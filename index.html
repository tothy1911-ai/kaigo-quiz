けやすいのは流動性知能。結晶性知能は知識や文化（教育・経験）の影響を受けやすい。","その場で新しい問題を解決する能力は流動性知能。"],"point":"「結晶性＝経験・知識・維持されやすい」「流動性＝新しい場面への対応・処理の速さ・早くから低下」。選択肢の説明が流動性知能のものにすり替わっていないかを確認する。","note":null}},{"id":"37-35","exam":37,"no":35,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，加齢に伴う感覚機能の変化として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["皮膚感覚が敏感になる。","高音域の聴力が高まる。","暗順応の時間が延長する。","味覚が敏感になる。","嗅覚が敏感になる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"加齢により瞳孔が小さくなり、網膜の働きも低下するため、明るい場所から暗い場所に入ったときに目が慣れる暗順応に時間がかかるようになる。","choices":["皮膚感覚（触覚・痛覚・温度覚）は鈍くなる。熱さに気づきにくく、やけどの原因になる。","高い音から聞こえにくくなる（老人性難聴）。","暗順応の時間は延長する。","味覚は鈍くなり、特に塩味を感じにくくなるため、味付けが濃くなりやすい。","嗅覚も鈍くなり、ガス漏れや食べ物の腐敗に気づきにくくなる。"],"point":"加齢による感覚の変化は基本的に「低下・鈍くなる」。「敏感になる」「高まる」とある選択肢は誤りと判断できる。生活上の危険（やけど、ガス漏れ、夜間の転倒）とセットで覚える。","note":null}},{"id":"37-36","exam":37,"no":36,"subject":"発達と老化の理解","group":6,"case":null,"stem":"<b>Ｂ<\/b>さん（74歳，女性）は，地方で一人暮らしをしている。持病はなく，認知機能の異常もない。ダンスサークルに通い，近所との付き合いも良好で，今の暮らしに満足している。最近，白髪が増え，友人との死別もあり，年をとったと感じている。ある日，一人息子（50歳，未婚）から，東京で一緒に住むことを提案された。<b>Ｂ<\/b>さんは，「ここには知り合いがいるが，東京には誰もいない。ここが一番いい」と言った。すると息子は，<b>Ｂ<\/b>さんに，「年をとると頑固になる。あと数年したら認知症（dementia）になるかもしれないので，自分と一緒に暮らすべきだ」と言った。<br>次のうち，<b>Ｂ<\/b>さんに関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ｂ<\/b>さんには，老性自覚はみられない。","<b>Ｂ<\/b>さんには，友人との死別による悲嘆がみられる。","<b>Ｂ<\/b>さんは，今，住んでいる環境や生活に適応できていない。","<b>Ｂ<\/b>さんには，エイジズム（ageism）の考え方がみられる。","<b>Ｂ<\/b>さんには，住み慣れた環境や仲間を喪失することへの不安がみられる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ｂさんは、知り合いのいる今の土地での生活に満足しており、「東京には誰もいない」と話している。東京に移ると、住み慣れた環境や仲間を失うことへの不安があると読み取れる。","choices":["白髪が増え、年をとったと感じており、老性自覚がみられる。","友人との死別はあるが、悲しみが続いているといった悲嘆の様子は書かれていない。","ダンスサークルや近所付き合いがあり、今の暮らしに満足しているので、適応できている。","「年をとると頑固になる」と決めつけているのは息子のほうで、エイジズム（年齢による偏見）がみられるのは息子。","「ここには知り合いがいるが、東京には誰もいない」という発言から、環境や仲間を失う不安が読み取れる。"],"point":"事例問題は、発言や行動が「誰のものか」を正確に読む。エイジズムは高齢者を年齢だけで一括りにして否定的に決めつける考え方で、事例では本人ではなく周囲の人の発言に現れることが多い。","note":null}},{"id":"37-37","exam":37,"no":37,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，サクセスフル・エイジング（successful aging）として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["長生きすることが，最大の目的である。","一人暮らしで，周囲の人と交流をしないようにしている。","膝に痛みがあるので，一日中ベッド上で過ごすようにしている。","難聴があるので，補聴器をつけてパソコン教室に通い始めた。","歌を上手に歌えなくなったので，カラオケに誘われても行かないようにしている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"サクセスフル・エイジングは、老化に伴う変化があっても、それに適応しながら社会と関わり、満足感をもって生きることをいう。補聴器で難聴を補い、新しい学びに挑戦するのはその例である。","choices":["長生きすることだけが目的ではない。生活の質や満足感、社会参加が重視される。","周囲との交流を避けており、社会とのつながりが失われている。","膝の痛みを理由に一日中ベッドで過ごすと、廃用症候群を招きやすい。","補聴器で機能低下を補い、パソコン教室という新しい活動に参加している。","できなくなったことを理由に交流の機会から遠ざかっている。"],"point":"サクセスフル・エイジングの正解は「機能の低下を補う工夫＋社会との関わりや新しい活動」がそろった選択肢。「やめる」「避ける」「行かない」と活動から退く選択肢は誤り。","note":null}},{"id":"37-38","exam":37,"no":38,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次のうち，老年症候群に直接関わる疾患として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["高血圧症（hypertension）","糖尿病（diabetes mellitus）","骨粗鬆症（osteoporosis）","心筋梗塞（myocardial infarction）","脂質異常症（dyslipidemia）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"老年症候群は、高齢者に多くみられ、介護や治療が必要になる症状や状態の総称で、転倒・骨折、腰痛、低栄養、尿失禁、認知機能の低下などがある。骨粗鬆症は骨がもろくなる病気で、転倒による骨折や腰痛、背中が丸くなる変形などに直接つながる。","choices":["高血圧症は生活習慣病の1つで、主に脳卒中や心疾患の危険因子となる。","糖尿病も生活習慣病で、合併症などを通じて間接的に影響するが、直接の原因疾患とはいえない。","骨粗鬆症は骨折・腰痛など老年症候群の症状に直接関わる。","心筋梗塞は心臓の血管が詰まる病気で、老年症候群に直接関わる疾患とはいえない。","脂質異常症は動脈硬化の危険因子となる生活習慣病。"],"point":"老年症候群は「病名」ではなく「症状・状態のまとまり」（転倒、骨折、失禁、低栄養、せん妄など）。選択肢の病気が、そうした症状を直接引き起こすかどうかで判断し、選択肢の中で骨折・転倒に最も直結するものを選ぶ。骨粗鬆症→転倒・骨折→寝たきり、の流れで覚える。","note":null}},{"id":"37-39","exam":37,"no":39,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，2019年（令和元年）の認知症施策推進大綱に関する説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「共生」と「予防」を車の両輪として施策を推進していく。","「予防」とは，「認知症（dementia）にならない」という意味である。","「認知症高齢者等にやさしい地域づくり」を推進する7つの柱が示された。","「普及啓発・本人発信支援」として，家族が積極的に本人の意思を代弁することが示された。","策定後は，毎年施策の進捗を確認することが示された。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"認知症施策推進大綱（2019年）は、認知症の人や家族の視点を重視しながら、「共生」と「予防」を車の両輪として施策を推進することを基本的な考え方としている。","choices":["「共生」と「予防」を車の両輪とすることが大綱の基本的な考え方。","大綱の「予防」は「認知症にならない」ではなく、「認知症になるのを遅らせる」「認知症になっても進行を緩やかにする」という意味。","「認知症高齢者等にやさしい地域づくり」と「7つの柱」は新オレンジプラン（2015年）の内容。大綱の柱は5つ。","本人発信支援は、認知症の人本人が自らの言葉で語り、発信する機会を増やすもの。家族が代弁することを示したものではない。","対象期間は2025年までで、策定後3年を目途に施策の進捗を確認するとされた。毎年ではない。"],"point":"「新オレンジプラン＝7つの柱・認知症高齢者等にやさしい地域づくり」「大綱＝5つの柱・共生と予防」を取り違えさせる問題が定番。大綱の「予防」の意味（遅らせる・緩やかにする）もよく問われる。なお、2024年1月には「共生社会の実現を推進するための認知症基本法」が施行されており、あわせて押さえておく。さらに2024年12月、認知症基本法に基づく「認知症施策推進基本計画」が閣議決定され、現在は基本計画が国の認知症施策の中心（大綱の対象期間は2025年まで）。","note":null}},{"id":"37-40","exam":37,"no":40,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ａ<\/b>さん（84歳，女性，要介護3）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）で，介護老人福祉施設に入所している。赤ちゃんの人形を持っていて，「はなちゃん」と呼んで話しかけている。<br>昼食のため，介護福祉職が居室を訪問すると，<b>Ａ<\/b>さんは不安そうな顔で，「はなちゃんがいなくなった。どこへ連れて行ったの？返して」と大声を出した。人形は<b>Ａ<\/b>さんのロッカーの上に置かれていた。<br><b>Ａ<\/b>さんに対する介護福祉職の最初の声かけとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「私を疑っているんですか」","「置いた場所を忘れたんですか」","「心配ですね，一緒に探しませんか」","「ご飯を食べてから探してはどうですか」","「ロッカーの上にあるのが見えないんですか」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"Ａさんにとって人形の「はなちゃん」は大切な存在で、いなくなったと強い不安を感じている。最初は事実を指摘せず、不安な気持ちを受け止めて共感し、一緒に探す姿勢を示すことが安心につながる。","choices":["介護福祉職自身の立場を守る発言で、Ａさんの不安に応えていない。対立を生みやすい。","忘れたことを指摘すると、自尊心を傷つけ、混乱や興奮を強めるおそれがある。","不安な気持ちを言葉にして受け止め、一緒に探すことで安心感を与えられる。","本人にとって切実な不安を後回しにしており、気持ちが落ち着かないまま食事を促すことになる。","見えないことを責めるような言い方で、Ａさんを否定している。"],"point":"認知症の人への「最初の声かけ」は、まず気持ちを受け止める言葉を選ぶ。「忘れたんですか」「見えないんですか」のように、できないことや誤りを指摘・訂正する選択肢は不適切と判断できる。","note":null}},{"id":"37-41","exam":37,"no":41,"subject":"認知症の理解","group":7,"case":null,"stem":"認知症（dementia）の高齢者にみられる，せん妄に関する記述として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["覚醒レベルが重度に低下した状態である。","症状の変動が少ないことが特徴である。","夜間よりも日中に生じやすいことが特徴である。","認知機能障害がみられることはまれである。","関与する因子を特定することが重要である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"せん妄は、脱水、感染症、薬剤、環境の変化、痛みなど身体的・環境的な要因で起こる一時的な意識障害である。原因となる因子を特定して取り除くことで改善が期待できるため、因子の特定が重要である。","choices":["せん妄は軽い意識の混濁（意識障害）に、注意力の低下や興奮、幻覚などが加わった状態。覚醒レベルが重度に低下した状態（昏睡など）とは異なる。","症状が一日の中で変動しやすい（日内変動）のが特徴。","夕方から夜間に生じやすい（夜間せん妄）。","注意障害や見当識障害など、認知機能障害がみられる。","原因となる因子を見つけて対応することが、改善と予防の基本。"],"point":"せん妄と認知症の違い（せん妄＝急に発症・日内変動あり・夜間に多い・原因を除けば改善しうる）をセットで覚える。介護福祉職は、急に様子が変わったら脱水や発熱、服薬の変更などがないかを確認し、医療職に伝える。","note":null}},{"id":"37-42","exam":37,"no":42,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，アルツハイマー型認知症（dementia of the Alzheimer’s type）の特徴として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["近時記憶（新しい記憶）の障害は，初期から始まる。","特徴的な症状として幻視がある。","脳にアミロイドβが沈着し始めると，すぐに発症する。","歩行障害が多く現れるのは，初期の段階である。","嚥下障害が多く現れるのは，初期の段階である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"アルツハイマー型認知症では、初期から近時記憶（新しいことを覚える力）の障害が目立ち、同じことを何度も聞くなどの症状が現れる。","choices":["初期から近時記憶の障害が始まるのが典型的。","幻視が特徴的なのはレビー小体型認知症。","アミロイドβは発症の何年も前（十数年以上前）から沈着し始めるとされ、沈着してすぐに発症するわけではない。","歩行障害は主に進行した段階（後期）で現れる。比較的早い時期から歩行障害が目立つのはレビー小体型や血管性認知症。","嚥下障害も主に後期に現れる。"],"point":"認知症の種類と特徴的な症状の組み合わせを押さえる。「アルツハイマー型＝近時記憶障害から始まり、ゆっくり進行」「レビー小体型＝幻視・パーキンソン症状・症状の変動」「前頭側頭型＝人格変化・脱抑制・常同行動」「血管性＝まだら状の症状・段階的に悪化」。","note":null}},{"id":"37-43","exam":37,"no":43,"subject":"認知症の理解","group":7,"case":null,"stem":"次のうち，認知症（dementia）のリスクを高める要因として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["身体活動","不飽和脂肪酸の摂取","歯がなくなることによる咀嚼機能の低下","難聴による補聴器の使用","ボランティア活動"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"歯を失って咀嚼機能が低下すると、脳への刺激が減ることや、食事内容が偏り栄養状態が悪くなることなどを通じて、認知症のリスクを高める要因になると考えられている。","choices":["運動などの身体活動は、認知症のリスクを下げる要因とされる。","青魚などに含まれる不飽和脂肪酸の摂取は、リスクを下げる可能性がある食習慣とされる。","歯の喪失による咀嚼機能の低下はリスクを高める要因の1つ。","リスク要因は「難聴」そのもの。補聴器の使用は難聴を補い、リスクを下げることが期待される。","ボランティアなどの社会参加は、リスクを下げる要因とされる。"],"point":"「リスクを高める要因」と「下げる要因（予防的な要因）」の取り違えに注意。難聴・社会的孤立・運動不足・喫煙・高血圧・糖尿病などが高める要因。選択肢4のように、リスク要因（難聴）とその対策（補聴器）を組み合わせたひっかけが出る。","note":null}},{"id":"37-44","exam":37,"no":44,"subject":"認知症の理解","group":7,"case":null,"stem":"次のうち，全般的な認知機能を評価する尺度であり，30点満点で20点以下を認知症の目安とするものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["バーセルインデックス（Barthel Index）","改訂長谷川式認知症スケール（HDS-R）","ＦＡＳＴ（Functional Assessment Staging）","認知症高齢者の日常生活自立度判定基準","臨床的認知症尺度（ＣＤＲ：Clinical Dementia Rating）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"改訂長谷川式認知症スケール（HDS-R）は、年齢・日時の見当識・記銘・計算などを質問形式で調べる全般的な認知機能の検査で、30点満点中20点以下を認知症の疑いの目安とする。","choices":["バーセルインデックスは、食事・移乗・排泄などADL（日常生活動作）を評価する尺度で、100点満点。","30点満点で20点以下が認知症の疑いの目安。","FASTはアルツハイマー型認知症の重症度を、生活機能の観察から7段階で評価するもの。","認知症高齢者の日常生活自立度判定基準は、日常生活の自立の程度をランク（Ⅰ〜M）で判定するもの。点数ではない。","CDRは、記憶や判断力などを観察・面接で評価し、重症度を判定する尺度。30点満点の検査ではない。"],"point":"点数の目安は「HDS-R＝30点満点・20点以下」「MMSE＝30点満点・23点以下」で区別して覚える。HDS-Rは図形模写や書字などの動作性課題を含まないのに対し、MMSEは図形の模写や文章を書く課題を含む点も違う。","note":null}},{"id":"37-45","exam":37,"no":45,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，「認知症（dementia）の人の日常生活・社会生活における意思決定支援ガイドライン」（2018年（平成30年）（厚生労働省））で示されている，意思決定支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["認知症（dementia）の人の家族の意思を支援することである。","意思決定支援者は特定の職種に限定される。","一度，意思決定したら，最後まで同じ内容で支援する。","看取りの場面になってから支援を開始する。","身振りや表情の変化も意思表示として読み取る努力を最大限に行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"ガイドラインでは、認知症の人の意思を、言葉だけでなく身振りや表情の変化からも読み取る努力を最大限に行うことが示されている。意思決定支援は、本人の意思をできるだけ把握し、尊重するための支援である。","choices":["支援の対象は認知症の人本人の意思。家族の意思を支援するものではない。","意思決定支援者は、ケアに携わる専門職、家族、成年後見人、地域の関係者など幅広く、特定の職種に限られない。","本人の意思は時間や状況で変わりうるため、その都度、意思を確認しながら支援する。","看取りの場面に限らず、日常生活のさまざまな場面で行う。","言葉にできない意思も、身振りや表情の変化から読み取る努力を最大限に行う。"],"point":"意思決定支援の問題では「本人中心」「その都度確認する」「誰でも支援者になりうる」「日常のあらゆる場面」が正解の方向。「家族の意思」「一度決めたら変えない」「特定の職種に限定」は誤りのパターン。","note":null}},{"id":"37-46","exam":37,"no":46,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，回想法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["肩や背中から優しくゆっくりと触れる。","共感を通して，認知症（dementia）の人が体験している現実を受け入れる。","見当識を高めるために，時間や場所，現在の状況を説明する。","昔の写真や音楽を活用して，記憶を活性化する。","残存能力を活用し，共同作業を通して仲間をつくる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"回想法は、昔の写真や音楽、なつかしい道具などを手がかりに過去の思い出を語ってもらう方法で、記憶を活性化し、気持ちの安定や自尊心の回復、交流の促進につながる。","choices":["肩や背中から優しく触れるのは、タクティールケアやユマニチュードの「触れる」技法などのタッチングの手法で、回想法ではない。","共感を通して本人が体験している現実を受け入れるのは、バリデーション。","時間や場所、現在の状況を伝えて見当識を高めるのは、リアリティ・オリエンテーション。","昔の写真や音楽を活用して記憶を活性化するのが回想法。","残存能力を活用した共同作業で仲間をつくるのは、作業療法などの集団活動の考え方で、回想法の説明ではない。"],"point":"非薬物療法は名前と内容の組み合わせで出る。「回想法＝昔の思い出」「リアリティ・オリエンテーション＝今の日時・場所を伝える」「バリデーション＝本人の世界に共感」「ユマニチュード＝見る・話す・触れる・立つ」をセットで覚える。","note":null}},{"id":"37-47","exam":37,"no":47,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，認知症疾患医療センターの説明として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["事業の実施主体は，市町村である。","都道府県ごとに，1か所の設置が義務づけられている。","認知症（dementia）の鑑別診断を行う。","主に認知症（dementia）が進行した人の入院治療を行う。","介護保険法に定められている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"認知症疾患医療センターは、都道府県・指定都市が指定する医療機関で、認知症の鑑別診断、身体合併症や行動・心理症状への対応、専門医療相談、地域の関係機関との連携などを担う。","choices":["実施主体は都道府県・指定都市であり、市町村ではない。","都道府県ごとに1か所という設置義務はなく、地域の実情に応じて複数指定されている。","認知症の鑑別診断を行うことが主な役割の1つ。","進行した人の入院治療が主目的ではない。早期の鑑別診断や専門医療相談、地域連携が中心。","介護保険法に定められた機関ではなく、国の補助事業として実施されている。"],"point":"認知症関係の機関は「実施主体」と「役割」で区別する。「認知症疾患医療センター＝都道府県・指定都市が指定、鑑別診断」「認知症初期集中支援チーム＝市町村（地域包括支援センターなどに配置）、初期の集中的支援」「認知症地域支援推進員＝市町村、連携・相談」。","note":null}},{"id":"37-48","exam":37,"no":48,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ｂ<\/b>さん（87歳，男性）は，一人暮らしである。玄関前で，脱水で倒れているところを発見され，救急搬送された。入院中，認知症（dementia）の疑いがある行動が見られた。<b>Ｂ<\/b>さんは，「自宅で暮らしたい」と強く希望していた。退院後，<b>Ｂ<\/b>さんは外出して自宅に戻れなくなることがあった。近所の人たちが，<b>Ｂ<\/b>さんの生活を心配して，地域包括支援センターに相談した結果，認知症初期集中支援チームが編成された。<br>次の記述のうち，<b>Ｂ<\/b>さんに対して認知症初期集中支援チームが行う支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["金銭管理を行う。","支援方針を検討する。","居宅サービス計画書を作成する。","介護保険サービスを契約する。","法定後見を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"認知症初期集中支援チームは、医療・介護の専門職が認知症が疑われる人や家族を訪問して状態を把握し、チーム員会議で支援方針を検討したうえで、受診や介護サービスの利用につなげるなど、初期の支援を集中的（おおむね6か月）に行う。","choices":["金銭管理は、日常生活自立支援事業や成年後見制度などで行うもので、チームの役割ではない。","訪問で把握した情報をもとに、チーム員会議で支援方針を検討する。","居宅サービス計画書（ケアプラン）は介護支援専門員が作成する。","介護保険サービスの契約は、本人（または代理人）と事業者が結ぶもの。チームが契約するわけではない。","法定後見は、家庭裁判所が選任した成年後見人等が行う。"],"point":"初期集中支援チームの仕事は「訪問・アセスメント・家族支援・支援方針の検討・医療や介護につなぐ」まで。ケアプラン作成、契約、金銭管理、後見など「他の専門職や制度が担う仕事」を選択肢に混ぜてくるので、誰の役割かで判断する。","note":null}},{"id":"37-49","exam":37,"no":49,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，ＩＣＦ（International Classification of Functioning, Disability and Health：国際生活機能分類）の社会（人生）レベルに該当するものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["心身機能・身体構造","活動","参加","機能障害","活動制限"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"ICFの生活機能は3つのレベルからなり、「心身機能・身体構造」は生命レベル、「活動」は生活レベル、「参加」は社会（人生）レベルにあたる。参加は、家庭や社会での役割を果たすなど、社会に関わることを指す。","choices":["心身機能・身体構造は生命レベル。","活動は生活レベル（ADLや家事など、生活上の行為）。","参加は社会（人生）レベル。","機能障害は、心身機能・身体構造に問題が生じた状態（否定的側面）。","活動制限は、活動に問題が生じた状態（否定的側面）。社会レベルの否定的側面は「参加制約」。"],"point":"「心身機能・身体構造＝生命」「活動＝生活」「参加＝人生（社会）」の対応と、それぞれの否定的側面「機能障害・活動制限・参加制約」をセットで覚える。","note":null}},{"id":"37-50","exam":37,"no":50,"subject":"障害の理解","group":8,"case":null,"stem":"次の記述のうち，障害者のエンパワメントに関するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害のある人が障害のない人と同等に生活し，活動する社会を目指す。","専門職が主導し，障害がある人は受動的に支援を受ける。","障害のある人が自らの能力や長所に気づき，課題に対応する。","障害のある人が，主体性や人権が守られないことに耐える。","障害のある人が，医学的リハビリテーションを受ける。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"エンパワメントは、障害のある人が本来もっている力や長所に気づき、それを発揮して自ら課題に対応し、生活をコントロールできるようにすることをいう。","choices":["障害のある人とない人が同等に生活・活動する社会を目指すのは、ノーマライゼーションの考え方。","専門職主導で本人が受け身になるのは、エンパワメントと反対の考え方。","自らの能力や長所に気づき、課題に対応していくことがエンパワメント。","主体性や人権が守られないことに耐えるのではなく、権利を主張し、取り戻していく力を高めることを目指す。","医学的リハビリテーションは心身機能の回復を図るもので、エンパワメントの説明ではない。"],"point":"エンパワメントのキーワードは「本人の力・強み・主体性」。似た理念の「ノーマライゼーション（普通の生活）」「インクルージョン（包み込む）」「ストレングス（強みに着目）」と区別して覚える。","note":null}},{"id":"37-51","exam":37,"no":51,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，クローン病（Crohn disease）にみられる特徴的な症状として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["視力低下","栄養障害","咳嗽","運動失調","関節痛"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"クローン病は、口から肛門までの消化管のどこにでも炎症や潰瘍が起こりうる慢性の病気（指定難病）で、腹痛、下痢、体重減少などがみられる。腸で栄養を吸収しにくくなるため、栄養障害が起こりやすい。","choices":["視力低下は、糖尿病網膜症や緑内障などでみられる。クローン病の特徴的な症状ではない。","消化管の炎症で栄養が吸収されにくく、栄養障害が起こりやすい。","咳嗽（せき）は呼吸器の症状。","運動失調は、脊髄小脳変性症など神経の病気でみられる。","関節痛は合併症として起こることもあるが、特徴的な症状として最も適切なのは消化管の障害に伴う栄養障害。"],"point":"クローン病は「若い人に多い・腹痛と下痢・栄養障害・再燃と寛解を繰り返す」。食事は低脂肪・低残渣が基本で、栄養療法が行われることもある。似た病気の潰瘍性大腸炎は、炎症が大腸に限られる点が違う。","note":null}},{"id":"37-52","exam":37,"no":52,"subject":"障害の理解","group":8,"case":null,"stem":"次の記述のうち，遂行機能障害の特徴として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["些細なことですぐに興奮して怒鳴る。","新しい知識を覚えることが困難である。","ぼんやりして周囲に注意を向け続けることが困難である。","行動を計画して実行することが困難である。","言葉の表出や理解が困難である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"遂行機能障害は高次脳機能障害の1つで、目標を決め、計画を立て、順序よく実行することが難しくなる。物事の段取りがつけられない、臨機応変に対応できないといった形で現れる。","choices":["些細なことで興奮して怒鳴るのは、社会的行動障害（感情のコントロールの低下）。","新しいことを覚えられないのは、記憶障害。","注意を向け続けることが難しいのは、注意障害。","行動を計画して実行することが困難なのが遂行機能障害。","言葉の表出や理解が難しいのは、失語症。"],"point":"高次脳機能障害の4つ（記憶障害・注意障害・遂行機能障害・社会的行動障害）は、症状の具体例と結びつけて覚える。支援では、手順を書き出す、一度に1つずつ伝えるなど、外から段取りを補う工夫が有効。","note":null}},{"id":"37-53","exam":37,"no":53,"subject":"障害の理解","group":8,"case":null,"stem":"視覚障害の特徴と視覚障害者の生活支援に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ロービジョンは，視覚情報をまったく得られない状態である。","中途視覚障害者は，先天性の障害に比べて障害を受容しやすい。","白杖には，視覚に障害があることを周囲に知らせる役目がある。","視覚障害を補うために，ペットの犬と一緒に外出する。","視覚障害者は，ガイドヘルパーの利用はできない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"白杖は、歩くときに足元や前方の状況を確かめる道具であると同時に、視覚障害があることを周囲に知らせる役目がある。","choices":["ロービジョンは、見えにくいが視覚を活用できる状態。視覚情報をまったく得られない状態は全盲。","中途視覚障害者は、それまでの生活が大きく変わるため、障害の受容に時間がかかることが多い。","白杖は、安全確認とともに、視覚障害があることを周囲に知らせる役割がある。","外出の手助けをするのは、訓練を受けた盲導犬。ペットの犬では誘導の役割を果たせない。","視覚障害者は、障害福祉サービスの同行援護などでガイドヘルパーを利用できる。"],"point":"視覚障害の支援では「ロービジョン＝見えにくいが見える」「中途障害は受容に時間がかかる」「移動支援は同行援護」をセットで覚える。盲導犬は身体障害者補助犬で、ペットとは異なる。","note":null}},{"id":"37-54","exam":37,"no":54,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ａ<\/b>さん（76歳，女性）は，パーキンソン病（Parkinson disease）と診断され，日常生活動作（Activities of Daily Living：ＡＤＬ）は，車いすやベッド上で全介助である。最近，食事に時間がかかって嫌がるようになり，かすれ声が目立つようになった。<br>次のうち，現在の<b>Ａ<\/b>さんに対して介護福祉職が留意すべきこととして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["安静時振戦","筋固縮","仮面様顔貌","誤嚥","便秘"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"パーキンソン病が進行すると、嚥下に関わる筋肉の動きも悪くなる。食事に時間がかかる、かすれ声が目立つといった変化は嚥下機能の低下を示しており、誤嚥や誤嚥性肺炎に最も留意する必要がある。","choices":["安静時振戦はパーキンソン病の代表的な症状だが、事例の変化から今最も留意すべきことではない。","筋固縮も代表的な症状だが、事例の食事やかすれ声の変化から最優先で留意する点ではない。","仮面様顔貌（表情が乏しくなる）も症状の1つだが、生命に関わる危険は誤嚥のほうが大きい。","食事に時間がかかる、かすれ声などは嚥下機能低下のサインで、誤嚥に注意が必要。","便秘も起こりやすい症状だが、事例が示す変化とは直接結びつかない。"],"point":"事例問題では「最近」起きた変化に注目する。パーキンソン病の主な症状（振戦・固縮・無動・姿勢反射障害）はどれも正しい知識だが、問われているのは「事例の変化から最も留意すべきこと」。食事時間の延長・むせ・声の変化は嚥下障害のサイン。","note":null}},{"id":"37-55","exam":37,"no":55,"subject":"障害の理解","group":8,"case":null,"stem":"聴覚障害者の特徴や支援の方法に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["要約筆記によって意思疎通を補う。","軽度の聴覚障害を「ろう」という。","フラッシュベルは周囲の音を増幅させて伝える。","手話は意思の伝達に役立たない。","両耳の聴力レベルが40 dB で身体障害者手帳が交付される。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"要約筆記は、話の内容を要約して文字で伝える方法で、特に手話を使わない中途失聴者や難聴者の意思疎通を補う手段となる。","choices":["要約筆記は、文字によって聴覚障害者の意思疎通を補う。","「ろう」は、音声による会話の聞き取りがほとんどできない高度の聴覚障害を指す。軽度ではない。","フラッシュベルは、玄関のチャイムなどの音を光の点滅で知らせる装置。音を増幅させるのは補聴器。","手話は、ろう者などにとって重要なコミュニケーション手段であり、言語の1つとして位置づけられている。","聴覚障害で身体障害者手帳が交付されるのは、最も軽い等級（6級）でも両耳の聴力レベルが70dB以上など。40dBでは対象にならない。"],"point":"聴覚障害の支援は「障害の程度・失聴の時期」で方法を選ぶ。中途失聴者は手話を使えないことが多く、筆談や要約筆記が有効。手帳の基準（両耳70dB以上で6級）も数値で問われる。","note":null}},{"id":"37-56","exam":37,"no":56,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ｂ<\/b>さん（24歳，男性）は，母親と二人暮らしで，小学生のときに注意欠陥多動性障害と疑われていた。<b>Ｂ<\/b>さんは，最近になって昼夜を問わずゲームを続け，朝起きられずにアルバイトを無断で休むことが増えた。<br>次のうち，<b>Ｂ<\/b>さんの母親が相談する機関として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ハローワーク（公共職業安定所）","難病情報センター","認知症カフェ","放課後等デイサービス","発達障害者支援センター"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ｂさんには、小学生のときに注意欠陥多動性障害（ADHD）を疑われた経緯がある。発達障害者支援センターは、発達障害のある人や家族からの相談に応じ、助言や関係機関の紹介などを行う専門機関で、年齢にかかわらず相談できる。","choices":["ハローワークは職業紹介を行う機関。まずは生活の乱れや発達特性について相談する段階であり、最も適切とはいえない。","難病情報センターは、難病（指定難病など）の情報を提供する機関。","認知症カフェは、認知症の人や家族、地域の人が集う場。","放課後等デイサービスは、就学している障害児（原則18歳未満）が対象。24歳のＢさんは利用できない。","発達障害のある人やその家族の相談に応じる専門機関。"],"point":"相談先の問題は「障害の種類」と「年齢」で絞り込む。発達障害（ADHD・自閉スペクトラム症・学習障害など）は発達障害者支援センター。児童向けサービス（放課後等デイサービスなど）は年齢で対象外になるひっかけが多い。ADHDは診断名としては「注意欠如・多動症」とも呼ばれる。","note":null}},{"id":"37-57","exam":37,"no":57,"subject":"障害の理解","group":8,"case":null,"stem":"次の記述のうち，「障害者差別解消法」の合理的配慮に沿った対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["車いすの身体障害者から，陳列棚にある商品を見せてほしいと言われたが，口頭で商品を説明した。","聴覚障害者の手話による注文がわからなかったので，最も人気のあるメニューを出した。","盲導犬を連れた視覚障害者が来店したが，動物嫌いの客から苦情を言われると思い，犬は店の中に入れないように頼んだ。","役所に相談に来た精神障害者から，多くの人の中だと不安になると言われたため，帰宅してもらった。","知的障害者から申し出があったので，会議に参加するための資料をわかりやすい言葉に直して，事前に口頭で説明した。"],"notes":"（注）　「障害者差別解消法」とは，「障害を理由とする差別の解消の推進に関する法律」のことである。","figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"合理的配慮は、障害のある人から社会的障壁を取り除くよう申し出があったときに、負担が重すぎない範囲で、その人に合わせた必要な対応を行うことである。知的障害者の申し出に応じて資料をわかりやすい言葉に直し、事前に説明するのはその典型例である。","choices":["商品を見せてほしいという申し出があり、取って見せることは過重な負担ではない。口頭説明だけで済ませるのは配慮として不十分。","本人の意思を確認せずに別のものを出しており、筆談や指差しなど意思を確かめる工夫をすべき。","身体障害者補助犬法により、飲食店など不特定多数の人が利用する施設は、原則として盲導犬の同伴を拒んではならない。","帰宅させるのではなく、別室で対応するなど、不安を軽減できる環境を用意すべき。","本人の申し出に応じ、わかりやすい資料と事前説明で参加しやすくしている。"],"point":"合理的配慮の正解は「本人の申し出に応じて、その人に合わせた方法に変える」選択肢。「代わりに決める」「断る」「帰す」はいずれも不適切。2024年4月施行の改正法により、民間事業者の合理的配慮の提供も努力義務から法的義務になっている。","note":null}},{"id":"37-58","exam":37,"no":58,"subject":"障害の理解","group":8,"case":null,"stem":"レスパイトケアの望ましいあり方に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害者はサービスを利用せずに生活するべきである。","利用中，家族は自宅で休まなくてはならない。","家族が障害者を預けて旅行に行くことは認められない。","家族の休息が目的なので，障害者の施設利用は宿泊に限定される。","家族が休息している間も，障害者が自分らしく過ごせるようにする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"レスパイトケアは、障害者や高齢者を一時的に預かるなどして、介護する家族の負担を軽くし休息をとってもらう支援である。その間も、利用する本人が安心して自分らしく過ごせるようにすることが望ましい。","choices":["サービスを適切に利用することは本人と家族の生活を支えるために必要で、利用しないことを求めるものではない。","休息の過ごし方は家族の自由で、自宅で休むことに限られない。","旅行など、家族が自分の時間を過ごすこともレスパイトの目的にかなう。","短期入所（宿泊）だけでなく、日中一時支援など日帰りの利用もある。","家族の休息と同時に、本人の生活の質も大切にする。"],"point":"レスパイトケアは「家族の休息」が目的だが、「本人の暮らしも大切にする」が望ましいあり方。「〜しなくてはならない」「認められない」「限定される」と家族や本人の行動を縛る選択肢は誤りと判断できる。","note":null}},{"id":"37-59","exam":37,"no":59,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，成人に対する救急蘇生法での胸骨圧迫の方法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["呼吸が確認できない場合は，すぐに圧迫を始める。","圧迫する部位は，胸骨の左側である。","実施者の両手を重ねて，指先で圧迫する。","圧迫の深さは，胸が10 cm 沈むようにする。","1分間に60回を目安に圧迫する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"反応がなく、普段どおりの呼吸がない（または判断に迷う）場合は、心停止とみなし、ただちに胸骨圧迫を開始する。少しでも早く始めることが救命につながる。","choices":["呼吸が確認できなければ、すぐに胸骨圧迫を始める。","圧迫部位は胸骨の下半分（胸の真ん中）。胸骨の左側ではない。","両手を重ね、手のひらの付け根（手根部）で圧迫する。指先ではない。","成人の圧迫の深さは約5cm（6cmを超えない）。10cmは深すぎる。","1分間に100〜120回のテンポで圧迫する。"],"point":"胸骨圧迫は数値で覚える。「胸の真ん中（胸骨の下半分）」「約5cm」「1分間に100〜120回」「手のひらの付け根」「中断は最小限に」。数値を入れ替えた選択肢がよく出る。","note":null}},{"id":"37-60","exam":37,"no":60,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，痰を喀出する仕組みに関するものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["呼吸器官の内部は乾燥した状態になっている。","気管の内部の表面には絨毛があり，分泌物の侵入を防いでいる。","分泌物は，咽頭で吸収される。","痰は，咳や咳払いによって排出される。","咳は，下垂体にある咳中枢によっておこる反射運動である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"気道の分泌物は、線毛の運動によってのどの方へ運ばれ、咳や咳払いによって痰として体外に出される。","choices":["呼吸器官の内部は、粘液で適度に湿った状態に保たれている。","気管の表面にあるのは「線毛」で、分泌物や異物を外へ運び出す働きをする。「絨毛」は小腸の粘膜にある構造。","分泌物は咽頭で吸収されるのではなく、飲み込まれるか、痰として外に出される。","痰は、咳や咳払いによって排出される。","咳中枢は延髄にある。下垂体はホルモンを分泌する器官。"],"point":"「線毛（気道）」と「絨毛（小腸）」の取り違えは定番のひっかけ。咳中枢・嚥下中枢・呼吸中枢はいずれも延髄にあることもあわせて覚える。","note":null}},{"id":"37-61","exam":37,"no":61,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，介護福祉士が行う口腔内の喀痰吸引の方法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["吸引圧は，利用者の体調によって介護福祉士が決める。","吸引圧をかけた状態で，吸引チューブを挿入する。","口蓋垂まで吸引チューブを挿入する。","吸引チューブを回転させながら痰を吸引する。","吸引後は洗浄水を吸引し，清浄綿でチューブを拭く。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"口腔内の吸引では、吸引チューブを回転させたり、ゆっくり動かしたりしながら吸引することで、粘膜の同じ部分に圧がかかり続けるのを防ぎ、痰を効率よく吸引できる。","choices":["吸引圧や吸引時間などは、医師の指示書に基づいて行う。介護福祉士が自分で判断して決めるものではない。","粘膜を吸い付けて傷つけないよう、吸引圧をかけない状態で挿入するのが原則。","口蓋垂（のどちんこ）まで挿入すると、嘔吐反射を起こすおそれがある。口腔内の吸引は咽頭の手前までとする。","回転させながら吸引し、粘膜の損傷を防ぎつつ痰を取り除く。","吸引後は、まずチューブの外側を清浄綿などで拭き、次に洗浄水を吸引して内側の汚れを洗い流す。順序が逆。"],"point":"喀痰吸引は「医師の指示に従う」「口腔内は咽頭の手前まで」「外側を拭いてから洗浄水で内側を洗う」が頻出。手順の順序を入れ替えた選択肢や、介護福祉士が独自に判断する選択肢は誤りと判断できる。","note":null}},{"id":"37-62","exam":37,"no":62,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，消化器症状の説明として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["腹部膨満感は，腹部が張る感覚のことである。","しゃっくり（吃逆）は，胸膜の刺激で起こる現象である。","胸やけは，飲食物による食道の熱傷のことである。","げっぷ（噯気）は，咽頭にたまった空気が排出されることである。","嘔気は，胃や腸の内容物が，食道を逆流して口外に吐き出されることである。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"腹部膨満感は、腸内のガスや便の停滞などにより、おなかが張っているように感じる感覚のことである。","choices":["腹部膨満感は、腹部が張る感覚のこと。","しゃっくり（吃逆）は、横隔膜がけいれんするように収縮して起こる。胸膜の刺激ではない。","胸やけは、胃酸などが食道に逆流して、胸のあたりに焼けるような不快感が起こる症状。飲食物による熱傷ではない。","げっぷ（噯気）は、胃にたまった空気が口から排出されること。咽頭ではない。","胃や腸の内容物を口から吐き出すのは嘔吐。嘔気は、吐きたいと感じる不快な感覚（吐き気）。"],"point":"消化器症状は「どこで・何が起こるか」で区別する。「しゃっくり＝横隔膜」「げっぷ＝胃の空気」「胸やけ＝胃酸の逆流」「嘔気＝吐き気（感覚）」「嘔吐＝実際に吐く」。嘔気と嘔吐の入れ替えは定番のひっかけ。","note":null}},{"id":"37-63","exam":37,"no":63,"subject":"医療的ケア","group":9,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，女性）は，脳梗塞（cerebral infarction）の後遺症で左片麻痺があり，介護老人保健施設に入所して在宅復帰に向けた訓練をしている。嚥下障害もあるため，経鼻経管栄養による栄養摂取をしているが，経口摂取できないことでイライラしてチューブを抜去したことがある。医師からは一時的な治療であると説明を受けて同意していた。<br>経管栄養中に介護福祉士が訪室すると，チューブを触りながら，「自分の口から食べたいから，このチューブを抜いてほしい。見た目も良くない」と訴えがあった。看護師に連絡し，チューブが抜けていないことを確認してもらった。<br>このときの<b>Ａ<\/b>さんへの介護福祉士の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["チューブを抜かないように<b>Ａ<\/b>さんの右手を固定する。","経管栄養が早く終わるように滴下速度を調節する。","医師や看護師に<b>Ａ<\/b>さんの思いを伝える。","<b>Ａ<\/b>さんに胃ろうの造設を提案する。","<b>Ａ<\/b>さんに経口摂取を提案する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"Ａさんは、治療に同意していたものの、口から食べたい、見た目が気になるという思いを訴えている。介護福祉士はその思いを受け止め、治療方針を決める医師や看護師に伝えて、チームで対応を検討することが適切である。","choices":["手を固定することは身体拘束にあたり、緊急やむを得ない場合の要件を満たさないかぎり行ってはならない。","滴下速度は医師の指示に基づくもので、介護福祉士が変えてはならない。速すぎると下痢や嘔吐の原因にもなる。","本人の思いを医療職に伝え、チームで対応を検討する。","胃ろうの造設は医師が判断し本人に説明する治療の選択であり、介護福祉士が提案するものではない。","嚥下障害があるため、経口摂取の可否は医師などの評価に基づいて判断する。介護福祉士が独自に提案すると誤嚥の危険がある。"],"point":"医療的ケアの事例では、介護福祉士が自分で判断・変更する選択肢（速度調節、治療の提案、手の固定）は誤り。「本人の思いを受け止め、医師・看護師に報告・連携する」が正解の型。","note":null}},{"id":"37-64","exam":37,"no":64,"subject":"介護の基本","group":1,"case":null,"stem":"介護福祉に関連する法律に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「高齢者虐待防止法」は，福祉六法の1つである。","「障害者総合支援法」は，障害者基本計画の策定を義務づけている。","社会福祉法によって，社会福祉士の定義が規定されている。","介護保険法は，国民の共同連帯の理念に基づいて介護保険制度を設けている。","医師法によって，介護福祉の業務の一部として医行為が認められている。"],"notes":"（注）1　「高齢者虐待防止法」とは，「高齢者虐待の防止，高齢者の養護者に対する支援等に関する法律」のことである。<br>2　「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"介護保険法第1条は、目的として「国民の共同連帯の理念に基づき介護保険制度を設け」と定めている。介護を社会全体で支える保険制度であることを示す部分である。","choices":["福祉六法は、生活保護法・児童福祉法・身体障害者福祉法・知的障害者福祉法・老人福祉法・母子及び父子並びに寡婦福祉法。高齢者虐待防止法は含まれない。","障害者基本計画の策定（国）を定めているのは障害者基本法。障害者総合支援法ではない。","社会福祉士の定義を定めているのは社会福祉士及び介護福祉士法。社会福祉法は社会福祉事業や社会福祉法人などを定める法律。","介護保険法第1条に「国民の共同連帯の理念」が明記されている。","医師法は医師以外の医業を禁じる法律。介護福祉士が喀痰吸引等を行えるのは、社会福祉士及び介護福祉士法の規定（医師の指示の下で行う）による。"],"point":"「どの法律に何が書いてあるか」の入れ替え問題。障害者基本計画＝障害者基本法、介護福祉士・社会福祉士の定義や喀痰吸引等＝社会福祉士及び介護福祉士法、と根拠法をセットで覚える。福祉六法の6つは名前で言えるようにしておく。","note":null}},{"id":"37-65","exam":37,"no":65,"subject":"介護の基本","group":1,"case":null,"stem":"社会福祉士及び介護福祉士法に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["資質向上のために，5年に1回，資格更新研修を受けなければならない。","社会福祉士の業務を介護福祉士が行うことは禁じられている。","介護福祉士の信用を傷つける行為をしてはならない。","介護福祉士は，その業を辞した後は秘密保持義務が解除される。","介護福祉士国家試験に合格した日から，介護福祉士を名乗ることができる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"社会福祉士及び介護福祉士法第45条は「社会福祉士又は介護福祉士は、社会福祉士又は介護福祉士の信用を傷つけるような行為をしてはならない」と定めている（信用失墜行為の禁止）。","choices":["介護福祉士の資格に更新制度はなく、5年ごとの更新研修の義務もない。資質向上は「責務」として努力が求められている。","社会福祉士・介護福祉士は名称独占の資格で、業務独占ではない。介護福祉士が相談援助を行うことは禁じられていない。","第45条の信用失墜行為の禁止。","第46条は、秘密保持義務について「介護福祉士でなくなつた後においても、同様とする」と定めており、辞めた後も義務は続く。","介護福祉士を名乗れるのは、合格後に介護福祉士登録簿に登録を受けてから。合格しただけでは名乗れない。"],"point":"法律上の義務は「誠実義務」「信用失墜行為の禁止」「秘密保持義務（辞めた後も続く）」「連携」「資質向上の責務」「名称の使用制限」の6つで覚える。「更新制」「業務独占」「合格した日から名乗れる」はよくある誤りの型。","note":null}},{"id":"37-66","exam":37,"no":66,"subject":"介護の基本","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（75歳，女性）は，3か月前に，血管性認知症（vascular dementia）を発症し，軽度の左片麻痺で杖歩行となり，要介護3と認定された。<b>Ａ<\/b>さんは，料理が大好きで，娘と一緒に食事を作ることを楽しみに生活していた。1か月前から認知症（dementia）が進行し，ユニット型介護老人福祉施設に入所した。<b>Ａ<\/b>さんは夕方になると，「ご飯の支度をしないといけないから帰ります」と言いながら，興奮して歩き回る様子がみられるようになった。<br><b>Ａ<\/b>さんへの介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["居室に鍵をかけて，自室で過ごしてもらう。","介護福祉職と一緒に，夕食の準備をしてもらう。","杖を預かり，低めの丸椅子に座ってもらう。","介護福祉職の判断で，向精神薬を服用してもらう。","ここが<b>Ａ<\/b>さんの自宅であることを，理解してもらう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Ａさんの「ご飯の支度をしないといけない」という言葉には、料理を大切にしてきた生活歴と役割への思いが表れている。その思いをくみ取り、介護福祉職と一緒に夕食の準備をしてもらうことで、役割と安心感を得られ、落ち着くことが期待できる。","choices":["居室に鍵をかけて出られなくすることは身体拘束にあたる。緊急やむを得ない場合の3要件（切迫性・非代替性・一時性）も満たさない。","生活歴を生かして役割を持ってもらい、行動の背景にある思いに応える。","杖を取り上げ、立ち上がりにくい低い椅子に座らせることは行動を制限する対応で、身体拘束につながる。転倒の危険も高まる。","服薬は医師の判断に基づく。介護福祉職が自分の判断で向精神薬を飲ませることはできず、行動を薬で抑えることにもなる。","認知症の人に事実を説明して理解させようとしても納得は得られにくく、かえって混乱や興奮を強める。"],"point":"認知症の人の帰宅願望や歩き回りには、「なぜその言葉が出るのか」を生活歴から考え、役割や楽しみにつなげる選択肢が正解になりやすい。鍵・取り上げ・薬・説得は、いずれも誤りの型。","note":null}},{"id":"37-67","exam":37,"no":67,"subject":"介護の基本","group":1,"case":null,"stem":"ＩＣＦ（International Classification of Functioning, Disability and Health：国際生活機能分類）における「参加」と「活動」の2つが関連した，認知症の人の支援に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["若年性アルツハイマー型認知症（dementia of the Alzheimer’s type with early onset）があり，治療している。","認知症カフェに通い，体操をしている。","近所に住む長男が，買物を代行している。","自宅にある広い庭を，バリアフリー化している。","見当識障害があり，ＧＰＳ装置を身に着けている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"ＩＣＦでは、「活動」は課題や行為の個人による遂行（体操をする）、「参加」は生活・人生場面への関わり（認知症カフェに通う）を指す。選択肢2は両方を含んでいる。","choices":["若年性アルツハイマー型認知症があり治療していることは「健康状態」にあたる。","認知症カフェに通うこと（参加）と、体操をすること（活動）の両方が含まれる。","長男が買物を代行していることは、人的な「環境因子」にあたる。","庭のバリアフリー化は、物的な「環境因子」にあたる。","見当識障害は「心身機能・身体構造」、ＧＰＳ装置は「環境因子」にあたる。"],"point":"ＩＣＦの分類問題は、「病気＝健康状態」「機能障害＝心身機能」「動作・行為＝活動」「地域や社会での役割・場への関わり＝参加」「人・物・制度＝環境因子」と当てはめて判断する。他者が代わりに行うことは、本人の活動ではなく環境因子。","note":null}},{"id":"37-68","exam":37,"no":68,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護保険制度における訪問介護員（ホームヘルパー）が行うサービス内容として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者が大切にしている庭の植木に，水やりをする。","利用者が長年飼っている猫のペットフードを，購入してくる。","掃き掃除をする習慣のある利用者と一緒に，寝室をほうきで掃除する。","利用者と一緒に，近所のラーメン屋に行く。","利用者のクレジットカードを預かって，買物を代行する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"掃除の習慣がある利用者と一緒に掃除をすることは、本人の力を生かした自立支援の援助であり、訪問介護のサービスとして適切である。厚生労働省の通知（老計第10号）でも、利用者と一緒に手助けや見守りをしながら行う掃除は「自立生活支援・重度化防止のための見守り的援助」として身体介護に位置づけられている。","choices":["庭の植木への水やりは、日常生活の援助に該当しない行為とされ、訪問介護では行えない。","ペットの世話は、日常生活の援助に該当しない行為とされ、ペットフードの購入も同様に対象外。","本人の習慣と残存能力を生かし、一緒に掃除する自立支援の援助。","外食への付き添いは、日常生活に必要な援助（通院・日常の買物など）には当たらず、訪問介護のサービスには含まれない。","クレジットカードを預かることは金銭管理上のトラブルの原因となり、訪問介護員が行うべきではない。"],"point":"訪問介護で行えないのは「直接本人の援助に該当しない行為（家族の分の家事・来客の応接など）」と「日常生活の援助に該当しない行為（草むしり・花木の水やり・ペットの世話・大掃除など）」。一方、利用者と一緒に行う家事は自立支援として推奨される、と覚える。","note":null}},{"id":"37-69","exam":37,"no":69,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護従事者を守る法制度として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["労働安全衛生法では，年に1回以上の健康診断を行うことを義務づけている。","労働者災害補償保険法では，労働時間，賃金，休暇などの労働条件を定めている。","環境基本法では，快適な職場環境の形成の促進を定めている。","介護休業は，対象家族1名につき，毎年93日間を取得できる。","出生時育児休業は，子の出生後から8週間取得できる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"労働安全衛生法は、事業者に労働者の健康診断を義務づけており、常時使用する労働者には1年以内ごとに1回の定期健康診断を行わなければならない（夜勤など特定業務の従事者は6か月以内ごとに1回）。","choices":["労働安全衛生法による定期健康診断の義務。","労働時間・賃金・休暇などの労働条件の最低基準を定めているのは労働基準法。労働者災害補償保険法は、業務上や通勤による災害への保険給付を定める。","快適な職場環境の形成の促進を定めているのは労働安全衛生法。環境基本法は公害防止や自然環境の保全など、環境政策の基本を定める法律。","介護休業は、対象家族1人につき通算93日まで（3回まで分割可）。毎年93日取得できるわけではない。","出生時育児休業（産後パパ育休）は、子の出生後8週間以内に、4週間（28日）まで取得できる制度。8週間取得できるわけではない。"],"point":"労働関係の法律は「労働条件＝労働基準法」「健康診断・職場環境＝労働安全衛生法」「労災の補償＝労働者災害補償保険法」と役割で区別する。休業制度は「介護休業は通算93日・3回まで」「出生時育児休業は8週間以内に4週間まで」と、数字と「通算」「以内」の言葉に注意する。","note":null}},{"id":"37-70","exam":37,"no":70,"subject":"介護の基本","group":1,"case":null,"stem":"<b>Ｂ<\/b>さん（68歳，女性，要介護1）は，ヨーロッパで生まれ育ち，50歳のときに日本人と結婚した。65歳で夫と共に日本で暮らすようになったが，日本語は十分に理解できない。半年前に，脳梗塞（cerebral infarction）を起こし，利き手に麻痺があり，立ち上がりも不安定である。現在は，介護老人保健施設に入所し，在宅復帰へ向けたリハビリテーションを行っている。<b>Ｂ<\/b>さんはこれまでの生活様式を守り，自宅で自分のペースで食事ができるようになりたいと希望している。<br>次の記述のうち，<b>Ｂ<\/b>さんへの介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["入所中は母語を使わずに，日本語を話すように伝える。","居室の床に布団を敷いて，寝起きができるようにする。","自分で食事ができるように，自助具の使用状況を確認する。","ほかの利用者と同じ時間に食べ終えるように伝える。","日本の生活に合わせるように，余暇活動の内容は介護福祉職が判断する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"Ｂさんは利き手に麻痺があり、「自宅で自分のペースで食事ができるようになりたい」と希望している。自助具の使用状況を確認し、自分で食事ができるよう支援することが、本人の希望と在宅復帰の目標にかなう。","choices":["母語は本人の文化やアイデンティティの一部。使用を禁じることは尊厳を損ない、意思疎通もさらに難しくなる。","ヨーロッパで育ったＢさんの生活様式を考えると、布団での寝起きは合わない。立ち上がりが不安定なため、床からの立ち上がりは転倒の危険も高い。","本人の希望（自分で食事をする）を、自助具の活用で支える。","本人は自分のペースで食べることを望んでいる。ほかの利用者に合わせるよう求めるのは、個別性を無視した対応。","余暇活動は本人の希望や文化を尊重して決める。日本の生活に合わせるよう介護福祉職が決めるのは不適切。"],"point":"事例問題では、まず本人の希望（ここでは「これまでの生活様式」「自分のペースで食事」）を見つけ、それを実現する選択肢を選ぶ。文化・習慣の違いを「日本に合わせさせる」選択肢は誤り。","note":null}},{"id":"37-71","exam":37,"no":71,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，チームアプローチに関するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護福祉職が利用者のところに行って，相談，支援を行う。","障害者が，地域の資源を活用して，共生社会の実現を目指す。","複数の専門職が共通の目標に向かって協働し，課題解決に取り組む。","利用者に代わって，専門職がサービスを決定する。","当事者が集まって体験談を話し，共に支えあう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"チームアプローチとは、介護・医療・リハビリテーションなど複数の専門職が、利用者の生活課題について共通の目標を持ち、それぞれの専門性を生かして協働することである。","choices":["支援者が利用者のもとへ出向いて相談・支援を行うのはアウトリーチ。","地域資源を活用して共生社会を目指すことは、地域共生社会やノーマライゼーションの考え方に関する記述で、チームアプローチの説明ではない。","多職種が共通の目標に向かって協働する。","利用者に代わって専門職がサービスを決めることは、自己決定を損なうパターナリズムにあたる。","当事者同士が体験を語り支え合うのは、セルフヘルプグループやピアサポート。"],"point":"用語の定義問題では、「出向く＝アウトリーチ」「当事者同士の支え合い＝セルフヘルプグループ／ピアサポート」「多職種の協働＝チームアプローチ」をセットで区別する。チームの中心は利用者本人で、専門職が勝手に決める選択肢は誤り。","note":null}},{"id":"37-72","exam":37,"no":72,"subject":"介護の基本","group":1,"case":null,"stem":"介護保険施設における防災対策に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護福祉士は，災害派遣福祉チームで活動することが義務づけられている。","介護福祉士は，防災スキル向上のために，防災士の資格取得が義務づけられている。","災害対策基本法に基づき，個別避難計画の作成が施設長に義務づけられている。","一般的に，飲料水と非常食は1日分の備蓄が義務づけられている。","災害時等に備えて，業務継続計画（ＢＣＰ：Business Continuity Plan）の策定が義務づけられている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"介護保険施設を含む介護サービス事業者には、感染症や災害が発生しても必要なサービスを継続するための業務継続計画（ＢＣＰ）の策定が義務づけられている。令和3年度の介護報酬改定で導入され、3年間の経過措置を経て、令和6年4月から完全に義務化された。","choices":["災害派遣福祉チーム（ＤＷＡＴ）は、都道府県が福祉専門職などの参加を得て組織するもので、介護福祉士に参加が義務づけられているわけではない。","防災士は民間の資格で、介護福祉士に取得の義務はない。","災害対策基本法で個別避難計画の作成（努力義務）を担うのは市町村。施設長の義務ではない。","備蓄は一般に「最低3日分」が目安とされる。1日分の備蓄を義務づける規定はない。","業務継続計画（ＢＣＰ）の策定は、介護サービス事業者に義務づけられている。"],"point":"「義務づけられている」という断定は、根拠となる法令・基準があるかで判断する。介護施設に関する義務は「ＢＣＰの策定」「非常災害に関する具体的計画の策定と避難訓練」など。個別避難計画は「市町村の努力義務」と主体ごと覚える。","note":null}},{"id":"37-73","exam":37,"no":73,"subject":"介護の基本","group":1,"case":null,"stem":"次のうち，結核（tuberculosis）の予防対策に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["便座のアルコール消毒","肺炎球菌ワクチンの接種","紫外線を避けた生活","年に1回の胸部Ｘ線検査","50℃以上の温水によるリネン類の洗濯"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"結核は空気感染する感染症で、高齢者は過去の感染が再燃して発病することがある。年1回の胸部Ｘ線検査などの定期健康診断で早期に発見し、感染の拡大を防ぐことが重要な予防対策である。","choices":["結核は空気感染（飛沫核感染）するため、便座の消毒は結核の予防にならない。便座などの環境消毒は、接触感染する感染症への対策。","肺炎球菌ワクチンは肺炎球菌による感染症を防ぐもので、結核には効かない。結核の予防接種はＢＣＧ。","紫外線を避けることは結核の予防と関係がない。","定期的な胸部Ｘ線検査による早期発見が、結核の予防対策になる。","熱い湯でのリネン類の洗濯は、疥癬などの接触感染する病気への対策として挙げられるもので、空気感染する結核の予防策ではない。"],"point":"感染症対策は「感染経路」で判断する。結核・麻しん・水痘は空気感染（Ｎ95マスク、換気、早期発見）、インフルエンザは飛沫感染、ノロウイルスや疥癬は接触感染。経路と対策の組み合わせを入れ替えた選択肢に注意する。","note":null}},{"id":"37-74","exam":37,"no":74,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"次の記述のうち，利用者とのコミュニケーションの場面で用いる要約の技法として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["開かれた質問をして，利用者の気持ちを明らかにした。","共感しながら話を聞き，利用者の気持ちを受け止めた。","話の途中でうなずき，利用者の気持ちに同意した。","話の内容を総合的にまとめて返し，利用者の気持ちを整理した。","自己覚知を図り，利用者との人間関係の形成に努めた。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"要約は、利用者が話した内容の要点を介護福祉職がまとめて返す技法である。利用者は自分の話や気持ちを整理でき、介護福祉職は理解が正しいかを確かめられる。","choices":["開かれた質問は、相手が自由に答えられる質問の技法で、要約ではない。","共感しながら聞き、気持ちを受け止めるのは共感・受容の態度で、要約ではない。","うなずきは、話を聞いていることを伝え、話を促す技法。うなずくことは同意を示すことと同じではなく、要約でもない。","話の内容を総合的にまとめて返すのが要約。","自己覚知は、援助者が自分の価値観や感情の傾向を知ることで、コミュニケーションの技法ではない。"],"point":"傾聴の技法は「うなずき・あいづち（話を促す）」「繰り返し（言葉をそのまま返す）」「言い換え（別の言葉で返す）」「要約（全体をまとめて返す）」で区別する。「総合的にまとめる」「整理する」という言葉があれば要約。","note":null}},{"id":"37-75","exam":37,"no":75,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"次の記述のうち，利用者と家族の意向が異なるとき，家族とのコミュニケーションにおいて介護福祉職が留意すべき点として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["家族に支援方針を決めてもらう。","家族を通して利用者の意向を聴き取る。","家族と話す機会を別に設ける。","家族にカウンセリングを行うことを意識する。","家族を説得する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"利用者と家族の意向が異なるとき、利用者の前では家族が本音を話しにくいことがある。家族と話す機会を別に設けることで、家族の思いや事情を十分に聴き、双方の意向を調整する手がかりが得られる。","choices":["支援方針は利用者本人の意向を中心に決める。家族に決めてもらうのは本人の自己決定を損なう。","利用者の意向は本人から直接聴き取る。家族を通すと、家族の考えが混ざって本人の意向が正しく伝わらないおそれがある。","家族の思いを率直に聴ける場を別に設ける。","カウンセリングは専門的な心理援助で、介護福祉職の役割ではない。家族の思いを傾聴し、受け止めることが求められる。","家族を説得すると、家族の思いが受け止められず、信頼関係が損なわれる。"],"point":"家族とのコミュニケーションでは「家族の思いも受け止める」「本人の意向は本人から聴く」「どちらか一方に決めさせない」が判断の軸。「説得する」「家族に決めてもらう」は誤りの型。","note":null}},{"id":"37-76","exam":37,"no":76,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，男性，要介護3）は，介護老人福祉施設に入所している。アルツハイマー型認知症（dementia of the Alzheimer’s type）が進行している。ある日の昼食時，介護福祉職が<b>Ａ<\/b>さんに配膳すると，「お金はこれしかありません。足りますか」と小さくたたまれたティッシュペーパーを渡してきた。<br>このときの<b>Ａ<\/b>さんに対する介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ティッシュペーパーは，口の周りが汚れたら拭くものだと伝える。","ティッシュペーパーが不足しているサインとして受け止める。","飲食店での会計の場面であると認識して対応する。","食事に集中するように促す。","小遣いの増額を家族に相談する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"アルツハイマー型認知症の進行したＡさんは、配膳された食事を飲食店での食事と受け止め、ティッシュペーパーをお金として支払おうとしている。Ａさんが生きている世界を否定せず、その場面に合わせて対応することで、安心して食事ができる。","choices":["ティッシュペーパーの本来の使い方を伝えても、Ａさんの認識を否定することになり、混乱や不安を招く。","Ａさんの言動は「お金はこれしかありません。足りますか」という支払いの場面であり、ティッシュペーパーの不足を表しているわけではない。","飲食店での会計の場面として受け止め、安心できるように対応する。","Ａさんは支払いを気にしている。その不安に応えずに食事を促しても、安心して食べられない。","Ａさんの言動は現金不足を示すものではない。小遣いの増額を相談しても、Ａさんの不安の解消にはつながらない。"],"point":"認知症の人の言動は「本人にとってはどんな場面か」を考えて受け止める。事実を正す・物の使い方を教える・話をそらす選択肢は誤りになりやすい。本人の世界に合わせて安心につなげる対応が正解の型。","note":null}},{"id":"37-77","exam":37,"no":77,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"構音障害のある<b>Ｂ<\/b>さんは，現在発語訓練を実施中である。ある日，介護福祉職に対して，「おあんで，あつがおごれた」と訴えた。介護福祉職は，<b>Ｂ<\/b>さんの発語をうまく聞き取れず，「もう一度，言ってください」と伝えた。<b>Ｂ<\/b>さんは，自身の発語で会話を続けようとしているが，介護福祉職には，その内容を十分に理解することができなかった。<br>このときの，<b>Ｂ<\/b>さんに対する介護福祉職の判断として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ｂ<\/b>さんは言葉の意味の理解に支障があるため，会話の継続は困難である。","発音が苦手なため，短い言葉でゆっくり話してもらう必要がある。","話す意欲があるため，開かれた質問が有効である。","発語訓練の効果がみられないため，訓練を中止する必要がある。","<b>Ｂ<\/b>さんの言葉が聞き取れないため，会話を中断する必要がある。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"構音障害は、言葉の意味の理解や言葉を選ぶ力は保たれているが、発音器官の動きの障害によって正しく発音できない状態である。聞き取りやすくするためには、短い言葉で、ゆっくり話してもらうことが有効である。","choices":["言葉の意味の理解に支障があるのは失語症（感覚性失語など）。構音障害では理解は保たれている。","短い言葉でゆっくり話してもらうと、聞き取りやすくなる。","開かれた質問は長い答えを求めるため、発音が苦手なＢさんには負担が大きい。「はい」「いいえ」で答えられる閉じた質問が有効。","訓練の中止は専門職が評価して判断すること。介護福祉職が効果がないと判断して中止するのは不適切。","Ｂさんは会話を続けようとしている。聞き取れないからと中断すると、話す意欲を損なう。"],"point":"「構音障害＝発音の障害（理解は保たれる）」「失語症＝言葉の理解・表出の障害」を区別する。構音障害には「短い言葉でゆっくり」「閉じた質問」「五十音表やコミュニケーションボードの活用」が有効。","note":null}},{"id":"37-78","exam":37,"no":78,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ｃ<\/b>さん（55歳，男性）は，知的障害がある。3か月前に，施設から居宅での一人暮らしに移行し，現在は，居宅介護（ホームヘルプサービス）を利用しながら生活している。ある日，<b>Ｃ<\/b>さんが，「ゴミ，分けて捨てるの，難しいよ」と言うので，室内に分別収集の説明書を貼って，カレンダーに収集日を書くことにした。そして，介護福祉職は，「この説明書とカレンダーを見て，捨てるといいですよ」と<b>Ｃ<\/b>さんに伝えた。その後，<b>Ｃ<\/b>さんは努力していたが，分別できなかったゴミが少しずつ増えていった。<br>次のうち，<b>Ｃ<\/b>さんにかける介護福祉職の最初の言葉として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「ゴミでいっぱいになる前に，適切に捨てられるようになりましょう」","「説明書とカレンダーをよく見てください」","「ゴミが増えてきて，気持ち悪いですね」","「がんばっていれば，上手にできるようになりますよ」","「ゴミ捨ては難しいですよね。できることをいっしょに考えましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ｃさんは努力しているが、分別できないゴミが増えている。まずＣさんの「難しい」という気持ちを受け止め、できることを一緒に考える声かけが、意欲を保ちながら支援方法を見直すことにつながる。","choices":["「適切に捨てられるようになりましょう」は、努力しているＣさんの気持ちを受け止めずに、結果だけを求める言葉。","説明書とカレンダーを見るよう繰り返しても、その方法でうまくいかなかった事実に向き合っていない。支援方法の見直しが必要。","「気持ち悪い」は介護福祉職の否定的な感情を伝える言葉で、Ｃさんを傷つける。","「がんばっていれば」は、すでに努力しているＣさんにさらに努力を求める言葉で、具体的な支援にもならない。","難しさに共感し、できることを一緒に考える。"],"point":"「最初の言葉」を問う問題は、まず本人の気持ちを受け止める言葉を選ぶ。そのうえで、うまくいかない方法を繰り返させるのではなく、一緒に方法を考える選択肢が正解になりやすい。","note":null}},{"id":"37-79","exam":37,"no":79,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"介護保険サービスにおける記録に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["記録に含まれないものとして食事チェック表がある。","介護記録は介護福祉職の意見を中心に記録する。","調査・研究目的で記録を利用することは避ける。","主観的情報と客観的事実は区別しないで記録する。","利用者は記録の閲覧を請求することができる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"介護記録は利用者の個人情報であり、個人情報保護法に基づき、利用者本人は事業者に記録（保有個人データ）の開示を請求することができる。","choices":["食事チェック表も、食事量などを記した記録の一つである。","介護記録は、事実を客観的に記録することが基本。介護福祉職の意見が中心ではない。","本人の同意を得るなど、個人情報の保護に配慮した手続きをとれば、記録を調査・研究に利用することもできる。","主観的情報（利用者の訴えや介護福祉職の判断）と客観的事実は、区別して記録する。","利用者は自分の記録の開示を請求できる。"],"point":"記録の原則は「事実を客観的に」「主観と客観を区別」「5W1Hを明確に」「利用者は開示を請求できる」。「避ける」「区別しない」など、記録の活用や正確さを否定する選択肢は誤りと判断しやすい。","note":null}},{"id":"37-80","exam":37,"no":80,"subject":"生活支援技術","group":4,"case":null,"stem":"高齢者に配慮した居室環境に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["夏は高齢者が発汗してから冷房を使用する。","暖房を使用するときは除湿機を併用する。","冷房を使用するときは換気を控える。","温度は介護福祉職の感覚で調整する。","冬はトイレの温度を居室の温度に近づける。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"冬は暖かい居室と寒いトイレ・浴室などとの温度差で血圧が急に変動し、ヒートショックを起こすおそれがある。トイレの温度を居室に近づけて、温度差を小さくすることが大切である。","choices":["高齢者は暑さやのどの渇きを感じにくく、発汗してからでは熱中症の危険が高い。温度計を見て早めに冷房を使う。","暖房を使うと空気が乾燥するため、併用するのは加湿器。除湿機を使うとさらに乾燥する。","冷房中も、空気をきれいに保つために適度な換気が必要。","室温は温度計・湿度計を確認し、利用者の感じ方を聞いて調整する。介護福祉職の感覚では、高齢者の体感とずれることがある。","居室とトイレの温度差を小さくし、ヒートショックを防ぐ。"],"point":"高齢者の居室環境は「温度差をなくす（ヒートショック予防）」「暑さを感じにくいので早めに冷房」「暖房時は加湿」がポイント。「介護福祉職の感覚で」は利用者本位でないため誤りの型。","note":null}},{"id":"37-81","exam":37,"no":81,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護の現場において，レクリエーション活動で実施するアイスブレーキングの効果として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["参加者の緊張感を軽減することができる。","活動内容を毎回固定して実施することができる。","介護福祉職の負担を軽減することができる。","利用者の参加を義務づけることができる。","勝敗を楽しむことができる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"アイスブレーキング（アイスブレイク）は、氷を砕くように、初対面や活動開始時の緊張をほぐす手法である。簡単なゲームや自己紹介などで場の雰囲気を和らげ、参加しやすくする。","choices":["参加者の緊張をほぐすのがアイスブレーキングの目的。","活動内容は参加者の状態や希望に合わせて工夫する。毎回固定することはアイスブレーキングの効果ではない。","アイスブレーキングは参加者のための手法で、介護福祉職の負担軽減が目的ではない。","レクリエーションへの参加は本人の自由意思による。参加を義務づけることはできない。","勝敗を楽しむのは競技的なゲームの要素で、緊張をほぐすアイスブレーキングの効果とは異なる。"],"point":"「アイス（氷）をブレイク（砕く）＝緊張をほぐす」と言葉の意味から覚える。レクリエーションでは「参加は自由」「参加者に合わせて内容を工夫する」が原則で、「義務づける」「固定する」は誤り。","note":null}},{"id":"37-82","exam":37,"no":82,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護福祉職が行う身じたく・整容の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ベッド上で行う口腔ケアは，ガーグルベースンを用いる。","総義歯の洗浄は，歯みがき剤を用いる。","耳垢の除去は，ピンセットを用いる。","ベッド上で行う洗顔は，冷水に浸して絞ったタオルを用いる。","浴室で行う洗髪は，ドライシャンプーを用いる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"ガーグルベースンは、ベッド上でうがいをするときに、吐き出した水を受けるための容器である。ベッド上の口腔ケアでは、側臥位や上体を起こした姿勢で、口元にガーグルベースンを当てて使う。","choices":["ベッド上の口腔ケアでは、ガーグルベースンでうがいの水を受ける。","歯みがき剤には研磨剤が含まれることが多く、義歯の表面を傷つける。総義歯は義歯用ブラシを使い、流水で洗う。","ピンセットは外耳道や鼓膜を傷つけるおそれがある。耳垢の除去は耳の入り口付近にとどめ、耳垢がたまって詰まっている（耳垢塞栓）場合は医療職に相談する。","冷水のタオルは体を冷やし、不快感を与える。洗顔には温かいタオルを用いる。","ドライシャンプーは、入浴や洗髪ができないときに使うもの。浴室ではシャワーで洗い流せる。"],"point":"整容の介護は「用具の正しい使い方」と「その場面に合う方法か」で判断する。義歯は「歯みがき剤を使わない」「熱湯で洗わない」「外したら水につけて保管」の3つをセットで覚える。","note":null}},{"id":"37-83","exam":37,"no":83,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，障害のある人への事故防止の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["パーキンソン病（Parkinson disease）の人には，低めのベッドを用意する。","認知症（dementia）の人には，ガスコンロを用意する。","在宅酸素療法中の人のそばでは，喫煙しない。","視覚障害のある人には，洗体用に頭受け台を用意する。","聴覚障害のある人には，補高便座を用意する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"酸素には物が燃えるのを助ける性質があり、在宅酸素療法中の人のそばで火を使うと、チューブや衣類に燃え移って重大な火災ややけどにつながる。喫煙は絶対にしない（厚生労働省も火気を近づけないよう注意喚起している）。","choices":["パーキンソン病の人は立ち上がりや姿勢の保持が難しい。低すぎるベッドは立ち上がりにくく、かえって転倒の危険が高まる。足底が床につき、立ち上がりやすい高さにする。","認知症の人は、火の消し忘れなどで火災を起こす危険がある。安全装置付きの調理器具などを検討する。","酸素は燃焼を助けるため、そばで喫煙しない。","頭受け台は、入浴時（シャワーキャリーやストレッチャー浴など）に頭部を支えるための用具で、視覚障害への事故防止策ではない。視覚障害のある人には、物の位置を一定にし、触って確認できるようにする。","補高便座は、膝や股関節の動きの制限などで立ち座りが難しい人のための用具。聴覚障害とは関係がない。"],"point":"福祉用具や環境整備の問題は、「その障害のどんな困難に対応する用具か」を結びつけて判断する。在宅酸素療法は「火気厳禁」が最重要ポイント。","note":null}},{"id":"37-84","exam":37,"no":84,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，右片麻痺の利用者が多点杖を使用して3動作歩行を開始するときに，介護福祉職が行う説明として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「杖，右足，左足の順で歩きましょう」","「杖，左足，右足の順で歩きましょう」","「右足，左足，杖の順で歩きましょう」","「左足，杖，右足の順で歩きましょう」","「左足，右足，杖の順で歩きましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"片麻痺のある人の3動作歩行は、杖を健側の手に持ち、「杖 → 患側の足 → 健側の足」の順に出す。右片麻痺の場合、杖は左手に持ち、「杖、右足、左足」の順になる。","choices":["杖 → 患側（右足） → 健側（左足）の順。","杖の次に健側（左足）を出すと、患側の右足だけで体を支える瞬間ができ、不安定になる。","杖より先に患側の右足を出すと、支えのない状態で麻痺側の足を出すことになり、転倒の危険が高い。","健側の左足を最初に出すと、杖も健側の足も前にない状態で患側に体重がかかり、不安定になる。","杖を最後に出す順序では、杖の支えがないまま両足を出すことになり、杖の役割を果たさない。"],"point":"3動作歩行は「杖 → 患側 → 健側」、2動作歩行は「杖と患側を同時 → 健側」。問題文の「右片麻痺」「左片麻痺」から、まず患側がどちらかを確かめて当てはめる。階段は「上りは健側から、下りは患側から」もあわせて覚える。","note":null}},{"id":"37-85","exam":37,"no":85,"subject":"生活支援技術","group":4,"case":null,"stem":"ノーリフティングケアに関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["仰臥位（背臥位）の利用者を抱え上げて，端座位にする。","仰臥位（背臥位）の利用者を手前に引きよせて，ストレッチャーに移乗する。","端座位の利用者の体幹を抱きかかえて，車いすに移乗する。","端座位の利用者にスライディングボードを使用して，車いすに移乗する。","立位が困難な端座位の利用者に回転移動盤を使用して，車いすに移乗する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"ノーリフティングケアは、介護者が人力だけで利用者を抱え上げたり引きずったりせず、福祉用具を活用して、介護者と利用者の双方の負担や危険を減らす考え方である。スライディングボードは座ったまま滑らせて移乗するための用具で、この考え方に合う。","choices":["利用者を抱え上げることは、ノーリフティングケアで避けるべき人力による持ち上げ。","手前に引き寄せる移乗は介護者の腰に負担がかかり、利用者の皮膚にも摩擦が生じる。スライディングシートなどを使う。","体幹を抱きかかえて移乗するのは人力による持ち上げで、腰痛や転落の原因になる。","スライディングボードを使い、持ち上げずに移乗する。","回転移動盤は、立位がある程度とれる人が足を乗せ、体の向きを変えるときに使う用具。立位が困難な人には適さない。"],"point":"ノーリフティングケアの問題は「持ち上げる」「抱える」「引き寄せる」を含む選択肢を除外し、福祉用具を使う選択肢から、利用者の状態に合う用具を選ぶ。スライディングボード＝座位で移乗、回転移動盤＝立位がとれる人の方向転換、と使い分けを押さえる。","note":null}},{"id":"37-86","exam":37,"no":86,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，左片麻痺の利用者を右側臥位から端座位にするときの介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者に左手でベッド柵をつかむように伝える。","利用者に右肘を支点にして上体を起こしてもらう。","利用者の右脚をベッドから下ろす。","利用者の頸部を支えて上体を起こす。","端座位の利用者の右側に立って上体を支える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"左片麻痺の利用者は、健側の右側を下にした右側臥位から、右肘を支点にして上体を起こすことで、健側の力を生かして端座位になれる。本人ができる動作は本人に行ってもらい、介護福祉職はそれを支える。","choices":["左手は麻痺側のため、ベッド柵をしっかりつかめない。つかむのは健側の右手。","健側の右肘を支点にして、自分の力で上体を起こしてもらう。","右脚は健側で、本人が動かせる。両脚をベッドから下ろす必要があり、麻痺側の左脚は健側の右脚ですくうなどして、本人の力で下ろせるよう支援する。","頸部だけを支えて持ち上げると首に負担がかかり、本人の力も生かせない。肩や背部を支え、本人の起き上がる動きに合わせて介助する。","左片麻痺の人は端座位で麻痺側（左側）に倒れやすい。介護福祉職は左側（麻痺側）に立って支える。"],"point":"片麻痺の介護は「健側を使ってもらう」「介護者は患側に立つ（倒れやすい側を守る）」が基本。問題文の麻痺側を確かめ、右・左を入れ替えたひっかけに注意する。","note":null}},{"id":"37-87","exam":37,"no":87,"subject":"生活支援技術","group":4,"case":null,"stem":"口腔ケアに関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["うがいは，顔貌を整える。","歯みがきは，感染予防になる。","口腔内の乾燥は，口臭を予防する。","唾液腺マッサージは，唾液の分泌を抑える。","咀嚼機能の向上のために，タッピングを行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"歯みがきで歯垢（プラーク）や食べかすを取り除くと、口腔内の細菌が減り、むし歯や歯周病のほか、誤嚥性肺炎などの感染症の予防につながる。","choices":["うがいは、口腔内の食べかすや汚れを洗い流し、口の中を潤すためのもの。顔貌（顔の形）を整える効果はない。","歯みがきで細菌を減らし、感染を予防する。","口腔内が乾燥すると唾液による自浄作用が低下し、細菌が増えて口臭の原因になる。","唾液腺マッサージは、唾液の分泌を促すために行う。","タッピングは、胸や背中を軽くたたいて痰を出しやすくする方法として知られる。咀嚼機能の向上には、口腔体操などを行う。"],"point":"口腔ケアの効果は「感染予防（誤嚥性肺炎）」「口臭予防」「唾液分泌の促進」「味覚の保持」。乾燥は口臭を「予防する」ではなく「招く」、マッサージは分泌を「抑える」ではなく「促す」と、効果を逆にしたひっかけに注意する。","note":null}},{"id":"37-88","exam":37,"no":88,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，口腔ケアを実施するときの留意点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["実施中は，利用者に顎を上げた姿勢をとってもらう。","総義歯は，上顎から下顎の順に外してもらう。","歯みがきの前に，うがいを行ってもらう。","歯ブラシは，大きく動かして磨いてもらう。","舌ブラシは，舌先から咽頭に向かって動かしてもらう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"歯みがきの前にうがいをすると、口の中が湿って汚れが落ちやすくなり、大きな食べかすも取り除ける。","choices":["顎を上げると気道が開いて、水や唾液を誤嚥しやすくなる。顎を軽く引いた姿勢をとってもらう。","総義歯を外すときは、外れやすい下顎から外し、次に上顎を外す。装着は上顎から行う。","歯みがきの前にうがいをして、口腔内を湿らせ汚れを落としやすくする。","歯ブラシを大きく動かすと、歯と歯ぐきの境目などの汚れが落ちにくく、歯ぐきを傷つけることもある。小刻みに動かして磨く。","舌ブラシは舌の奥から手前（舌先）に向かって動かす。咽頭に向かって動かすと、汚れを奥に押し込み、嘔吐反射を起こすこともある。"],"point":"口腔ケアの手順は「顎を引く」「義歯は下から外し上から入れる」「舌は奥から手前へ」「歯ブラシは小刻みに」。向きや順序を逆にした選択肢が定番のひっかけ。","note":null}},{"id":"37-89","exam":37,"no":89,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護が必要な人への熱中症対策のために，介護福祉職が行う水分補給の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["のどが渇いてから，水分を取るように伝える。","水でむせるときは，ゼリーの提供を控える。","起床時は，水分摂取を控えるように伝える。","食事のときの水分は，一日の水分摂取量から除く。","汗の量が多いときは，塩分を含んだ飲み物を勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"大量に汗をかくと、水分だけでなく塩分（ナトリウム）も失われる。水だけを飲むと体内の塩分濃度が下がるため、汗の量が多いときは塩分を含んだ飲み物（経口補水液など）を勧める。","choices":["高齢者はのどの渇きを感じにくい。渇きを感じる前に、時間を決めてこまめに水分を取ってもらう。","水でむせる人には、ゼリーやとろみをつけた飲み物が水分補給に役立つ。ゼリーの提供を控えるのは逆。","睡眠中も水分は失われるため、起床時は水分を補給する。","食事のときに飲むお茶や汁物などの水分も、一日の水分摂取量に含めて把握する。","汗の量が多いときは、塩分を含んだ飲み物で水分と塩分を補う。"],"point":"高齢者の水分補給は「渇く前にこまめに」「起床時・入浴前後・就寝前にも」「むせる人はゼリーやとろみ」「大量の汗には塩分も」。控える・除くといった水分を減らす選択肢は誤りと判断しやすい。","note":null}},{"id":"37-90","exam":37,"no":90,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ａ<\/b>さん（75歳，男性）は，1年前に前頭側頭型認知症（frontotemporal dementia）と診断され，現在は，認知症対応型共同生活介護（認知症高齢者グループホーム）に入居している。若い頃から食べることが好きである。現在，咀嚼や嚥下機能の低下はなく，スプーンを使い，自分で食べている。最近，飲み込む前に次々と食べ物を口に入れることが増えた。<br>次の記述のうち，<b>Ａ<\/b>さんの現在の状態に合わせた食事の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["取っ手つきのコップを準備する。","食器に少量ずつ盛りつけて提供する。","すべての料理をテーブルの上に並べる。","大きなスプーンに変更する。","手で持って食べられる物を準備する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"前頭側頭型認知症では、抑制がきかなくなり、次々と食べ物を口に詰め込むことがある。食器に少量ずつ盛りつけると、一度に口に入れる量が減り、窒息を防ぎながら自分で食べ続けられる。","choices":["取っ手つきのコップは、手でうまく握れない人のための用具。Ａさんの困りごと（詰め込み）には対応していない。","少量ずつ盛りつけ、一度に口に入る量を減らす。","すべての料理を並べると、次々と口に入れる行動を強め、窒息の危険が高まる。","大きなスプーンでは一口の量が増え、詰め込みや窒息の危険が高まる。小さめのスプーンが適している。","手で持って食べられる物は、さらに次々と口に入れやすくなる。Ａさんはスプーンで自分で食べられている。"],"point":"前頭側頭型認知症の特徴は「脱抑制（我慢がきかない）」「常同行動（同じ行動を繰り返す）」「食行動の変化（早食い・詰め込み・同じ物ばかり食べる）」。詰め込みには「少量ずつ提供」「小さいスプーン」で一口量を調整する。","note":null}},{"id":"37-91","exam":37,"no":91,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，パーキンソン病（Parkinson disease）で上肢の震えはあるが，自力摂取が可能な利用者の食事の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["食事後に口腔内のアイスマッサージを行う。","片側の縁が高くなっている皿を準備する。","上半身を後ろに20度程度倒すように伝える。","食器の置いてある位置を説明する。","踵を床から浮かすように伝える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"上肢の震えがあると、食べ物をすくうときに皿の外へこぼしやすい。片側の縁が高くなっている皿は、縁に食べ物を押し当ててすくえるため、自力摂取を助ける。","choices":["アイスマッサージは、嚥下反射を促すために食事の前などに行う方法。この利用者の困りごとは上肢の震えで、嚥下障害の記述はない。","すくいやすい皿で、震えがあっても自分で食べられるようにする。","上半身を後ろに倒すと誤嚥しやすい。食事は、やや前かがみの姿勢で行う。","食器の位置を説明するのは、視覚障害のある人への支援。","踵を浮かすと姿勢が不安定になる。足底を床につけて、体を安定させる。"],"point":"自助具は「困りごと」と結びつけて覚える。震え・すくいにくさ＝縁が高い皿（すくいやすい皿）、握力の低下＝太い柄のスプーン、視覚障害＝クロックポジションでの説明。食事姿勢は「やや前かがみ・足底を床につける」が基本。","note":null}},{"id":"37-92","exam":37,"no":92,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，入浴の作用を生かした，高齢者への入浴の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["食事は，入浴直前に摂取する。","高血圧の人には，42℃以上の湯につかってもらう。","浴槽の中では，関節運動を促す。","心疾患（heart disease）のある人には，肩まで湯につかってもらう。","個浴の浴槽内では，足を浮かせてもらう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"入浴には温熱・静水圧・浮力の作用がある。浴槽の中では浮力で体が軽くなり、関節への負担が減るため、関節を動かす運動がしやすくなる。","choices":["食事の直前・直後の入浴は、消化に必要な血液が皮膚に集まり、消化を妨げる。食後すぐや空腹時の入浴は避ける。","42℃以上の熱い湯は交感神経を刺激し、血圧を上げる。高血圧の人には、ぬるめの湯が適している。","浮力の作用を生かして、関節運動を促す。","肩までつかると静水圧が心臓や肺に負担をかける。心疾患のある人には、みぞおち程度までの半身浴が適している。","足を浮かせると体が浮いて不安定になり、溺れる危険がある。足底を浴槽の壁につけて体を安定させる。"],"point":"入浴の3作用は「温熱（血行促進）」「静水圧（心肺への負担、むくみの軽減）」「浮力（体が軽くなる）」。熱い湯・肩までの全身浴・食事直後の入浴は、高齢者に負担をかける組み合わせとして覚える。","note":null}},{"id":"37-93","exam":37,"no":93,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，下肢筋力が低下して介護を必要とする人の入浴に適した環境として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["浴室の入口は開き戸にする。","床から浴槽の縁までの高さは20 cm にする。","縦に長く，浅めの洋式の浴槽にする。","浴槽の縁の幅は20 cm にする。","浴槽への出入りのために，水平および垂直の手すりを設置する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"下肢筋力が低下した人が浴槽に出入りするときは、またぐ動作や立ち座りで体を支える必要がある。水平の手すりは浴槽の縁に腰掛けるときなどに、垂直の手すりは立ち上がりや体を支えるときに使え、両方を設置すると安全に出入りできる。","choices":["開き戸は開閉のときに体を前後に動かす必要があり、内開きの場合は浴室内で倒れた人がいると開けにくい。引き戸が適している。","床から浴槽の縁までは、腰掛けてまたげる高さ（一般に40cm程度）がよい。20cmでは低すぎて縁に腰掛けて移乗しにくく、浴槽の底が深くなりまたぎにくい。","縦に長い洋式の浴槽は、体が滑って沈みやすく、足が浴槽の壁に届かず姿勢を保ちにくい。膝を軽く曲げて座れる和洋折衷式が適している。","縁の幅が20cmもあると、またぐ距離が長くなり、縁を握って体を支えることもしにくい。","水平と垂直の手すりで、浴槽への出入りを支える。"],"point":"浴室環境は「引き戸」「浴槽の縁の高さは40cm程度」「和洋折衷式の浴槽」「手すりの設置」をセットで覚える。数値の入れ替え（20cmなど）に注意する。","note":null}},{"id":"37-94","exam":37,"no":94,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，体調不良で入浴できない片麻痺の利用者に対して，ベッド上で行う全身清拭の方法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["清拭時は，窓を開けて行う。","洗面器には，40℃程度のお湯を準備する。","最初に，腹部から清拭する。","背部は，患側を下にした側臥位にして拭く。","蒸しタオルで拭いた後は，乾いたタオルで水分を拭き取る。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"蒸しタオルで拭いた後に皮膚に水分が残ると、蒸発するときに体の熱を奪い（気化熱）、体が冷える。拭いた後はすぐに乾いたタオルで水分を拭き取る。","choices":["窓を開けると室温が下がり、体が冷える。窓を閉めて室温を調整し、終わってから換気する。","お湯は清拭中に冷めやすいため、40℃程度では低い。熱めの湯（50〜55℃程度とされることが多い）を用意する。","全身清拭は、一般に顔から始め、上肢・胸腹部・下肢・背部の順に行う。最初に腹部から拭くのは一般的な順序ではない。","患側を下にした側臥位は、麻痺側を圧迫し、痛みや関節の損傷を起こすおそれがある。背部は健側を下にした側臥位で拭く。","拭いた後はすぐに乾いたタオルで水分を拭き取り、体の冷えを防ぐ。"],"point":"清拭は「体を冷やさない」が最優先。窓を閉める、熱めの湯、拭いたらすぐ乾いたタオル、露出は最小限。片麻痺の人の側臥位は「健側を下」と覚える。","note":null}},{"id":"37-95","exam":37,"no":95,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，同居の高齢者におむつを使用する家族介護者に対する，介護福祉職の説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「使用する本人の羞恥心に気を配りましょう」","「尿失禁を防ぐことができます」","「尿量を気にせずに，1日中同じおむつを使うことができます」","「おむつを着けると，安心して排泄ができます」","「家族の都合に合わせて，おむつを使いましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"おむつの使用は、本人にとって羞恥心や自尊心の低下につながりやすい。家族介護者には、交換時の露出を少なくするなど、本人の羞恥心に気を配るよう説明することが大切である。","choices":["本人の羞恥心と尊厳に配慮するよう伝える。","おむつは失禁した尿を受け止めるもので、尿失禁そのものを防ぐことはできない。","同じおむつを長時間使うと、皮膚のかぶれや尿路感染症の原因になる。尿量や排泄のタイミングに合わせて交換する。","おむつの中に排泄することに抵抗感や不快感を持つ人は多く、安心して排泄できるとはいえない。","おむつは本人の状態に合わせて使う。家族の都合で使うと、本人の排泄機能や意欲の低下を招く。"],"point":"おむつに関する問題は「安易に使わない」「使うときは尊厳と皮膚の清潔に配慮する」が軸。おむつの効果を大げさに述べる選択肢（失禁を防ぐ、1日中使える、安心できる）は誤りの型。","note":null}},{"id":"37-96","exam":37,"no":96,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，ポータブルトイレを使用するときの排泄の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ポータブルトイレの下に新聞紙を敷く。","ベッドで臥床している状態で，ズボンや下着をおろす。","ポータブルトイレには，前かがみになって座ってもらう。","排泄が終わるまで，ポータブルトイレの後ろに立って待つ。","排泄後の陰部の清拭は，ベッドの上で行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"ポータブルトイレに座るときは、やや前かがみの姿勢をとると腹圧がかかりやすく、排便しやすくなる。足底を床につけて安定した姿勢をとってもらう。","choices":["新聞紙は滑りやすく、立ち上がりや移乗のときに足が滑って転倒するおそれがある。下に敷くなら滑りにくいマットなどにする。","ズボンや下着は、立位で手すりなどにつかまっておろす。臥床したままおろすと、下半身を露出した状態で移乗することになり、羞恥心への配慮にも欠ける。","前かがみの姿勢は腹圧をかけやすく、排便を促す。","排泄中にそばで待たれると、落ち着いて排泄できない。安全を確認したら、声をかけてその場を離れ、終わったら呼んでもらう。","排泄後の陰部の清拭は、ポータブルトイレ上（座位や、手すりにつかまった立位）で済ませてからベッドに戻る。汚れたままベッドに戻ると、寝具を汚し不潔になる。"],"point":"排泄介護は「自然な排泄姿勢（前かがみ・足底を床に）」「プライバシーへの配慮（そばで待たない）」「転倒予防」で判断する。トイレでの排便を促す姿勢は、出題が多いので押さえておく。","note":null}},{"id":"37-97","exam":37,"no":97,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護福祉職が行うことのできる，坐薬（座薬）を用いた介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["膣から挿入する坐薬（座薬）が扱える。","坐薬（座薬）は，あたたかな場所で保管する。","坐薬（座薬）は，とがっていない方から挿入する。","腹部に力を入れるよう促しながら，坐薬（座薬）を挿入する。","下剤以外の坐薬（座薬）挿入は，先に排泄を済ませてから行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"解熱剤などの下剤以外の坐薬は、直腸から薬を吸収させるものである。挿入後に排便すると薬が一緒に出てしまうため、先に排泄を済ませてから挿入する。","choices":["介護福祉職が行える医薬品の使用の介助は、肛門から挿入する坐薬で、一定の条件を満たす場合に限られる。膣から挿入する坐薬は含まれない。","坐薬は体温で溶けるように作られているため、あたたかい場所では溶けて変形する。冷所（冷蔵庫など）で保管する。","坐薬は、とがった方から挿入する。とがった方から入れると挿入しやすく、肛門の刺激も少ない。","腹部に力を入れると、坐薬が押し出されてしまう。口からゆっくり息を吐いてもらい、力を抜いた状態で挿入する。","薬が排泄されないよう、先に排泄を済ませてから挿入する。"],"point":"坐薬は「冷所保存」「とがった方から」「口で息を吐いて力を抜く」「下剤以外は排便後に」がセット。介護福祉職が行えるのは肛門からの坐薬挿入で、条件（容態が安定しているなど）があることも押さえる。","note":null}},{"id":"37-98","exam":37,"no":98,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，調理における基本調味料の効果や使い方として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["砂糖は，塩より先に入れると，食物に甘みが浸透しやすくなる。","塩は，食物のうま味を増し，照りを出す。","酢は，食物の水分を引き出し，保存性を高める。","しょうゆは，食物のくさみを抜き，肉を柔らかくする。","みそは，味付けの最初に入れると，特有の香りが逃げない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"砂糖は塩より分子が大きく、食材にしみ込むのに時間がかかる。塩を先に入れると食材が締まり、砂糖の甘みが入りにくくなるため、砂糖は塩より先に入れる（調味の「さしすせそ」）。","choices":["砂糖は塩より先に入れると、甘みが浸透しやすい。","照りを出すのは砂糖やみりん。塩の主な働きは、味をつける、食材の水分を引き出す、防腐など。","食材の水分を引き出すのは、主に塩の働き。酢の主な働きは、殺菌・防腐、さっぱりした酸味をつけることなど。","しょうゆには香りづけやくさみを抑える働きがあるが、肉を柔らかくする働きはしょうゆの特徴とはいえない。酢やワインなどに漬けると肉は柔らかくなりやすい。","みその香りは加熱で失われやすいため、味付けの最後に入れる。"],"point":"調味の順序は「さ（砂糖）・し（塩）・す（酢）・せ（しょうゆ）・そ（みそ）」。後半のしょうゆ・みそは香りを生かすため最後に入れる、と理由とセットで覚える。","note":null}},{"id":"37-99","exam":37,"no":99,"subject":"生活支援技術","group":4,"case":null,"stem":"食品の保存に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["賞味期限の切れた未開封の缶詰は，すぐに廃棄する。","ウインナーには，消費期限が記載されている。","前日調理して常温保存した肉入りカレーは，再加熱する。","りんごを冷蔵庫で保存するときは，ビニール袋に入れて密封する。","冷凍食品は，一度解凍しても再冷凍すれば長期間の保存が可能である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"りんごは、ほかの野菜や果物の熟成を早めるエチレンガスを多く出す。冷蔵庫ではビニール袋に入れて密封し、ほかの食品への影響と乾燥を防ぐ。","choices":["賞味期限は、おいしく食べられる期限。過ぎてもすぐに食べられなくなるわけではないため、未開封の缶詰をすぐに廃棄する必要はない。","ウインナーなど品質の劣化が比較的遅い加工食品には、通常、賞味期限が表示される。消費期限は弁当など傷みやすい食品に表示される。","肉入りカレーなどを常温で保存すると、ウエルシュ菌が増えることがある。この菌は熱に強い芽胞をつくるため、再加熱しても安全とはいえない。小分けして早く冷まし、冷蔵保存する。","りんごはビニール袋に入れて密封し、冷蔵庫で保存する。","一度解凍した冷凍食品を再冷凍すると、品質が落ち、解凍中に増えた細菌も残る。再冷凍は避ける。"],"point":"期限表示は「消費期限＝安全に食べられる期限（傷みやすい食品）」「賞味期限＝おいしく食べられる期限（劣化が遅い食品）」で区別する。カレーやシチューの常温保存とウエルシュ菌は、食中毒の頻出テーマ。","note":null}},{"id":"37-100","exam":37,"no":100,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，衣類の保管方法として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["衣装ケースで保管するときは，たたんだ衣類の下に防虫剤を入れる。","ドライクリーニング後の衣類は，ビニールを外さずに保管する。","汚れのひどい衣類は，介護福祉職の判断で廃棄する。","湿気を含んだ衣類は，たたんで引き出しに保管する。","絹製品は，タンスの上部に保管する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"湿気は下のほう（床に近い引き出し）にたまりやすい。床付近は温度が低く、湿度が上がりやすいためである。湿気や虫害に弱い絹製品は、タンスの上部に保管するのが適している。","choices":["防虫剤の成分は空気より重く、上から下に広がる。衣類の上に置く。","クリーニングのビニールをかけたままにすると、湿気がこもってカビや変色の原因になる。外してから保管する。","衣類は利用者の持ち物。汚れがひどくても、介護福祉職が勝手に廃棄せず、本人の意向を確認する。","湿気を含んだまま保管するとカビや臭いの原因になる。よく乾かしてからしまう。","湿気がたまりにくいタンスの上部に、絹製品を保管する。"],"point":"衣類の保管は「防虫剤は上に置く」「湿気は下にたまる」「ビニールは外す」「乾かしてからしまう」。利用者の持ち物を「介護福祉職の判断で」処分する選択肢は、すぐに誤りと判断できる。","note":null}},{"id":"37-101","exam":37,"no":101,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護の現場で行うベッドメイキングとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["居室の窓は，閉めて行う。","キャスターのあるベッドは，ストッパーを外す。","シーツの中心線を，マットレスの端に合わせる。","シーツをマットレスの下に入れるときは，手掌を下にする。","シーツ交換は，両膝を伸ばしたままで行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"シーツをマットレスの下に入れるときは、手掌（手のひら）を下に向けて差し込む。マットレスを大きく持ち上げずにシーツを奥まで入れやすく、しわになりにくい。","choices":["ベッドメイキングではほこりが舞うため、窓を開けて換気しながら行う。","キャスターのあるベッドは、動かないようにストッパーをかけて行う。外すとベッドが動き、事故の原因になる。","シーツの中心線は、マットレスの中心に合わせる。端に合わせると、シーツが片側に寄って包み込めない。","手掌を下に向けて、シーツをマットレスの下に入れる。","両膝を伸ばしたまま行うと腰に負担がかかる。膝を曲げて腰を落とし、重心を低くする（ボディメカニクス）。"],"point":"ベッドメイキングは「換気」「ストッパーをかける」「中心線を合わせる」「膝を曲げて重心を低く」。ボディメカニクスの原則（支持基底面を広く、重心を低く）は移乗介護の問題でも使えるので、あわせて覚える。","note":null}},{"id":"37-102","exam":37,"no":102,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ｂ<\/b>さん（90歳，女性，要介護3）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）があり，介護老人福祉施設に入所している。テレビを見ることが好きで，日中はお茶を飲みながら，テレビを見て過ごすことが日課である。1週間前から<b>Ｂ<\/b>さんは，夜中に目が覚めたり，3時ごろに起きたりと，不眠が続いている。2時間ほどしか寝ていない日もある。ある日，<b>Ｂ<\/b>さんは，「昼間，眠くてしかたがない。からだがだるい」と介護福祉職に話した。<br>次の記述のうち，<b>Ｂ<\/b>さんに安眠を促すための介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["午前中，太陽の光を浴びることを勧める。","昼間眠いときは，1時間以上の昼寝を勧める。","夕食後，すぐに寝ることを勧める。","寝る前に，介護福祉職の判断で睡眠薬を勧める。","夜眠れないときは，居室でテレビを見ることを勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"朝から午前中に太陽の光を浴びると、体内時計がリセットされ、夜に自然な眠気が起こりやすくなる。昼夜の生活リズムを整えることが、安眠を促す基本である。","choices":["午前中に日光を浴び、体内時計を整える。","長い昼寝は夜の睡眠を妨げる。昼寝は午後の早い時間に、短時間（30分程度まで）にとどめる。","夕食後すぐに寝ると、早く目覚めて夜中や早朝に起きる原因になる。消化の面でも好ましくない。","睡眠薬は医師の処方と指示に基づいて使う。介護福祉職が自分の判断で勧めることはできない。","テレビの光や刺激は脳を覚醒させ、さらに眠れなくなる。夜に眠れないときは、照明を落とし落ち着ける環境を整える。"],"point":"安眠の支援は「朝の光」「日中の活動」「短い昼寝」「寝る前の刺激（光・カフェイン）を避ける」。介護福祉職の判断で薬を勧める選択肢は、どの分野でも誤り。","note":null}},{"id":"37-103","exam":37,"no":103,"subject":"生活支援技術","group":4,"case":null,"stem":"終末期の介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["決まった時間に食事を提供する。","部屋の換気は控えるようにする。","無反応のときは無言で静かに介護を行う。","呼吸困難時は，顎を下げて頭部を前屈させた仰臥位（背臥位）にする。","せん妄によって話のつじつまが合わないときは，否定せずに受け止める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"終末期にはせん妄が起こり、話のつじつまが合わなくなることがある。否定や訂正をせずに受け止めることで、本人の不安を和らげ、安心して過ごせるようにする。","choices":["終末期には食欲や体調が変動しやすい。決まった時間ではなく、本人が食べたいときに、食べたい物を食べられるようにする。","部屋の換気をして、空気を清潔に保ち、臭いがこもらないようにする。","聴覚は最期まで保たれるといわれる。反応がなくても声をかけながら介護する。","顎を下げて頭部を前屈させると、気道が狭くなり呼吸がさらに苦しくなる。呼吸困難時は、上体を起こした姿勢（セミファーラー位など）にする。","せん妄による言動を否定せずに受け止める。"],"point":"終末期の介護は「本人の望みを優先（食事の時間や内容）」「反応がなくても声をかける」「呼吸が苦しいときは上体を起こす」「言動を否定しない」。規則どおりの対応や、無言で行う介護は誤りの型。","note":null}},{"id":"37-104","exam":37,"no":104,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，キューブラー・ロス（Kubler-Ross, E.）が提唱した終末期にある人の死の受容過程のうち，「死は避けられないと知り，さまざまな喪失感を抱く段階」に該当するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["否認","怒り","取り引き","抑うつ","受容"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"キューブラー・ロスは、死の受容過程を「否認」「怒り」「取り引き」「抑うつ」「受容」の5段階で示した。死が避けられないと知り、さまざまな喪失感を抱いて気持ちが沈む段階は「抑うつ」である。","choices":["否認は、死が近いという事実を受け入れず、「何かの間違いだ」と否定する段階。","怒りは、「なぜ自分が」と周囲に怒りを向ける段階。","取り引きは、神や運命などと取り引きして、死を先延ばしにしようとする段階。","抑うつは、死が避けられないと知り、喪失感を抱く段階。","受容は、死を自然なこととして静かに受け入れる段階。"],"point":"5段階は「否認 → 怒り → 取り引き → 抑うつ → 受容」の順で覚え、各段階の特徴となる言葉（間違いだ・なぜ自分が・〜するから助けて・喪失感・静かに受け入れる）と結びつける。","note":null}},{"id":"37-105","exam":37,"no":105,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ｃ<\/b>さん（58歳，男性）は，アテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）がある。腕，脚，体幹の筋肉は不随意的にゆっくりと動くことが多く，手指を細かく動かすことは難しい。言葉をはっきり発音することが困難であるが，音の聞き取りはできる。<br>次のうち，<b>Ｃ<\/b>さんが使用している情報・意思疎通支援用具として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["福祉電話","携帯用会話補助装置","人工喉頭","助聴器","点字器"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Ｃさんは音の聞き取りはできるが、はっきり発音することが難しく、手指の細かい動きも困難である。携帯用会話補助装置は、文字や記号を選ぶなどして音声や文字で意思を伝える機器で、発語が困難な人の意思疎通を支える。","choices":["福祉電話は電話を使えるようにするための用具で、音声で話す必要がある。発音が困難なＣさんの意思伝達の課題には対応していない。","発語が困難な人が、音声や文字で意思を伝えるための機器。","人工喉頭は、喉頭を摘出して声が出せなくなった人が、発声のために使う用具。","助聴器は、聞こえにくい人の聞き取りを助ける用具。Ｃさんは音の聞き取りができる。","点字器は、視覚障害のある人が点字を書くための用具。"],"point":"情報・意思疎通支援用具は「障害の種類」と結びつけて覚える。発語困難＝携帯用会話補助装置、喉頭摘出＝人工喉頭、聴覚障害＝助聴器など、視覚障害＝点字器。事例文の「できること（聞き取れる）」「できないこと（発音・手指の細かい動き）」から用具を絞り込む。","note":null}},{"id":"37-106","exam":37,"no":106,"subject":"介護過程","group":10,"case":null,"stem":"次の記述のうち，介護過程を展開する目的として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["家族が抱える生活課題の解決","個別ケアに基づく利用者の自立支援","介護福祉職の職業倫理の向上","利用者と家族の信頼関係の構築","介護福祉職と他職種の連携の促進"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"介護過程は、情報収集・アセスメント・計画・実施・評価を通して、その人に合った個別ケアを科学的・計画的に行うための方法である。目的は、利用者が望む生活を実現し、自立を支援することにある。","choices":["家族の生活課題も考慮はするが、介護過程の中心はあくまで利用者本人の生活課題の解決。","個別ケアを通して利用者の自立を支援することが介護過程の目的。","職業倫理の向上は介護福祉職の資質向上の課題で、介護過程を展開する目的ではない。","信頼関係は介護過程を進めるための土台として大切だが、それ自体が目的ではない。","他職種との連携は、介護過程を展開する中で必要になる手段であり、目的ではない。"],"point":"「介護過程の目的」を問われたら、主語が「利用者」で「望む生活の実現・自立支援・個別ケア」を含む選択肢を選ぶ。家族・介護福祉職・他職種が主語の選択肢は、手段や副次的な効果を目的にすり替えた型。","note":null}},{"id":"37-107","exam":37,"no":107,"subject":"介護過程","group":10,"case":null,"stem":"生活課題に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["家族の立場から検討する。","利用者のニーズを判断の基盤にする。","利用者の要望を1つに集約する。","介護福祉職の主観を尊重する。","生命の危機よりも利用者の意向を優先する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"生活課題は、利用者が望む生活を実現するうえで解決が必要なことである。利用者の言葉（要望）をそのまま課題にするのではなく、情報を分析して導いた本人のニーズを判断の基盤にする。","choices":["家族の意向も参考にするが、生活課題は利用者本人の立場から検討する。","利用者のニーズを判断の基盤にして生活課題を明らかにする。","生活課題は複数あることが多い。1つにまとめるのではなく、優先順位をつけて整理する。","介護福祉職の主観ではなく、客観的な情報と根拠に基づいて判断する。","生命の危機に関わる課題は、優先順位が最も高い。本人の意向は大切だが、生命の安全より優先するものではない。"],"point":"「要望（デマンド）」と「ニーズ」は区別して覚える。要望は本人が口にする希望、ニーズは専門職が分析して導く本当に必要なこと。優先順位は「生命・安全に関わる課題」が最優先。","note":null}},{"id":"37-108","exam":37,"no":108,"subject":"介護過程","group":10,"case":null,"stem":"次の記述のうち，介護過程の展開における評価の説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["他の利用者と比較して評価する。","短期目標の評価によって，介護過程の展開を終了する。","目標の達成状況を評価する。","介護計画の実施後に評価日を検討する。","介護計画を修正した場合は，評価を省略する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"介護過程の評価では、介護計画で設定した目標がどの程度達成されたかを確認し、支援内容が適切だったか、計画を見直す必要があるかを判断する。","choices":["評価は、その利用者自身の目標に照らして行う。他の利用者との比較ではない。","短期目標を評価したら、長期目標に向けて次の計画につなげる。介護過程は評価から再アセスメントへと循環する。","目標の達成状況を評価する。","評価日は、介護計画を立案する段階であらかじめ決めておく。","計画を修正した場合も、修正後の計画について評価を行う。評価を省略することはない。"],"point":"評価の基準は「目標」、評価日は「計画立案時に設定」、評価のあとは「再アセスメント・計画修正へ循環」。他人との比較や、終了・省略を含む選択肢は誤りの型。","note":null}},{"id":"37-109","exam":37,"no":109,"subject":"介護過程","group":10,"case":null,"stem":"次のうち，介護保険制度のサービス担当者会議におけるサービス提供責任者の役割として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["会議の主催","居宅サービス計画の原案の説明","他職種が実施したサービス内容の評価","訪問介護計画の作成に要した時間の報告","訪問介護計画の作成に必要な情報の確認"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"サービス担当者会議は、介護支援専門員が居宅サービス計画の原案をもとに開き、各サービスの担当者が専門的な意見を出し合う場である。サービス提供責任者は、ここで利用者の状況や居宅サービス計画の内容を確認し、訪問介護計画の作成に必要な情報を得る。","choices":["会議を開催（主催）するのは介護支援専門員。","居宅サービス計画の原案を作成して説明するのも介護支援専門員。","他職種が実施したサービス内容を評価することは、サービス提供責任者の役割ではない。","訪問介護計画の作成に要した時間を会議で報告する必要はない。","訪問介護計画の作成に必要な情報を確認する。"],"point":"「居宅サービス計画（ケアプラン）＝介護支援専門員」「訪問介護計画＝サービス提供責任者」と作成者を対にして覚える。訪問介護計画は居宅サービス計画の内容に沿って作るので、会議では情報の確認・共有が役割になる。","note":null}},{"id":"37-110","exam":37,"no":110,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題110<\/b>，<b>問題111<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（78歳，男性，要介護1）は，一人暮らしで，脳梗塞（cerebral infarction）を発症し入院した。その後，リハビリテーションを経て，自宅に戻った。利き手の右手に麻痺が残ったため，左手を使った調理の自立を目的に，訪問介護（ホームヘルプサービス）を利用することになった。サービス利用時は，訪問介護員（ホームヘルパー）の協力を得ながら，孫からプレゼントされた包丁を使って，調理に取り組んでいた。<br>ある日，好物の牛肉をうまく押さえることができず，切ることができなかった。すると，<b>Ａ<\/b>さんは包丁を置き，部屋で横になってしまった。心配した訪問介護員（ホームヘルパー）が声をかけ，バイタルサインを確認したところ変化はなかった。<b>Ａ<\/b>さんは，「右手が思うように動いてくれない。悔しい。でも，もう一度ひとりで作れるようになりたい」と話した。<br>次の日，<b>Ａ<\/b>さんは，「今日も手伝って」と訪問介護員（ホームヘルパー）に話した。","stem":"調理中に<b>Ａ<\/b>さんが包丁を置き，部屋で横になってしまった行動に対する解釈として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["体調不良による休憩","食材に対する不満","調理に対する興味の喪失","包丁に対する不満","調理がうまくできないことに対する苛立ち"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ａさんは牛肉をうまく切れなかったあと横になり、「右手が思うように動いてくれない。悔しい」と話している。バイタルサインに変化はなく、思うように調理できないことへの苛立ちによる行動と解釈できる。","choices":["バイタルサインに変化はなく、体調不良を示す情報はない。","牛肉は好物であり、食材への不満を示す情報はない。","「もう一度ひとりで作れるようになりたい」と話し、次の日も手伝いを頼んでいる。興味は失われていない。","包丁は孫からのプレゼントで、包丁への不満を示す情報はない。","「悔しい」という言葉から、うまくできないことへの苛立ちと解釈できる。"],"point":"行動の解釈は、事例文の「本人の言葉」と「客観的な情報（バイタルサインなど）」を根拠にする。事例に書かれていない理由（不満・興味の喪失）を推測した選択肢は選ばない。","note":null}},{"id":"37-111","exam":37,"no":111,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題110<\/b>，<b>問題111<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（78歳，男性，要介護1）は，一人暮らしで，脳梗塞（cerebral infarction）を発症し入院した。その後，リハビリテーションを経て，自宅に戻った。利き手の右手に麻痺が残ったため，左手を使った調理の自立を目的に，訪問介護（ホームヘルプサービス）を利用することになった。サービス利用時は，訪問介護員（ホームヘルパー）の協力を得ながら，孫からプレゼントされた包丁を使って，調理に取り組んでいた。<br>ある日，好物の牛肉をうまく押さえることができず，切ることができなかった。すると，<b>Ａ<\/b>さんは包丁を置き，部屋で横になってしまった。心配した訪問介護員（ホームヘルパー）が声をかけ，バイタルサインを確認したところ変化はなかった。<b>Ａ<\/b>さんは，「右手が思うように動いてくれない。悔しい。でも，もう一度ひとりで作れるようになりたい」と話した。<br>次の日，<b>Ａ<\/b>さんは，「今日も手伝って」と訪問介護員（ホームヘルパー）に話した。","stem":"訪問介護計画の修正を目的としたカンファレンスで，訪問介護員（ホームヘルパー）が提案する内容として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["訪問介護員（ホームヘルパー）による調理の代行","担当する訪問介護員（ホームヘルパー）の交代","配食サービスの利用","調理に関する福祉用具の活用","訪問回数の削減"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"Ａさんは「もう一度ひとりで作れるようになりたい」と意欲を示しており、課題は左手だけで食材を押さえて切ることである。食材を固定できるまな板など調理用の福祉用具を活用すれば、左手での調理の自立に近づける。","choices":["調理を代行すると、左手で調理を自立するという目標とＡさんの意欲に反する。","担当者を交代しても、食材を押さえられないという課題は解決しない。","配食サービスは、自分で調理したいというＡさんの意向に沿わない。","片手でも食材を固定できる福祉用具の活用で、調理の自立を支える。","訪問回数を減らすと、調理の練習の機会が減り、目標の達成が遠のく。"],"point":"計画修正の提案は「本人の意欲と目標を生かし、できない部分を道具や方法の工夫で補う」ものを選ぶ。代行・別サービスへの置き換え・支援の削減は、自立支援の目標から外れる型。","note":null}},{"id":"37-112","exam":37,"no":112,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題112<\/b>，<b>問題113<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｂ<\/b>さん（42歳，女性，障害支援区分3）は，知的障害があり，母親と二人暮らしである。日中は生活介護事業所に通っている。日常生活動作の一部に見守りが必要である。個別支援計画の短期目標を，「見守りのもと，トイレで排泄ができる」としている。<br>しかし，最近，排泄のときに下着やズボンを汚してしまい，それをほかの利用者にからかわれ，しばらく一人でいる様子があったと生活支援員から申し送りがあった。<br>ある日，事業所長が話しかけると，<b>Ｂ<\/b>さんは，「トイレで失敗したら恥ずかしい」と元気なく話した。母親からも電話で，「これからは紙おむつを使うように勧めているのだけど，使いたくないと<b>Ｂ<\/b>は話している」とサービス管理責任者に連絡があった。","stem":"次のうち，<b>Ｂ<\/b>さんがしばらく一人でいた様子を理解するために必要な情報として，<b>最も優先すべきもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["サービス管理責任者との関係","生活支援員との関係","事業所長との関係","ほかの利用者との関係","母親との関係"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"生活支援員の申し送りでは、Ｂさんは下着やズボンを汚したことをほかの利用者にからかわれ、そのあとしばらく一人でいた。一人でいた様子を理解するには、ほかの利用者との関係を把握することが最も優先される。","choices":["サービス管理責任者は母親からの連絡を受けた立場で、一人でいたことの直接の要因ではない。","生活支援員は様子を申し送った立場で、関係に問題があるという情報はない。","事業所長はＢさんに話しかけた立場で、一人でいたことの直接の要因ではない。","ほかの利用者にからかわれたことが、一人でいた直接のきっかけである。","母親との関係は紙おむつの話題に関わるが、事業所で一人でいたこととの関係は薄い。"],"point":"「〜を理解するために必要な情報」は、事例文でその出来事の直前に何があったか（きっかけ）を探す。登場人物が多い事例では、各人物が事例のどの場面に関わっているかを整理してから選ぶ。","note":null}},{"id":"37-113","exam":37,"no":113,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題112<\/b>，<b>問題113<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｂ<\/b>さん（42歳，女性，障害支援区分3）は，知的障害があり，母親と二人暮らしである。日中は生活介護事業所に通っている。日常生活動作の一部に見守りが必要である。個別支援計画の短期目標を，「見守りのもと，トイレで排泄ができる」としている。<br>しかし，最近，排泄のときに下着やズボンを汚してしまい，それをほかの利用者にからかわれ，しばらく一人でいる様子があったと生活支援員から申し送りがあった。<br>ある日，事業所長が話しかけると，<b>Ｂ<\/b>さんは，「トイレで失敗したら恥ずかしい」と元気なく話した。母親からも電話で，「これからは紙おむつを使うように勧めているのだけど，使いたくないと<b>Ｂ<\/b>は話している」とサービス管理責任者に連絡があった。","stem":"<b>Ｂ<\/b>さんについて，個別支援会議が開催され，短期目標を，「排泄の自立（下着を汚さずに排泄する）（3か月）」とした。次の記述のうち，<b>Ｂ<\/b>さんの短期目標を実現するために生活支援員がとる対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["定期的に，手順を理解できているか一緒に確認する。","自宅で排泄を済ませ，事業所で排泄しないように助言する。","母親の要望であると伝え，紙おむつを使うように助言する。","ポータブルトイレを設置し，そこで排泄をするように誘導する。","排泄に関する行為を，全介助にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"短期目標は「下着を汚さずに排泄する」ことである。排泄の手順（下着の下ろし方、拭き方、衣服の整え方など）を理解できているかを定期的に一緒に確認することで、Ｂさんが自分でできることを増やし、自立につなげられる。","choices":["手順の理解を一緒に確認し、自分でできる排泄を支える。","事業所で排泄しないよう助言すると、トイレで排泄する機会が失われ、目標に反する。","紙おむつはＢさん本人が使いたくないと話しており、本人の意思に反する。","トイレで排泄できる力があるのに、ポータブルトイレに変えると能力を生かせない。","全介助にすると、排泄の自立という目標から遠ざかる。"],"point":"知的障害のある人の自立支援では、手順を一緒に確認する・わかりやすく繰り返すといった「本人ができる形にする」対応が正解になりやすい。本人の意思に反する対応や、できることを奪う対応（全介助・機会の制限）は誤りの型。","note":null}},{"id":"37-114","exam":37,"no":114,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（70歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。<br><b>Ａ<\/b>さんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれた<b>Ｂ<\/b>主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。<b>Ａ<\/b>さんは信頼して，気になっていたことをすべて話すことができた。<b>Ａ<\/b>さんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。","stem":"現在の<b>Ａ<\/b>さんの症状に該当するホーエン・ヤール重症度分類として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ステージⅠ","ステージⅡ","ステージⅢ","ステージⅣ","ステージⅤ"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"ホーエン・ヤール重症度分類のステージⅢは、両側に症状があり、姿勢反射障害（体のバランスを立て直す反応の低下）が現れた段階である。方向転換が難しい、急に止まれないという症状は姿勢反射障害を示しており、事例に日常生活で介助を要する記述がない（地域包括支援センターや市役所に自ら出向いている）ことからステージⅢに当たる。","choices":["ステージⅠは、症状が体の片側だけにみられる段階。","ステージⅡは、症状が両側にあるが、姿勢反射障害はない段階。","方向転換が難しく、急に止まれないのは姿勢反射障害で、ステージⅢ。","ステージⅣは、日常生活に介助が必要になるが、立つことや歩くことはなんとかできる段階。","ステージⅤは、車いすの生活や寝たきりで、全面的な介助が必要な段階。"],"point":"ステージは「Ⅰ＝片側」「Ⅱ＝両側」「Ⅲ＝姿勢反射障害（方向転換が難しい・止まれない・転びやすい）」「Ⅳ＝介助が必要だが歩ける」「Ⅴ＝車いす・寝たきり」で覚える。ⅢとⅣの境目は「日常生活に介助が必要か」。","note":null}},{"id":"37-115","exam":37,"no":115,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（70歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。<br><b>Ａ<\/b>さんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれた<b>Ｂ<\/b>主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。<b>Ａ<\/b>さんは信頼して，気になっていたことをすべて話すことができた。<b>Ａ<\/b>さんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。","stem":"要介護認定を申請してから2週間が経過した。<b>Ａ<\/b>さんは要介護認定の認定結果が届かないことが気になった。そこで，以前に対応してくれた<b>Ｂ<\/b>主任介護支援専門員に電話で相談した。<br>次のうち，<b>Ｂ<\/b>主任介護支援専門員の応答として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「次の受診時に主治医に相談しましょう」","「通常1か月程度かかるので，あと2週間くらい待ってみましょう」","「以前に自宅に来てくれた認定調査員に相談しましょう」","「念のためにもう一度要介護認定を申請してください」","「通常であれば認定結果は出ていると思います」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"要介護認定の結果は、介護保険法で原則として申請日から30日以内に出すと定められている。申請から2週間であれば、まだ結果が届いていなくても通常の範囲であり、あと2週間ほど待つよう伝えるのが適切である。","choices":["主治医は意見書を作成するが、認定結果を通知する立場ではない。","原則30日以内に結果が出るため、あと2週間ほど待つよう伝える。","認定調査員は心身の状況を調査するだけで、判定（介護認定審査会）や通知（市町村）は行わない。","申請はすでに受け付けられており、もう一度申請する必要はない。","2週間では結果が出ていないことも普通であり、不安をあおる誤った説明になる。"],"point":"要介護認定の流れは「申請（市町村）→ 認定調査・主治医意見書 → 一次判定（コンピュータ）→ 二次判定（介護認定審査会）→ 市町村が通知」。期間は「原則30日以内」と数字で覚える。","note":null}},{"id":"37-116","exam":37,"no":116,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（70歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。<br><b>Ａ<\/b>さんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれた<b>Ｂ<\/b>主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。<b>Ａ<\/b>さんは信頼して，気になっていたことをすべて話すことができた。<b>Ａ<\/b>さんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。","stem":"最近，<b>Ａ<\/b>さんは急に体の動きが悪くなる時間帯があり，不安を感じた。そこで<b>Ａ<\/b>さんは，週に2回利用している訪問介護員（ホームヘルパー）に相談した。相談を受けた訪問介護員（ホームヘルパー）は<b>Ａ<\/b>さんに，日々の症状の変化とその時間，さらにもう一点をメモして，医師に伝えるようにと助言した。<br>日々の症状の変化とその時間に加えて，<b>Ａ<\/b>さんが医師に伝える内容として，<b>最も優先度の高いもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["服薬の時間","起床の時間","食事の時間","排便の時間","入浴の時間"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"パーキンソン病の治療薬は、長く使ううちに効いている時間が短くなり、次の服薬前に急に動きが悪くなること（ウェアリング・オフ現象）がある。症状の変化と服薬の時間の関係がわかれば、医師が薬の量や回数を調整する判断材料になる。","choices":["症状の変化と服薬時間の関係は、薬の調整に欠かせない情報。","起床の時間は、急に動きが悪くなる原因を判断する手がかりとしては優先度が低い。","食事は薬の吸収に影響することもあるが、まず必要なのは服薬の時間。","便秘はパーキンソン病によくみられるが、急に動きが悪くなる時間帯との関係は薄い。","入浴の時間は、症状の変動の原因を判断する情報としては優先度が低い。"],"point":"パーキンソン病で「急に動きが悪くなる時間帯がある」ときは、薬の効果が切れるウェアリング・オフ現象を考え、服薬時間との関係を記録する。服薬時間と関係なく急に動けなくなったり動けたりするオン・オフ現象もあわせて覚える。","note":null}},{"id":"37-117","exam":37,"no":117,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｃ<\/b>さん（90歳，女性）は，動物好きで長年ペットのオウムを飼っている。5年前に夫が亡くなったときも，ペットが大きな心の支えになった。2年前，身体の衰えから買物や調理などの家事が難しくなり，一人暮らしが困難になったので，ペットと入所できる健康型有料老人ホームに入所した。<br>最近<b>Ｃ<\/b>さんは，毎週楽しみにしていたレクリエーションがある曜日や時間を忘れてしまう，トイレの場所がわからず失禁するなどの症状が繰り返し生じるようになってきた。心配した娘が<b>Ｃ<\/b>さんと病院を受診したところ，アルツハイマー型認知症（dementia of the Alzheimer’s type）と診断を受けた。<br>健康型有料老人ホームでは対応が困難になってきたため，心配した娘は<b>Ｃ<\/b>さんが入所できる施設に移ることを検討し始めた。","stem":"次のうち，最近の<b>Ｃ<\/b>さんの症状に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["妄想","見当識障害","失語","遂行機能障害","観念失行"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"見当識障害は、時間・場所・人物などがわからなくなる症状である。レクリエーションのある曜日や時間を忘れる（時間の見当識）、トイレの場所がわからない（場所の見当識）という症状は、見当識障害に当たる。","choices":["妄想は、事実でないことを確信して訂正できない症状（物盗られ妄想など）。事例にはその情報がない。","曜日や時間、トイレの場所がわからないのは見当識障害。","失語は、言葉を話したり理解したりすることが難しくなる症状。事例にはその情報がない。","遂行機能障害は、計画を立てて順序よく物事を進めることが難しくなる症状。","観念失行は、道具の使い方や一連の動作の手順がわからなくなる症状（お茶をいれる手順がわからないなど）。"],"point":"「いつ・どこ・だれ」がわからなければ見当識障害。トイレの場所がわからず失禁するのは、排泄機能の問題ではなく、認知機能の低下などで起こる機能性尿失禁と結びつけて覚える。","note":null}},{"id":"37-118","exam":37,"no":118,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｃ<\/b>さん（90歳，女性）は，動物好きで長年ペットのオウムを飼っている。5年前に夫が亡くなったときも，ペットが大きな心の支えになった。2年前，身体の衰えから買物や調理などの家事が難しくなり，一人暮らしが困難になったので，ペットと入所できる健康型有料老人ホームに入所した。<br>最近<b>Ｃ<\/b>さんは，毎週楽しみにしていたレクリエーションがある曜日や時間を忘れてしまう，トイレの場所がわからず失禁するなどの症状が繰り返し生じるようになってきた。心配した娘が<b>Ｃ<\/b>さんと病院を受診したところ，アルツハイマー型認知症（dementia of the Alzheimer’s type）と診断を受けた。<br>健康型有料老人ホームでは対応が困難になってきたため，心配した娘は<b>Ｃ<\/b>さんが入所できる施設に移ることを検討し始めた。","stem":"娘は<b>Ｃ<\/b>さんの病状を心配して，「お父さんが残してくれた貯金があるから，もっとお母さんのお世話をしてくれる施設に移ろう」と提案した。<b>Ｃ<\/b>さんは，「ペットと一緒に暮らせなくなるのは嫌だ」とつぶやき，うつむいた。困った娘は健康型有料老人ホームの介護福祉士に相談した。<br>次のうち，娘への介護福祉士の応答として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「<b>Ｃ<\/b>さんがペットを大事にしている意思を尊重してはいかがですか」","「<b>Ｃ<\/b>さんが新しい施設に行くことが最優先です」","「あなたの意向を優先してはいかがですか」","「<b>Ｃ<\/b>さんがペットを飼うことは優先度の高いニーズとは言えません」","「<b>Ｃ<\/b>さんが新しい施設に行くことを受け入れるように説得してください」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"Ｃさんは「ペットと一緒に暮らせなくなるのは嫌だ」と話している。ペットは夫を亡くしたときにも心の支えになっており、Ｃさんにとって大切な存在である。介護福祉士は娘の心配を受け止めつつ、Ｃさんの意思を尊重するよう提案するのが適切である。","choices":["ペットを大事にするＣさんの意思を尊重するよう娘に伝える。","Ｃさんの意思を確かめずに、施設を移ることを最優先にしている。","娘の意向を優先すると、Ｃさん本人の意思が置き去りになる。","ペットはＣさんの心の支えであり、優先度の低いニーズと決めつけるのは誤り。","本人の意思に反して説得させることは、自己決定の尊重に反する。"],"point":"家族と本人の意向が違う場面では、家族の思いを受け止めたうえで「本人の意思の尊重」を軸に答える。認知症があっても意思決定の主体は本人。事例文の過去のエピソード（ペットが心の支え）は、本人の価値観を示す手がかりになる。","note":null}},{"id":"37-119","exam":37,"no":119,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｃ<\/b>さん（90歳，女性）は，動物好きで長年ペットのオウムを飼っている。5年前に夫が亡くなったときも，ペットが大きな心の支えになった。2年前，身体の衰えから買物や調理などの家事が難しくなり，一人暮らしが困難になったので，ペットと入所できる健康型有料老人ホームに入所した。<br>最近<b>Ｃ<\/b>さんは，毎週楽しみにしていたレクリエーションがある曜日や時間を忘れてしまう，トイレの場所がわからず失禁するなどの症状が繰り返し生じるようになってきた。心配した娘が<b>Ｃ<\/b>さんと病院を受診したところ，アルツハイマー型認知症（dementia of the Alzheimer’s type）と診断を受けた。<br>健康型有料老人ホームでは対応が困難になってきたため，心配した娘は<b>Ｃ<\/b>さんが入所できる施設に移ることを検討し始めた。","stem":"<b>Ｃ<\/b>さんと娘は介護福祉士と相談し，希望に沿った施設を見つけることができた。<br>次のうち，<b>Ｃ<\/b>さんが入所する施設として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["経過的軽費老人ホーム（Ｂ型）","介護医療院","介護老人保健施設","養護老人ホーム","介護付有料老人ホーム"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ｃさんは認知症の診断を受けて介護が必要になってきたが、医療的な管理が特に必要な状態ではない。介護付有料老人ホームは、特定施設入居者生活介護の指定を受け、ホームの職員から介護を受けながら生活を続けられる。娘は費用を負担できる見通しも示している。","choices":["経過的軽費老人ホーム（Ｂ型）は、自炊ができる程度に身の回りのことができる人が対象で、介護が必要になったＣさんには合わない。","介護医療院は、長期的な療養と医療が必要な人のための施設。Ｃさんは医療の必要性が高い状態ではない。","介護老人保健施設は、在宅復帰を目指してリハビリテーションなどを行う施設で、長く暮らし続けることを前提としていない。","養護老人ホームは、環境上・経済的な理由で自宅での生活が難しい人が、市町村の措置で入所する施設。Ｃさんは経済的な問題を抱えていない。","介護を受けながら生活を続けられる介護付有料老人ホームが適切。"],"point":"施設は「目的と対象」で区別する。「介護老人保健施設＝在宅復帰」「介護医療院＝長期療養と医療」「養護老人ホーム＝措置（環境上・経済的理由）」「軽費老人ホーム＝低額で身の回りのことができる人」「介護付有料老人ホーム＝ホームの職員による介護」。","note":null}},{"id":"37-120","exam":37,"no":120,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｄ<\/b>さん（男性，障害支援区分4）は，ベッカー型筋ジストロフィー（Becker muscular dystrophy）である。自宅で家族と生活をしている。<b>Ｄ<\/b>さんは，食事は自立しているが，排泄，入浴に介護が必要である。歩行はできず，移動は電動車いすを使用している。絵を描くことが趣味であり，日中は創作活動に取り組んでいる。<br>これまで<b>Ｄ<\/b>さんは自宅で家族の介護を受けながら生活してきたが，<b>Ｄ<\/b>さんの身体機能の低下に伴い，家族の介護負担が増えたため，居宅介護を利用することになった。","stem":"<b>Ｄ<\/b>さんの疾患で生じる病態として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["筋線維の変性","運動神経の変性","網膜の変性","自己免疫の低下","脳細胞の変性"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"筋ジストロフィーは、筋線維が変性・壊死して筋力が徐々に低下していく遺伝性の病気である。ベッカー型はデュシェンヌ型と同じ遺伝子の異常によるが、発症が遅く、進行もゆるやかである。","choices":["筋線維の変性・壊死によって筋力が低下する。","運動神経（運動ニューロン）が変性するのは、筋萎縮性側索硬化症（ALS）など。","網膜が変性するのは、網膜色素変性症など。","筋ジストロフィーは免疫の病気ではない。自己免疫の異常で起こる神経・筋の病気には、重症筋無力症などがある。","脳細胞が変性するのは、アルツハイマー型認知症などの神経変性疾患。"],"point":"筋力が低下する病気は「どこが障害されるか」で区別する。「筋ジストロフィー＝筋肉そのもの」「ALS＝運動神経」「重症筋無力症＝神経と筋のつなぎ目（自己免疫）」。","note":null}},{"id":"37-121","exam":37,"no":121,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｄ<\/b>さん（男性，障害支援区分4）は，ベッカー型筋ジストロフィー（Becker muscular dystrophy）である。自宅で家族と生活をしている。<b>Ｄ<\/b>さんは，食事は自立しているが，排泄，入浴に介護が必要である。歩行はできず，移動は電動車いすを使用している。絵を描くことが趣味であり，日中は創作活動に取り組んでいる。<br>これまで<b>Ｄ<\/b>さんは自宅で家族の介護を受けながら生活してきたが，<b>Ｄ<\/b>さんの身体機能の低下に伴い，家族の介護負担が増えたため，居宅介護を利用することになった。","stem":"<b>Ｅ<\/b>居宅介護事業所に勤務する<b>Ｆ<\/b>介護福祉職は，<b>Ｄ<\/b>さん宅を初回訪問するにあたりフェイスシートのジェノグラムを確認した。<br>以下のジェノグラムから<b>Ｆ<\/b>介護福祉職が
