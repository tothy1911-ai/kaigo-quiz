}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #241a20; --card: #1f2226; --text: #e8eaed; --muted: #a0a6ad; --line: #3a3f45;
    --accent: #6ea8e6; --accent-text: #0d1117; --ok: #5cc98a; --ok-bg: #173325; --ng: #f08a7e; --ng-bg: #3a1d1a;
    --warn-bg: #3b3115; --warn-text: #f3d98b; --radar: rgba(110, 168, 230, .35);
    --petals: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22320%22 viewBox=%220 0 260 320%22%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.75%22 transform=%22translate(30 40) rotate(20) scale(1.0)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.6%22 transform=%22translate(170 25) rotate(-35) scale(0.8)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.7%22 transform=%22translate(110 120) rotate(70) scale(1.15)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.55%22 transform=%22translate(215 165) rotate(10) scale(0.7)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.65%22 transform=%22translate(45 200) rotate(-60) scale(0.9)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.7%22 transform=%22translate(150 255) rotate(40) scale(1.05)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.5%22 transform=%22translate(80 290) rotate(-15) scale(0.75)%22/%3E%3Cpath d=%22M0 13C-7 5-8-5-3-10L0-7L3-10C8-5 7 5 0 13Z%22 fill=%22%23b9758c%22 fill-opacity=%220.6%22 transform=%22translate(235 280) rotate(95) scale(0.85)%22/%3E%3C/svg%3E");
  }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background-color: var(--bg); background-image: var(--petals); background-size: 260px 320px; color: var(--text);
  font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
#app { max-width: 720px; margin: 0 auto; padding: 12px 16px 48px; }
h1 { font-size: 22px; margin: 8px 0 12px; }
h2 { font-size: 17px; margin: 24px 0 8px; color: var(--muted); }
h3 { font-size: 15px; margin: 16px 0 4px; }
section { margin-bottom: 8px; }
button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.wide { display: block; width: 100%; margin-top: 12px; }
.row-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
  margin-bottom: 8px; text-align: left; }
.row-btn small, .row-label small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.row { background: var(--card); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.row-label { display: flex; justify-content: space-between; gap: 8px; }
.row-actions { display: flex; gap: 8px; margin-top: 8px; }
.row-actions button { flex: 1; }
.warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.progress { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.q-meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.case { border-left: 3px solid var(--line); padding-left: 10px; margin-bottom: 10px; }
.case summary { color: var(--muted); font-size: 14px; cursor: pointer; }
.stem { margin-bottom: 10px; }
.fig { display: block; max-width: 100%; height: auto; margin: 8px auto; background: #fff; border-radius: 6px; }
.choices, .exp-choices { list-style: none; margin: 0; padding: 0; }
.choice { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; margin-top: 8px; }
.choice.ok { border-color: var(--ok); background: var(--ok-bg); }
.choice.ng { border-color: var(--ng); background: var(--ng-bg); }
.choice:disabled { opacity: 1; }
.num { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
  border-radius: 50%; border: 1px solid var(--line); font-size: 14px; }
.txt { flex: 1; }
.notes { font-size: 13px; color: var(--muted); margin-top: 8px; }
.fb { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 18px;
  display: flex; justify-content: space-between; align-items: center; scroll-margin-top: 8px; }
.fb span { font-weight: 400; font-size: 15px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.ng { background: var(--ng-bg); color: var(--ng); }
.exp { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px 12px; margin-top: 10px; }
.exp p { margin: 0; }
.exp-choices li { display: flex; gap: 8px; margin: 6px 0; }
.note { border-top: 1px dashed var(--line); margin-top: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
.score { font-size: 24px; font-weight: 700; margin: 8px 0; }
.sub { color: var(--muted); margin: 0; }
.radar { display: block; width: 100%; max-width: 460px; margin: 0 auto; }
.radar .grid { fill: none; stroke: var(--line); }
.radar .axis { stroke: var(--line); }
.radar .data { fill: var(--radar); stroke: var(--accent); stroke-width: 2; }
.radar .lbl { font-size: 18px; fill: var(--text); }
.radar .val { font-size: 15px; fill: var(--text); }
textarea { display: block; width: 100%; margin-top: 10px; font: 13px/1.4 monospace; color: var(--text);
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
input[type=file] { display: block; margin-top: 10px; max-width: 100%; }
.msg { font-weight: 600; }
footer { margin-top: 32px; color: var(--muted); font-size: 12px; line-height: 1.6; }
footer p { margin: 4px 0; }
</style>
</head>

<script>window.EXAMS=[36,37,38];window.GROUPS=["人間の尊厳と自立、介護の基本","社会の理解","人間関係とコミュニケーション、コミュニケーション技術","生活支援技術","こころとからだのしくみ","発達と老化の理解","認知症の理解","障害の理解","医療的ケア","介護過程","総合問題"];window.QUESTIONS=[{"id":"36-1","exam":36,"no":1,"subject":"人間の尊厳と自立","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（76歳，女性，要支援1）は，一人暮らしである。週1回介護予防通所リハビリテーションを利用しながら，近所の友人たちとの麻雀を楽しみに生活している。最近，膝に痛みを感じ，変形性膝関節症（knee osteoarthritis）と診断された。同時期に友人が入院し，楽しみにしていた麻雀ができなくなった。<b>Ａ<\/b>さんは徐々に今後の生活に不安を感じるようになった。ある日，「自宅で暮らし続けたいけど，心配なの…」と介護福祉職に話した。<br><b>Ａ<\/b>さんに対する介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["要介護認定の申請を勧める。","友人のお見舞いを勧める。","膝の精密検査を勧める。","別の趣味活動の希望を聞く。","生活に対する思いを聞く。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ａさんは膝の痛み、楽しみの喪失、一人暮らしの今後が重なり、「心配なの…」と不安を言葉にしている。何が心配で、どう暮らしたいのかをまず本人から聴くことで、本人主体の支援を考えられる。","choices":["Ａさんはすでに要支援1の認定を受けている。不安の中身を聴かないうちに制度の手続きを勧めるのは早すぎる。","介護福祉職が解決策を先に決めている。Ａさんの不安は友人のことだけとは限らない。","変形性膝関節症の診断はすでについている。検査の必要性は医師が判断することで、不安への対応にもなっていない。","失った楽しみの代わりを探すのは、思いを聴いたあとに考えること。不安の理由を確かめないまま話題をそらしている。","「自宅で暮らし続けたい」という思いと心配の中身を聴くことが、自己決定を尊重した支援の出発点になる。"],"point":"利用者が不安や迷いを口にした事例では、「気持ち・思いを聴く」選択肢がまず正解候補になる。手続き・検査・代わりの活動を「勧める」選択肢は、介護福祉職が先回りして結論を出しているひっかけ。","note":null}},{"id":"36-2","exam":36,"no":2,"subject":"人間の尊厳と自立","group":1,"case":null,"stem":"次の記述のうち，介護を必要とする人の自立についての考え方として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["自立は，他者の支援を受けないことである。","精神的自立は，生活の目標をもち，自らが主体となって物事を進めていくことである。","社会的自立は，社会的な役割から離れて自由になることである。","身体的自立は，介護者の身体的負担を軽減することである。","経済的自立は，経済活動や社会活動に参加せずに，生活を営むことである。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"精神的自立とは、自分で目標をもち、自分の意思で選び、主体的に物事を進めていくことをいう。介護が必要になっても、精神的自立は保つことができる。","choices":["支援を受けながらでも、自分で選び決めていれば自立である。支援を受けないことが自立という考えは誤り。","生活の目標をもち、自らが主体となって進めることが精神的自立。","社会的自立は、家庭や地域で役割を担い、社会とつながりながら生活すること。役割から離れることではない。","身体的自立は、本人が身体機能を生かして日常生活動作を自分で行えること。介護者の負担軽減は目的が違う。","経済的自立は、収入や年金などの経済的基盤をもち、それを自分の判断で使って生活すること。"],"point":"自立は「身体的・精神的・社会的・経済的」の4つの側面で整理される。どの側面でも「支援を受けない」「離れる」「参加しない」と書かれた選択肢は誤り。「支援を受けながら自分で選ぶことも自立」と覚えておく。","note":null}},{"id":"36-3","exam":36,"no":3,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"Ｕ介護老人福祉施設では，利用者の介護計画を担当の介護福祉職が作成している。このため，利用者の個別の介護目標を，介護福祉職のチーム全員で共有することが課題になっている。<br>この課題を解決するための取り組みとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["管理職がチーム全体に注意喚起して，集団規範を形成する。","現場経験の長い介護福祉職の意見を優先して，同調行動を促す。","チームメンバーの懇談会を実施して，内集団バイアスを強化する。","チームメンバー間の集団圧力を利用して，多数派の意見に統一する。","担当以外のチームメンバーもカンファレンス（conference）に参加して，集団凝集性を高める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"集団凝集性は、メンバーがその集団にとどまりたいと感じ、まとまろうとする力のこと。担当以外のメンバーもカンファレンスに参加して目標を話し合えば、目標が全員のものになり、チームのまとまりも強まる。","choices":["管理職からの一方的な注意喚起では、利用者ごとの目標の中身を話し合う機会にならず、共有にはつながりにくい。","同調行動は、周囲に合わせて自分の意見を変えること。経験者の意見に合わせるだけでは、目標を理解したことにならない。","内集団バイアスは、自分の集団のメンバーを他より高く評価する偏り。強化すると他職種や他集団との関係が悪くなるおそれがある。","集団圧力で多数派に統一すると、少数意見が出なくなり、利用者にとって大切な視点を失うおそれがある。","全員がカンファレンスで目標を話し合うことで共有が進み、集団凝集性も高まる。"],"point":"集団に関する用語は、良い方向に使うもの（集団凝集性・話し合い）と、弊害として問われるもの（同調行動・集団圧力・内集団バイアス）を分けて覚える。「強化する」「利用する」が弊害側の用語についていたら誤り。","note":null}},{"id":"36-4","exam":36,"no":4,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"<b>Ｂ<\/b>さん（90歳，女性，要介護3）は，介護老人福祉施設に入所している。入浴日に，担当の介護福祉職が居室を訪問し，「<b>Ｂ<\/b>さん，今日はお風呂の日です。時間は午後3時からです」と伝えた。しかし，<b>Ｂ<\/b>さんは言っていることがわからなかったようで，「はい，何ですか」と困った様子で言った。<br>このときの，介護福祉職の準言語を活用した対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["強い口調で伝えた。","抑揚をつけずに伝えた。","大きな声でゆっくり伝えた。","急かすように伝えた。","早口で伝えた。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"準言語は、話し言葉にともなう声の大きさ・速さ・抑揚・トーンなどで、非言語的コミュニケーションに含まれる。聞き取れなかった高齢者には、聞き取りやすい大きさの声でゆっくり伝えるのが適切である。","choices":["強い口調は、責められている、怒られていると受け取られやすい。","抑揚がないと、どこが大事な情報なのか伝わりにくい。","聞き取りやすい大きさの声でゆっくり話すのは、準言語を活用した対応。","急かすような話し方は相手を焦らせ、内容がさらに伝わりにくくなる。","早口は聞き取れなかった原因になりやすく、逆効果。"],"point":"準言語は「何を言うか」ではなく「どう声に出すか」。高齢者への対応では「大きめの声・ゆっくり・はっきり・抑揚をつける」が基本。ただし、怒鳴るような大声は適切ではない。","note":null}},{"id":"36-5","exam":36,"no":5,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"Ｖ介護老人福祉施設では，感染症が流行したために，緊急的な介護体制で事業を継続することになった。さらに労務管理を担当する職員からは，介護福祉職の精神的健康を守ることを目的とした組織的なマネジメントに取り組む必要性について提案があった。<br>次の記述のうち，このマネジメントに該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["感染防止対策を強化する。","多職種チームでの連携を強化する。","利用者のストレスをコントロールする。","介護福祉職の燃え尽き症候群（バーンアウト（burnout））を防止する。","利用者家族の面会方法を見直す。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"問題文のマネジメントは「介護福祉職の精神的健康を守ること」が目的。緊急体制での勤務が続くと燃え尽き症候群が起こりやすいため、その防止に組織として取り組むことが当てはまる。","choices":["感染防止対策の強化は、利用者・職員を感染から守るための対策で、精神的健康を守ることが直接の目的ではない。","多職種連携の強化は、サービスの質を高めるための取り組み。","利用者のストレスへの対応で、介護福祉職の精神的健康を対象としていない。","燃え尽き症候群の防止は、職員の精神的健康を守る組織的マネジメント（メンタルヘルス対策）にあたる。","面会方法の見直しは、利用者・家族への対応や感染対策の問題。"],"point":"問題文の「目的」と、選択肢の取り組みの対象（職員か、利用者か、家族か）が一致するかで判断する。燃え尽き症候群は、熱心に働いていた人が心身ともに疲れ果て、意欲を失う状態。ストレスチェックや相談体制などの職場のメンタルヘルス対策とあわせて覚える。","note":null}},{"id":"36-6","exam":36,"no":6,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"次のうち，介護老人福祉施設における全体の指揮命令系統を把握するために必要なものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["組織図","勤務表","経営理念","施設の歴史","資格保有者数"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"組織図は、部署や役職の配置と、誰が誰に指示し、誰に報告するかの上下関係を図で示したもの。施設全体の指揮命令系統を把握するのに最も適している。","choices":["組織図で部署・役職の関係と指示・報告の流れがわかる。","勤務表は、誰がいつ勤務するかを示すもので、命令系統は示されていない。","経営理念は、組織が大切にする考え方や目指す方向を示すもの。","施設の歴史は、組織の成り立ちを知る資料で、現在の命令系統はわからない。","資格保有者数は、人員の構成を示すだけ。"],"point":"「指揮命令系統」「報告ルート」を問われたら組織図。「何を目指すか」は経営理念、「いつ誰が働くか」は勤務表と、資料の役割をセットで覚える。","note":null}},{"id":"36-7","exam":36,"no":7,"subject":"社会の理解","group":2,"case":null,"stem":"次のうち，セルフヘルプグループ（self-help group）の活動に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["断酒会","施設の社会貢献活動","子ども食堂の運営","傾聴ボランティア","地域の町内会"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"セルフヘルプグループ（自助グループ）は、同じ病気・障害・悩みなどをもつ当事者が集まり、体験を分かち合って支え合う集まりである。断酒会は、アルコール依存症の当事者が集まって断酒を続けるための代表的なセルフヘルプグループ。","choices":["同じ問題をもつ当事者同士が支え合う活動で、セルフヘルプグループにあたる。","施設（法人）が地域に向けて行う公益的な取り組みで、当事者同士の支え合いではない。","子ども食堂は、地域の住民や団体が子どもに食事や居場所を提供する活動。支える側と支えられる側が分かれている。","傾聴ボランティアは、ボランティアが他者の話を聴いて支える活動で、当事者同士の集まりではない。","町内会は、同じ地域に住むことでつながる地縁組織。共通の悩みをもつ当事者の集まりではない。"],"point":"判断の手がかりは「メンバー全員が同じ問題の当事者か」。断酒会・ＡＡ（アルコホーリクス・アノニマス）・患者会・認知症の人と家族の会などが代表例。ボランティア活動や地縁組織と取り違えるひっかけが多い。","note":null}},{"id":"36-8","exam":36,"no":8,"subject":"社会の理解","group":2,"case":null,"stem":"特定非営利活動法人（ＮＰＯ法人）に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["社会福祉法に基づいて設置される。","市町村が認証する。","保健，医療又は福祉の増進を図る活動が最も多い。","収益活動は禁じられている。","宗教活動を主たる目的とする団体もある。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"特定非営利活動促進法が定める20の活動分野のうち、定款に「保健、医療又は福祉の増進を図る活動」を掲げる法人が最も多い（内閣府NPOホームページの活動分野別認証数）。","choices":["根拠法は特定非営利活動促進法（ＮＰＯ法、1998年制定）。社会福祉法に基づくのは社会福祉法人。","認証するのは所轄庁で、原則は主たる事務所がある都道府県の知事（その事務所が指定都市内だけにある場合は指定都市の長）。市町村一般ではない。","活動分野別では保健・医療・福祉の分野が最も多い。","営利を目的としない（利益を構成員に分配しない）法人だが、本来の活動に支障がない範囲で収益事業（その他の事業）を行うことはできる。","宗教の教義を広めることなどを主な目的とする団体は、ＮＰＯ法人になれない。政治活動を主な目的とする団体も同様。"],"point":"「非営利」は「収益を上げてはいけない」ではなく「利益を分配しない」という意味。ＮＰＯ法人＝特定非営利活動促進法・所轄庁（都道府県知事等）の認証、社会福祉法人＝社会福祉法、と根拠法を取り違えるひっかけに注意する。","note":null}},{"id":"36-9","exam":36,"no":9,"subject":"社会の理解","group":2,"case":null,"stem":"地域福祉において，19世紀後半に始まった，貧困地域に住み込んで実態調査を行いながら住民への教育や生活上の援助を行ったものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["世界保健機関（ＷＨＯ）","福祉事務所","地域包括支援センター","生活協同組合","セツルメント"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"セツルメントは、19世紀後半のイギリスで始まった活動で、知識人や学生が貧困地域に住み込み、生活実態を調べながら教育や生活上の援助を行った。ロンドンのトインビー・ホールが代表例で、地域福祉の源流の一つとされる。","choices":["世界保健機関（ＷＨＯ）は、1948年に設立された保健分野の国連専門機関。","福祉事務所は、1951年の社会福祉事業法（現・社会福祉法）で設けられた日本の行政機関。","地域包括支援センターは、2005年の介護保険法改正で設けられ、2006年に始まった日本の機関。","生活協同組合は、組合員が出資して生活物資の購入などを共同で行う組織で、住み込みによる調査・援助活動ではない。","貧困地域に住み込み、調査・教育・援助を行ったのがセツルメント。"],"point":"「住み込み」「貧困地域」「19世紀後半」がそろえばセツルメント。トインビー・ホール（ロンドン）、ハル・ハウス（シカゴ、ジェーン・アダムズ）、日本のキングスレー館（片山潜）をセットで覚える。同じ時代の慈善組織協会（ＣＯＳ）は、貧困家庭の訪問・調査と慈善活動の調整を行った別の活動。","note":null}},{"id":"36-10","exam":36,"no":10,"subject":"社会の理解","group":2,"case":null,"stem":"社会福祉基礎構造改革に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["社会福祉法が社会福祉事業法に改正された。","利用契約制度から措置制度に変更された。","サービス提供事業者は，社会福祉法人に限定された。","障害福祉分野での制度改正は見送られた。","判断能力が不十分な者に対する地域福祉権利擁護事業が創設された。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"社会福祉基礎構造改革（2000年の社会福祉法への改正など）の中で、判断能力が不十分な人の福祉サービス利用を支える地域福祉権利擁護事業が1999年に始まった。現在の日常生活自立支援事業である。","choices":["向きが逆。2000年に社会福祉事業法が社会福祉法に改正・改称された。","向きが逆。行政が決める措置制度から、利用者が事業者と契約してサービスを選ぶ利用契約制度へ変わった。","逆に、ＮＰＯ法人や民間企業など多様な事業者の参入が進められた。","障害福祉分野でも、措置制度から支援費制度（2003年開始）へ移行した。","契約制度で不利にならないよう、判断能力が不十分な人を支える地域福祉権利擁護事業が創設された。"],"point":"基礎構造改革のキーワードは「措置から契約へ」。契約制度にすると判断能力が不十分な人が困るので、権利を守る仕組み（地域福祉権利擁護事業＝現・日常生活自立支援事業、苦情解決の仕組み、2000年の成年後見制度）が同じ時期に整えられた、と流れで覚える。名称の「旧と新」を逆にしたひっかけに注意。","note":null}},{"id":"36-11","exam":36,"no":11,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ｃ<\/b>さん（77歳，男性）は，60歳で公務員を定年退職し，年金生活をしている。持病や障害はなく，退職後も趣味のゴルフを楽しみながら健康に過ごしている。ある日，<b>Ｃ<\/b>さんはゴルフ中にけがをして医療機関を受診した。<br>このとき，<b>Ｃ<\/b>さんに適用される公的医療制度として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["国民健康保険","後期高齢者医療制度","共済組合保険","育成医療","更生医療"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"75歳以上の人は、それまで加入していた医療保険を離れ、後期高齢者医療制度の被保険者となる。Ｃさんは77歳なので、元公務員かどうかにかかわらず後期高齢者医療制度が適用される。","choices":["国民健康保険は、75歳になると後期高齢者医療制度へ移るため適用されない。Ｃさんは退職後75歳までは国民健康保険などに加入していたと考えられる。","75歳以上は後期高齢者医療制度の対象。","共済組合も、特例退職組合員を含め75歳で外れ、後期高齢者医療制度に移る。77歳のＣさんには適用されない。","育成医療は、18歳未満の障害児を対象とする自立支援医療。","更生医療は、18歳以上の身体障害者が障害を軽くするための医療を受ける自立支援医療。Ｃさんに障害はない。"],"point":"医療保険の判断は年齢がカギ。「75歳以上（一定の障害がある人は65歳以上で認定を受けた場合も）＝後期高齢者医療制度」。元の職業（公務員・会社員）の情報は、年齢で答えが決まる問題のひっかけとして入ることが多い。","note":null}},{"id":"36-12","exam":36,"no":12,"subject":"社会の理解","group":2,"case":null,"stem":"次のうち，介護保険法に基づき，都道府県・指定都市・中核市が指定（許可），監督を行うサービスとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["地域密着型介護サービス","居宅介護支援","施設サービス","夜間対応型訪問介護","介護予防支援"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"施設サービス（介護老人福祉施設・介護老人保健施設・介護医療院）は、都道府県（指定都市・中核市を含む）が指定・監督する。介護老人保健施設と介護医療院は「指定」ではなく「許可」なので、問題文に「指定（許可）」とある。","choices":["地域密着型介護サービスは、市町村が指定・監督する。","居宅介護支援は、2018年4月から指定の権限が市町村に移っている。","施設サービスは都道府県・指定都市・中核市が指定（許可）・監督する。","夜間対応型訪問介護は地域密着型サービスの一つなので、市町村が指定する。","介護予防支援も市町村が指定する。"],"point":"「市町村が指定するもの」を覚えれば、残りは都道府県と判断できる。市町村＝地域密着型サービス・地域密着型介護予防サービス・居宅介護支援・介護予防支援。「訪問介護」という言葉につられず、夜間対応型・定期巡回は地域密着型と押さえる。","note":"2024年4月施行の介護保険法改正で、介護予防支援は地域包括支援センターに加えて、指定居宅介護支援事業者も市町村長から直接指定を受けて行えるようになった。指定するのが市町村である点は変わらないので、この問題の正答は変わらない。最新の仕組みは厚生労働省の資料で確認すること。"}},{"id":"36-13","exam":36,"no":13,"subject":"社会の理解","group":2,"case":null,"stem":"「障害者差別解消法」に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["法の対象者は，身体障害者手帳を交付された者に限定されている。","合理的配慮は，実施するときの負担の大小に関係なく提供する。","個人による差別行為への罰則規定がある。","雇用分野での，障害を理由とした使用者による虐待の禁止が目的である。","障害者基本法の基本的な理念を具体的に実施するために制定された。"],"notes":"（注）　「障害者差別解消法」とは，「障害を理由とする差別の解消の推進に関する法律」のことである。","figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"障害者差別解消法は、障害者基本法の基本的な理念にのっとり、同法が定める差別の禁止を具体的に実施するために制定された（2013年制定、2016年施行）。行政機関等と事業者に、不当な差別的取扱いの禁止と合理的配慮の提供を求めている。","choices":["対象は障害者基本法と同じく、障害と社会的障壁によって継続的に日常生活・社会生活に相当な制限を受ける人で、障害者手帳の有無に限られない。","合理的配慮は、実施に伴う負担が過重でない範囲で提供するもの。負担の大小に関係なく必ず提供するわけではない。","差別行為そのものへの罰則はない。罰則は、主務大臣からの報告の求めに応じない・虚偽の報告をした場合の過料と、障害者差別解消支援地域協議会の秘密を漏らした場合に限られる。","雇用分野での差別の禁止は障害者雇用促進法、使用者による虐待の防止は障害者虐待防止法の役割。","障害者基本法の理念を具体的に実施するための法律である。"],"point":"障害者関連の法律は「何を定めた法律か」で区別する。差別解消法＝行政機関等・事業者による差別の解消、雇用促進法＝雇用分野の差別禁止と雇用率、虐待防止法＝養護者・施設従事者等・使用者による虐待。合理的配慮には「過重な負担でない範囲で」という条件がつく点がよく問われる。","note":"試験後の2024年4月1日に改正法が施行され、事業者による合理的配慮の提供は努力義務から法的義務になった（行政機関等は以前から義務）。「過重な負担でない範囲で」という条件は変わらず、この問題の正答も変わらない。最新の内容は内閣府の資料で確認すること。"}},{"id":"36-14","exam":36,"no":14,"subject":"社会の理解","group":2,"case":null,"stem":"「障害者総合支援法」に規定された移動に関する支援の説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["移動支援については，介護給付費が支給される。","行動援護は，周囲の状況把握ができない視覚障害者が利用する。","同行援護は，危険を回避できない知的障害者が利用する。","重度訪問介護は，重度障害者の外出支援も行う。","共同生活援助（グループホーム）は，地域で生活する障害者の外出支援を行う。"],"notes":"（注）　「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"重度訪問介護は、重度の肢体不自由者などで常に介護が必要な人に、自宅での入浴・排せつ・食事の介護などに加えて、外出時の移動中の介護も総合的に行う介護給付のサービスである。","choices":["移動支援は、市町村が行う地域生活支援事業の一つ。個別給付である介護給付費は支給されない。","行動援護は、知的障害や精神障害で行動上著しい困難があり、危険を回避できない人の外出などを支援するサービス。視覚障害者向けではない。","同行援護は、移動に著しい困難がある視覚障害者に、外出時の移動の援護や情報提供（代筆・代読を含む）を行うサービス。知的障害者向けではない。","重度訪問介護には外出時の移動中の介護が含まれる。","共同生活援助（グループホーム）は、共同生活を営む住居で相談や日常生活上の援助を行うサービスで、外出支援を目的とするものではない。"],"point":"選択肢2と3は、行動援護と同行援護の対象者を入れ替えたひっかけ。「同行援護＝視覚障害」「行動援護＝知的・精神障害で危険回避が難しい」と対で覚える。移動支援だけは地域生活支援事業（市町村事業）で、介護給付ではない。","note":null}},{"id":"36-15","exam":36,"no":15,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ｄ<\/b>さん（80歳，男性，要介護2）は，認知症（dementia）がある。訪問介護（ホームヘルプサービス）を利用しながら一人暮らしをしている。<br>ある日，訪問介護員（ホームヘルパー）が<b>Ｄ<\/b>さんの自宅を訪問すると，近所に住む<b>Ｄ<\/b>さんの長女から，「父が，高額な投資信託の電話勧誘を受けて，契約しようかどうか悩んでいるようで心配だ」と相談された。<br>訪問介護員（ホームヘルパー）が長女に助言する相談先として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["公正取引委員会","都道府県障害者権利擁護センター","運営適正化委員会","消費生活センター","市町村保健センター"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"電話勧誘などによる契約トラブルの相談先は消費生活センター。商品やサービスの契約に関する相談を受け、助言やあっせんを行う。消費者ホットライン「188」で最寄りの窓口につながる。","choices":["公正取引委員会は、独占禁止法に基づいて企業間の公正な競争を確保する行政機関。個人の契約相談の窓口ではない。","都道府県障害者権利擁護センターは、障害者虐待防止法に基づき、使用者による障害者虐待の通報や相談を受ける機関。Ｄさんの相談内容に合わない。","運営適正化委員会は、都道府県社会福祉協議会に置かれ、福祉サービスに関する苦情の解決や日常生活自立支援事業の運営監視を行う。投資の勧誘は福祉サービスの苦情ではない。","契約・悪質商法などの消費者トラブルの相談先は消費生活センター。","市町村保健センターは、健康相談・保健指導・健康診査などを行う機関。"],"point":"相談先の問題は、相談の「中身」で機関を選ぶ。契約・勧誘トラブル＝消費生活センター、福祉サービスの苦情＝運営適正化委員会、障害者虐待（使用者）＝都道府県障害者権利擁護センター。認知症の人の財産管理が今後心配な場合は、成年後見制度や日常生活自立支援事業もあわせて思い浮かべる。","note":null}},{"id":"36-16","exam":36,"no":16,"subject":"社会の理解","group":2,"case":null,"stem":"災害時の福祉避難所に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護老人福祉施設の入所者は，原則として福祉避難所の対象外である。","介護保険法に基づいて指定される避難所である。","医療的ケアを必要とする者は対象にならない。","訪問介護員（ホームヘルパー）が，災害対策基本法に基づいて派遣される。","同行援護のヘルパーが，災害救助法に基づいて派遣される。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"内閣府の「福祉避難所の確保・運営ガイドライン」では、特別養護老人ホームなどの入所者は、その施設で適切に対応されるべきとして、原則として福祉避難所の対象としていない。対象は、主に在宅で生活している高齢者・障害者などの要配慮者である。","choices":["介護老人福祉施設の入所者は、原則として入所している施設で対応する。","福祉避難所は、災害対策基本法（同法施行令の基準）に基づいて市町村が指定する避難所。介護保険法による指定ではない。","人工呼吸器などを使う在宅の難病患者など、医療的ケアを必要とする人も対象として想定されている。","災害対策基本法には、訪問介護員を福祉避難所に派遣する仕組みは定められていない。訪問介護は介護保険法のサービスである。","同行援護は障害者総合支援法の障害福祉サービスで、災害救助法に基づいて同行援護のヘルパーを派遣する仕組みはない。"],"point":"福祉避難所は「在宅の要配慮者」のための避難所で、根拠は災害対策基本法、と押さえる。施設入所者は施設で対応するのが原則（緊急的・一時的な避難は妨げない）。災害関係の法律は、災害対策基本法＝避難所・避難行動要支援者名簿などの枠組み、災害救助法＝避難所の設置など救助の実施、と役割を分けて覚える。","note":null}},{"id":"36-17","exam":36,"no":17,"subject":"社会の理解","group":2,"case":null,"stem":"「感染症法」に基づいて，結核（tuberculosis）を発症した在宅の高齢者に，医療費の公費負担の申請業務や家庭訪問指導などを行う機関として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["基幹相談支援センター","地域活動支援センター","保健所","老人福祉センター","医療保護施設"],"notes":"（注）　「感染症法」とは，「感染症の予防及び感染症の患者に対する医療に関する法律」のことである。","figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"保健所は、感染症法に基づく結核対策の中心となる機関で、医療費の公費負担の申請の受付、保健師による家庭訪問指導、服薬を確実に続けるための支援（ＤＯＴＳ）などを行う。","choices":["基幹相談支援センターは、障害者総合支援法に基づき、地域の障害者の相談支援の中核となる機関。","地域活動支援センターは、障害者に創作的活動や生産活動、交流の場を提供する施設。","結核の公費負担の申請や家庭訪問指導は保健所の業務。","老人福祉センターは、老人福祉法に基づき、高齢者の各種相談や健康増進、教養の向上、レクリエーションなどの便宜を無料または低額で提供する施設。","医療保護施設は、生活保護法に基づく保護施設で、医療を必要とする要保護者に医療を提供する。"],"point":"感染症・精神保健・難病など、地域の公衆衛生の窓口は保健所と覚える。結核は服薬を長期間続ける必要があり、保健所が服薬を見守る支援を行う。「センター」がつく障害者向けの機関は、感染症対策とは関係がない。","note":null}},{"id":"36-18","exam":36,"no":18,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ｅ<\/b>さん（55歳，女性，障害の有無は不明）は，ひきこもりの状態にあり，就労していない。父親の年金で父親とアパートで暮らしていたが，父親が亡くなり，一人暮らしになった。遠方に住む弟は，姉が家賃を滞納していて，生活に困っているようだと，家主から連絡を受けた。<br>心配した弟が相談する機関として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["地域包括支援センター","福祉事務所","精神保健福祉センター","公共職業安定所（ハローワーク）","年金事務所"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Ｅさんは55歳で収入がなく家賃を滞納しており、生活の困窮が差し迫っている。福祉事務所は生活保護の窓口であり、福祉事務所を設置する自治体は生活困窮者自立支援制度の自立相談支援事業も実施するため、生活費や住まいの相談先として最も適切である。","choices":["地域包括支援センターは、主に65歳以上の高齢者とその家族を支える機関。55歳のＥさん本人の生活困窮は主な対象ではない。","生活保護や生活困窮者自立支援制度につなぐことができ、収入・住まいの問題に対応できる。","精神保健福祉センターは、都道府県などに置かれる精神保健の専門機関で、ひきこもりの相談も受ける。ただし、生活費や家賃滞納への直接の支援は行わない。","公共職業安定所は職業紹介の機関。長くひきこもり状態にあるＥさんに、まず就職を目指させる段階ではない。","年金事務所は年金の手続きや相談の窓口で、生活困窮の総合的な相談先ではない。"],"point":"「収入がない」「家賃を滞納」「生活に困っている」とあれば、まず福祉事務所（生活保護・生活困窮者自立支援制度）。年齢にも注目し、65歳未満なら地域包括支援センターは基本的に対象外と判断する。","note":"2025年4月から改正生活困窮者自立支援法（令和6年改正）が施行され、自立相談支援事業で住まいに関する相談支援を行うことが明確になったほか、住居確保給付金に家賃の安い住宅への転居費用の支給が加わり、一時生活支援事業は居住支援事業に名称が変わった。相談先として福祉事務所が適切である点は変わらない。最新の内容は厚生労働省の資料で確認すること。"}},{"id":"36-19","exam":36,"no":19,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，マズロー（Maslow, A.H.）の欲求階層説で成長欲求に該当するものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["承認欲求","安全欲求","自己実現欲求","生理的欲求","所属・愛情欲求"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"マズローは欲求を5段階に分け、下の4つ（生理的・安全・所属と愛情・承認）を、満たされないと不足を感じる欠乏欲求、最上位の自己実現欲求を成長欲求とした。自己実現欲求は、自分の可能性を生かして成長したいという欲求である。","choices":["承認欲求は、他者から認められたいという欲求で、欠乏欲求の最上位。","安全欲求は、危険を避けて安定した生活を求める欲求で、欠乏欲求。","自己実現欲求だけが成長欲求にあたる。","生理的欲求は、食事・睡眠・排せつなど生命維持の欲求で、最も基本的な欠乏欲求。","所属・愛情欲求は、集団に属し愛されたいという欲求で、欠乏欲求。"],"point":"下から「生理的→安全→所属・愛情→承認→自己実現」の順番と、「成長欲求は自己実現だけ」をセットで覚える。順番を入れ替えた選択肢や、承認欲求を成長欲求とするひっかけが出やすい。","note":null}},{"id":"36-20","exam":36,"no":20,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，交感神経の作用に該当するものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["血管収縮","心拍数減少","気道収縮","消化促進","瞳孔収縮"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"交感神経は、活動時や緊張・興奮時にはたらく神経で、皮膚や内臓の血管を収縮させて血圧を上げる。体を「闘うか逃げるか」の状態にする作用と考えるとわかりやすい。","choices":["血管収縮は交感神経の作用。","交感神経は心拍数を増やす。減少させるのは副交感神経。","交感神経は気道を広げて呼吸をしやすくする。収縮させるのは副交感神経。","交感神経は消化を抑える。消化を促すのは副交感神経。","交感神経は瞳孔を広げる（散大）。収縮させるのは副交感神経。"],"point":"交感神経＝活動モード（心拍増加・血圧上昇・気道拡張・瞳孔散大・消化抑制）、副交感神経＝休息モード（その逆）と、対で覚える。選択肢の多くは副交感神経の作用を並べたひっかけなので、1つずつ「活動モードか休息モードか」で判断する。","note":null}},{"id":"36-21","exam":36,"no":21,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ｆ<\/b>さん（82歳，女性）は，健康診断で骨粗鬆症（osteoporosis）と診断され，内服治療が開始された。杖歩行で時々ふらつくが，ゆっくりと自立歩行することができる。昼間は自室にこもり，ベッドで横になっていることが多い。リハビリテーションとして週3日歩行訓練を行い，食事は普通食を毎食8割以上摂取している。<br><b>Ｆ<\/b>さんの骨粗鬆症（osteoporosis）の進行を予防するための支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["リハビリテーションを週1日に変更する。","繊維質の多い食事を勧める。","日光浴を日課に取り入れる。","車いすでの移動に変更する。","ビタミンＡ（vitamin A）の摂取を勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"日光（紫外線）を浴びると皮膚でビタミンＤがつくられ、ビタミンＤは腸からのカルシウムの吸収を助ける。昼間も自室にこもりがちなＦさんには、日光浴を日課にすることが骨粗鬆症の進行予防に役立つ。","choices":["歩行など骨に負荷のかかる運動は骨量の維持に役立つ。回数を減らすと逆効果になる。","食物繊維は便秘予防には役立つが、骨を強くする栄養素ではない。","日光浴でビタミンＤの生成が促され、カルシウムの吸収が高まる。","車いす移動にすると歩く機会が減って骨への負荷が少なくなり、骨量の低下や筋力低下を招く。ゆっくり自立歩行できる能力も生かせない。","骨の健康に関わるのはビタミンＤやビタミンＫ。ビタミンＡは主に視覚や皮膚・粘膜の健康に関わる。"],"point":"骨粗鬆症の予防は「カルシウム・ビタミンＤ・ビタミンＫの摂取」「日光浴」「骨に負荷がかかる運動」の3本柱。転倒のおそれを理由に活動を減らす選択肢は、自立支援の点からも誤りと判断する。","note":null}},{"id":"36-22","exam":36,"no":22,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"中耳にある耳小骨として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ツチ骨","蝶形骨","前頭骨","頬骨","上顎骨"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"中耳には3つの耳小骨（ツチ骨・キヌタ骨・アブミ骨）があり、鼓膜の振動を増幅して内耳へ伝える。","choices":["ツチ骨は鼓膜に接する耳小骨。","蝶形骨は頭蓋骨の底の中央にある骨。","前頭骨は額をつくる頭蓋骨。","頬骨は頬の高まりをつくる顔の骨。","上顎骨は上あごをつくる顔の骨。"],"point":"耳の構造は「外耳（耳介・外耳道）→中耳（鼓膜・耳小骨・耳管）→内耳（蝸牛・前庭・三半規管）」の順で整理する。耳小骨は鼓膜側から「ツチ→キヌタ→アブミ」。伝音難聴は外耳・中耳の障害、感音難聴（加齢性難聴を含む）は内耳から奥の障害と結びつけて覚える。","note":null}},{"id":"36-23","exam":36,"no":23,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"成人の爪に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["主成分はタンパク質である。","1日に1 mm 程度伸びる。","爪の外表面には爪床がある。","正常な爪は全体が白色である。","爪半月は角質化が進んでいる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"爪は皮膚の角質が変化したもので、主成分はケラチンというタンパク質である。","choices":["爪の主成分はケラチン（タンパク質）。","手の爪が伸びるのは1日に約0.1mm程度。1mmは多すぎる。","爪床は爪（爪甲）の下にある皮膚で、外表面ではない。","健康な爪は、爪床の血液の色が透けて薄いピンク色に見える。全体が白い場合は貧血などが疑われる。","爪半月は、根元の白い半月状の部分で、つくられたばかりの爪。角質化が十分に進んでいない。"],"point":"爪は健康状態のサイン。白い（貧血など）、青紫色（チアノーゼ）、スプーン状（鉄欠乏性貧血）、厚く濁る（爪白癬）など、色や形の変化と疑われる状態をセットで覚える。","note":null}},{"id":"36-24","exam":36,"no":24,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"食物が入り誤嚥が生じる部位として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["扁桃","食道","耳管","気管","咽頭"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"誤嚥は、食物や唾液などが本来通る食道ではなく、気管（気道）に入ってしまうことをいう。","choices":["扁桃は、のどにあるリンパ組織で、食物が入り込む通り道ではない。","食道は食物が本来通る道。ここに入るのは正常な嚥下。","耳管は、中耳と咽頭をつなぐ管で、中耳の圧を調節する。","食物が気管に入ることが誤嚥。","咽頭は、空気と食物の両方が通る共通の通り道。食物が咽頭を通ること自体は正常である。"],"point":"咽頭の先で、空気は気管へ、食物は食道へ分かれる。飲み込むときに喉頭蓋が気管の入り口をふさぐが、このはたらきが弱まると誤嚥が起こる。誤嚥性肺炎の予防として、食事時の姿勢（軽くあごを引く）や口腔ケアとあわせて覚える。","note":null}},{"id":"36-25","exam":36,"no":25,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ｇ<\/b>さん（79歳，男性）は，介護老人保健施設に入所している。<b>Ｇ<\/b>さんは普段から食べ物をかきこむように食べる様子がみられ，最近はむせることが多くなった。義歯は使用していない。食事は普通食を摂取している。ある日の昼食時，唐揚げを口の中に入れたあと，喉をつかむようなしぐさをし，苦しそうな表情になった。<br><b>Ｇ<\/b>さんに起きていることとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["心筋梗塞（myocardial infarction）","蕁麻疹（urticaria）","誤嚥性肺炎（aspiration pneumonia）","食中毒（foodborne disease）","窒息（choking）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"食べ物をかきこむ癖やむせが増えていたＧさんが、唐揚げを口に入れた直後に喉をつかむしぐさ（チョークサイン）をして苦しそうにしている。食べ物が気道をふさいだ窒息と考えられる。","choices":["心筋梗塞では胸の激しい痛みや冷や汗がみられる。食べ物を口に入れた直後に喉をつかむしぐさは窒息を示す。","蕁麻疹は皮膚にかゆみを伴う発疹が出るもので、喉をつかんで苦しむ症状ではない。","誤嚥性肺炎は、誤嚥した食物や細菌によって肺に炎症が起こる病気で、発熱・せき・痰などが時間をかけて現れる。食べた直後に急に起こるものではない。","食中毒は、飲食から数時間〜数日たって腹痛・下痢・嘔吐などが起こるもので、食べた直後の呼吸困難ではない。","チョークサインは窒息の典型的な徴候。"],"point":"「食事中」「急に」「喉をつかむ」がそろえば窒息。すぐに人を呼び、せきができれば強いせきを促し、できなければ背部叩打法や腹部突き上げ法で異物の除去を試みる。発症が急か、時間をかけて現れるかで、窒息と誤嚥性肺炎を区別する。","note":null}},{"id":"36-26","exam":36,"no":26,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ｈ<\/b>さん（60歳，男性）は，身長170 cm，体重120 kg である。<b>Ｈ<\/b>さんは浴槽で入浴しているときに毎回，「お風呂につかると，からだが軽く感じて楽になります」と話す。胸が苦しいなど，ほかの訴えはない。<br><b>Ｈ<\/b>さんが話している内容に関連する入浴の作用として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["静水圧作用","温熱作用","清潔作用","浮力作用","代謝作用"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"水中では体が浮力を受けるため、体重を支える負担が軽くなり、「からだが軽く感じる」。体重の重いＨさんにとって、関節や筋肉への負担が減って楽に感じられる。","choices":["静水圧作用は、水圧で体が締めつけられる作用。血液が心臓に戻りやすくなる一方、胸やおなかが圧迫される。軽く感じる理由ではない。","温熱作用は、体が温まって血管が広がり、血行がよくなる・筋肉の緊張がほぐれる作用。","清潔作用は、汚れを落として皮膚を清潔にする作用。","浮力作用で体が軽く感じられる。","代謝作用は、体が温まることで新陳代謝が高まる作用で、体が軽く感じる理由ではない。"],"point":"入浴の3つの作用「温熱・静水圧・浮力」を、利用者の言葉と結びつけて覚える。「軽く感じる」＝浮力、「胸が苦しい」＝静水圧（心臓や肺への負担）、「温まる・ほぐれる」＝温熱。心臓に負担がある人は、半身浴で静水圧の影響を減らす。","note":null}},{"id":"36-27","exam":36,"no":27,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"男性に比べて女性に尿路感染症（urinary tract infection）が起こりやすい要因として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["子宮の圧迫がある。","尿道が短く直線的である。","腹部の筋力が弱い。","女性ホルモンの作用がある。","尿道括約筋が弛緩している。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"女性の尿道は約3〜4cmと短く、ほぼまっすぐなうえ、尿道口が肛門に近い。そのため細菌が膀胱へ入りやすく、尿路感染症が起こりやすい。","choices":["妊娠中などには子宮が膀胱を圧迫することもあるが、女性一般に尿路感染症が起こりやすい主な理由ではない。","尿道が短く直線的なため、細菌が侵入しやすい。","腹部の筋力の弱さは、尿路感染症の起こりやすさの直接の要因ではない。","女性ホルモン（エストロゲン）には、むしろ尿道や膣の粘膜を保つはたらきがある。","尿道括約筋が健康な女性で弛緩しているわけではない。括約筋のゆるみは尿失禁と関連する。"],"point":"女性の尿道＝約3〜4cmで短く直線的、男性の尿道＝約16〜20cmで長くＳ字状、とセットで覚える。介護では、排せつ後の陰部を前から後ろへ拭くこと、水分を十分にとることが尿路感染症の予防になる。","note":null}},{"id":"36-28","exam":36,"no":28,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，眠りが浅くなる原因として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["抗不安薬","就寝前の飲酒","抗アレルギー薬","抗うつ薬","足浴"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"アルコールは寝つきをよくするように感じられるが、時間がたつと眠りが浅くなり、夜中に目が覚めやすくなる。利尿作用によりトイレで起きる回数も増える。","choices":["抗不安薬には眠気を起こす作用をもつものが多く、眠りが浅くなる原因として代表的ではない。","就寝前の飲酒は、睡眠の後半を浅くし、中途覚醒を増やす。","抗アレルギー薬（抗ヒスタミン薬）は、副作用として眠気が出やすい。","抗うつ薬は種類によって眠気が出るものも不眠が出るものもあり、選択肢の中では眠りが浅くなる原因として最も適切とはいえない。","足浴は体を温めてリラックスさせ、入眠を助ける。"],"point":"「寝酒は眠りを浅くする」は頻出。睡眠を妨げる要因としてアルコール、カフェイン（コーヒー・緑茶）、ニコチン、就寝前の強い光をまとめて覚える。薬の問題では、眠気が出る薬（抗ヒスタミン薬・抗不安薬など）の副作用は転倒の原因として問われることが多い。","note":null}},{"id":"36-29","exam":36,"no":29,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"概日リズム睡眠障害（circadian rhythm sleep disorder）に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["早朝に目が覚める。","睡眠中に下肢が勝手にピクピクと動いてしまう。","睡眠中に呼吸が止まる。","睡眠中に突然大声を出したり身体を動かしたりする。","夕方に強い眠気を感じて就寝し，深夜に覚醒してしまう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"概日リズム睡眠障害は、体内時計（約24時間のリズム）と、望ましい睡眠の時間帯がずれてしまう睡眠障害である。夕方に強い眠気がきて早く寝てしまい、深夜に目が覚めるのは、睡眠の時間帯が前にずれた状態（睡眠相前進）で、高齢者に多い。","choices":["早朝に目が覚めて再び眠れないのは、不眠症の一つである早朝覚醒の説明。うつ病でもみられる。","睡眠中に下肢がピクピク動くのは周期性四肢運動障害の説明。","睡眠中に呼吸が止まるのは睡眠時無呼吸症候群の説明。","睡眠中に大声を出したり体を動かしたりするのはレム睡眠行動障害の説明。レビー小体型認知症に伴うことがある。","睡眠の時間帯が前にずれた状態で、概日リズム睡眠障害にあたる。"],"point":"睡眠障害は「症状」と「名前」を組み合わせて覚える。概日リズム＝時間帯のずれ、むずむず脚症候群＝寝る前の脚の不快感、周期性四肢運動障害＝睡眠中の脚のピクつき、睡眠時無呼吸＝いびきと呼吸停止、レム睡眠行動障害＝夢に合わせた寝言・行動。体内時計を整えるには、朝に日光を浴びることが有効。","note":null}},{"id":"36-30","exam":36,"no":30,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"鎮痛薬としてモルヒネを使用している利用者に，医療職と連携した介護を実践するときに留意すべき観察点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["不眠","下痢","脈拍","呼吸","体温"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"モルヒネなどの医療用麻薬には、呼吸の回数を減らす呼吸抑制という重い副作用がある。呼吸の回数や深さの変化に気づいたら、すぐに医療職へ報告する必要がある。","choices":["モルヒネでは眠気が出やすく、不眠は主な観察点ではない。","モルヒネの代表的な副作用は便秘で、下痢ではない。","脈拍は一般的な観察項目だが、モルヒネで特に注意すべき副作用は呼吸抑制である。","呼吸抑制は重大な副作用なので、呼吸の観察が最も重要。","体温はモルヒネの副作用として特に注意すべき項目ではない。"],"point":"モルヒネの副作用は「便秘・吐き気（悪心・嘔吐）・眠気・呼吸抑制」の4つをセットで覚える。中でも命に関わるのは呼吸抑制。「下痢」は便秘と入れ替えたひっかけになりやすい。","note":null}},{"id":"36-31","exam":36,"no":31,"subject":"発達と老化の理解","group":6,"case":null,"stem":"スキャモン（Scammon, R.E.）の発達曲線に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["神経系の組織は，4歳ごろから急速に発達する。","筋骨格系の組織は，4歳ごろから急速に発達する。","生殖器系の組織は，12歳ごろから急速に発達する。","循環器系の組織は，20歳ごろから急速に発達する。","リンパ系の組織は，20歳ごろから急速に発達する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"スキャモンの発達曲線では、生殖器系（生殖型）は幼児期・児童期にはほとんど発達せず、思春期に入る12歳ごろから急速に発達する。","choices":["神経系（神経型）は、出生直後から幼児期にかけて急速に発達し、4〜6歳ごろには成人に近い水準に達する。4歳ごろから急速に発達するのではない。","筋骨格系は一般型に含まれ、乳幼児期と思春期の2回、大きく発達する（Ｓ字型の曲線）。","生殖器系は12歳ごろから急速に発達する。","循環器系も一般型で、20歳ごろから急速に発達するのではない。20歳はほぼ発達を終える時期。","リンパ系（リンパ型）は12歳ごろに成人の約2倍に達し、その後は減っていく。"],"point":"4つの型を曲線の形で覚える。神経型＝早く立ち上がる、一般型＝Ｓ字（2回の急成長）、生殖型＝思春期から急上昇、リンパ型＝12歳ごろに成人の約2倍の山。20歳を100％として比べたグラフなので、「20歳ごろから急速に発達」は誤りのサイン。","note":null}},{"id":"36-32","exam":36,"no":32,"subject":"発達と老化の理解","group":6,"case":null,"stem":"幼稚園児の<b>Ｊ<\/b>さん（6歳，男性）には，広汎性発達障害（pervasive developmental disorder）がある。砂場で砂だんごを作り，きれいに並べることが好きで，毎日，一人で砂だんごを作り続けている。<br>ある日，園児が帰宅した後に，担任が台風に備えて砂場に青いシートをかけておいた。翌朝，登園した<b>Ｊ<\/b>さんが，いつものように砂場に行くと，青いシートがかかっていた。<b>Ｊ<\/b>さんはパニックになり，その場で泣き続け，なかなか落ち着くことができなかった。<br>担任は，<b>Ｊ<\/b>さんにどのように対応すればよかったのか，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["前日に，「あしたは，台風が来るよ」と伝える。","前日に，「あしたは，台風が来るので砂場は使えないよ」と伝える。","前日に，「あしたは，おだんご屋さんは閉店です」と伝える。","その場で，「今日は，砂場は使えないよ」と伝える。","その場で，「今日は，おだんご屋さんは閉店です」と伝える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"広汎性発達障害（自閉スペクトラム症）の子どもは、予定外の変化に強い不安を感じやすく、たとえや遠回しな表現を言葉どおりに受け取りやすい。前日のうちに、何が起こり（台風）、その結果どうなるのか（砂場は使えない）を、そのままの言葉で具体的に伝えておくと、見通しをもって変化を受け止めやすくなる。","choices":["台風が来ることだけでは、自分がいつも使う砂場がどうなるのかがわからず、見通しにつながらない。","前日に、変化の理由と「砂場は使えない」という結果を、具体的でわかりやすい言葉で予告している。","「おだんご屋さんは閉店」はたとえの表現。言葉どおりに受け取りやすいＪさんには、砂場が使えないことが伝わりにくい。","その場で伝えるのでは、すでに変化に直面しており、パニックを防げない。","その場で伝えるうえに、たとえの表現でわかりにくい。"],"point":"自閉スペクトラム症の人への対応は「事前に予告する（見通し）」と「具体的で、言葉どおりに伝わる表現」の2つがそろった選択肢を選ぶ。たとえ・遠回しな言い方・あいまいな表現は伝わりにくい。「その場で」伝える選択肢は事前の予告になっていないので外せる。","note":null}},{"id":"36-33","exam":36,"no":33,"subject":"発達と老化の理解","group":6,"case":null,"stem":"生理的老化に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["環境によって起こる現象である。","訓練によって回復できる現象である。","個体の生命活動に有利にはたらく現象である。","人間固有の現象である。","遺伝的にプログラムされた現象である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"生理的老化は、誰にでも起こる加齢による変化で、遺伝的にあらかじめ組み込まれているという考え方（プログラム説）で説明される。普遍性・内在性・進行性・有害性が特徴とされる。","choices":["環境や病気などの影響で老化が進むのは、病的老化の説明。生理的老化は体の内側の要因（内在性）で起こる。","生理的老化は元に戻らない進行性の変化。訓練で機能の低下をゆるやかにすることはできても、老化そのものは回復しない。","生理的老化は、生命活動にとって不利にはたらく（有害性）。","生理的老化は、人間だけでなくすべての生物に起こる（普遍性）。","遺伝的にプログラムされた現象と考えられている。"],"point":"生理的老化の4つの特徴「普遍性・内在性・進行性・有害性」を、選択肢の誤りに当てはめて判断する。環境＝内在性の否定、回復できる＝進行性の否定、有利＝有害性の否定、人間固有＝普遍性の否定、という作りになっている。","note":null}},{"id":"36-34","exam":36,"no":34,"subject":"発達と老化の理解","group":6,"case":null,"stem":"エイジズム（ageism）に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["高齢を理由にして，偏見をもったり差別したりすることである。","高齢になっても生産的な活動を行うことである。","高齢になることを嫌悪する心理のことである。","加齢に抵抗して，健康的に生きようとすることである。","加齢を受容して，活動的に生きようとすることである。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"エイジズムは、高齢であることを理由にした偏見や差別のことで、アメリカの老年医学者バトラーが提唱した。人種差別・性差別と並ぶ差別の一つとされる。","choices":["高齢を理由とした偏見・差別がエイジズム。","高齢になっても生産的な活動を続けることは、プロダクティブ・エイジングの考え方。","自分が年をとることへの嫌悪や不安の心理を指す言葉ではない。エイジズムは高齢者に対する社会的な偏見・差別を指す。","加齢に抵抗して若さや健康を保とうとするのは、アンチエイジングの考え方。","加齢を受け入れて活動的に生きることは、サクセスフル・エイジングやアクティブ・エイジングに関わる考え方で、エイジズムとは逆の方向の考え方。"],"point":"「〜エイジング」と「エイジズム」を区別する。エイジズムだけが否定的な意味（偏見・差別）。「高齢者は皆、頑固で物忘れが多い」のような決めつけもエイジズムにあたり、介護職自身が気づくべき偏見として問われる。","note":null}},{"id":"36-35","exam":36,"no":35,"subject":"発達と老化の理解","group":6,"case":null,"stem":"<b>Ｋ<\/b>さん（80歳，男性）は，40歳ごろから職場の健康診査で高血圧と高コレステロール血症（hypercholesterolemia）を指摘されていた。最近，階段を上るときに胸の痛みを感じていたが，しばらく休むと軽快していた。喉の違和感や嚥下痛はない。今朝，朝食後から冷や汗を伴う激しい胸痛が起こり，30分しても軽快しないので，救急車を呼んだ。<br><b>Ｋ<\/b>さんに考えられる状況として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["喘息（bronchial asthma）","肺炎（pneumonia）","脳梗塞（cerebral infarction）","心筋梗塞（myocardial infarction）","逆流性食道炎（reflux esophagitis）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"高血圧と高コレステロール血症は動脈硬化の危険因子で、階段で胸が痛み休むと治まるのは狭心症の典型的な症状。今回、冷や汗を伴う激しい胸痛が30分以上続いていることから、心臓の血管が詰まる心筋梗塞が考えられる。","choices":["喘息は、ゼーゼー・ヒューヒューという呼吸音と息苦しさが主な症状で、冷や汗を伴う激しい胸痛ではない。","肺炎は、発熱・せき・痰などが主な症状。","脳梗塞は、片側の手足のまひ、ろれつが回らないなどの神経症状が主で、激しい胸痛は典型的ではない。","危険因子、狭心症の経過、30分以上続く冷や汗を伴う激しい胸痛から、心筋梗塞が考えられる。","逆流性食道炎は胸やけや喉の違和感が主な症状。問題文に喉の違和感や嚥下痛はないとあり、否定されている。"],"point":"胸痛の判断は持続時間がカギ。狭心症＝数分〜15分程度で休むと治まる、心筋梗塞＝30分以上続き、休んでも治まらない（冷や汗・吐き気を伴う）。高齢者の心筋梗塞は、胸痛がはっきりせず、息切れや倦怠感だけのこともある点もあわせて覚える。","note":null}},{"id":"36-36","exam":36,"no":36,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次のうち，健康寿命の説明として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["0歳児の平均余命","65歳時の平均余命","65歳時の平均余命から介護期間を差し引いたもの","介護状態に至らずに死亡する人の平均寿命","健康上の問題で日常生活が制限されることなく生活できる期間"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"厚生労働省は健康寿命を「健康上の問題で日常生活が制限されることなく生活できる期間」と定義している。平均寿命と健康寿命の差は、日常生活に制限のある期間を意味する。","choices":["0歳児の平均余命は平均寿命のこと。","65歳時の平均余命は、65歳の人があと何年生きられるかの平均で、健康寿命ではない。","健康寿命は、介護期間を差し引いて計算するものではない。日常生活に制限があるかどうかをもとにした指標である。","健康寿命は、介護が必要にならずに亡くなった人の寿命の平均ではない。","健康上の問題で日常生活が制限されることなく生活できる期間が健康寿命。"],"point":"平均寿命＝0歳の平均余命、健康寿命＝日常生活が制限されずに生活できる期間、両者の差＝日常生活に制限のある「不健康な期間」と3点セットで覚える。健康寿命の延伸は健康日本21の中心的な目標である。","note":null}},{"id":"36-37","exam":36,"no":37,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次のうち，前立腺肥大症（prostatic hypertrophy）に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["抗利尿ホルモンが関与している。","症状が進むと無尿になる。","初期には頻尿が出現する。","進行すると透析の対象になる。","骨盤底筋訓練で回復が期待できる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"前立腺肥大症は、加齢により前立腺が大きくなって尿道を圧迫する病気で、初期には頻尿（特に夜間頻尿）や尿意切迫感がみられる。進行すると尿の勢いが弱くなり、残尿や尿閉が起こる。","choices":["抗利尿ホルモンは腎臓での水の再吸収を調節するホルモンで、前立腺肥大症の原因ではない。加齢と男性ホルモンの影響が関係するとされる。","無尿は腎臓で尿がほとんどつくられない状態。前立腺肥大症で進行して起こるのは、膀胱に尿がたまっても出せない尿閉である。","初期には頻尿、特に夜間頻尿がみられる。","治療の中心は薬物療法や手術で、透析の対象となる病気ではない。透析は腎不全に対する治療である。","骨盤底筋訓練は、女性に多い腹圧性尿失禁などに効果がある。前立腺による尿道の圧迫を改善するものではない。"],"point":"「無尿」と「尿閉」の違いがよく問われる。無尿＝尿がつくられない（腎臓の問題）、尿閉＝尿はたまっているが出せない（出口の問題）。前立腺肥大症は出口の問題なので、溢流性尿失禁（あふれ出る尿失禁）の原因にもなる。","note":null}},{"id":"36-38","exam":36,"no":38,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次のうち，高齢期に多い筋骨格系の疾患に関する記述として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["骨粗鬆症（osteoporosis）は男性に多い。","変形性膝関節症（knee osteoarthritis）ではＸ脚に変形する。","関節リウマチ（rheumatoid arthritis）は軟骨の老化によって起こる。","腰部脊柱管狭窄症（lumbar spinal canal stenosis）では下肢のしびれがみられる。","サルコペニア（sarcopenia）は骨量の低下が特徴である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"腰部脊柱管狭窄症は、加齢などで腰の脊柱管が狭くなり、神経が圧迫される病気である。下肢のしびれや痛み、少し歩くと脚がしびれて休むとまた歩ける間欠性跛行が特徴。","choices":["骨粗鬆症は女性に多い。閉経後に女性ホルモン（エストロゲン）が減ると骨量が低下しやすくなる。","変形性膝関節症では、多くは膝の内側の軟骨がすり減り、Ｏ脚に変形する。","関節リウマチは、免疫の異常による自己免疫疾患で、関節の滑膜に炎症が起こる。軟骨の老化によって起こるのは変形性関節症。","腰部脊柱管狭窄症では下肢のしびれがみられる。","サルコペニアは、加齢による筋肉量の減少と筋力・身体機能の低下が特徴。骨量の低下は骨粗鬆症の特徴。"],"point":"高齢者の筋骨格系疾患は「特徴を1つずつ」覚える。骨粗鬆症＝女性に多い、変形性膝関節症＝Ｏ脚、関節リウマチ＝自己免疫・朝のこわばり、脊柱管狭窄症＝間欠性跛行、サルコペニア＝筋肉の減少。骨（骨粗鬆症）と筋肉（サルコペニア）を入れ替えるひっかけに注意する。","note":null}},{"id":"36-39","exam":36,"no":39,"subject":"認知症の理解","group":7,"case":null,"stem":"高齢者の自動車運転免許に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["75歳から免許更新時の認知機能検査が義務づけられている。","80歳から免許更新時の運転技能検査が義務づけられている。","軽度認知障害（mild cognitive impairment）と診断された人は運転免許取消しになる。","認知症（dementia）の人はサポートカー限定免許であれば運転が可能である。","認知症（dementia）による運転免許取消しの後，運転経歴証明書が交付される。"],"notes":"（注）　「サポートカー限定免許」とは，道路交通法第91条の2の規定に基づく条件が付された免許のことである。","figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"道路交通法により、免許証の更新期間が満了する日の年齢が75歳以上の人は、更新時に認知機能検査を受けなければならない。","choices":["75歳以上の更新時に認知機能検査が義務づけられている。","運転技能検査（実車による試験）の対象は「80歳から全員」ではなく、75歳以上で過去3年間に信号無視・速度超過などの一定の違反歴がある人である。","軽度認知障害は認知症ではないため、それだけで免許取消しにはならない。取消し・停止の対象は認知症と診断された場合である。","サポートカー限定免許は、運転できる車を安全運転支援装置付きの普通自動車に限る条件付きの免許で、本人の申請で付けるもの。認知症の人が運転を続けられる制度ではない。","運転経歴証明書は、免許を自主返納した人や更新せず失効した人が申請して受けるもの。認知症などで行政処分として取り消された人は交付を受けられない。"],"point":"数値の入れ替えに注意。「75歳以上＝認知機能検査（全員）」「75歳以上＋一定の違反歴＝運転技能検査」と組で覚える。運転経歴証明書は「自主返納した人が受けられ、本人確認書類にも使える証明書」で、処分による取消しでは交付されない点もセットにする。","note":null}},{"id":"36-40","exam":36,"no":40,"subject":"認知症の理解","group":7,"case":null,"stem":"認知症（dementia）の行動・心理症状（ＢＰＳＤ）であるアパシー（apathy）に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["感情の起伏がみられない。","将来に希望がもてない。","気持ちが落ち込む。","理想どおりにいかず悩む。","自分を責める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"アパシーは無関心・意欲の低下を表し、喜怒哀楽などの感情の動きが乏しくなって、周囲や自分のことに関心を示さなくなる状態をいう。","choices":["感情の起伏がみられないのはアパシーの特徴。","将来に希望がもてない（絶望感）のは、うつ状態にみられる。","気持ちが落ち込む（抑うつ気分）のは、うつ状態の中心的な症状。","理想どおりにいかず悩むのは、悩むという感情の動きがあり、無関心とは逆である。","自分を責める（自責感）のは、うつ状態にみられる。"],"point":"アパシーとうつの区別がねらわれる。うつは「つらい・悲しい・自分を責める」と本人が苦しむのに対し、アパシーは「何も感じない・どうでもいい」と苦痛の訴えが少ない。選択肢に「悩む」「責める」「希望がない」があれば、うつ側と判断する。","note":null}},{"id":"36-41","exam":36,"no":41,"subject":"認知症の理解","group":7,"case":null,"stem":"認知症（dementia）の人にみられる，せん妄に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ゆっくりと発症する。","意識は清明である。","注意機能は保たれる。","体調の変化が誘因になる。","日中に多くみられる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"せん妄は、脱水・発熱・感染症・便秘・薬の副作用・環境の変化などをきっかけに起こる一時的な意識障害である。体調の変化は代表的な誘因で、原因を取り除くと改善することが多い。","choices":["せん妄は数時間〜数日で急に発症する。ゆっくり発症するのは認知症。","意識障害（意識の混濁）が本態であり、意識は清明ではない。","注意を集中・維持できなくなる注意障害が中心的な症状である。","脱水や感染症などの体調の変化が誘因になる。","夕方から夜間に多くみられる（夜間せん妄）。"],"point":"せん妄と認知症の比較表で覚える。せん妄＝急に発症・意識障害あり・一日の中で変動し夜に悪化・原因を除けば改善しうる。認知症＝ゆっくり進行・意識は清明。高齢者の急な混乱は「認知症が進んだ」と決めつけず、まず体調の変化（脱水・発熱・薬）を疑う。","note":null}},{"id":"36-42","exam":36,"no":42,"subject":"認知症の理解","group":7,"case":null,"stem":"レビー小体型認知症（dementia with Lewy bodies）にみられる歩行障害として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["しばらく歩くと足に痛みを感じて，休みながら歩く。","最初の一歩が踏み出しにくく，小刻みに歩く。","動きがぎこちなく，酔っぱらったように歩く。","下肢は伸展し，つま先を引きずるように歩く。","歩くごとに骨盤が傾き，腰を左右に振って歩く。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"レビー小体型認知症では、パーキンソン病と同じような症状（パーキンソニズム）がみられる。歩き始めの一歩が出にくい「すくみ足」や、小刻み歩行が特徴である。","choices":["歩くと脚が痛み・しびれ、休むとまた歩けるのは間欠性跛行。腰部脊柱管狭窄症や閉塞性動脈硬化症でみられる。","すくみ足・小刻み歩行はパーキンソニズムの歩行障害。","酔っぱらったようにふらつくのは失調性歩行で、小脳の障害（脊髄小脳変性症など）でみられる。","下肢が突っ張ってつま先を引きずるのは痙性歩行で、脳卒中による片麻痺などでみられる。","骨盤が傾き腰を左右に振るのは動揺性歩行（あひる歩行）で、進行性筋ジストロフィーなど腰回りの筋力低下でみられる。"],"point":"レビー小体型認知症の3大特徴「幻視（人や虫が見える）・パーキンソニズム・認知機能の日内変動」をセットで覚える。パーキンソニズムがあるので転倒しやすいことも問われやすい。歩行の型と病気の組み合わせ（間欠性跛行・失調性・痙性・動揺性）もあわせて整理する。","note":null}},{"id":"36-43","exam":36,"no":43,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，若年性認知症（dementia with early onset）の特徴として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["高齢の認知症（dementia）に比べて，症状の進行速度は緩やかなことが多い。","男性よりも女性の発症者が多い。","50歳代よりも30歳代の有病率が高い。","特定健康診査で発見されることが多い。","高齢の認知症（dementia）に比べて，就労支援が必要になることが多い。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"若年性認知症は65歳未満で発症する認知症である。働き盛りで発症することが多く、仕事を続けるための支援や、収入が減ることへの経済的支援が高齢の認知症より強く必要になる。","choices":["若年性認知症は、高齢の認知症に比べて進行が速い傾向があるとされる。","国の調査では、女性より男性のほうが多いと報告されている。","有病率は年齢が上がるほど高くなるため、30歳代より50歳代のほうが高い。","特定健康診査は生活習慣病（メタボリックシンドローム）に着目した健診で、認知症を見つける目的のものではない。仕事のミスなどをきっかけに気づかれることが多い。","現役世代のため、就労の継続や就労支援が必要になることが多い。"],"point":"若年性認知症は「現役世代の病気」と考えると解きやすい。就労・経済・子育て（子どもへの影響）・配偶者の介護負担が課題になる。相談先として都道府県の若年性認知症支援コーディネーターも覚えておく。","note":null}},{"id":"36-44","exam":36,"no":44,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ｌ<\/b>さん（78歳，女性，要介護1）は，3年前にアルツハイマー型認知症（dementia of the Alzheimer’s type）と診断された。訪問介護（ホームヘルプサービス）を利用し，夫の介護を受けながら二人で暮らしている。ある日，訪問介護員（ホームヘルパー）が訪問すると夫から，「用事で外出しようとすると『外で女性に会っている』と言って興奮することが増えて困っている」と相談を受けた。<br><b>Ｌ<\/b>さんの症状に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["誤認","観念失行","嫉妬妄想","視覚失認","幻視"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"夫が外出するたびに「外で女性に会っている」と思い込んで興奮するのは、配偶者が浮気をしていると確信する嫉妬妄想である。妄想は事実でないことを確信し、訂正できない状態をいう。","choices":["誤認は、人や物を別のものと取り違えること（例：娘を妹と思う）。Ｌさんは夫を別人と取り違えてはいない。","観念失行は、手足は動くのに、お茶を入れるなど一連の動作の手順がわからなくなること。","配偶者の浮気を確信する嫉妬妄想である。","視覚失認は、見えているのにそれが何かわからないこと。","幻視は、実際にはないものが見えること。レビー小体型認知症に多い。"],"point":"アルツハイマー型認知症の妄想は、身近な人を対象とする「もの盗られ妄想」と「嫉妬妄想」が代表。妄想は否定や説得では消えないので、まず本人の不安な気持ちを受け止める。介護する家族の負担への支援も問われやすい。","note":null}},{"id":"36-45","exam":36,"no":45,"subject":"認知症の理解","group":7,"case":null,"stem":"認知機能障害による生活への影響に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["遂行機能障害により，自宅がわからない。","記憶障害により，出された食事を食べない。","相貌失認により，目の前の家族がわからない。","視空間認知障害により，今日の日付がわからない。","病識低下により，うつ状態になりやすい。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"相貌失認は、視力に問題がないのに、顔を見ても誰かがわからなくなる症状である。そのため、目の前にいる家族の顔を見ても家族だとわからないことがある。声を聞くとわかる場合もある。","choices":["自宅がわからなくなるのは、場所の見当識障害や視空間認知障害による。遂行機能障害は、計画を立てて段取りよく進めることができなくなる障害（例：料理の手順が組めない）。","記憶障害では「食べたことを忘れて、また食事を求める」ことが起こる。出された食事を食べないのは、失認（食べ物と認識できない）や失行などで起こりうる。","相貌失認では目の前の家族がわからなくなる。","今日の日付がわからないのは、時間の見当識障害による。視空間認知障害は物の位置や距離、形がわからない障害。","病識が低下すると、自分の障害を自覚しにくくなるため、悩んでうつ状態になる流れとは逆である。うつ状態は、病識が保たれ、できなくなったことを自覚している初期に起こりやすい。"],"point":"「障害名と生活への影響」の組み合わせ問題は、誤りの選択肢で症状名と例が入れ替えられる。遂行機能障害＝段取り、見当識障害＝時間・場所・人、視空間認知障害＝位置・距離・形、相貌失認＝顔、と1語のキーワードで結びつけておく。","note":null}},{"id":"36-46","exam":36,"no":46,"subject":"認知症の理解","group":7,"case":null,"stem":"バリデーション（validation）に基づく，認知症（dementia）の人の動きや感情に合わせるコミュニケーション技法として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["センタリング（centering）","リフレージング（rephrasing）","レミニシング（reminiscing）","ミラーリング（mirroring）","カリブレーション（calibration）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4,5],"exp":{"basis":"バリデーションは、ナオミ・フェイルが提唱した、認知症の人の言動には意味があると考えて受け止め、共感するコミュニケーション法である。ミラーリングは相手の動きや表情を鏡のようにまねること、カリブレーションは相手の感情を観察して自分も同じ感情に合わせることで、どちらも「動きや感情に合わせる」技法にあたる。このため試験センターは、問題文からはどちらも正答となるとして、選択肢4と5の両方に得点する扱いとした。","choices":["センタリングは、介護者が関わる前に深呼吸などで自分の気持ちを落ち着け、集中する技法。相手に合わせる技法ではない。","リフレージングは、本人の話した言葉をそのまま繰り返して返す技法。","レミニシングは、昔の思い出を一緒に話すことで、本人が慣れた対処の仕方を思い出せるよう促す技法。","ミラーリングは、相手の動きや表情に合わせて鏡のようにまねる技法。","カリブレーションは、相手の感情を観察し、その感情に合わせて同調する技法。"],"point":"バリデーションの技法はカタカナ名と中身の対応で問われる。センタリング＝介護者が自分を整える、リフレージング＝言葉を繰り返す、レミニシング＝思い出話、ミラーリング＝動きをまねる、カリブレーション＝感情に合わせる。「動き」ならミラーリング、「感情」ならカリブレーションと区別して覚える。","note":null}},{"id":"36-47","exam":36,"no":47,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ｍ<\/b>さん（80歳，女性，要介護1）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）であり，3日前に認知症対応型共同生活介護（認知症高齢者グループホーム）に入居した。主治医から向精神薬が処方されている。居室では穏やかに過ごしていた。夕食後，表情が険しくなり，「こんなところにはいられません。私は家に帰ります」と大声を上げ，ほかの利用者にも，「あなたも一緒に帰りましょう」と声をかけて皆が落ち着かなくなることがあった。<br><b>Ｍ<\/b>さんの介護を検討するときに優先することとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ｍ<\/b>さんが訴えている内容","<b>Ｍ<\/b>さんの日中の過ごし方","ほかの利用者が落ち着かなくなったこと","対応に困ったこと","薬が効かなかったこと"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"入居して3日目で、慣れない環境への不安から「家に帰ります」と訴えていると考えられる。帰宅願望などの行動・心理症状には本人なりの理由があるため、まずＭさんが何を訴えているのか、その内容と背景にある気持ちを理解することを優先する。","choices":["本人の訴えの内容と、その背景の気持ちを理解することが出発点になる。","日中の過ごし方も背景を探る情報の一つだが、優先すべきはＭさんが今訴えていること。","ほかの利用者への影響も配慮は必要だが、周囲の都合を本人の理解より先にしない。","介護者が対応に困ったことは職員側の視点で、Ｍさんの介護を考える出発点ではない。","薬が効かなかったと決めつけて薬に原因を求めるのは、本人の不安や環境の変化を見落とす。薬の評価は医師・看護職員と連携して行う。"],"point":"認知症の事例で「優先すること」を問われたら、本人の思い・訴え・気持ちを中心にした選択肢を選ぶ。入居直後の不穏は、住み慣れた場所を離れたことによる環境の変化（リロケーションダメージ）を考える。夕方に落ち着かなくなる「夕暮れ症候群」もあわせて覚える。","note":null}},{"id":"36-48","exam":36,"no":48,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，男性，要介護1）は，認知症（dementia）で，妻の介護を受けながら二人で暮らしている。「夫は昼夜逆転がある。在宅介護を続けたいが，私が体調を崩し数日間の入院が必要になった」と言う妻に提案する，<b>Ａ<\/b>さんへの介護サービスとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["認知症対応型通所介護（認知症対応型デイサービス）","短期入所生活介護（ショートステイ）","認知症対応型共同生活介護（認知症高齢者グループホーム）","特定施設入居者生活介護","介護老人福祉施設"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"妻の入院の数日間だけ、Ａさんが昼夜を通して介護を受けられ、退院後はまた在宅介護に戻れるサービスが必要である。短期入所生活介護（ショートステイ）は、施設に短期間泊まって介護を受けるサービスで、家族の病気や休息（レスパイト）のときに使われる。","choices":["認知症対応型通所介護は日帰りのサービスで、夜間の介護は受けられない。昼夜逆転のあるＡさんを夜間一人にしてしまう。","数日間の宿泊で昼夜の介護を受けられ、在宅介護も続けられる。","認知症対応型共同生活介護は、原則として生活の場として入居し共同生活を送るサービスで、数日間の一時的な利用には向かない。","特定施設入居者生活介護は、有料老人ホームなどに入居している人が受けるサービス。","介護老人福祉施設は長期入所の施設で、新規入所は原則として要介護3以上。要介護1のＡさんの数日間の利用には合わない。"],"point":"「家族が数日いない」「在宅介護を続けたい」という条件が出たら、短期入所（ショートステイ）を選ぶ。日帰り（通所）・短期の宿泊（短期入所）・入居（施設・グループホーム）の区別で絞り込む。特養の「原則要介護3以上」もよく使われる手がかりである。","note":null}},{"id":"36-49","exam":36,"no":49,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，ノーマライゼーション（normalization）の原理を盛り込んだ法律（いわゆる「1959年法」）を制定した最初の国として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["デンマーク","イギリス","アメリカ","スウェーデン","ノルウェー"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"ノーマライゼーションの原理を初めて法律に盛り込んだのはデンマークの「1959年法」（知的障害者に関する法律）である。知的障害者の親の会の運動を受け、行政官のバンク-ミケルセンが法律づくりに関わった。","choices":["デンマークの1959年法が最初である。","イギリスは、ベヴァリッジ報告に基づく福祉国家づくりやコミュニティケアで知られる。","アメリカは、自立生活運動やＡＤＡ（障害をもつアメリカ人法、1990年）で知られる。","スウェーデンは、ニィリエがノーマライゼーションの原理を8つに整理して広めた国。最初に法律化した国ではない。","ノルウェーは、1959年法とは関係がない。"],"point":"「デンマーク＝バンク-ミケルセン＝1959年法（ノーマライゼーションの父）」「スウェーデン＝ニィリエ＝8つの原理」「アメリカ＝ヴォルフェンスベルガー＝社会的役割の価値付与」と国・人物・業績を3点セットで覚える。デンマークとスウェーデンの入れ替えが定番のひっかけ。","note":null}},{"id":"36-50","exam":36,"no":50,"subject":"障害の理解","group":8,"case":null,"stem":"法定後見制度において，成年後見人等を選任する機関等として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["法務局","家庭裁判所","都道府県知事","市町村長","福祉事務所"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"法定後見制度（後見・保佐・補助）では、本人や配偶者、4親等内の親族、市町村長などの申立てを受けて、家庭裁判所が成年後見人等を選任する。","choices":["法務局は、後見の内容を登記する（後見登記）機関で、選任はしない。","成年後見人等を選任するのは家庭裁判所である。","都道府県知事に選任の権限はない。","市町村長は、身寄りがないときなどに後見開始の審判を申し立てることができる立場で、選任するのではない。","福祉事務所に選任の権限はない。"],"point":"「申し立てる人（本人・親族・市町村長など）」と「選ぶ機関（家庭裁判所）」と「登記する機関（法務局）」を区別する。任意後見でも、任意後見監督人を選任するのは家庭裁判所である。","note":null}},{"id":"36-51","exam":36,"no":51,"subject":"障害の理解","group":8,"case":null,"stem":"次の記述のうち，障害を受容した心理的段階にみられる言動として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害があるという自覚がない。","周囲に不満をぶつける。","自分が悪いと悲観する。","価値観が転換し始める。","できることに目を向けて行動する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"障害受容の段階は、ショック期→否認期→混乱期→解決への努力期→受容期と説明されることが多い。受容期には、障害を自分の一部として受け入れ、できることに目を向けて前向きに行動するようになる。","choices":["障害があるという自覚がないのは、ショック期や否認期にみられる。","周囲に不満や怒りをぶつけるのは混乱期にみられる。","自分が悪いと悲観し落ち込むのも混乱期にみられる。","価値観が転換し始めるのは、受容期に向かう途中の解決への努力期の特徴。受容期は価値の転換が進み、それに基づいて行動している段階。","できることに目を向けて行動するのは受容期の言動。"],"point":"段階の順番と各段階のキーワードで判断する。否認＝認めない、混乱＝怒り・悲しみ・自責、努力期＝前向きになり始める、受容＝できることに目を向けて行動。「〜し始める」は受容の一歩手前と読む。段階は必ず順番どおりに進むとは限らず、行きつ戻りつする点も押さえる。","note":null}},{"id":"36-52","exam":36,"no":52,"subject":"障害の理解","group":8,"case":null,"stem":"統合失調症（schizophrenia）の特徴的な症状として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["振戦せん妄","妄想","強迫性障害","抑うつ気分","健忘"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"統合失調症では、妄想（被害妄想など）や幻覚（特に幻聴）といった陽性症状が特徴的にみられる。意欲の低下や感情の平板化などの陰性症状もある。","choices":["振戦せん妄は、アルコール依存症の人が飲酒をやめたときに起こる離脱症状。","妄想は統合失調症の代表的な症状（陽性症状）。","強迫性障害は、わかっていても同じ考えや確認行為をくり返してしまう別の精神疾患。","抑うつ気分はうつ病（気分障害）の中心的な症状。","健忘（記憶の欠落）は、認知症、解離性障害、アルコールによるコルサコフ症候群などでみられる。"],"point":"統合失調症は「陽性症状（幻聴・妄想）」と「陰性症状（意欲低下・感情の平板化・ひきこもり）」の2つに分けて覚える。病名と症状の組み合わせ問題では、振戦せん妄＝アルコール、抑うつ気分＝うつ病、と他の病気の症状がひっかけに並ぶ。","note":null}},{"id":"36-53","exam":36,"no":53,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ｂ<\/b>さん（60歳，男性）は，一人暮らしをしている。糖尿病性網膜症（diabetic retinopathy）による視覚障害（身体障害者手帳1級）があり，末梢神経障害の症状がでている。<b>Ｂ<\/b>さんの日常生活において，介護福祉職が留意すべき点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["水晶体の白濁","口腔粘膜や外陰部の潰瘍","振戦や筋固縮","足先の傷や壊疽などの病変","感音性の難聴"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"糖尿病の末梢神経障害では足の感覚が鈍り、けがや靴ずれに気づきにくい。さらにＢさんは視覚障害のため足先の傷を目で確かめられず、傷が悪化して壊疽に進むおそれがある。足先の傷や変色などを観察することが重要である。","choices":["水晶体の白濁は白内障の症状。Ｂさんの視覚障害は網膜の障害による。","口腔粘膜や外陰部の潰瘍は、ベーチェット病の症状。","振戦や筋固縮はパーキンソン病の症状。","感覚の低下と視覚障害が重なり、足先の傷や壊疽に気づきにくい。","感音性難聴は内耳などの障害で、加齢性難聴などでみられる。糖尿病の三大合併症ではない。"],"point":"糖尿病の三大合併症は「網膜症・腎症・神経障害」。神経障害がある人は足の観察（フットケア）、靴の中の異物確認、低温やけどへの注意が大切。視覚障害があれば、本人の代わりに介護職が目で確認する視点をもつ。","note":null}},{"id":"36-54","exam":36,"no":54,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ｃ<\/b>さん（55歳，男性）は，5年前に筋萎縮性側索硬化症（amyotrophic lateral sclerosis：ＡＬＳ）と診断された。現在は症状が進行して，日常生活動作に介護が必要で，自宅では電動車いすと特殊寝台を使用している。<br>次の記述のうち，<b>Ｃ<\/b>さんの現在の状態として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["誤嚥せずに食事することが可能である。","明瞭に話すことができる。","身体の痛みがわかる。","自力で痰を排出できる。","箸を上手に使える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"ＡＬＳは運動神経が選択的に障害される病気で、感覚神経は保たれる。そのため症状が進んでも、痛みや触られた感覚はわかる。","choices":["嚥下にかかわる筋肉も弱くなるため、進行すると誤嚥しやすくなる。","発声や構音にかかわる筋肉も弱くなり、話しにくくなる（構音障害）。","感覚は保たれるため、身体の痛みはわかる。","呼吸や咳の力が弱くなるため、自力で痰を出しにくくなり、吸引が必要になることが多い。","手指の筋力も低下するため、箸を上手に使うことは難しくなる。電動車いすを使うほど進行していることも手がかり。"],"point":"ＡＬＳで「保たれる機能」が繰り返し出題される。感覚（痛み）、眼球運動、膀胱・直腸の機能（排せつのコントロール）、知能は比較的保たれ、褥瘡もできにくいとされる。コミュニケーションには、文字盤や視線入力などの意思伝達装置を使う。","note":null}},{"id":"36-55","exam":36,"no":55,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ｄ<\/b>さん（36歳，女性，療育手帳所持）は，一人暮らしをしながら地域の作業所に通っている。身の回りのことはほとんど自分でできるが，お金の計算，特に計画的にお金を使うのが苦手だった。そこで，社会福祉協議会の生活支援員と一緒に銀行へ行って，1週間ごとにお金をおろして生活するようになった。小遣い帳に記録をするようにアドバイスを受けて，お金を計画的に使うことができるようになった。<br>次のうち，<b>Ｄ<\/b>さんが活用した支援を実施する事業として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害者相談支援事業","自立生活援助事業","日常生活自立支援事業","成年後見制度利用支援事業","日常生活用具給付等事業"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"日常生活自立支援事業は、判断能力が十分でない人が地域で自立して暮らせるよう、社会福祉協議会が本人との契約に基づいて行う事業である。生活支援員が、福祉サービスの利用援助や、日常的な金銭管理（預金の出し入れの支援など）を行う。","choices":["障害者相談支援事業は、市町村が行う障害者の一般的な相談に応じる事業で、金銭管理を一緒に行うものではない。","自立生活援助は、施設やグループホームから一人暮らしに移った人などを定期的に訪問し、生活の困りごとに助言する障害福祉サービスで、社会福祉協議会の生活支援員による事業ではない。","社会福祉協議会の生活支援員による日常的な金銭管理の支援である。","成年後見制度利用支援事業は、後見の申立て費用や後見人の報酬を助成する事業。","日常生活用具給付等事業は、特殊寝台や視覚障害者用の機器など、生活に必要な用具を給付・貸与する事業。"],"point":"「社会福祉協議会」「生活支援員」「日常的な金銭管理」「本人との契約」が出たら日常生活自立支援事業。契約を結べる程度の判断能力が必要な点で成年後見制度と区別する。家庭裁判所が関わるのは成年後見制度のほうである。","note":null}},{"id":"36-56","exam":36,"no":56,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，障害の特性に応じた休憩時間の調整など，柔軟に対応することで障害者の権利を確保する考え方を示すものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["全人間的復権","合理的配慮","自立生活運動","意思決定支援","共同生活援助"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"合理的配慮は、障害のある人から社会的障壁を取り除いてほしいという意思が示されたときに、負担が重すぎない範囲で、個々の状況に応じた変更や調整を行うことをいう。休憩時間の調整はその代表例で、障害者権利条約や障害者差別解消法に規定されている。","choices":["全人間的復権は、リハビリテーションの理念を表す言葉。","個々の障害の特性に応じた柔軟な調整は合理的配慮である。","自立生活運動は、障害者自身が自己決定に基づく地域生活を求めたアメリカ発祥の運動。","意思決定支援は、本人が自分で決められるよう支援する考え方で、休憩時間の調整などの環境の変更を示す言葉ではない。","共同生活援助はグループホームのことで、障害福祉サービスの名称。"],"point":"合理的配慮のキーワードは「本人からの意思の表明」「過重な負担にならない範囲」「個別の調整」。反対に、障害を理由にサービス提供を断るなどの「不当な差別的取扱い」は禁止されている。2つをセットで覚える。","note":"試験時（2024年1月）は、民間事業者による合理的配慮の提供は努力義務だった。改正障害者差別解消法が2024（令和6）年4月1日に施行され、現在は事業者にも合理的配慮の提供が法的義務となっている（行政機関等は以前から義務）。最新の内容は内閣府の資料で確認すること。"}},{"id":"36-57","exam":36,"no":57,"subject":"障害の理解","group":8,"case":null,"stem":"「障害者総合支援法」において，障害福祉サービスを利用する人の意向のもとにサービス等利用計画案を作成する事業所に置かなければならない専門職として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護支援専門員（ケアマネジャー）","社会福祉士","介護福祉士","民生委員","相談支援専門員"],"notes":"（注）　「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"障害福祉サービスを利用するときのサービス等利用計画案は、指定特定相談支援事業所で作成される。この事業所には、計画を作成する専門職として相談支援専門員を置かなければならない。","choices":["介護支援専門員は、介護保険でケアプラン（居宅サービス計画など）を作成する専門職。","社会福祉士は相談援助の国家資格だが、事業所に置かなければならない職種として定められているのは相談支援専門員。","介護福祉士は介護の専門職で、サービス等利用計画案の作成者として配置が義務づけられているわけではない。","民生委員は地域で住民の相談に応じる民間の奉仕者（厚生労働大臣が委嘱）で、事業所の職員ではない。","指定特定相談支援事業所には相談支援専門員を置く。"],"point":"「介護保険＝介護支援専門員＝ケアプラン」「障害者総合支援法＝相談支援専門員＝サービス等利用計画」と制度ごとに対応させる。障害福祉サービスの利用者が65歳になると介護保険が優先される場面もあり、両者の連携が問われることもある。","note":null}},{"id":"36-58","exam":36,"no":58,"subject":"障害の理解","group":8,"case":null,"stem":"家族の介護力をアセスメントするときの視点に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害者個人のニーズを重視する。","家族のニーズを重視する。","家族構成員の主観の共通部分を重視する。","家族を構成する個人と家族全体の生活を見る。","支援者の視点や価値観を基準にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"家族の介護力をアセスメントするときは、障害者本人、介護する家族一人ひとり、そして家族全体の生活をとらえる。誰か一人のニーズだけを見ると、家族の誰かに無理がかかっていることを見落とす。","choices":["障害者個人のニーズだけを重視すると、介護する家族の負担や健康状態が見えなくなる。","家族のニーズだけを重視すると、本人の意向が後回しになる。","家族の考えの共通部分だけを見ると、一人ひとりの異なる思いや、言い出しにくい負担などを見落とす。","家族を構成する個人と家族全体の生活の両方を見る。","支援者の視点や価値観を基準にすると、その家族なりの暮らし方や価値観を尊重できない。"],"point":"家族支援の問題では、「〜だけを重視する」「支援者の価値観を基準にする」という一方的な選択肢は誤りになりやすい。本人と家族一人ひとり、そして家族全体を見る選択肢を選ぶ。","note":null}},{"id":"36-59","exam":36,"no":59,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，喀痰吸引等を実施する訪問介護事業所として登録するときに，事業所が行うべき事項として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["登録研修機関になる。","医師が設置する安全委員会に参加する。","喀痰吸引等計画書の作成を看護師に依頼する。","介護支援専門員（ケアマネジャー）の文書による指示を受ける。","医療関係者との連携体制を確保する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"介護職員が喀痰吸引等を行う事業所は、都道府県知事に登録する必要がある。登録の要件の一つとして、医師や看護職員などの医療関係者との連携体制を確保することが求められる。","choices":["登録研修機関は、介護職員に喀痰吸引等の研修を行う機関である。サービスを提供する事業所が研修機関になる必要はない。","喀痰吸引等を安全に行うための安全委員会は、事業所が（安全確保の体制として）設置するもので、医師が設置する委員会に参加するのではない。","喀痰吸引等計画書は、事業所（実施する介護職員等）が利用者ごとに作成するもので、看護師に作成を依頼することが登録の要件ではない。","喀痰吸引等の実施に必要なのは医師の文書による指示で、介護支援専門員の指示ではない。","医療関係者との連携体制の確保は登録の要件である。"],"point":"喀痰吸引等の「指示を出すのは医師（文書）」「登録先は都道府県知事」「研修をするのは登録研修機関」「連携するのは医師・看護職員」と役割を区別する。ケアマネジャーや看護師が指示や計画の主体になっている選択肢はひっかけ。","note":null}},{"id":"36-60","exam":36,"no":60,"subject":"医療的ケア","group":9,"case":null,"stem":"次のうち，呼吸器官の部位の説明に関する記述として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["鼻腔は，上葉・中葉・下葉に分かれている。","咽頭は，左右に分岐している。","喉頭は，食べ物の通り道である。","気管は，空気の通り道である。","肺は，腹腔内にある。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"気管は、喉頭から続いて肺へ向かう空気の通り道である。胸の中で左右の主気管支に分かれ、肺に空気を送る。","choices":["上葉・中葉・下葉に分かれているのは右肺。左肺は上葉と下葉の2つである。鼻腔は葉に分かれない。","左右に分岐するのは気管（気管分岐部で左右の主気管支に分かれる）。咽頭は分岐しない。","喉頭は空気の通り道で、声帯がある。食べ物は咽頭から食道へ進み、飲み込むときは喉頭蓋が喉頭の入り口にふたをする。","気管は空気の通り道である。","肺は胸腔内にある。胸腔と腹腔は横隔膜で隔てられている。"],"point":"空気の通り道は「鼻腔→咽頭→喉頭→気管→気管支→肺」の順で覚える。咽頭は空気と食べ物の共通の通り道で、その先で喉頭（空気）と食道（食べ物）に分かれる。右肺3葉・左肺2葉、右の気管支は太く短く傾きが急なため誤嚥物が入りやすい、もあわせて押さえる。","note":null}},{"id":"36-61","exam":36,"no":61,"subject":"医療的ケア","group":9,"case":null,"stem":"次のうち，痰の吸引の準備に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["吸引器は，陰圧になることを確認する。","吸引びんは，滅菌したものを用意する。","吸引チューブのサイズは，痰の量に応じたものにする。","洗浄水は，決められた消毒薬を入れておく。","清浄綿は，次亜塩素酸ナトリウムに浸しておく。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"吸引の準備では、吸引器のスイッチを入れ、吸引チューブの根元を指で閉じて、吸引圧（陰圧）がかかることを確認する。陰圧にならなければ痰を吸引できないため、使用前の点検が欠かせない。","choices":["吸引器が陰圧になることを確認する。","吸引びん（排液をためるびん）は体内に入るものではないため、滅菌したものである必要はない。清潔に管理し、排液がたまったら捨てて洗浄する。","吸引チューブのサイズは、医師の指示や対象者の年齢・体格などに合わせて選ぶ。痰の量で決めるものではない。","洗浄水は、チューブ内側の痰を洗い流すための水で、口腔・鼻腔の吸引では水道水などの清潔な水、気管カニューレ内部の吸引では滅菌精製水を使う。消毒薬を入れておくものではない。","次亜塩素酸ナトリウムは器具の消毒などに使う消毒薬で、清浄綿を浸すものではない。清浄綿はそのまま使う。"],"point":"喀痰吸引では「何が滅菌で、何が清潔でよいか」がよく問われる。気管カニューレ内部の吸引は無菌的操作、口腔・鼻腔の吸引は清潔操作と区別する。吸引器の作動確認（陰圧の確認）は毎回の準備で必ず行う。","note":null}},{"id":"36-62","exam":36,"no":62,"subject":"医療的ケア","group":9,"case":null,"stem":"次のうち，経管栄養で起こるトラブルに関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["チューブの誤挿入は，下痢を起こす可能性がある。","注入速度が速いときは，嘔吐を起こす可能性がある。","注入物の温度の調整不良は，脱水を起こす可能性がある。","注入物の濃度の間違いは，感染を起こす可能性がある。","注入中の姿勢の不良は，便秘を起こす可能性がある。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"栄養剤の注入速度が速すぎると、胃に急に多くの量が入って、腹部膨満感や嘔吐、下痢などを起こす可能性がある。嘔吐すると誤嚥性肺炎につながるおそれもある。","choices":["チューブの誤挿入（経鼻胃管が気管に入るなど）で起こるのは、誤嚥や肺炎、呼吸困難など。","注入速度が速いと嘔吐を起こす可能性がある。","注入物の温度が低すぎると、腹痛や下痢を起こす可能性がある。脱水の原因とはされない。","注入物の濃度の間違いで起こるのは、下痢などの消化器症状。感染は器具の不潔な扱いや栄養剤の汚染で起こる。","注入中の姿勢が悪い（上半身が起きていない）と、栄養剤が逆流して嘔吐や誤嚥性肺炎を起こす可能性がある。"],"point":"経管栄養のトラブルは「原因→起こること」の組で覚える。速度が速い＝嘔吐・下痢・腹部膨満、温度が低い＝下痢・腹痛、濃度が高い＝下痢、不潔操作＝感染、姿勢不良＝逆流・誤嚥。選択肢はこの組み合わせを入れ替えて作られる。","note":null}},{"id":"36-63","exam":36,"no":63,"subject":"医療的ケア","group":9,"case":null,"stem":"<b>Ｅ<\/b>さん（75歳，女性）は，介護老人福祉施設に入所している。脳梗塞（cerebral infarction）の後遺症があり，介護福祉士が胃ろうによる経管栄養を行っている。<br>ある日，半座位で栄養剤の注入を開始し，半分程度を順調に注入したところで，体調に変わりがないかを聞くと，「少しお腹が張ってきたような気がする」と<b>Ｅ<\/b>さんは答えた。意識レベルや顔色に変化はなく，腹痛や嘔気はない。<br>次のうち，介護福祉士が看護職員に相談する前に行う対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["嘔吐していないので，そのまま様子をみる。","仰臥位（背臥位）にする。","腹部が圧迫されていないかを確認する。","注入速度を速める。","栄養剤の注入を終了する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"意識や顔色に変化がなく、腹痛や嘔気もないため、まず介護福祉士が確認できる原因から確かめる。腹部の張りは、姿勢がずれて腹部が圧迫されていたり、衣類やベルトで締めつけられていたりすることでも起こるため、腹部が圧迫されていないかを確認する。そのうえで看護職員に相談する。","choices":["腹部膨満感は嘔吐の前ぶれになりうる。何もせずに様子をみるのは不適切。","仰臥位にすると、胃の内容物が逆流し、嘔吐や誤嚥を起こす危険が高まる。注入中・注入後しばらくは上半身を起こした姿勢を保つ。","姿勢のずれや衣類による腹部の圧迫がないかを確認する。","注入速度を速めると、腹部膨満感や嘔吐が悪化するおそれがある。","注入を終了するかどうかは、看護職員や医師と相談して判断すること。症状が強ければ注入を止めて相談するが、本事例では腹痛・嘔気はなく、まず原因を確認する段階である。"],"point":"経管栄養中の異常への対応は「まず自分で確認できること（姿勢・圧迫・速度）を確かめる→看護職員に報告・相談」の順。「速める」「仰臥位にする」「そのまま様子をみる」は誤りの定番。嘔吐や顔色の変化、呼吸の異常があるときは、すぐに注入を止めて看護職員に連絡する。","note":null}},{"id":"36-64","exam":36,"no":64,"subject":"介護の基本","group":1,"case":null,"stem":"介護を取り巻く状況に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ダブルケアとは，夫婦が助け合って子育てをすることである。","要介護・要支援の認定者数は，介護保険制度の導入時から年々減少している。","家族介護を支えていた家制度は，地域包括ケアシステムによって廃止された。","要介護・要支援の認定者のいる三世代世帯の構成割合は，介護保険制度の導入時から年々増加している。","家族が担っていた介護の役割は，家族機能の低下によって社会で代替する必要が生じた。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"核家族化や単身世帯の増加、女性の就労の広がりなどで、家族だけで介護を担う力（家族機能）は弱まった。その結果、介護を社会全体で支える必要が生じ、介護保険制度による「介護の社会化」が進められた。","choices":["ダブルケアは、育児と親などの介護を同じ時期に担うこと。夫婦の子育ての協力を指す言葉ではない。","要介護・要支援の認定者数は、制度開始（2000年）以降おおむね増え続けている。","家制度は、戦後の民法改正（1947年）で廃止された。地域包括ケアシステムとは関係がない。","三世代世帯の割合は、制度開始以降減少している。増えているのは単独世帯や夫婦のみの世帯。","家族機能の低下により、介護の役割を社会で代わって担う必要が生じた。"],"point":"介護を取り巻く統計は「認定者数・高齢者人口・単独世帯・夫婦のみ世帯は増加」「三世代世帯は減少」の向きで判断する。ダブルケア（育児＋介護）とヤングケアラー（子どもが家族を介護）、老老介護・認認介護もあわせて区別しておく。","note":null}},{"id":"36-65","exam":36,"no":65,"subject":"介護の基本","group":1,"case":null,"stem":"介護福祉士に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["傷病者に対する療養上の世話又は診療の補助を業とする。","喀痰吸引を行うときは市町村の窓口に申請する。","業務独占の資格である。","資格を更新するために5年ごとに研修を受講する。","信用を傷つけるような行為は禁止されている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"社会福祉士及び介護福祉士法は、介護福祉士の信用を傷つけるような行為を禁止している（信用失墜行為の禁止）。誠実義務、秘密保持義務、連携、資質向上の責務とあわせて、介護福祉士の義務として定められている。","choices":["療養上の世話または診療の補助を業とするのは看護師（保健師助産師看護師法）。介護福祉士の定義ではない。","喀痰吸引は、介護福祉士が実地研修を修了したうえで、事業所が都道府県に登録（登録喀痰吸引等事業者）して行う。市町村の窓口に申請するしくみではない。","介護福祉士は名称独占の資格。資格がなくても介護の業務はできるが、「介護福祉士」と名乗ることはできない。","介護福祉士の資格に更新制度はない。ただし資質向上に努める責務はある。","信用失墜行為の禁止が定められている。"],"point":"介護福祉士の義務は「誠実義務・信用失墜行為の禁止・秘密保持義務・連携・資質向上の責務」の5つで覚え、資格のない人が「介護福祉士」と名乗れない「名称の使用制限（第48条）」もあわせて押さえる。秘密保持義務は資格を離れた後も続き、違反には罰則がある。「業務独占」「更新制」は誤りの定番。","note":null}},{"id":"36-66","exam":36,"no":66,"subject":"介護の基本","group":1,"case":null,"stem":"施設利用者の個人情報の保護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["職員がすべての個人情報を自由に閲覧できるように，パスワードを共有する。","個人情報を記載した書類は，そのまま新聞紙と一緒に捨てる。","個人情報保護に関する研修会を定期的に開催し，意識の向上を図る。","職員への守秘義務の提示は，採用時ではなく退職時に書面で行う。","利用者の音声情報は，同意を得ずに使用できる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"個人情報の保護は、職員一人ひとりの意識と知識に支えられる。研修会を定期的に開いて、取り扱いのルールや漏えいの危険を繰り返し確認することが、組織としての適切な対策になる。","choices":["個人情報は業務に必要な範囲の職員だけが見られるようにする。パスワードの共有は、だれが見たか分からなくなり、漏えいの原因になる。","個人情報を記載した書類は、シュレッダーにかけるなど、読めない状態にして廃棄する。","定期的な研修で職員の意識を高めることは適切。","守秘義務は採用時に書面で示し、在職中も退職後も守ることを確認する。退職時だけでは在職中の保護にならない。","音声も個人を識別できる個人情報になりうる。使用する際は本人の同意を得る。"],"point":"個人情報の問題は「必要最小限の人だけが扱う」「目的外に使うときは本人の同意」「廃棄は読めない状態で」の3点で判断する。写真・音声・映像も個人情報になりうることに注意する。","note":null}},{"id":"36-67","exam":36,"no":67,"subject":"介護の基本","group":1,"case":null,"stem":"個別性や多様性を踏まえた介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["その人らしさは，障害特性から判断する。","生活習慣は，生活してきた環境から理解する。","生活歴は，成人期以降の情報から収集する。","生活様式は，同居する家族と同一にする。","衣服は，施設の方針によって統一する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"生活習慣は、その人が育ち、暮らしてきた地域・家庭・職業などの環境の中で形づくられる。生活してきた環境を知ることで、その人の習慣の意味を理解し、個別性を尊重した介護につなげられる。","choices":["その人らしさは、障害特性だけでなく、価値観・生活歴・好みなどから総合的に理解する。障害特性だけで判断するのは個別性の軽視になる。","生活習慣は、生活してきた環境から理解する。","生活歴は、子ども時代を含めた生涯の情報から理解する。成人期以降に限ると、価値観の土台になった経験を見落とす。","生活様式は本人のものを尊重する。同居する家族に合わせて同一にする必要はない。","衣服は本人の好みや習慣に合わせて選ぶ。施設の方針で統一するのは個別性に反する。"],"point":"個別性・多様性の問題では、「統一する」「同一にする」「〜だけから判断する」という言い方は誤りになりやすい。本人の生活歴・価値観・環境から全体的に理解する選択肢を選ぶ。","note":null}},{"id":"36-68","exam":36,"no":68,"subject":"介護の基本","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（48歳，女性，要介護1）は，若年性認知症（dementia with early onset）で，夫，長女（高校1年生）と同居している。<b>Ａ<\/b>さんは家族と過ごすことを希望し，小規模多機能型居宅介護で通いを中心に利用を始めた。<b>Ａ<\/b>さんのことが心配な長女は，部活動を諦めて学校が終わるとすぐに帰宅していた。<br>ある日，夫が，「長女が，学校の先生たちにも相談しているが，今の状況をわかってくれる人がいないと涙を流すことがある」と介護福祉職に相談をした。<br>夫の話を聞いた介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["長女に，掃除や洗濯の方法を教える。","家族でもっと頑張るように，夫を励ます。","同じような体験をしている人と交流できる場について情報を提供する。","介護老人福祉施設への入所の申込みを勧める。","介護支援専門員（ケアマネジャー）に介護サービスの変更を提案する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"長女は母親の介護のために部活動を諦め、周りにわかってくれる人がいないと悩んでいる（ヤングケアラーの状態）。同じような立場の人と気持ちを分かち合える場（ピアサポート、家族会など）の情報を提供することで、孤立感をやわらげることが期待できる。","choices":["家事の方法を教えると、長女の負担をさらに増やすことになり、悩みの解決にならない。","「もっと頑張る」よう励ますのは、すでに負担を抱えている家族を追いつめる。","同じような体験をしている人と交流できる場の情報を提供する。","Ａさんは家族と過ごすことを希望している。本人の意向を無視して施設入所を勧めるのは不適切。","サービスの見直しが必要になることはあるが、今回の相談の中心は「わかってくれる人がいない」という長女の気持ちである。まず長女の孤立感に応える支援が優先される。"],"point":"家族支援の事例では、相談の「中心にある気持ち」を読み取る。孤立感・理解者がいない悩みには、ピアサポートや家族会など同じ立場の人とつながる場の情報提供が合う。本人の希望に反する施設入所の勧めや、家族への「頑張れ」は誤りの定番。","note":null}},{"id":"36-69","exam":36,"no":69,"subject":"介護の基本","group":1,"case":null,"stem":"<b>Ｂ<\/b>さん（61歳，男性，要介護3）は，脳梗塞（cerebral infarction）による左片麻痺がある。週2回訪問介護（ホームヘルプサービス）を利用し，妻（58歳）と二人暮らしである。自宅での入浴が好きで，妻の介助を受けながら，毎日入浴している。サービス提供責任者に，<b>Ｂ<\/b>さんから，「浴槽から立ち上がるのがつらくなってきた。何かいい方法はないですか」と相談があった。<br><b>Ｂ<\/b>さんへのサービス提供責任者の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ｂ<\/b>さんがひとりで入浴できるように，自立生活援助の利用を勧める。","浴室を広くするために，居宅介護住宅改修費を利用した改築を勧める。","妻の入浴介助の負担が軽くなるように，行動援護の利用を勧める。","入浴補助用具で本人の力を生かせるように，特定福祉用具販売の利用を勧める。","<b>Ｂ<\/b>さんが入浴を継続できるように，通所介護（デイサービス）の利用を勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"浴槽からの立ち上がりがつらいという相談には、浴槽内いすや浴槽用手すりなどの入浴補助用具が役立つ。入浴補助用具は介護保険の特定福祉用具販売の対象で、本人の力を生かしながら、自宅での入浴を続けられる。","choices":["自立生活援助は障害者総合支援法のサービスで、施設やグループホームなどから一人暮らしに移行した人の定期的な訪問・相談を行うもの。入浴の困りごとへの対応ではない。","介護保険の住宅改修は、手すりの取付け、段差の解消などに限られ、浴室を広くする改築は対象にならない。また、立ち上がりの困難には用具で対応できる。","行動援護は障害者総合支援法のサービスで、知的障害や精神障害により行動上著しい困難がある人の外出時の支援などを行う。入浴介助のサービスではない。","入浴補助用具で本人の力を生かせるよう、特定福祉用具販売の利用を勧める。","Ｂさんは自宅での入浴が好きで、立ち上がりの方法を相談している。通所介護での入浴に切り替える提案は、本人の希望に沿わない。"],"point":"介護保険の福祉用具は「貸与（車いす・特殊寝台・手すりなど）」と「販売（入浴補助用具・腰掛便座など肌に触れるもの）」に分けて覚える。浴槽内いす・入浴台・浴槽用手すりは特定福祉用具販売。障害者総合支援法のサービス名（自立生活援助・行動援護など）を混ぜたひっかけにも注意。","note":null}},{"id":"36-70","exam":36,"no":70,"subject":"介護の基本","group":1,"case":null,"stem":"社会奉仕の精神をもって，住民の立場に立って相談に応じ，必要な援助を行い，社会福祉の増進に努める者として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["民生委員","生活相談員","訪問介護員（ホームヘルパー）","通所介護職員","介護支援専門員（ケアマネジャー）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"民生委員法第1条は、民生委員を「社会奉仕の精神をもつて、常に住民の立場に立つて相談に応じ、及び必要な援助を行い、もつて社会福祉の増進に努めるもの」と定めている。問題文はこの条文に当たる。","choices":["民生委員法に定められた民生委員の役割である。","生活相談員は、通所介護や特別養護老人ホームなどで利用者・家族の相談や連絡調整を行う職員で、法律で問題文のように定められた者ではない。","訪問介護員は、利用者の居宅で身体介護や生活援助を行う。","通所介護職員は、通所介護事業所で利用者の介護などを行う。","介護支援専門員は、ケアプランの作成やサービス事業者との連絡調整を行う。"],"point":"「社会奉仕の精神」「住民の立場に立って」がキーワード。民生委員は厚生労働大臣が委嘱し、給与はない（非常勤の特別職の地方公務員）。民生委員は児童委員を兼ねる（児童福祉法）こともあわせて覚える。","note":null}},{"id":"36-71","exam":36,"no":71,"subject":"介護の基本","g
