内水氾濫」の図記号である。洪水で警戒レベル3（高齢者等避難）が出たときは、避難に時間がかかる高齢者等の避難を始める。3階建ての施設では、利用者を上の階へ移動させる垂直避難が有効な手段になる。","choices":["玄関のドアを開けたままにするのは、地震で建物がゆがみ、ドアが開かなくなるのを防ぐための対策。洪水では浸水の原因になりうる。","初期消火は火災への対応である。","洪水では上の階への垂直避難を誘導する。","安否の連絡は必要だが、警戒レベル3の段階では利用者の避難を最優先する。","家具などの固定は、地震に備える平時の対策である。"],"point":"警戒レベルは5段階で、レベル3＝高齢者等避難、レベル4＝避難指示（全員避難）、レベル5＝緊急安全確保。災害の種類ごとに行動を分ける（洪水＝高い所へ、地震＝家具の固定・出口の確保、火災＝初期消火）。図記号が何の災害かを先に読み取る。","note":null}},{"id":"36-72","exam":36,"no":72,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護における感染症対策として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["手洗いは，液体石鹸よりも固形石鹸を使用する。","配膳時にくしゃみが出たときは，口元をおさえた手でそのまま行う。","嘔吐物の処理は，素手で行う。","排泄の介護は，利用者ごとに手袋を交換する。","うがい用のコップは，共用にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"排泄の介護では、手袋に便や尿の病原体が付着する。利用者ごとに手袋を交換し、外した後は手洗いをすることで、利用者間の感染を防ぐ。","choices":["固形石鹸は、ぬれたまま置かれると菌が増えやすく、共用で汚染が広がるおそれがある。手洗いには液体石鹸が適している。","くしゃみを押さえた手には病原体が付着している。手を洗ってから配膳する。くしゃみや咳は、ティッシュや袖で口や鼻を覆う（咳エチケット）。","嘔吐物にはノロウイルスなどの病原体が含まれることがある。使い捨ての手袋・マスク・エプロンを着けて処理する。","排泄の介護は、利用者ごとに手袋を交換する。","うがい用のコップを共用すると、唾液を介して感染が広がる。利用者ごとに個別のものを使う。"],"point":"感染対策は標準予防策（スタンダードプリコーション）が基本で、血液・体液・排泄物・嘔吐物は感染の可能性があるものとして扱う。「1ケア1手洗い」「利用者ごとに手袋交換」「共用しない」を判断の軸にする。","note":null}},{"id":"36-73","exam":36,"no":73,"subject":"介護の基本","group":1,"case":null,"stem":"介護福祉士が行う服薬の介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["服薬時間は，食後に統一する。","服用できずに残った薬は，介護福祉士の判断で処分する。","多種類の薬を処方された場合は，介護福祉士が一包化する。","内服薬の用量は，利用者のその日の体調で決める。","副作用の知識をもって，服薬の介護を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"介護福祉士は、医師・薬剤師の指示どおりに服薬できるよう支援する立場にある。薬の主な副作用を知っておくことで、服薬後の変化（ふらつき、眠気、発疹など）に気づき、医療職に早く報告できる。","choices":["服薬時間（食前・食後・食間・就寝前など）は、薬ごとに医師が指示する。介護側の都合で統一してはいけない。","残った薬は自己判断で処分せず、医師・看護師・薬剤師に報告して指示を受ける。","一包化は、医師の指示に基づいて薬剤師が行う。介護福祉士が行うことではない。","用量は医師が決める。体調に合わせて介護福祉士が変えてはならない。","副作用の知識をもって服薬の介護を行う。"],"point":"服薬の介護で「介護福祉士の判断で〜する」「統一する」は誤りの定番。介護福祉士の役割は、指示どおりの服薬の支援、服薬後の観察、異常時の医療職への報告と覚える。","note":null}},{"id":"36-74","exam":36,"no":74,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ｃ<\/b>さん（85歳，女性，要介護3）は，介護老人保健施設に入所しており，軽度の難聴がある。数日前から，職員は感染症対策として日常的にマスクを着用して勤務することになった。<br>ある日，<b>Ｄ<\/b>介護福祉職が<b>Ｃ<\/b>さんの居室を訪問すると，「孫が絵を描いて送ってくれたの」と笑いながら絵を見せてくれた。<b>Ｄ<\/b>介護福祉職は<b>Ｃ<\/b>さんの言動に共感的理解を示すために，意図的に非言語コミュニケーションを用いて対応した。<br>このときの<b>Ｄ<\/b>介護福祉職の<b>Ｃ<\/b>さんへの対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「よかったですね」と紙に書いて渡した。","目元を意識した笑顔を作り，大きくうなずいた。","「お孫さんの絵が届いて，うれしかったですね」と耳元で話した。","「私もうれしいです」と，ゆっくり話した。","「えがとてもじょうずです」と五十音表を用いて伝えた。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"マスクで口元が隠れていても、目元の表情は相手に伝わる。目元を意識した笑顔と大きなうなずきは、言葉を使わずに「うれしい気持ちを一緒に感じている」ことを示す非言語コミュニケーションであり、難聴があるＣさんにも伝わりやすい。","choices":["紙に書いた文字は言語コミュニケーション（書き言葉）である。","目元の笑顔とうなずきは、非言語コミュニケーションで共感を伝える方法。","話し言葉による言語コミュニケーションである。","話す速さは準言語として非言語的な要素を含むが、伝えている中心は「私もうれしいです」という言葉であり、問題の求める「意図的な非言語コミュニケーション」には当たらない。","五十音表で言葉を伝えるのは言語コミュニケーションである。"],"point":"言語＝話し言葉・書き言葉・文字盤・五十音表・手話など「言葉」を使うもの。非言語＝表情・視線・うなずき・身ぶり・姿勢・距離・接触、そして準言語（声の大きさ・速さ・トーン）。マスク着用時は目元の表情や身ぶりを大きくして補う。","note":null}},{"id":"36-75","exam":36,"no":75,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"利用者の家族との信頼関係の構築を目的としたコミュニケーションとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["家族に介護技術を教える。","家族に介護をしている当事者の会に参加することを提案する。","家族から介護の体験を共感的に聴く。","家族に介護を続ける強い気持ちがあるかを質問する。","家族に介護保険が使える範囲を説明する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"家族との信頼関係は、家族の思いや苦労を受け止めてもらえたと家族が感じることから築かれる。家族が語る介護の体験を共感的に聴くことが、関係づくりの出発点になる。","choices":["介護技術を教えることは家族支援の一つだが、信頼関係の構築を目的としたコミュニケーションではない。関係ができる前に教えると、責められていると感じさせるおそれもある。","当事者の会の紹介は社会資源の情報提供であり、信頼関係づくりそのものではない。","家族の介護体験を共感的に聴くことが信頼関係の基盤になる。","介護を続ける意思を問いただすと、家族に圧力や不信感を与える。","制度の説明は情報提供であり、信頼関係づくりを目的としたものではない。"],"point":"「信頼関係の構築（ラポール形成）」を問われたら、まず相手の思いを受け止める・共感的に聴く選択肢を選ぶ。教える・説明する・提案するは、関係ができた後の支援として区別する。","note":null}},{"id":"36-76","exam":36,"no":76,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ｅ<\/b>さん（70歳，女性）は，脳梗塞（cerebral infarction）の後遺症で言語に障害がある。発語はできるが，話したいことをうまく言葉に言い表せない。聴覚機能に問題はなく，日常会話で使用する単語はだいたい理解できるが，単語がつながる文章になるとうまく理解できない。ある日，<b>Ｅ<\/b>さんに介護福祉職が，「お風呂は，今日ではなくあしたですよ」と伝えると，<b>Ｅ<\/b>さんはしばらく黙って考え，理解できない様子だった。<br>このとき，<b>Ｅ<\/b>さんへの介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「何がわからないのか教えてください」と質問する。","「お風呂，あした」と短い言葉で伝える。","「今日，お風呂に入りたいのですね」と確かめる。","「あしたがお風呂の日で，今日は違いますよ」と言い換える。","「お・ふ・ろ・は・あ・し・た」と1音ずつ言葉を区切って伝える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Ｅさんは単語は理解できるが、文章になると理解が難しい。伝えたい内容を「お風呂、あした」のように、重要な単語だけの短い言葉にすると理解しやすい。","choices":["言葉で説明するのが難しい人に、何がわからないかを言葉で説明させるのは負担が大きい。","重要な単語を短く伝えると理解しやすい。","Ｅさんは入浴したいと言っていない。介護福祉職の推測で確認しても、伝えたい内容は伝わらない。","言い換えても文章の長さは変わらず、理解の難しさは解消されない。","1音ずつ区切ると単語としてのまとまりが失われ、かえって意味がわかりにくくなる。聴覚に問題はないので、ゆっくり区切る必要もない。"],"point":"失語症の人には「短い文・具体的な単語で」「絵や実物、身ぶりを添える」「答えやすい質問（はい・いいえ）」が基本。1音ずつ区切る、五十音表を使うは失語症には向かないことが多い（文字や音の理解も障害されうるため）。構音障害（言葉は理解できるが発音が難しい）への対応と区別する。","note":null}},{"id":"36-77","exam":36,"no":77,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ｆ<\/b>さん（70歳，女性）は，最近，抑うつ状態（depressive state）にあり，ベッドに寝ていることが多く，「もう死んでしまいたい」とつぶやいていた。<br><b>Ｆ<\/b>さんの発言に対する，介護福祉職の言葉かけとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「落ちこんだらだめですよ」","「とてもつらいのですね」","「どうしてそんなに寝てばかりいるのですか」","「食堂へおしゃべりに行きましょう」","「元気を出して，頑張ってください」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"抑うつ状態の人には、励ましたり否定したりせず、つらい気持ちをそのまま受け止めることが大切である。「とてもつらいのですね」と気持ちを言葉にして返すことで、理解しようとしている姿勢が伝わる。","choices":["落ちこむことを否定すると、気持ちをわかってもらえないと感じさせ、さらに追いつめる。","つらい気持ちを受け止める共感的な言葉かけである。","寝てばかりいる理由を問いただすと、責められていると感じさせる。","本人の気持ちを受け止めないまま活動に誘うのは、抑うつ状態の人には負担になる。","「頑張って」という励ましは、頑張れない自分を責めることにつながりやすく、抑うつ状態の人には避ける。"],"point":"抑うつ状態の人への対応は「励まさない・否定しない・問いつめない・気持ちを受け止める」。「死にたい」という発言は聞き流さず、気持ちを受け止めたうえで、医療職などチームで共有する。","note":null}},{"id":"36-78","exam":36,"no":78,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ｇ<\/b>さん（70歳，女性，要介護1）は，有料老人ホームに入居していて，網膜色素変性症（retinitis pigmentosa）による夜盲がある。ある日の夕方，<b>Ｇ<\/b>さんがうす暗い廊下を歩いているのを<b>Ｈ<\/b>介護福祉職が発見し，「<b>Ｈ<\/b>です。大丈夫ですか」と声をかけた。<b>Ｇ<\/b>さんは，「びっくりした。見えにくくて，わからなかった…」と暗い表情で返事をした。<br>このときの<b>Ｇ<\/b>さんに対する<b>Ｈ<\/b>介護福祉職の受容的な対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「驚かせてしまいましたね。一緒に歩きましょうか」","「明るいところを歩きましょう。電気をつけたほうがいいですよ」","「見えにくくなってきたのですね。一緒に点字の練習を始めましょう」","「白杖があるかを確認しておきます。白杖を使うようにしましょう」","「暗い顔をしないでください。頑張りましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"受容的な対応とは、相手の気持ちや状況をそのまま受け止めること。突然声をかけて驚かせたことを受け止めて伝え、見えにくい状況に寄り添って一緒に歩くことを提案するのが、Ｇさんの気持ちに沿った対応になる。","choices":["驚かせたことを受け止め、不安な状況に寄り添って同行を申し出ている。","電気をつけるという指示であり、Ｇさんの気持ちを受け止めていない。","見えにくさを受け止める言葉はあるが、本人の気持ちを確かめないまま点字の練習を始めようとしている。夜盲で見えにくいことと点字が必要になることは別である。","白杖の使用を一方的に求めており、Ｇさんの今の気持ちを受け止めていない。","暗い表情を否定しており、受容とは反対の対応である。"],"point":"「受容的な対応」は、相手の気持ちや状況を否定せず受け止める言葉を含む選択肢を選ぶ。指示・助言・訓練の提案（電気をつけて、点字を、白杖を）は、受容の前に先回りした対応として誤りになりやすい。視覚障害の人には、声をかけるときに名前を名乗り、驚かせない工夫をする。","note":null}},{"id":"36-79","exam":36,"no":79,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"事例検討の目的に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["家族に介護計画を説明し，同意を得る。","上司に利用者への対応の結果を報告し，了解を得る。","介護計画の検討をとおして，チームの交流を深める。","チームで事例の課題を共有し，解決策を見いだす。","各職種の日頃の悩みを共有する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"事例検討は、チームのメンバーが一つの事例について情報を出し合い、課題を共有して、よりよい支援の方法（解決策）を見いだすために行う。","choices":["家族への介護計画の説明と同意は、介護計画の作成・実施の過程で行うことで、事例検討の目的ではない。","上司への報告と了解は、報告・連絡・相談の場面であり、事例検討の目的ではない。","チームの交流が深まることはあるが、それは副次的な効果であり、目的ではない。","チームで事例の課題を共有し、解決策を見いだすことが目的。","職員の悩みの共有は、事例検討の目的ではない（スーパービジョンや職場の支援で扱う）。"],"point":"会議の種類と目的を区別する。事例検討＝事例の課題共有と解決策の検討、サービス担当者会議＝ケアプラン原案の検討と情報共有、申し送り＝勤務交代時の情報伝達。「交流を深める」「悩みを共有する」は副次的な効果として誤りになりやすい。","note":null}},{"id":"36-80","exam":36,"no":80,"subject":"生活支援技術","group":4,"case":null,"stem":"介護老人福祉施設における，レクリエーション活動に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者全員が参加することを重視する。","毎回，異なるプログラムを企画する。","プログラムに買い物や調理も取り入れる。","利用者の過去の趣味を，プログラムに取り入れることは避ける。","地域のボランティアの参加は，遠慮してもらう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"レクリエーションは娯楽だけでなく、生活を豊かにする活動全体を含む。買い物や調理は、楽しみに加えて、これまでの生活の役割や能力を生かせる活動であり、施設のレクリエーションとして取り入れる意義がある。","choices":["参加は本人の自由意思による。全員参加を重視すると、参加したくない人に無理をさせることになる。","毎回異なるプログラムにする必要はない。なじみのある活動を続けることで、安心して参加できる人もいる。","買い物や調理など、生活に結びついた活動も取り入れる。","過去の趣味は、本人が意欲をもって取り組める大切な手がかり。積極的に取り入れる。","地域のボランティアの参加は、施設と地域のつながりや交流の機会になる。遠慮してもらう理由はない。"],"point":"レクリエーションの問題は「本人の自由意思」「なじみ・生活歴の活用」「生活行為も含む」「地域との交流」が正解の方向。「全員参加」「避ける」「遠慮してもらう」は誤りの定番。","note":null}},{"id":"36-81","exam":36,"no":81,"subject":"生活支援技術","group":4,"case":null,"stem":"関節リウマチ（rheumatoid arthritis）で，関節の変形や痛みがある人への住まいに関する介護福祉職の助言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["手すりは，握らずに利用できる平手すりを勧める。","いすの座面の高さは，低いものを勧める。","ベッドよりも，床に布団を敷いて寝るように勧める。","部屋のドアは，開き戸を勧める。","2階建ての家の場合，居室は2階にすることを勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"関節リウマチでは手指の関節の変形や痛みがあり、手すりを握ることが難しい。平手すりは、手のひらや前腕をのせて体を支えられるため、握らずに使える。","choices":["握らずに使える平手すりは、手指に負担をかけない。","座面が低いと、立ち上がるときに膝や股関節に大きな負担がかかる。座面は高めのものがよい。","床からの立ち上がりは関節への負担が大きい。ベッドのほうが起き上がりや立ち上がりが楽になる。","開き戸はドアノブを握って回し、体を前後に移動させる必要がある。引き戸のほうが関節への負担が少ない。","階段の昇り降りは膝などの関節に負担がかかる。居室は1階にするほうがよい。"],"point":"関節リウマチの住まいは「関節に負担をかけない」が判断の軸。高めのいす・ベッド、平手すり、引き戸、レバーハンドル、1階の居室、と対で覚える。朝のこわばりがあることもあわせて押さえる。","note":null}},{"id":"36-82","exam":36,"no":82,"subject":"生活支援技術","group":4,"case":null,"stem":"心身機能が低下した高齢者の住環境の改善に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["玄関から道路までは，コンクリートから砂利敷きにする。","扉の取っ手は，レバーハンドルから丸いドアノブにする。","階段の足が乗る板と板の先端部分は，反対色から同系色にする。","車いすを使用する居室の床は，畳から板製床材（フローリング）にする。","浴槽は，和洋折衷式から洋式にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"畳は車いすの車輪が沈んだり、こすれて傷んだりして、移動しにくい。板製床材（フローリング）にすると、車いすが動かしやすくなる。","choices":["砂利敷きは足元が不安定で、つまずきやすく、車いすや杖も使いにくい。","丸いドアノブは握って回す必要があり、手の力が弱い人には使いにくい。レバーハンドルのほうが使いやすい。","踏み板と先端部分は、反対色など色の差をつけると段の境目が見えやすく、踏み外しを防げる。同系色にすると見分けにくくなる。","車いすを使う居室の床はフローリングにする。","洋式浴槽は浅く長いため、湯の中で体が伸びて滑りやすく、立ち上がりにくい。高齢者には膝を軽く曲げて入れる和洋折衷式が適している。"],"point":"住環境の改善は「ある状態から別の状態にする」形の選択肢が多く、どちらが安全かを比べる。安全な側は、平らで固い通路、レバーハンドル、段差の色分け、フローリング（車いす）、和洋折衷式浴槽。","note":null}},{"id":"36-83","exam":36,"no":83,"subject":"生活支援技術","group":4,"case":null,"stem":"仰臥位（背臥位）から半座位（ファーラー位）にするとき，ギャッチベッドの背上げを行う前の介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["背部の圧抜きを行う。","臀部をベッド中央部の曲がる部分に合わせる。","ベッドの高さを最も低い高さにする。","利用者の足がフットボードに付くまで水平移動する。","利用者のからだをベッドに対して斜めにする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"ギャッチベッドは、背上げの曲がる部分と体の股関節の位置が合っていないと、体がずれたり腹部が圧迫されたりする。背上げの前に、臀部をベッドの曲がる部分に合わせておく。","choices":["背部の圧抜きは、背上げを行った後に、背中とマットレスの間に生じたずれや圧迫を解消するために行う。","臀部をベッドの曲がる部分に合わせてから背上げする。","ベッドの高さは、介護者が腰を曲げずに作業できる高さにする。最も低くすると介護者の腰に負担がかかる。","足がフットボードに付くまで移動させると、臀部の位置がベッドの曲がる部分からずれてしまう。","体を斜めにすると、背上げしたときに体が傾き、ずれや転落の原因になる。体はベッドに対してまっすぐにする。"],"point":"背上げの手順は「臀部（股関節）を曲がる部分に合わせる→足側を少し上げる→背上げ→圧抜き」の順で覚える。圧抜きは背上げの「後」に行う点がひっかけになりやすい。","note":null}},{"id":"36-84","exam":36,"no":84,"subject":"生活支援技術","group":4,"case":null,"stem":"回復期にある左片麻痺の利用者が，ベッドで端座位から立位になるときの基本的な介護方法に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者の右側に立つ。","利用者に，ベッドに深く座るように促す。","利用者に，背すじを伸ばして真上に立ち上がるように促す。","利用者の左側に荷重がかかるように支える。","利用者の左の膝頭に手を当てて保持し，膝折れを防ぐ。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"左片麻痺の人が立ち上がるとき、麻痺側の膝は力が入りにくく、膝折れを起こしやすい。介護者は麻痺側（左）に立ち、左の膝頭に手を当てて支えることで膝折れを防ぐ。","choices":["介護者は、転倒しやすい麻痺側（左側）に立つ。","ベッドに深く座ると足を引けず、前かがみになりにくい。浅く座り、足を引いてから立ち上がる。","真上に立ち上がろうとすると重心が前に移らず、後ろに倒れやすい。前かがみになって重心を足の上に移してから立ち上がる。","健側（右側）に荷重がかかるように支える。麻痺側に荷重をかけると膝折れや転倒の原因になる。","左の膝頭に手を当てて保持し、膝折れを防ぐ。"],"point":"立ち上がりの基本は「浅く座る→足を引く→前かがみ→立つ」。片麻痺の介護では「介護者は麻痺側に立つ」「荷重は健側に」「麻痺側の膝折れに注意」をセットで覚える。","note":null}},{"id":"36-85","exam":36,"no":85,"subject":"生活支援技術","group":4,"case":null,"stem":"標準型車いすを用いた移動の介護に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["急な上り坂は，すばやく進む。","急な下り坂は，前向きで進む。","踏切を渡るときは，駆動輪を上げて進む。","エレベーターに乗るときは，正面からまっすぐに進む。","段差を降りるときは，前輪から下りる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"エレベーターでは、正面からまっすぐ進むと、すき間や溝に前輪（キャスター）が斜めに入らず、安全に乗り込める。中で方向転換できない場合は、降りるときに後ろ向きで出る。","choices":["急な上り坂は、後ろに戻らないように、ゆっくり、しっかり押して進む。すばやく進むと利用者に不安を与え、危険である。","急な下り坂は、後ろ向きで進む。前向きだと利用者が前に投げ出されるおそれがある。","踏切は、前輪（キャスター）を上げて進む。キャスターがレールの溝にはまるのを防ぐためで、駆動輪（後輪）を上げるのではない。","エレベーターは正面からまっすぐ進む。","段差を降りるときは、後ろ向きになり後輪から降りる。前輪から降りると利用者が前に投げ出されるおそれがある。"],"point":"車いすの移動は「下りは後ろ向き（急な坂・段差）」「上りの段差・溝はキャスターを上げる」「坂はゆっくり」で判断する。前輪（キャスター）と駆動輪（後輪）の入れ替えがひっかけの型。","note":null}},{"id":"36-86","exam":36,"no":86,"subject":"生活支援技術","group":4,"case":null,"stem":"医学的管理の必要がない高齢者の爪の手入れに関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["爪は，入浴の前に切る。","爪の先の白い部分は，残らないように切る。","爪は，一度にまっすぐ横に切る。","爪の両端は，切らずに残す。","爪切り後は，やすりをかけて滑らかにする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"爪を切った後の切り口はとがっていて、皮膚を傷つけたり衣類に引っかかったりする。やすりをかけて滑らかにしておくと、けがや爪の割れを防げる。","choices":["爪は、入浴後など爪が水分を含んでやわらかくなっているときに切ると、割れにくい。","白い部分を残さず切ると深爪になり、痛みや炎症の原因になる。白い部分を少し残す。","一度に切ると爪が割れやすい。少しずつ切る。","両端を切らずに残すと、角がとがって皮膚を傷つけたり、引っかかったりする。まっすぐ切った後、角は少し切るかやすりで整える。","爪切り後はやすりをかけて滑らかにする。"],"point":"爪切りは「入浴後に・少しずつ・白い部分を少し残す・角を整えてやすり」で覚える。介護福祉職が行えるのは、爪や周囲の皮膚に異常がなく、糖尿病などで専門的な管理が必要でない場合に限られる。","note":null}},{"id":"36-87","exam":36,"no":87,"subject":"生活支援技術","group":4,"case":null,"stem":"左片麻痺の利用者が，端座位でズボンを着脱するときの介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["最初に，左側の腰を少し上げて脱ぐように促す。","右膝を高く上げて，脱ぐように促す。","左足を右の大腿の上にのせて，ズボンを通すように促す。","立ち上がる前に，ズボンを膝下まで上げるように促す。","介護福祉職は右側に立って，ズボンを上げるように促す。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"端座位で麻痺側の足にズボンを通すときは、健側の手で麻痺側（左）の足を持ち上げて健側（右）の大腿の上にのせると、足先が床から離れてズボンを通しやすい。","choices":["ズボンは「脱健着患」で、健側（右側）から脱ぐのが基本。最初に麻痺側の左の腰から脱ぐのは原則に合わない。","健側の右膝を高く上げると、支えになる足がなくなって座位のバランスを崩し、転倒の危険がある。","麻痺側の足を健側の大腿にのせてズボンを通す。","立ち上がる前に、ズボンはできるだけ上（大腿部）まで上げておく。膝下までだと、立位で上げる量が多くなり、立っている時間が長くなって不安定になる。","介護福祉職は、転倒しやすい麻痺側（左側）に立って支える。"],"point":"着脱は「脱健着患（脱ぐのは健側から、着るのは患側から）」と「介護者は麻痺側に立つ」の2つで多くの選択肢を判断できる。立位の時間を短くする工夫（座ったまま大腿まで上げておく）もあわせて覚える。","note":null}},{"id":"36-88","exam":36,"no":88,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，嚥下機能の低下している利用者に提供するおやつとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["クッキー","カステラ","もなか","餅","プリン"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"プリンは、なめらかでまとまりがあり、口の中でばらけにくく、変形しながらのどを通るため、嚥下機能が低下した人にも食べやすい。","choices":["クッキーはパサパサして口の中でばらけやすく、唾液を吸ってまとまりにくいため、むせやすい。","カステラは水分が少なく、口の中でかたまりになったり、上あごに張りついたりしやすい。","もなかの皮は薄くて口の中に張りつきやすい。","餅は粘りが強く、のどに詰まりやすい。窒息の危険が高い食品である。","プリンはなめらかでまとまりがあり、飲み込みやすい。"],"point":"嚥下しやすい食品の条件は「まとまりやすい・なめらか・べたつかない・適度な粘度」。パサパサ（クッキー・パン）、張りつく（のり・もなか）、粘りが強い（餅）、さらさらの水分（むせやすい）は避ける。","note":null}},{"id":"36-89","exam":36,"no":89,"subject":"生活支援技術","group":4,"case":null,"stem":"介護老人福祉施設の介護福祉職が，管理栄養士と連携することが必要な利用者の状態として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者の食べ残しが目立つ。","経管栄養をしている利用者が嘔吐する。","利用者の食事中の姿勢が不安定である。","利用者の義歯がぐらついている。","利用者の摂食・嚥下の機能訓練が必要である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"食べ残しが目立つときは、食事の量・味付け・形態・好みなどが合っていない可能性があり、栄養状態にも影響する。栄養管理と献立の専門職である管理栄養士と連携して、原因と対応を検討する。","choices":["食べ残しは栄養面の課題につながるため、管理栄養士と連携する。","経管栄養中の嘔吐は医療的な対応が必要で、看護職員や医師への報告が優先される。","食事中の姿勢の不安定さは、理学療法士や作業療法士と連携して検討する。","義歯のぐらつきは、歯科医師や歯科衛生士と連携する。","摂食・嚥下の機能訓練は、言語聴覚士などと連携する。"],"point":"連携先は「何の専門職か」で選ぶ。栄養・献立＝管理栄養士、医療的な異常＝看護職員・医師、姿勢・動作＝理学療法士・作業療法士、嚥下訓練＝言語聴覚士、口腔・義歯＝歯科医師・歯科衛生士。","note":null}},{"id":"36-90","exam":36,"no":90,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，血液透析を受けている利用者への食事の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["塩分の多い食品をとるように勧める。","ゆでこぼした野菜をとるように勧める。","乳製品を多くとるように勧める。","水分を多くとるように勧める。","魚や肉を使った料理を多くとるように勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"血液透析を受けている人は、腎臓からカリウムを十分に排出できず、高カリウム血症（不整脈などの原因）になりやすい。野菜をゆでこぼすと、カリウムがゆで汁に溶け出して減らせる。","choices":["塩分をとると、のどが渇いて水分をとりすぎ、体重増加やむくみ、血圧上昇につながる。塩分は控える。","ゆでこぼした野菜でカリウムを減らす。","乳製品はリンを多く含む。リンがたまると骨がもろくなるなどの合併症の原因になるため、とりすぎに注意する。","尿がほとんど出ないことが多く、水分をとりすぎると体内にたまり、むくみや心不全の原因になる。水分は制限される。","たんぱく質は医師の指示に基づく適量とし、多くとるように勧めるものではない。肉や魚はリンも多い。"],"point":"透析の食事は「水分・塩分・カリウム・リンを控える」で覚える。カリウムを減らす調理法＝ゆでこぼし・水にさらす。生野菜・果物、乳製品は注意が必要な食品の例。","note":null}},{"id":"36-91","exam":36,"no":91,"subject":"生活支援技術","group":4,"case":null,"stem":"介護老人福祉施設の一般浴（個浴）で，右片麻痺の利用者が移乗台に座っている。その状態から安全に入浴をするための介護福祉職の助言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「浴槽に入るときは，右足から入りましょう」","「湯につかるときは，左膝に手をついてゆっくり入りましょう」","「浴槽内では，足で浴槽の壁を押すようにして姿勢を安定させましょう」","「浴槽内では，後ろの壁に寄りかかり足を伸ばしましょう」","「浴槽から出るときは，真上方向に立ち上がりましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"浴槽内では浮力で体が浮きやすく、姿勢が崩れやすい。足で浴槽の壁を押すようにすると、体が固定されて姿勢が安定する。","choices":["浴槽には健側（左足）から入る。健側で湯温を確かめられ、支えも安定する。","膝に手をつくと支えが不安定になる。健側の左手で手すりや浴槽のふちをつかみ、ゆっくり入る。","足で浴槽の壁を押して姿勢を安定させる。","足を伸ばして後ろに寄りかかると、浮力で体が浮いて滑り、溺れる危険がある。","真上方向に立ち上がると重心が足の上に移らず、後ろに倒れやすい。前かがみになってから立ち上がる。"],"point":"片麻痺の人の入浴は「健側から入る・健側の手で手すりを持つ・浴槽内は膝を曲げて足で壁を押す・前かがみで立つ」。浮力で体が浮く点（ずれ・溺水）をつねに意識する。","note":null}},{"id":"36-92","exam":36,"no":92,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，椅座位で足浴を行う介護方法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ズボンを脱いだ状態で行う。","湯温の確認は，介護福祉職より先に利用者にしてもらう。","足底は，足浴用容器の底面に付いていることを確認する。","足に付いた石鹸の泡は，洗い流さずに拭き取る。","足浴用容器から足を上げた後は，自然乾燥させる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"足底が容器の底に付いていると、足が安定して湯の中で落ち着ける。足が浮いたままだと姿勢が不安定になり、リラックスできない。","choices":["ズボンを脱ぐ必要はない。膝の上までまくり上げて行う。脱ぐと羞恥心や体の冷えにつながる。","湯温は、介護福祉職が先に確認してから、利用者にも確かめてもらう。感覚が鈍っている場合もあり、やけどを防ぐため。","足底が容器の底面に付いていることを確認する。","石鹸の泡は湯で洗い流す。残ると皮膚のかぶれや乾燥の原因になる。","足を上げた後は、指の間までしっかり水分を拭き取る。自然乾燥では体が冷え、指の間の湿り気が白癬などの原因になる。"],"point":"足浴・手浴の湯温は「介護者が先に確認→本人にも確認」。終わったら「洗い流す→指の間まで拭く」。足浴の後は爪がやわらかくなり、爪切りがしやすいこともあわせて覚える。","note":null}},{"id":"36-93","exam":36,"no":93,"subject":"生活支援技術","group":4,"case":null,"stem":"身体機能が低下している高齢者が，ストレッチャータイプの特殊浴槽を利用するときの入浴介護の留意点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護福祉職2名で，洗髪と洗身を同時に行う。","背部を洗うときは，側臥位にして行う。","浴槽に入るときは，両腕の上から固定ベルトを装着する。","浴槽では，首までつかるようにする。","浴槽につかる時間は，20分程度とする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"ストレッチャータイプの特殊浴槽では、利用者は仰向けで寝ている。背部を洗うときは側臥位にすると、背中や臀部を確認しながら洗える。","choices":["2人が洗髪と洗身を同時に行うと、ストレッチャー上の利用者の安全を見守る人がいなくなり、転落や表情・体調の変化を見落としやすい。一人が安全を確認しながら進める。","背部は側臥位にして洗う。","両腕の上から固定ベルトをかけると、腕を動かせず、体を支えたり異変を伝えたりできない。腕を締めつけないように装着する。","首までつかると、水圧で心臓や肺に負担がかかる。","身体機能が低下した人には、湯につかる時間は短くする。20分は長く、疲労や血圧の変動の原因になる。"],"point":"特殊浴槽の入浴は「安全の見守り」「体力の消耗を防ぐ短時間の入浴」「心肺への負担を避ける（首までつからない）」が判断の軸。体調変化を見逃さないことが最優先。","note":null}},{"id":"36-94","exam":36,"no":94,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ｊ<\/b>さん（84歳，女性，要介護3）は，認知症（dementia）があり，夫（86歳，要支援1）と二人暮らしである。<b>Ｊ<\/b>さんは尿意はあるが，夫の介護負担を軽減するため終日おむつを使用しており，尿路感染症（urinary tract infection）を繰り返していた。夫が体調不良になったので，<b>Ｊ<\/b>さんは介護老人福祉施設に入所した。<br><b>Ｊ<\/b>さんの尿路感染症（urinary tract infection）を予防する介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["尿の性状を観察する。","体温の変化を観察する。","陰部洗浄の回数を検討する。","おむつを使わないで，トイレに誘導する。","膀胱留置カテーテルの使用を提案する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"Ｊさんは尿意があるにもかかわらず、終日おむつを使っていたことが尿路感染症の原因の一つと考えられる。尿意を生かしてトイレに誘導し、おむつを外すことで、陰部が排泄物で汚れた状態が続くのを防げる。","choices":["尿の性状の観察は、尿路感染症の早期発見には役立つが、予防の介護ではない。","体温の観察も、発症に気づくための観察であり、予防の介護ではない。","陰部洗浄で清潔を保つことは大切だが、おむつを使い続けるかぎり根本的な原因は解消しない。","尿意を生かして、おむつを使わずトイレに誘導する。","膀胱留置カテーテルは、それ自体が尿路感染症の大きな原因になる。尿意がある人に提案するものではない。"],"point":"「予防」と「早期発見（観察）」を区別する。尿意がある人には、おむつではなくトイレでの排泄を支援するのが自立支援の基本であり、感染予防にもつながる。","note":null}},{"id":"36-95","exam":36,"no":95,"subject":"生活支援技術","group":4,"case":null,"stem":"夜間，自宅のトイレでの排泄が間に合わずに失敗してしまう高齢者への介護福祉職の助言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["水分摂取量を減らすように勧める。","終日，リハビリパンツを使用するように勧める。","睡眠薬を服用するように勧める。","泌尿器科を受診するように勧める。","夜間は，ポータブルトイレを使用するように勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"夜間にトイレまで間に合わないのは、寝室からトイレまでの距離や移動に時間がかかることが一因と考えられる。夜間だけベッドのそばにポータブルトイレを置くと、移動距離が短くなり、間に合いやすくなる。","choices":["水分を減らすと脱水や便秘の原因になる。高齢者は特に脱水に注意が必要。","終日のリハビリパンツの使用は、日中も含めて必要以上におむつ類に頼ることになり、自立を妨げ、自尊心を傷つけるおそれがある。","睡眠薬は医師が判断するもので、介護福祉職が勧めるものではない。また、ふらつきによる転倒の危険も高まる。","夜間頻尿などで受診が必要な場合もあるが、問題は「間に合わない」ことであり、まず環境の工夫で対応できる。受診を最初に勧める段階ではない。","夜間はポータブルトイレを使うように勧める。"],"point":"排泄の失敗には、原因（移動距離・衣服の着脱・尿意の伝え方など）を考えて、本人の力を生かす環境の工夫を選ぶ。「水分を減らす」「終日おむつ」は誤りの定番。","note":null}},{"id":"36-96","exam":36,"no":96,"subject":"生活支援技術","group":4,"case":null,"stem":"介護福祉職が行うことができる，市販のディスポーザブルグリセリン浣腸器を用いた排便の介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["浣腸液は，39℃～40℃に温める。","浣腸液を注入するときは，立位をとるように声をかける。","浣腸液は，すばやく注入する。","浣腸液を注入したら，すぐに排便するように声をかける。","排便がない場合は，新しい浣腸液を再注入する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"浣腸液は、直腸温（約37.5〜38℃）よりやや高い39〜40℃程度に温めて使う。冷たいと腸が急に刺激されて腹痛や血圧の変動を起こし、熱すぎると腸の粘膜を傷つける。","choices":["浣腸液は39〜40℃程度に温める。","立位で注入すると、管が直腸の壁に当たって粘膜を傷つける危険がある。左側臥位で行うのが基本。","すばやく注入すると、腸が急に刺激されて腹痛や便意だけが強くなる。ゆっくり注入する。","注入後すぐに排便すると、浣腸液だけが出てしまう。少し（数分程度）がまんしてから排便するよう声をかける。","排便がないときに介護福祉職の判断で再注入してはいけない。看護職員などに報告する。"],"point":"市販の浣腸器の使用は、一定の条件を満たせば医行為に当たらないとされ、介護福祉職が行える。「温度は40℃前後・左側臥位・ゆっくり注入・少し待って排便・再注入しない」で覚える。","note":null}},{"id":"36-97","exam":36,"no":97,"subject":"生活支援技術","group":4,"case":null,"stem":"訪問介護員（ホームヘルパー）が行う見守り的援助として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ゴミの分別ができるように声をかける。","利用者がテレビを見ている間に洗濯物を干す。","着られなくなった服を作り直す。","調理したものを盛り付け，食事を提供する。","冷蔵庫の中を整理し，賞味期限が切れた食品を捨てておく。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"見守り的援助は、利用者が自分でできるよう、そばで声かけや見守りをしながら一緒に行う援助で、自立支援・重度化防止のための身体介護に位置づけられる。ゴミの分別ができるように声をかけるのは、本人の力を生かす見守り的援助に当たる。","choices":["利用者が自分でできるように声をかける見守り的援助である。","利用者が関わらないまま洗濯物を干すのは、生活援助（代行）である。","衣類を作り直すのは、日常生活に必要な家事の範囲を超える。","盛り付けと配膳を訪問介護員が行うのは、生活援助（代行）である。","利用者の確認を得ずに食品を捨てるのは、本人の意思を無視した行為であり、見守り的援助でもない。"],"point":"見守り的援助かどうかは「利用者自身が行い、訪問介護員はそばで声かけ・見守り・一緒に行う」かで判断する。訪問介護員が代わりに行えば生活援助、利用者の参加があれば見守り的援助（身体介護）になる。","note":null}},{"id":"36-98","exam":36,"no":98,"subject":"生活支援技術","group":4,"case":null,"stem":"高齢者が靴下・靴を選ぶときの介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["靴下は，指つきのきついものを勧める。","靴下は，足底に滑り止めがあるものを勧める。","靴は，床面からつま先までの高さが小さいものを勧める。","靴は，踵のない脱ぎやすいものを勧める。","靴は，先端部に0.5～1 cm の余裕があるものを勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"靴の先端（つま先）に0.5〜1cm程度の余裕があると、歩くときに指が圧迫されず、指が自然に動いて踏ん張れる。余裕がないと指の変形や傷、余裕が大きすぎると靴の中で足が動いてつまずく原因になる。","choices":["指つきのきつい靴下は、血行を妨げ、指を圧迫する。","足底に滑り止めがある靴下は、すり足で歩く高齢者では床に引っかかり、つまずきの原因になることがある。","床面からつま先までの高さ（つま先の反り上がり）が小さいと、つま先が床に引っかかってつまずきやすい。適度な高さがあるものがよい。","踵のない靴は脱げやすく、足が安定しないため転倒の原因になる。踵を包む靴を選ぶ。","先端部に0.5〜1cmの余裕がある靴を勧める。"],"point":"高齢者の靴は「つま先に余裕・つま先が少し反り上がっている・踵がしっかりしている・軽い・面ファスナーで調整できる」で選ぶ。すり足・つまずきを防ぐ観点で判断する。","note":null}},{"id":"36-99","exam":36,"no":99,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ｋ<\/b>さん（77歳，女性，要支援2）は，もの忘れが目立ちはじめ，訪問介護（ホームヘルプサービス）を利用しながら夫と二人で生活している。訪問時，<b>Ｋ<\/b>さん夫婦から，「<b>Ｋ<\/b>さんがテレビショッピングで購入した健康食品が毎月届いてしまい，高額の支払いが発生して困っている」と相談があった。<br><b>Ｋ<\/b>さん夫婦に対する訪問介護員（ホームヘルパー）の発言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「健康食品は処分しましょう」","「クーリング・オフをしましょう」","「買い物は夫がするようにしましょう」","「契約内容を一緒に確認しましょう」","「テレビショッピングでの買い物はやめましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"定期購入の契約になっている可能性があり、まず何を、どのような条件で契約しているのかを確かめることが必要である。夫婦と一緒に契約内容を確認することで、本人の意思を尊重しながら、解約や消費生活センターへの相談など次の対応につなげられる。","choices":["処分しても契約は続き、支払いの問題は解決しない。本人の物を一方的に処分させることにもなる。","テレビショッピングなどの通信販売には、法律上のクーリング・オフ制度がない（返品は事業者が表示する返品特約に従い、特約の表示がなければ商品を受け取ってから8日以内は返品できる）。契約内容を確認しないまま勧めるのは不適切。","買い物を夫に任せるよう求めるのは、Ｋさんの自己決定を奪い、今の契約の問題も解決しない。","契約内容を一緒に確認する。","一方的に買い物をやめさせるのは、Ｋさんの楽しみや自己決定を奪う。今の契約の問題も解決しない。"],"point":"消費者被害の相談では、まず「契約内容の確認」、そのうえで消費生活センター（消費者ホットライン188）などにつなぐ。通信販売にはクーリング・オフ制度がない点はよく問われる（訪問販売・電話勧誘販売などとの違い）。","note":null}},{"id":"36-100","exam":36,"no":100,"subject":"生活支援技術","group":4,"case":null,"stem":"消化管ストーマを造設した利用者への睡眠の介護に関する記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["寝る前にストーマから出血がある場合は，軟膏を塗布する。","寝る前に，パウチに便がたまっていたら捨てる。","寝る前に，ストーマ装具を新しいものに交換する。","便の漏れが心配な場合は，パウチの上からおむつを強く巻く。","睡眠を妨げないように，パウチの観察は控える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"寝る前にパウチにたまった便を捨てておくと、睡眠中にパウチがふくらんで重くなったり、はがれて漏れたりするのを防げる。安心して眠れることにもつながる。","choices":["ストーマからの出血は、医療職に報告する。介護福祉職の判断で軟膏を塗ってはいけない。","寝る前にパウチの便を捨てておく。","装具の交換は、皮膚の状態や装具の種類に応じた間隔で行う。毎晩寝る前に交換する必要はなく、頻繁なはがし貼りは皮膚の負担になる。","おむつを強く巻くと、ストーマやパウチが圧迫され、便の流れが妨げられて、かえって漏れやストーマの損傷の原因になる。","睡眠中もパウチの状態（ふくらみ・漏れ）を観察する必要がある。"],"point":"ストーマの日常の介護は「便は早めに捨てる（パウチの3分の1〜半分程度が目安）」「出血・皮膚の異常は医療職へ」「圧迫しない」。異常への処置（軟膏など）は介護福祉職の判断で行わない。","note":null}},{"id":"36-101","exam":36,"no":101,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ｌ<\/b>さん（79歳，男性，要介護2）は，介護老人保健施設に入所して1か月が経過した。睡眠中に大きないびきをかいていることが多く，いびきの音が途切れることもある。夜間に目を覚ましていたり，起床時にだるそうにしている様子もしばしば見られている。<br>介護福祉職が<b>Ｌ<\/b>さんについて収集すべき情報として，<b>最も優先度の高いもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["枕の高さ","マットレスの硬さ","掛け布団の重さ","睡眠中の足の動き","睡眠中の呼吸状態"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"大きないびきが途切れる、夜間に目が覚める、起床時にだるそうにしている様子は、睡眠時無呼吸症候群が疑われる状態である。呼吸が止まっていないかなど、睡眠中の呼吸状態を最も優先して観察し、医療職につなぐ。","choices":["枕の高さもいびきに関係することはあるが、呼吸が途切れる状態をまず確認することが優先される。","マットレスの硬さは寝心地に関わるが、今回の症状の中心ではない。","掛け布団の重さも、今回の症状とは直接関係しない。","睡眠中の足の動きは、むずむず脚症候群や周期性四肢運動障害を疑うときの情報で、いびきの途切れとは結びつかない。","いびきの途切れは無呼吸の可能性があり、睡眠中の呼吸状態を最優先で確認する。"],"point":"「いびき＋呼吸の途切れ＋日中の眠気・だるさ」は睡眠時無呼吸症候群のサイン。「足の不快感・動き」はむずむず脚症候群。症状と疑われる病気を結びつけて、優先する観察を選ぶ。","note":null}},{"id":"36-102","exam":36,"no":102,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ｍ<\/b>さん（98歳，男性，要介護5）は，介護老人福祉施設に入所している。誤嚥性肺炎（aspiration pneumonia）で入退院を繰り返し，医師からは終末期が近い状態であるといわれている。<br>介護福祉職が確認すべきこととして，<b>最も優先度の高いもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["主治医の今後の見通し","誤嚥性肺炎（aspiration pneumonia）の発症時の入院先","経口摂取に対する本人の意向","経口摂取に対する家族の意向","延命治療に対する家族の希望"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"終末期の介護では、本人の意思を尊重することが最も大切である。誤嚥性肺炎を繰り返しているＭさんが、口から食べることをどう考えているかを確認することが、今後のケアの方向を決める出発点になる。","choices":["主治医の見通しは大切な情報だが、ケアの方向を決めるうえでは本人の意向の確認が優先される。","発症時の入院先は、本人の意向を確認した後に検討することである。","経口摂取に対する本人の意向を最優先で確認する。","家族の意向も大切だが、まず本人の意向を確認する。本人が意思を示せない場合に、家族などと本人の推定意思を考える。","延命治療に対する家族の希望より、本人の意向が優先される。"],"point":"「最も優先度の高いもの」を問う終末期の問題では、本人の意向が最優先。人生会議（ACP）の考え方とあわせて、「本人→（意思が確認できないとき）家族などと推定意思を考える」の順序を押さえる。","note":null}},{"id":"36-103","exam":36,"no":103,"subject":"生活支援技術","group":4,"case":null,"stem":"デスカンファレンス（death conference）の目的に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["一般的な死の受容過程を学習する。","終末期を迎えている利用者の介護について検討する。","利用者の家族に対して，死が近づいたときの身体の変化を説明する。","亡くなった利用者の事例を振り返り，今後の介護に活用する。","終末期の介護に必要な死生観を統一する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"デスカンファレンスは、利用者が亡くなった後に、関わった職員が事例を振り返り、ケアの良かった点や課題を共有して、今後の介護に生かすために行う。職員の悲しみやつらさを分かち合う意味もある。","choices":["死の受容過程の学習は研修で行うことで、デスカンファレンスの目的ではない。","終末期を迎えている利用者の介護の検討は、亡くなる前に行うカンファレンスである。デスカンファレンスは亡くなった後に行う。","家族への説明は、終末期の家族支援として行うもので、デスカンファレンスの目的ではない。","亡くなった利用者の事例を振り返り、今後の介護に活用する。","死生観は人それぞれで、統一するものではない。"],"point":"デスカンファレンス＝「死後」の振り返り。「終末期の介護を検討する」は死の前のカンファレンスとのひっかけ。職員のグリーフケア（悲しみのケア）の役割もあわせて覚える。","note":null}},{"id":"36-104","exam":36,"no":104,"subject":"生活支援技術","group":4,"case":null,"stem":"福祉用具を活用するときの基本的な考え方として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["福祉用具が活用できれば，住宅改修は検討しない。","複数の福祉用具を使用するときは，状況に合わせた組合せを考える。","福祉用具の選択に迷うときは，社会福祉士に選択を依頼する。","家族介護者の負担軽減を最優先して選ぶ。","福祉用具の利用状況のモニタリング（monitoring）は不要である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"福祉用具は、一つひとつの性能だけでなく、利用者の心身の状態や生活の場面に合わせた組合せで効果が決まる。たとえばベッドと車いすの高さを合わせるなど、状況に応じた組合せを考える。","choices":["福祉用具と住宅改修は、目的に応じて組み合わせて検討する。福祉用具が使えるからといって住宅改修を検討しないわけではない。","複数の福祉用具は、状況に合わせた組合せを考える。","福祉用具の選択の相談先は、福祉用具専門相談員や理学療法士・作業療法士など。社会福祉士に選択を依頼するのは適切ではない。","家族の負担軽減も大切だが、最優先は利用者本人の自立支援と安全である。","心身の状態は変化するため、利用状況のモニタリングは必要である。"],"point":"福祉用具の基本は「本人の自立支援が目的」「状況に合わせた組合せ」「住宅改修と組み合わせる」「継続的なモニタリング」。「〜は不要」「〜は検討しない」と言い切る選択肢は誤りになりやすい。","note":null}},{"id":"36-105","exam":36,"no":105,"subject":"生活支援技術","group":4,"case":null,"stem":"以下の図のうち，握力の低下がある利用者が使用する杖として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":[],"notes":null,"figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA7IAAAQOCAAAAADDRFuoAAAACXBIWXMA HcYUDNWCgcmv+WKDzenMNWnTGlCFT27CDWUHT7Sna8vnrWkEt8AdwYzfT9fO9y/d+yMSlqtwRVkEAjEhkLIIBK9AyiIQvAIpi0DwCqQsAsErkLIIBK9AyiIQvAIpi0Dwiv8Hej6wX+4zQc0AAAAASUVORK5CYII=","choicesInFigure":true,"answer":[3],"exp":{"basis":"3の杖はロフストランドクラッチ（前腕固定型杖）で、前腕をカフ（輪）に通し、グリップと前腕の2か所で体重を支える。手の握る力だけに頼らずに使えるため、握力が低下している人に適している。","choices":["T字杖（一本杖）。握り手をしっかり握って体重を支えるため、握力が必要。","オフセット型杖。体重が杖の真上にかかり安定しやすいが、握り手を握って使うため握力が必要。","ロフストランドクラッチ。前腕でも支えられるため、握力が低下していても使いやすい。","多点杖（四点杖）。支持面が広く安定性が高いが、握り手を握って使う。","サイドケイン（歩行器型杖）。安定性はさらに高いが、やはり握り手を握って使う。"],"point":"杖は「何を補うか」で選ぶ。握力低下・手首の負担を減らしたい＝ロフストランドクラッチ（前腕で支える）、より安定が必要＝多点杖・サイドケイン、比較的安定して歩ける＝T字杖・オフセット型杖。図の問題では握り手以外に体を支える部分（カフ）があるかに注目する。","note":null}},{"id":"36-106","exam":36,"no":106,"subject":"介護過程","group":10,"case":null,"stem":"介護福祉職が，初回の面談で情報を収集するときの留意点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["用意した項目を次から次に質問する。","目的を意識しながら話を聴く。","ほかの利用者が同席する状況で質問する。","最初に経済状態に関する質問をする。","家族の要望を中心に話を聴く。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"初回の面談は、介護過程の出発点となる情報を集める場である。何のために、どんな情報が必要かという目的を意識して聴くことで、話の流れを大切にしながら必要な情報を漏れなく集められる。","choices":["用意した項目を次々に質問すると、尋問のようになり、利用者が安心して話せない。項目は手がかりにとどめ、相手の話の流れに沿って聴く。","目的を意識しながら聴くことで、必要な情報を自然な会話の中で集められる。","ほかの利用者が同席すると、プライバシーが守られず、本人が話しにくくなる。個別に話せる場所を用意する。","経済状態は話しにくい内容で、最初に聞くと警戒心を強める。信頼関係ができてから、必要に応じて確認する。","家族の要望も大切だが、中心にすべきは利用者本人の思いや意向である。"],"point":"情報収集の問題は「本人中心」「プライバシーへの配慮」「信頼関係づくり」が判断の軸。「次から次に」「最初に経済状態」「家族を中心に」のように、相手の気持ちや本人の意向を後回しにする選択肢は誤り。","note":null}},{"id":"36-107","exam":36,"no":107,"subject":"介護過程","group":10,"case":null,"stem":"介護過程の評価に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["生活状況が変化しても，介護計画で設定した日に評価する。","サービス担当者会議で評価する。","相談支援専門員が中心になって評価する。","利用者の満足度を踏まえて評価する。","介護計画の実施中に評価基準を設定する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"介護過程の評価では、目標の達成度とあわせて、支援を受けた利用者の満足度や思いを確かめる。利用者がどう受け止めたかを踏まえることで、本人の意向に沿った計画の見直しにつながる。","choices":["評価日はあらかじめ決めておくが、生活状況が変化したときは、設定した日を待たずに評価して計画を見直す。","サービス担当者会議は、介護支援専門員が開き、ケアプランについて関係者で話し合う場である。介護過程の評価は、介護計画を立てた介護福祉職が中心となって行う。","相談支援専門員は、障害福祉サービスのサービス等利用計画を作る専門職。介護過程の評価の中心は介護福祉職である。","利用者の満足度を踏まえて評価する。","評価基準は、計画を立てる段階で目標とあわせて設定しておく。実施中に決めると、何を基準に評価するかがぶれる。"],"point":"介護過程は「アセスメント→計画立案→実施→評価」。評価の基準（目標）は計画立案のときに決める、状況が変われば予定日を待たずに評価する、の2点がよく問われる。ケアプラン（介護支援専門員）や会議の名前と介護計画（介護福祉職）を取り違えさせるひっかけに注意する。","note":null}},{"id":"36-108","exam":36,"no":108,"subject":"介護過程","group":10,"case":null,"stem":"次の記述のうち，介護老人保健施設で多職種連携によるチームアプローチ（team approach）を実践するとき，介護福祉職が担う役割として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者の生活状況の変化に関する情報を提供する。","総合的な支援の方向性を決める。","サービス担当者会議を開催する。","必要な検査を指示する。","ほかの職種が担う貢献度を評価する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"介護福祉職は、利用者の日常生活に最も身近に関わる職種である。チームアプローチでは、日々の関わりの中で気づいた生活状況の変化を、ほかの職種に伝える役割が期待される。","choices":["生活に身近な介護福祉職ならではの情報を提供する。","総合的な支援の方向性は、施設サービス計画をもとに多職種のチーム全体で決めるもので、介護福祉職が単独で決めるものではない。","サービス担当者会議を開くのは、介護支援専門員の役割である。","検査を指示するのは医師の役割である。","チームは各職種が対等に協働するもので、介護福祉職がほかの職種の貢献度を評価する立場にはない。"],"point":"多職種連携の問題では、職種ごとの役割を区別する。「検査・治療の指示＝医師」「会議の開催・計画の原案＝介護支援専門員」「生活の様子・変化の把握と情報提供＝介護福祉職」。1つの職種が全体を決める・評価する選択肢は誤りになりやすい。","note":null}},{"id":"36-109","exam":36,"no":109,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題109<\/b>，<b>問題110<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（75歳，女性）は，一人暮らしで，身体機能に問題はない。70歳まで地域の子どもたちに大正琴を教えていた。認知症（dementia）の進行が疑われて，心配した友人が地域包括支援センターに相談した結果，<b>Ａ<\/b>さんは介護老人福祉施設に入所することになった。入所時の<b>Ａ<\/b>さんの要介護度は3であった。<br>入所後，短期目標を，「施設に慣れ，安心して生活する（3か月）」と設定し，計画は順調に進んでいた。<b>Ａ<\/b>さんは施設の大正琴クラブに自ら進んで参加し，演奏したり，ほかの利用者に大正琴を笑顔で教えたりしていた。ある日，クラブの終了後に，<b>Ａ<\/b>さんは部屋に戻らずに，エレベーターの前で立ち止まっていた。介護職員が声をかけると，<b>Ａ<\/b>さんが，「あの子たちが待っているの」と強い口調で言った。","stem":"大正琴クラブが終わった後の<b>Ａ<\/b>さんの行動を解釈するために必要な情報として，<b>最も優先すべきもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護職員の声かけのタイミング","<b>Ａ<\/b>さんが演奏した時間","「あの子たちが待っているの」という発言","クラブに参加した利用者の人数","居室とエレベーターの位置関係"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"行動の意味を解釈するには、本人の言葉が最も重要な手がかりになる。「あの子たちが待っているの」という発言は、かつて地域の子どもたちに大正琴を教えていた生活歴と結びつき、Ａさんが何をしようとしていたのかを理解する鍵になる。","choices":["声かけのタイミングは、行動の後の関わり方の情報で、行動そのものの理由を解釈する手がかりにはなりにくい。","演奏した時間は、エレベーターの前で立ち止まった理由とは結びつきにくい。","本人の発言は、生活歴（子どもたちに大正琴を教えていたこと）と結びつき、行動の意味を解釈する鍵になる。","クラブの参加人数は、Ａさんの行動の理由とは関係が薄い。","身体機能に問題はなく、居室に戻れなかったという情報もないため、位置関係は優先すべき情報ではない。"],"point":"事例問題で「行動を解釈するために優先すべき情報」を問われたら、まず本人の言葉（かぎかっこの発言）と生活歴を結びつける。周囲の状況（人数・時間・位置）は、本人の思いを理解する手がかりとしては優先度が低い。","note":null}},{"id":"36-110","exam":36,"no":110,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題109<\/b>，<b>問題110<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（75歳，女性）は，一人暮らしで，身体機能に問題はない。70歳まで地域の子どもたちに大正琴を教えていた。認知症（dementia）の進行が疑われて，心配した友人が地域包括支援センターに相談した結果，<b>Ａ<\/b>さんは介護老人福祉施設に入所することになった。入所時の<b>Ａ<\/b>さんの要介護度は3であった。<br>入所後，短期目標を，「施設に慣れ，安心して生活する（3か月）」と設定し，計画は順調に進んでいた。<b>Ａ<\/b>さんは施設の大正琴クラブに自ら進んで参加し，演奏したり，ほかの利用者に大正琴を笑顔で教えたりしていた。ある日，クラブの終了後に，<b>Ａ<\/b>さんは部屋に戻らずに，エレベーターの前で立ち止まっていた。介護職員が声をかけると，<b>Ａ<\/b>さんが，「あの子たちが待っているの」と強い口調で言った。","stem":"<b>Ａ<\/b>さんの状況から支援を見直すことになった。<br>次の記述のうち，新たな支援の方向性として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護職員との関係を改善する。","身体機能を改善する。","演奏できる自信を取り戻す。","エレベーターの前に座れる環境を整える。","大正琴を教える役割をもつ。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ａさんは、クラブでほかの利用者に笑顔で大正琴を教え、クラブの後には「あの子たちが待っているの」と話している。教えることがＡさんにとって大切な役割であり、生きがいであると考えられるため、施設の中で大正琴を教える役割をもてるように支援の方向性を見直す。","choices":["介護職員との関係が悪いという情報は事例にない。","Ａさんは身体機能に問題がない。","Ａさんは演奏ができており、演奏の自信を失っている様子はない。","エレベーターの前に座れるようにしても、行動の背景にある「教えたい」という思いには応えられない。","教える役割をもつことで、Ａさんの思いと生きがいに応える。"],"point":"支援の見直しでは、事例の中の「本人が生き生きしている場面」と「本人の発言」から、その人にとっての意味（役割・生きがい）を読み取る。行動そのものに合わせて環境を整えるだけの選択肢（エレベーターの前に座れるようにする）は、背景にある思いに応えていないため誤りになりやすい。","note":null}},{"id":"36-111","exam":36,"no":111,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題111<\/b>，<b>問題112<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｂ<\/b>さん（50歳，男性，障害支援区分3）は，49歳のときに脳梗塞（cerebral infarction）を発症し，左片麻痺で高次脳機能障害（higher brain dysfunction）と診断された。以前は大工で，手先が器用だったと言っている。<br>現在は就労継続支援Ｂ型事業所に通っている。短期目標を，「右手を使い，作業を自分ひとりで行える（3か月）」と設定し，製品を箱に入れる単純作業を任されていた。ほかの利用者との人間関係も良好で，左片麻痺に合わせた作業台で，毎日の作業目標を達成していた。生活支援員には，「将来は手先を使う仕事に就きたい」と希望を話していた。<br>将来に向けて，生活支援員が新たに製品の組立て作業を提案すると，<b>Ｂ<\/b>さんも喜んで受け入れた。初日に，「ひとりで頑張る」と始めたが，途中で何度も手が止まり，完成品に不備が見られた。生活支援員が声をかけると，「こんなの，できない」と大声を出した。","stem":"生活支援員の声かけに対し，<b>Ｂ<\/b>さんが大声を出した理由を解釈する視点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ほかの利用者との人間関係","生活支援員に話した将来の希望","製品を箱に入れる毎日の作業量","製品の組立て作業の状況","左片麻痺に合わせた作業台"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"Ｂさんは単純作業では目標を達成できていたが、新しく始めた組立て作業では何度も手が止まり、不備も出ていた。大声を出したのは、組立て作業がうまくできないことへの戸惑いや苛立ちと考えられるため、組立て作業の状況から解釈するのが適切である。","choices":["ほかの利用者との人間関係は良好で、大声の理由とは考えにくい。","将来の希望は組立て作業を始めた動機であり、大声を出した直接の理由を解釈する視点ではない。","箱に入れる単純作業は目標を達成できており、問題は起きていない。","うまくいかなかった組立て作業の状況から、大声の理由を解釈する。","作業台は左片麻痺に合わせたもので、これまで問題なく作業できている。"],"point":"事例で行動の理由を問われたら「何が変わった直後に起きたか」に注目する。うまくいっていたこと（人間関係・単純作業・作業台）は理由の候補から外し、新しく始めたこと・変化したことに焦点を当てる。","note":null}},{"id":"36-112","exam":36,"no":112,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題111<\/b>，<b>問題112<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｂ<\/b>さん（50歳，男性，障害支援区分3）は，49歳のときに脳梗塞（cerebral infarction）を発症し，左片麻痺で高次脳機能障害（higher brain dysfunction）と診断された。以前は大工で，手先が器用だったと言っている。<br>現在は就労継続支援Ｂ型事業所に通っている。短期目標を，「右手を使い，作業を自分ひとりで行える（3か月）」と設定し，製品を箱に入れる単純作業を任されていた。ほかの利用者との人間関係も良好で，左片麻痺に合わせた作業台で，毎日の作業目標を達成していた。生活支援員には，「将来は手先を使う仕事に就きたい」と希望を話していた。<br>将来に向けて，生活支援員が新たに製品の組立て作業を提案すると，<b>Ｂ<\/b>さんも喜んで受け入れた。初日に，「ひとりで頑張る」と始めたが，途中で何度も手が止まり，完成品に不備が見られた。生活支援員が声をかけると，「こんなの，できない」と大声を出した。","stem":"<b>Ｂ<\/b>さんに対するカンファレンス（conference）が開催され，短期目標を達成するための具体的な支援について見直すことになった。<br>次の記述のうち，見直した支援内容として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["完成品の不備を出すことへの反省を促す。","左側に部品を置いて作業するように促す。","完成までの手順を理解しやすいように示す。","生活支援員が横に座り続けて作業内容を指示する。","製品を箱に入れる単純作業も同時に行うように調整する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"高次脳機能障害があると、複数の工程を順序立てて進めること（遂行機能）が難しくなることがある。完成までの手順を図や写真などで分かりやすく示せば、Ｂさんが自分ひとりで組立て作業を進めやすくなり、短期目標の達成につながる。","choices":["反省を促しても、手順が分からないという原因は解決せず、自信を失わせる。","短期目標は右手を使うこと。麻痺側の左に部品を置くと扱いにくく見落としやすい。右手で扱いやすい位置に置く。","手順を分かりやすく示し、ひとりで作業できるよう支援する。","横に座り続けて指示すると、「自分ひとりで行える」という短期目標に反し、本人の主体性も損なう。","2つの作業を同時に行うと、注意を配分する負担が増し、かえって混乱しやすい。"],"point":"高次脳機能障害の支援は「工程を分ける・手順を目に見える形で示す・一度に1つの作業にする」が基本。短期目標の文言（「自分ひとりで」）と矛盾する支援（つきっきりで指示する）は誤りと判断する。","note":null}},{"id":"36-113","exam":36,"no":113,"subject":"介護過程","group":10,"case":null,"stem":"事例研究を行うときに，遵守すべき倫理的配慮として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["研究内容を説明して，事例対象者の同意を得る。","個人が特定できるように，氏名を記載する。","得られたデータは，研究終了後すぐに破棄する。","論文の一部であれば，引用元を明示せずに利用できる。","研究成果を得るために，事実を拡大解釈する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"事例研究では、対象者の個人情報や生活を扱うため、研究の目的や内容、結果の公表方法などを説明し、本人の同意を得ることが基本的な倫理的配慮である。","choices":["研究内容を説明して同意を得る（インフォームド・コンセント）。","個人が特定されないよう、氏名は記号に置き換えるなど匿名化する。","データは、定められた期間、安全に保管し、その後適切な方法で破棄する。研究終了後すぐに破棄するとは限らない。","他者の論文を使うときは、一部であっても引用元を明示する。明示しなければ盗用になる。","事実を拡大解釈するのは研究の不正である。事実に基づいて正確に報告する。"],"point":"研究倫理は「説明と同意」「匿名化」「データの適切な保管と破棄」「引用元の明示」「事実のねつ造・改ざんをしない」の5点で判断する。「すぐに破棄」のように一見慎重そうな表現も、ルールとずれていれば誤り。","note":null}},{"id":"36-114","exam":36,"no":114,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｃ<\/b>さん（59歳，男性）は，妻（55歳）と二人暮らしであり，専業農家である。<b>Ｃ<\/b>さんはおとなしい性格であったが，最近怒りやすくなったと妻は感じていた。<b>Ｃ<\/b>さんは毎日同じ時間に同じコースを散歩している。ある日，散歩コースの途中にあり，昔からよく行く八百屋から，「<b>Ｃ<\/b>さんが代金を支払わずに商品を持っていった。今回で2回目になる。お金を支払いにきてもらえないか」と妻に連絡があった。妻が<b>Ｃ<\/b>さんに確認したところ，悪いことをした認識がなかった。心配になった妻が<b>Ｃ<\/b>さんと病院に行くと，前頭側頭型認知症（frontotemporal dementia）と診断を受けた。妻は今後同じようなことが起きないように，<b>Ｃ<\/b>さんの行動を常に見守り，外出を制限したが，疲労がたまり，今後の生活に不安を感じた。そこで，地域包括支援センターに相談し，要介護認定の申請を行い，訪問介護（ホームヘルプサービス）を利用することになった。","stem":"<b>Ｃ<\/b>さんが八百屋でとった行動から考えられる状態として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["脱抑制","記憶障害","感情失禁","見当識障害","遂行機能障害"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"前頭側頭型認知症では、前頭葉の働きが低下し、社会のルールや周囲への配慮よりも欲求のままに行動してしまう「脱抑制」がみられる。代金を支払わずに商品を持っていき、悪いことをした認識もないのは、脱抑制による行動と考えられる。","choices":["社会のルールを守れず、思うままに行動してしまうのは脱抑制。","記憶障害が目立つのはアルツハイマー型認知症。Ｃさんは毎日同じコースを散歩しており、記憶の問題は事例から読み取れない。","感情失禁は、わずかなことで泣いたり笑ったりする症状で、血管性認知症でみられやすい。","見当識障害は時間・場所・人が分からなくなる症状。Ｃさんは昔からの店に行けており、当てはまらない。","遂行機能障害は、計画を立てて順序よく物事を進められない症状で、商品を持ち去る行動の説明にはならない。"],"point":"前頭側頭型認知症は「脱抑制（万引き・ルール違反）」「常同行動（毎日同じ時間・同じコース）」「性格の変化（怒りやすくなる）」がセット。事例の中に複数の手がかりが散りばめられているので、まとめて結びつける。","note":null}},{"id":"36-115","exam":36,"no":115,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｃ<\/b>さん（59歳，男性）は，妻（55歳）と二人暮らしであり，専業農家である。<b>Ｃ<\/b>さんはおとなしい性格であったが，最近怒りやすくなったと妻は感じていた。<b>Ｃ<\/b>さんは毎日同じ時間に同じコースを散歩している。ある日，散歩コースの途中にあり，昔からよく行く八百屋から，「<b>Ｃ<\/b>さんが代金を支払わずに商品を持っていった。今回で2回目になる。お金を支払いにきてもらえないか」と妻に連絡があった。妻が<b>Ｃ<\/b>さんに確認したところ，悪いことをした認識がなかった。心配になった妻が<b>Ｃ<\/b>さんと病院に行くと，前頭側頭型認知症（frontotemporal dementia）と診断を受けた。妻は今後同じようなことが起きないように，<b>Ｃ<\/b>さんの行動を常に見守り，外出を制限したが，疲労がたまり，今後の生活に不安を感じた。そこで，地域包括支援センターに相談し，要介護認定の申請を行い，訪問介護（ホームヘルプサービス）を利用することになった。","stem":"<b>Ｃ<\/b>さんの介護保険制度の利用に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護保険サービスの利用者負担割合は1割である。","介護保険料は特別徴収によって納付する。","要介護認定の結果が出る前に介護保険サービスを利用することはできない。","要介護認定の利用者負担割合は2割である。","介護保険サービスの費用はサービスの利用回数に関わらず定額である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"Ｃさんは59歳で、40〜64歳の第2号被保険者に当たる。前頭側頭型認知症は特定疾病の「初老期における認知症」に該当するため、要介護認定を受けてサービスを利用できる。第2号被保険者の利用者負担は、所得にかかわらず1割である。","choices":["第2号被保険者の利用者負担は1割。","特別徴収（年金からの天引き）は第1号被保険者の納め方。第2号被保険者は、加入している医療保険の保険料と一緒に納める。","要介護認定の効力は申請日にさかのぼるため、認定結果が出る前でも、暫定的なケアプランによってサービスを利用できる。","要介護認定に「負担割合」はない。2割負担は、一定以上の所得がある第1号被保険者に適用されるもの。","多くのサービスは利用回数・時間に応じて決まり、一律に定額ではない。"],"point":"まず年齢で被保険者の種類を判断する。「第2号（40〜64歳）＝特定疾病が必要・負担は1割・保険料は医療保険と一緒」「第1号（65歳以上）＝負担は1〜3割・保険料は年金天引き（特別徴収）が中心」。","note":null}},{"id":"36-116","exam":36,"no":116,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｃ<\/b>さん（59歳，男性）は，妻（55歳）と二人暮らしであり，専業農家である。<b>Ｃ<\/b>さんはおとなしい性格であったが，最近怒りやすくなったと妻は感じていた。<b>Ｃ<\/b>さんは毎日同じ時間に同じコースを散歩している。ある日，散歩コースの途中にあり，昔からよく行く八百屋から，「<b>Ｃ<\/b>さんが代金を支払わずに商品を持っていった。今回で2回目になる。お金を支払いにきてもらえないか」と妻に連絡があった。妻が<b>Ｃ<\/b>さんに確認したところ，悪いことをした認識がなかった。心配になった妻が<b>Ｃ<\/b>さんと病院に行くと，前頭側頭型認知症（frontotemporal dementia）と診断を受けた。妻は今後同じようなことが起きないように，<b>Ｃ<\/b>さんの行動を常に見守り，外出を制限したが，疲労がたまり，今後の生活に不安を感じた。そこで，地域包括支援センターに相談し，要介護認定の申請を行い，訪問介護（ホームヘルプサービス）を利用することになった。","stem":"その後，妻に外出を制限された<b>Ｃ<\/b>さんは不穏となった。困った妻が訪問介護員（ホームヘルパー）に相談したところ，「八百屋に事情を話して事前にお金を渡して，<b>Ｃ<\/b>さんが品物を持ち去ったときは，渡したお金から商品代金を支払うようにお願いしてはどうか」とアドバイスを受けた。<br>訪問介護員（ホームヘルパー）が意図した<b>Ｃ<\/b>さんへの関わりをＩＣＦ（International Classification of Functioning, Disability and Health：国際生活機能分類）に当てはめた記述として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["個人因子への影響を意図して，健康状態に働きかける。","健康状態への影響を意図して，心身機能に働きかける。","活動への影響を意図して，身体構造に働きかける。","参加への影響を意図して，環境因子に働きかける。","環境因子への影響を意図して，個人因子に働きかける。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"訪問介護員の提案は、八百屋に事情を話して協力してもらうことで、Ｃさんが散歩や買物を続けられるようにするものである。八百屋の理解と協力はＩＣＦの「環境因子」に当たり、地域での散歩や買物を続けることは「参加」に当たる。","choices":["健康状態（前頭側頭型認知症）に働きかけるものではなく、個人因子への影響を意図したものでもない。","心身機能に働きかけて健康状態を変えようとするものではない。","身体構造（体の器官など）に働きかけるものではない。","八百屋の協力（環境因子）によって、散歩や買物という地域での参加を続けられるようにする。","個人因子（年齢・性格・生活歴など）は働きかけて変える対象ではない。"],"point":"ＩＣＦの問題は、支援で「何を変えたか」を構成要素に当てはめる。「周囲の人の理解・協力、制度、福祉用具＝環境因子」「地域や社会での役割・外出・交流＝参加」。本人を変えるのではなく周囲を変える支援は、環境因子への働きかけと判断する。","note":null}},{"id":"36-117","exam":36,"no":117,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｄ<\/b>さん（70歳，男性）は，自宅で妻と二人暮らしで，年金収入で生活している。ある日，車を運転中に事故に遭い救急搬送された。医師からは，第4胸髄節まで機能が残存している脊髄損傷（spinal cord injury）と説明を受けた。<b>Ｄ<\/b>さんは，入院中に要介護3の認定を受けた。<br><b>Ｄ<\/b>さんは，退院後は自宅で生活することを望んでいた。妻は一緒に暮らしたいと思うが，<b>Ｄ<\/b>さんの身体状況を考えると不安を感じていた。介護支援専門員（ケアマネジャー）は，「退院後は，在宅復帰を目的に，一定の期間，リハビリテーション専門職がいる施設で生活してはどうか」と<b>Ｄ<\/b>さんに提案した。<b>Ｄ<\/b>さんは妻と退院後の生活について話し合った結果，一定期間施設に入所して，その間に，自宅の住宅改修を行うことにして，介護支援専門員（ケアマネジャー）に居宅介護住宅改修費について相談した。","stem":"次のうち，<b>Ｄ<\/b>さんが提案を受けた施設として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["養護老人ホーム","軽費老人ホーム","介護老人福祉施設","介護老人保健施設","介護医療院"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"介護老人保健施設は、要介護者に看護・医学的管理のもとでリハビリテーションなどを行い、在宅復帰を目指す施設である。理学療法士・作業療法士などのリハビリテーション専門職が配置され、「在宅復帰を目的に、一定の期間」生活する施設として最も適切である。","choices":["養護老人ホームは、環境上・経済的な理由で自宅での生活が難しい高齢者が、市町村の措置で入所する施設。在宅復帰のリハビリを目的とする施設ではない。","軽費老人ホームは、自立した生活に不安のある高齢者が低額な料金で利用する住まいで、リハビリを目的とする施設ではない。","介護老人福祉施設は、常に介護が必要な人の生活の場で、在宅復帰を目的とした一定期間の入所施設ではない。","在宅復帰を目指し、リハビリテーション専門職がいる施設。","介護医療院は、長期にわたり療養が必要な人に医療と介護を一体で提供する施設で、在宅復帰を目的とした施設ではない。"],"point":"介護保険施設は目的で区別する。「介護老人保健施設＝在宅復帰（リハビリ）」「介護老人福祉施設＝生活の場」「介護医療院＝長期療養と医療」。事例の「在宅復帰を目的に」「一定の期間」「リハビリテーション専門職」が介護老人保健施設のキーワード。","note":null}},{"id":"36-118","exam":36,"no":118,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｄ<\/b>さん（70歳，男性）は，自宅で妻と二人暮らしで，年金収入で生活している。ある日，車を運転中に事故に遭い救急搬送された。医師からは，第4胸髄節まで機能が残存している脊髄損傷（spinal cord injury）と説明を受けた。<b>Ｄ<\/b>さんは，入院中に要介護3の認定を受けた。<br><b>Ｄ<\/b>さんは，退院後は自宅で生活することを望んでいた。妻は一緒に暮らしたいと思うが，<b>Ｄ<\/b>さんの身体状況を考えると不安を感じていた。介護支援専門員（ケアマネジャー）は，「退院後は，在宅復帰を目的に，一定の期間，リハビリテーション専門職がいる施設で生活してはどうか」と<b>Ｄ<\/b>さんに提案した。<b>Ｄ<\/b>さんは妻と退院後の生活について話し合った結果，一定期間施設に入所して，その間に，自宅の住宅改修を行うことにして，介護支援専門員（ケアマネジャー）に居宅介護住宅改修費について相談した。","stem":"次のうち，介護支援専門員（ケアマネジャー）が<b>Ｄ<\/b>さんに説明する居宅介護住宅改修費の支給限度基準額として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["10万円","15万円","20万円","25万円","30万円"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"居宅介護住宅改修費の支給限度基準額は、要介護度にかかわらず20万円である。この範囲内の改修費用のうち、利用者負担（原則1割、所得により2割・3割）を除いた額が支給される。","choices":["10万円ではない。特定福祉用具購入費の支給限度基準額（年間10万円）と混同しないようにする。","15万円ではない。","住宅改修費の支給限度基準額は20万円。","25万円ではない。","30万円ではない。"],"point":"「住宅改修＝20万円（原則1人1回。要介護度が3段階以上上がったときや転居したときは改めて利用できる）」「特定福祉用具購入＝年間10万円」をセットで覚える。数字の入れ替えがひっかけの定番。","note":null}},{"id":"36-119","exam":36,"no":119,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｄ<\/b>さん（70歳，男性）は，自宅で妻と二人暮らしで，年金収入で生活している。ある日，車を運転中に事故に遭い救急搬送された。医師からは，第4胸髄節まで機能が残存している脊髄損傷（spinal cord injury）と説明を受けた。<b>Ｄ<\/b>さんは，入院中に要介護3の認定を受けた。<br><b>Ｄ<\/b>さんは，退院後は自宅で生活することを望んでいた。妻は一緒に暮らしたいと思うが，<b>Ｄ<\/b>さんの身体状況を考えると不安を感じていた。介護支援専門員（ケアマネジャー）は，「退院後は，在宅復帰を目的に，一定の期間，リハビリテーション専門職がいる施設で生活してはどうか」と<b>Ｄ<\/b>さんに提案した。<b>Ｄ<\/b>さんは妻と退院後の生活について話し合った結果，一定期間施設に入所して，その間に，自宅の住宅改修を行うことにして，介護支援専門員（ケアマネジャー）に居宅介護住宅改修費について相談した。","stem":"<b>Ｄ<\/b>さんが施設入所してから3か月後，住宅改修を終えた自宅に戻ることになった。<b>Ｄ<\/b>さんは自宅での生活を楽しみにしている。その一方で，不安も抱えていたため，担当の介護福祉士は，理学療法士と作業療法士に相談して，生活上の留意点を記載した冊子を作成して，<b>Ｄ<\/b>さんに手渡した。<br>次の記述のうち，冊子の内容として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["食事では，スプーンを自助具で手に固定する。","移動には，リクライニング式車いすを使用する。","寝具は，エアーマットを使用する。","更衣は，ボタンエイドを使用する。","外出するときには，事前に多機能トイレの場所を確認する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"第4胸髄節まで機能が残っている脊髄損傷では、上肢の機能は保たれるが、下肢は動かず、膀胱・直腸の機能障害（排泄の障害）を伴うことが多い。車いすで使えるトイレは限られるため、外出前に多機能トイレの場所を確認しておくことが生活上の大切な留意点となる。","choices":["スプーンを手に固定する自助具は、手指の機能が低下した頸髄損傷の人などが使うもの。第4胸髄節まで機能が残っていれば手指は使える。","リクライニング式車いすは、座った姿勢を保てない高位の頸髄損傷の人などが使う。上肢が使えるＤさんは、自分でこげる車いすで移動できる。","エアーマットは、自分で寝返りなどができない人の褥瘡予防に使う。褥瘡予防（除圧）は必要だが、上肢で自ら体位変換・除圧できる。上肢が使えるＤさんは、柔らかいマットではかえって起き上がりや移乗がしにくくなる。","ボタンエイドは、手指の細かい動きが難しい人がボタンをかけるための自助具。手指が使えるＤさんには必要ない。","排泄の障害と車いすでの移動を考え、外出前に多機能トイレの場所を確認する。"],"point":"脊髄損傷は「損傷の高さで残る機能が決まる」。頸髄（C）の損傷は上肢にも障害が出る、胸髄（Th）以下の損傷では上肢が使える、と区別する。上肢が使える人に手指の自助具やリクライニング式車いすを選ぶのはひっかけ。排泄の障害への備えは、損傷の高さにかかわらず問われやすい留意点。","note":null}},{"id":"36-120","exam":36,"no":120,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｅ<\/b>さん（34歳，女性，障害支援区分3）は，特別支援学校の高等部を卒業後，週2回，生活介護を利用しながら自宅で生活している。<b>Ｅ<\/b>さんはアテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）で不随意運動があり，首を振る動作が見られる。<br>食事は首の動きに合わせて，自助具を使って食べている。食事中は不随意運動が強く，食事が終わると，「首が痛い，しびれる」と言ってベッドに横になるときがある。<br>また，お茶を飲むときは取っ手つきのコップで飲んでいるが，コップを口元に運ぶまでにお茶がこぼれるようになってきた。日頃から自分のことは自分でやりたいと考えていて，お茶が上手に飲めなくなってきたことを気にしている。<br><b>Ｅ<\/b>さんは，生活介護事業所で油絵を描くことを楽しみにしている。以前から隣町の油絵教室に通い技術を高めたいと話していた。そこで<b>Ｅ<\/b>さんは，「自宅から油絵教室に通うときの介助をお願いするにはどうしたらよいか」と介護福祉職に相談した。","stem":"<b>Ｅ<\/b>さんの食事の様子から，今後，引き起こされる可能性が高いと考えられる二次障害として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["変形性股関節症（coxarthrosis）","廃用症候群（disuse syndrome）","起立性低血圧（orthostatic hypotension）","脊柱側弯症（scoliosis）","頚椎症性脊髄症（cervical spondylotic myelopathy）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"アテトーゼ型の脳性麻痺では、首などの不随意運動が長年繰り返されることで頸椎に負担がかかり、頸椎の変形から脊髄が圧迫される頸椎症性脊髄症が起こりやすい。Ｅさんの「首が痛い、しびれる」という訴えは、その前ぶれと考えられる。","choices":["変形性股関節症は、股関節の軟骨のすり減りなどで起こる病気で、首の不随意運動とは結びつかない。","廃用症候群は、体を動かさないことで心身の機能が低下する状態。Ｅさんの首の痛み・しびれは、動かないことではなく、首の不随意運動の繰り返しから生じていると考えられる。","起立性低血圧は、急に起き上がったときなどに血圧が下がる状態で、首の痛み・しびれとは関係しない。","脊柱側弯症は脳性麻痺の二次障害としてみられることがあるが、事例の首の痛み・しびれと直接結びつくのは頸椎の障害である。","首の不随意運動の繰り返しによる頸椎症性脊髄症。"],"point":"「アテトーゼ型脳性麻痺＋首の不随意運動＋首の痛み・しびれ」なら頸椎症性脊髄症。二次障害を問う問題では、事例にある体の部位（首）と症状（痛み・しびれ）に直接つながる病名を選ぶ。","note":null}},{"id":"36-121","exam":36,"no":121,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｅ<\/b>さん（34歳，女性，障害支援区分3）は，特別支援学校の高等部を卒業後，週2回，生活介護を利用しながら自宅で生活している。<b>Ｅ<\/b>さんはアテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）で不随意運動があり，首を振る動作が見られる。<br>食事は首の動きに合わせて，自助具を使って食べている。食事中は不随意運動が強く，食事が終わると，「首が痛い，しびれる」と言ってベッドに横になるときがある。<br>また，お茶を飲むときは取っ手つきのコップで飲んでいるが，コップを口元に運ぶまでにお茶がこぼれるようになってきた。日頃から自分のことは自分でやりたいと考えていて，お茶が上手に飲めなくなってきたことを気にしている。<br><b>Ｅ<\/b>さんは，生活介護事業所で油絵を描くことを楽しみにしている。以前から隣町の油絵教室に通い技術を高めたいと話していた。そこで<b>Ｅ<\/b>さんは，「自宅から油絵教室に通うときの介助をお願いするにはどうしたらよいか」と介護福祉職に相談した。","stem":"<b>Ｅ<\/b>さんがお茶を飲むときの介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["吸い飲みに変更する。","ストローつきコップに変更する。","重いコップに変更する。","コップを両手で持つように伝える。","全介助を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Ｅさんは、コップを口元に運ぶまでの間に不随意運動でお茶がこぼれている。ストローつきコップにすれば、コップを口元まで持ち上げなくても飲めるため、こぼれにくくなり、「自分のことは自分でやりたい」という思いに沿って自分で飲み続けられる。","choices":["吸い飲みは、主に寝たままの人などに介助者が口元へ運んで使う用具で、Ｅさんが自分で飲むことにつながりにくい。","口元まで運ぶ動作を減らし、自分で飲めるようにする。","重くしても、口元まで運ぶ動作は残るため、不随意運動によるこぼれは防ぎにくい。腕や首への負担も増える。","両手で持っても不随意運動は抑えにくく、口元まで運ぶ動作も残る。","全介助は、自分でやりたいというＥさんの思いと残存能力を生かさない。"],"point":"自助具の問題は「何が困難の原因か」を見極める。Ｅさんの場合は「口元まで運ぶ動作」でこぼれるので、その動作自体を減らす道具を選ぶ。全介助や本人の意欲を無視した方法は、自立支援の観点から誤りになりやすい。","note":null}},{"id":"36-122","exam":36,"no":122,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｅ<\/b>さん（34歳，女性，障害支援区分3）は，特別支援学校の高等部を卒業後，週2回，生活介護を利用しながら自宅で生活している。<b>Ｅ<\/b>さんはアテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）で不随意運動があり，首を振る動作が見られる。<br>食事は首の動きに合わせて，自助具を使って食べている。食事中は不随意運動が強く，食事が終わると，「首が痛い，しびれる」と言ってベッドに横になるときがある。<br>また，お茶を飲むときは取っ手つきのコップで飲んでいるが，コップを口元に運ぶまでにお茶がこぼれるようになってきた。日頃から自分のことは自分でやりたいと考えていて，お茶が上手に飲めなくなってきたことを気にしている。<br><b>Ｅ<\/b>さんは，生活介護事業所で油絵を描くことを楽しみにしている。以前から隣町の油絵教室に通い技術を高めたいと話していた。そこで<b>Ｅ<\/b>さんは，「自宅から油絵教室に通うときの介助をお願いするにはどうしたらよいか」と介護福祉職に相談した。","stem":"介護福祉職は，<b>Ｅ<\/b>さんが隣町の油絵教室に通うことができるようにサービスを提案したいと考えている。<br>次のうち，<b>Ｅ<\/b>さんが利用するサービスとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["自立生活援助","療養介護","移動支援","自立訓練","同行援護"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"移動支援は、障害者総合支援法の地域生活支援事業の一つで、屋外での移動が難しい障害者の社会生活上必要な外出や、余暇活動などの社会参加のための外出を支援する。油絵教室に通うという趣味・社会参加のための外出に適している。","choices":["自立生活援助は、施設やグループホームから一人暮らしに移った人などを、定期的な訪問などで支えるサービス。","療養介護は、医療と常時の介護が必要な人が、病院で機能訓練・療養上の管理・看護などを受けるサービス。","余暇活動などの外出を支援する移動支援。","自立訓練は、自立した日常生活や社会生活ができるよう、一定期間、身体機能や生活能力の訓練を行うサービス。","同行援護は、視覚障害により移動が著しく困難な人の外出を支援するサービスで、Ｅさんは対象ではない。"],"point":"外出の支援は対象で区別する。「同行援護＝視覚障害」「行動援護＝知的・精神障害で行動上著しい困難がある人」「移動支援＝地域生活支援事業（市町村が実施）で、余暇や社会参加の外出にも使える」。","note":null}},{"id":"36-123","exam":36,"no":123,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｆ<\/b>さん（20歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）と重度の知的障害があり，自宅で母親（50歳），姉（25歳）と3人で暮らしている。<br><b>Ｆ<\/b>さんは生活介護事業所を利用している。事業所では比較的落ち着いているが，自宅に帰ってくると母親に対してかみつきや頭突きをすることがあった。また，自分で頭をたたくなどの自傷行為もたびたび見られる。<br>仕事をしている母親に代わり，小さい頃から食事や排泄の介護をしている姉は，これまで<b>Ｆ<\/b>さんの行動を止めることができていたが，最近ではからだが大きくなり力も強くなって，母親と協力しても止めることが難しくなっていた。<br>家族で今後のことを考えた結果，<b>Ｆ<\/b>さんは障害者支援施設に入所することになった。","stem":"次のうち，<b>Ｆ<\/b>さんが自宅に帰ってきたときの状態に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["学習障害","注意欠陥多動性障害","高次脳機能障害","強度行動障害","気分障害"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"強度行動障害とは、自傷（自分の頭をたたくなど）や他害（かみつき・頭突きなど）といった行動が高い頻度で起こり、家庭で通常の育て方や関わり方をしていても対応が著しく難しい状態をいう。Ｆさんの自宅での様子は強度行動障害に当たる。","choices":["学習障害は、知的発達に大きな遅れがないのに、読む・書く・計算するなど特定の能力の習得が難しい障害。","注意欠陥多動性障害（ADHD）は、不注意・多動性・衝動性を特徴とする障害で、事例の自傷・他害の説明にはならない。","高次脳機能障害は、脳の損傷（脳血管障害や事故など）の後に起こる記憶や注意などの障害で、Ｆさんには脳損傷の情報はない。","自傷・他害が頻繁にみられ、家族で対応が難しい状態は強度行動障害。","気分障害は、うつ病や双極性障害など、気分の落ち込みや高揚が続く精神障害。"],"point":"強度行動障害は診断名ではなく「状態」を表す言葉で、自閉症スペクトラム障害や重度の知的障害のある人にみられやすい。「自傷・他害（かみつき・頭突き・頭をたたく）が頻繁で、家族では対応が難しい」が手がかり。","note":null}},{"id":"36-124","exam":36,"no":124,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｆ<\/b>さん（20歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）と重度の知的障害があり，自宅で母親（50歳），姉（25歳）と3人で暮らしている。<br><b>Ｆ<\/b>さんは生活介護事業所を利用している。事業所では比較的落ち着いているが，自宅に帰ってくると母親に対してかみつきや頭突きをすることがあった。また，自分で頭をたたくなどの自傷行為もたびたび見られる。<br>仕事をしている母親に代わり，小さい頃から食事や排泄の介護をしている姉は，これまで<b>Ｆ<\/b>さんの行動を止めることができていたが，最近ではからだが大きくなり力も強くなって，母親と協力しても止めることが難しくなっていた。<br>家族で今後のことを考えた結果，<b>Ｆ<\/b>さんは障害者支援施設に入所することになった。","stem":"<b>Ｆ<\/b>さんが入所してからも月1，2回は，姉が施設を訪ね，<b>Ｆ<\/b>さんの世話をしている。<br>ある日，担当の介護福祉職が姉に声をかけると，「小学生の頃から，学校が終わると友だちと遊ばずにまっすぐ家に帰り，母親に代わって，弟の世話をしてきた。今は，弟を見捨てたようで，申し訳ない」などと話す。<br>介護福祉職の姉への対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「これからも<b>Ｆ<\/b>さんのお世話をしっかり行ってください」","「<b>Ｆ<\/b>さんは落ち着いていて，自傷他害行為があるようには見えませんね」","「お姉さんは，小さい頃からお母さんの代わりをしてきたのですね」","「訪問回数を減らしてはどうですか」","「施設入所を後悔しているのですね。もう一度在宅ケアを考えましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"姉は、幼い頃から母親の代わりに弟を世話してきたこと、施設に入所させて申し訳ないと思っていることを打ち明けている。まずはその思いと、これまでの姉の歩みを受け止め、共感的に返すことが、姉の気持ちに寄り添う対応となる。","choices":["世話を続けるよう求めると、姉の負担感や罪悪感をさらに強める。","弟の様子を話題にしても、姉の気持ちを受け止めていない。自宅での大変さを否定するようにも受け取られかねない。","姉のこれまでの歩みを言葉にして受け止める共感的な対応。","訪問回数を減らすよう提案するのは、姉の気持ちを受け止める前の一方的な助言で、訪問を否定されたと感じさせる。","姉は後悔しているとは言っておらず、解釈を押しつけている。在宅ケアの再検討は、家族で考えた結論を覆すことにもなる。"],"point":"家族への対応の問題は、まず「相手の言葉をそのまま受け止めて返す」選択肢を選ぶ。助言・提案・励まし・相手の気持ちの決めつけは、受け止めた後の段階。子どもの頃から家族を世話してきた姉のように、ヤングケアラーだった家族の思いへの配慮も問われる。","note":null}},{"id":"36-125","exam":36,"no":125,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｆ<\/b>さん（20歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）と重度の知的障害があり，自宅で母親（50歳），姉（25歳）と3人で暮らしている。<br><b>Ｆ<\/b>さんは生活介護事業所を利用している。事業所では比較的落ち着いているが，自宅に帰ってくると母親に対してかみつきや頭突きをすることがあった。また，自分で頭をたたくなどの自傷行為もたびたび見られる。<br>仕事をしている母親に代わり，小さい頃から食事や排泄の介護をしている姉は，これまで<b>Ｆ<\/b>さんの行動を止めることができていたが，最近ではからだが大きくなり力も強くなって，母親と協力しても止めることが難しくなっていた。<br>家族で今後のことを考えた結果，<b>Ｆ<\/b>さんは障害者支援施設に入所することになった。","stem":"<b>Ｆ<\/b>さんが施設に入所して1年が経った。介護福祉職は，<b>Ｆ<\/b>さん，母親，姉と共にこれまでの生活と支援を振り返り，当面，施設で安定した生活が送れるように検討した。<br>次のうち，<b>Ｆ<\/b>さんの支援を修正するときに利用するサービスとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["地域定着支援","計画相談支援","地域移行支援","基幹相談支援","基本相談支援"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"障害福祉サービスを利用する人には、相談支援専門員がサービス等利用計画を作り、定期的にモニタリングして必要に応じて見直す。これが計画相談支援（サービス利用支援・継続サービス利用支援）で、施設に入所しているＦさんの支援を修正するときに利用する。","choices":["地域定着支援は、一人暮らしなどで地域生活をしている障害者に、常時の連絡体制を確保し、緊急時に対応するサービス。","サービス等利用計画の作成・見直しを行う計画相談支援。","地域移行支援は、施設に入所している人や精神科病院に入院している人が地域生活に移るための支援。Ｆさんは当面、施設での生活を続ける。","基幹相談支援センターは、地域の相談支援の中核となる機関の名前で、Ｆさん個人の支援計画を修正するサービスではない。","基本相談支援は、障害者や家族からの一般的な相談に応じる支援で、計画の作成・見直しそのものではない。"],"point":"相談支援は名前と目的で整理する。「計画相談支援＝サービス等利用計画の作成とモニタリング」「地域移行支援＝施設・病院から地域へ」「地域定着支援＝地域で暮らす人の緊急時対応」。事例の「当面、施設で安定した生活」は、地域移行ではなく計画の見直しを示す手がかり。","note":null}},{"id":"37-1","exam":37,"no":1,"subject":"人間の尊厳と自立","group":1,"case":null,"stem":"次の記述のうち，介護福祉職がアドボカシー（advocacy）の視点から行う対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護を行う前には，利用者に十分な説明をして同意を得る。","利用者の介護計画を作成するときに，他職種に専門的な助言を求める。","利用者個人の趣味を生かして，レクリエーション活動を行う。","希望を言い出しにくい利用者の意思をくみ取り，その実現に向けて働きかける。","視覚障害者が必要とする情報を，利用しやすいようにする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"アドボカシーは「権利擁護」「代弁」と訳される。自分の思いや権利を十分に主張できない利用者に代わって意思をくみ取り、その実現に向けて周囲や制度に働きかけることが中心となる。","choices":["説明と同意はインフォームド・コンセントの考え方。大切だが、代弁して働きかけるアドボカシーそのものではない。","他職種への助言の依頼は多職種連携（チームアプローチ）の場面。","趣味を生かす活動は個別性の尊重やQOLの向上の視点。","言い出しにくい利用者の意思をくみ取り、実現に向けて働きかけるのは、代弁・権利擁護の実践そのもの。","情報を利用しやすくするのは情報保障（アクセシビリティ）や合理的配慮の視点。"],"point":"アドボカシーの正解は「意思をくみ取る」＋「代わりに伝える・働きかける」の2要素がそろった選択肢。インフォームド・コンセント、多職種連携、合理的配慮など、どれも大切だが別の用語の説明になっている選択肢と区別する。","note":null}},{"id":"37-2","exam":37,"no":2,"subject":"人間の尊厳と自立","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（83歳，女性，要介護3）は，脳梗塞（cerebral infarction）の後遺症で左片麻痺があり，介護老人福祉施設で生活している。家族から，「できることは自分で行ってほしい」と希望があり，<b>Ａ<\/b>さんは自室から食堂まで車いすで自走することを日課としている。<br>1週間前から，介護福祉士養成施設の学生が<b>Ａ<\/b>さんのフロアで実習を開始した。数日前から<b>Ａ<\/b>さんは実習生に，「今日は腕が痛いので，食堂まで車いすを押してください」と依頼するようになった。悩んだ実習生は，実習指導者に相談をした。<br>実習生に対する実習指導者の最初の助言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「<b>Ａ<\/b>さんの腕は痛くないので，気にしないでください」","「どのようなときも，<b>Ａ<\/b>さん自身で行ってもらうことが必要です」","「ご家族から自分で行うように，言われています」","「それは自立につながらないので，車いすを押さないでください」","「<b>Ａ<\/b>さんが依頼する理由を，まず考えてみることが大切です」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ａさんの依頼には、腕の痛み、体調の変化、実習生と関わりたい気持ちなど、さまざまな理由が考えられる。自立支援は何でも自分でさせることではないので、まず依頼の理由を理解することが出発点になる。","choices":["痛みの訴えを根拠なく否定しており、確認もしていない。痛みが本当なら見逃すことになる。","「どのようなときも」と一律に決めつけている。体調によっては介助が必要な場合もある。","家族の希望を理由にしており、Ａさん本人の思いや状態を考えていない。","理由を確かめずに結論を出している。依頼の背景を知らないまま断ると、痛みや不安を見逃すおそれがある。","依頼の理由（痛み・体調・気持ちなど）をまず考えることで、本人に合った支援を判断できる。"],"point":"「最初の助言」「最初の対応」を問う事例では、結論を出す選択肢より「理由を考える」「気持ちを聴く」「状態を確認する」選択肢を選ぶ。「どのようなときも」「必ず」のような一律の表現は誤りのサインになりやすい。","note":null}},{"id":"37-3","exam":37,"no":3,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"人間関係と心理に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["自己愛とは，自分という存在を，他人と区別して意識することである。","自己同一性の確立とは，自分とは何かという認識をもつことである。","自我とは，日常行動に影響を与える，表面化していない意識のことである。","自己覚知とは，コミュニケーションにおいて自分について話すことである。","自己中心性とは，自分の意思で自分の行動をコントロールすることである。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"自己同一性（アイデンティティ）はエリクソンの発達理論で青年期の課題とされ、「自分とは何者か」という一貫した認識をもつことをいう。","choices":["自分を他人と区別して意識するのは「自己意識」の説明。自己愛は自分を愛し大切に思う気持ち（ナルシシズム）。","自分とは何かという認識をもつことが自己同一性の確立。","表面化していないのに行動に影響する意識は「無意識」の説明。自我は自分を意識し、行動をまとめる主体。","自分について話すのは「自己開示」。自己覚知は、自分の価値観・感情・考え方の傾向を自ら理解すること。","自分の行動を自分でコントロールするのは「自己統制（セルフコントロール）」。自己中心性はピアジェの用語で、自分の視点からしか物事を見られないこと。"],"point":"「自己」のつく用語は入れ替えのひっかけが多い。自己覚知＝自分を知る、自己開示＝自分を話す、自己同一性＝自分とは何かの認識、の3つを確実に区別する。介護職の自己覚知は「利用者への先入観に気づくため」に行うとセットで覚える。","note":null}},{"id":"37-4","exam":37,"no":4,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，男性）は，有料老人ホームに入所することになった。一人暮らしが長かった<b>Ａ<\/b>さんは，入所当日，担当の介護福祉職と話すことに戸惑っている様子で，なかなか自分のことを話そうとはしなかった。介護福祉職は，一方的な働きかけにならないように，<b>Ａ<\/b>さんとコミュニケーションをとるとき，あいづちを打ちながら<b>Ａ<\/b>さんの発話を引き出すように心がけた。<br>このときの，介護福祉職の対応の意図に当てはまるものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["互いの自己開示","コミュニケーション能力の評価","感覚機能の低下への配慮","認知機能の改善","双方向のやり取り"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"あいづちを打ちながら相手の発話を引き出すのは、介護福祉職が一方的に話すのではなく、相手からも言葉が返ってくる双方向のやり取りをつくるためである。","choices":["自己開示は自分のことを相手に話すこと。事例では介護福祉職が自分を語っておらず、あいづちで相手の話を促している。","能力を評価する目的の記述は事例にない。","視力や聴力の低下をうかがわせる記述はない。","認知機能の低下の記述はなく、改善を目的とした関わりでもない。","「一方的な働きかけにならないように」発話を引き出しており、双方向のやり取りを意図している。"],"point":"事例の中にある「一方的な働きかけにならないように」という言葉が答えの手がかり。事例問題は、問題文に書かれていない障害や目的（感覚機能の低下、評価など）を読み込まない。","note":null}},{"id":"37-5","exam":37,"no":5,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"次の記述のうち，介護福祉職のキャリアパスに関するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護計画を作成するときのポイントを明確にする。","介護福祉職の業務マニュアルを具体化する。","利用サービスに応じて求められる関係書類を検討する。","介護施設に必要な設備基準について確認する。","介護福祉職として必要な能力や経験を明確にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"キャリアパスとは、職員がどのような能力や経験を身につけると、どの職位・役割や処遇につながるのかという道筋を示すもの。介護職員等処遇改善加算の要件（キャリアパス要件）にも、職位・職責・職務内容に応じた任用要件や賃金体系の整備が含まれる。","choices":["介護計画作成のポイントは介護過程（個別の支援）の話。","業務マニュアルは日々の業務の標準化の話で、職員の成長の道筋ではない。","関係書類の検討は事務手続きの話。","設備基準は施設運営の基準の話。","職員として必要な能力や経験を明確にすることは、キャリアパスの中心となる内容。"],"point":"キャリアパスは「人（職員）の成長と処遇の道筋」。マニュアル・設備・書類など「業務や施設の仕組み」の選択肢とは区別する。あわせて、職場内研修のOJT（仕事を通じた指導）とOFF-JT（職場を離れた研修）、自己研鑽のSDSも覚える。","note":null}},{"id":"37-6","exam":37,"no":6,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"<b>Ｂ<\/b>介護老人福祉施設に，学校を卒業したばかりの元気な<b>Ｃ<\/b>介護福祉職が加わった。2か月後，ユニットリーダーが，「最近，<b>Ｃ<\/b>介護福祉職に笑顔が少ない。いつもとちがう様子だ」と，フォロワーである<b>Ｄ<\/b>介護福祉職に話した。<b>Ｄ<\/b>介護福祉職はチームの一員として何ができるのかを考えた。<br><b>Ｄ<\/b>介護福祉職が最初に行うフォロワーシップとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ｃ<\/b>介護福祉職に対して，元気を出すように励ます。","ユニットリーダーが気になっていることを詳しく聞く。","<b>Ｃ<\/b>介護福祉職の状況をユニット内のほかのメンバーと速やかに共有する。","施設長に対して，何か指示を出すようにお願いする。","<b>Ｃ<\/b>介護福祉職に対して，介助方法について教える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"フォロワーシップとは、メンバーがリーダーを支え、チームの目標達成に主体的に関わることをいう。リーダーが気になっている内容を詳しく聞き、状況を正確に把握することが、最初に取るべき行動である。","choices":["原因がわからないまま励ますと、かえって本人を追い詰めるおそれがある。","リーダーの気づきを詳しく聞いて情報を正確に把握することが、リーダーを支える最初の一歩になる。","状況がはっきりしないうちに広く共有すると、Ｃ介護福祉職への誤解やプライバシーの侵害につながりうる。","リーダーを飛び越えて施設長に指示を求めており、チームの一員としての行動ではない。","笑顔が少ない原因が介助技術だとは限らない。原因を確かめずに指導している。"],"point":"「最初に行う」フォロワーシップは「情報を確認する・リーダーに聞く」が基本。リーダーを飛び越える、原因を確かめずに励ます・教える、といった選択肢は誤りになりやすい。","note":null}},{"id":"37-7","exam":37,"no":7,"subject":"社会の理解","group":2,"case":null,"stem":"社会福祉法に基づく社会福祉法人に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["収益事業は禁止されている。","所轄庁は内閣府である。","設立時に所轄庁の認可は不要である。","評議員会を置く必要がある。","解散は禁止されている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"社会福祉法人には評議員会の設置が義務づけられている（2016年の社会福祉法改正で、2017年4月から全法人に必置）。評議員会は理事・監事の選任や定款変更などを決める議決機関である。","choices":["社会福祉事業に支障がない範囲で、収益を社会福祉事業などに充てるための収益事業を行うことができる。","所轄庁は原則として主たる事務所のある都道府県知事（区域によって市長、指定都市の長、厚生労働大臣）。内閣府ではない。","設立には定款について所轄庁の認可が必要。","評議員会は必置の機関。","解散は禁止されていない。評議員会の決議などの事由で解散でき、残余財産は他の社会福祉法人などに帰属する。"],"point":"社会福祉法人は「所轄庁の認可で設立」「評議員会・理事会・監事は必置」「収益事業も可」が基本。「禁止」「不要」と言い切る選択肢は疑ってかかる。","note":null}},{"id":"37-8","exam":37,"no":8,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，定期巡回・随時対応型訪問介護看護の説明として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用定員は，9人以下と定められている。","日中・夜間を通じて，提供するサービスである。","認知症対応型共同生活介護（認知症高齢者グループホーム）に入居する利用者に対して，機能訓練を行うサービスである。","通い，泊まり，看護の3種類の組合せによるサービスである。","都道府県が事業者の指定，指導，監督を行うサービスである。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"定期巡回・随時対応型訪問介護看護は、日中・夜間を通じて、定期的な巡回訪問と、通報を受けた随時の対応を、訪問介護と訪問看護を組み合わせて行う地域密着型サービスである。","choices":["「9人以下」はグループホーム（認知症対応型共同生活介護）の1ユニットの定員の上限。定期巡回は訪問サービスで、利用定員の定めはない。","24時間（日中・夜間を通じて）対応するのが特徴。","グループホームの入居者に機能訓練を行うサービスではない。在宅の要介護者が対象。","通い・泊まり・訪問を組み合わせ、看護も提供するのは看護小規模多機能型居宅介護。","地域密着型サービスなので、指定・指導・監督は市町村が行う。"],"point":"「定期巡回」は24時間・訪問介護＋訪問看護、「夜間対応型訪問介護」は夜間のみ・訪問介護だけ、と対で覚える。地域密着型サービスの指定権者は市町村、という点もよく問われる。","note":null}},{"id":"37-9","exam":37,"no":9,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ａ<\/b>さん（48歳，会社員）は，うつ症状から体調不良が続き，仕事を休むことが増えたため，自主的に退職した。その後，体調は回復したが，再就職先がなかなか見つからなかった。しばらく貯金で生活していたが，数か月後，生活を営むことができなくなってしまった。頼れる親族はなく，生活保護を受給することにした。<br>この事例において，日本国憲法に基づいて<b>Ａ<\/b>さんに保障された権利として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["団体交渉権","平等権","財産権","思想の自由","生存権"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"生活保護は、日本国憲法第25条の生存権（すべて国民は、健康で文化的な最低限度の生活を営む権利を有する）を具体化した制度である。","choices":["団体交渉権は第28条の労働基本権の1つで、労働者が使用者と交渉する権利。","平等権（第14条）は法の下の平等。生活保護の受給そのものを根拠づける権利ではない。","財産権（第29条）は財産を持つ権利の保障。","思想の自由（第19条）は精神的自由の1つ。","生活に困窮したときに最低限度の生活を保障されるのは生存権による。"],"point":"憲法の条文番号はセットで覚える。第13条＝幸福追求権（個人の尊重）、第14条＝法の下の平等、第25条＝生存権。「生活保護・社会保障」と出たら第25条を選ぶ。","note":null}},{"id":"37-10","exam":37,"no":10,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，保健所に関するものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["保健師助産師看護師法に基づいて設置されている。","すべての市町村に設置の義務がある。","業務には精神保健に関する事項が含まれている。","歯科衛生士を置かなくてはならない。","児童の一時保護を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"保健所は地域保健法に基づいて設置され、その業務には精神保健に関する事項が含まれる（ほかに、感染症などの疾病の予防、母子保健、食品衛生、環境衛生など）。","choices":["根拠法は地域保健法。保健師助産師看護師法は看護職の資格を定める法律。","設置するのは都道府県、指定都市、中核市、その他政令で定める市、特別区。すべての市町村に義務はない。市町村が設置するのは市町村保健センター（設置は任意）。","精神保健は保健所の業務の1つ。","歯科衛生士の配置は義務づけられていない。","児童の一時保護は児童相談所の業務。"],"point":"「保健所」と「市町村保健センター」の違いが頻出。保健所＝地域保健法・都道府県など・広域的で専門的、市町村保健センター＝身近な健康相談・健診。一時保護（児童相談所）や福祉事務所の業務との入れ替えにも注意する。","note":null}},{"id":"37-11","exam":37,"no":11,"subject":"社会の理解","group":2,"case":null,"stem":"地域包括支援センターの業務に関する記述として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["地域ケア会議の開催","施設サービスのケアプランの作成","成年後見制度の申請","介護認定審査会の設置","地域密着型サービスの事業者の指導・監督"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"地域ケア会議は、個別事例の検討を通じて地域の課題を見つけ、支援ネットワークづくりにつなげる会議で、地域包括支援センターが開催する（市町村も開催する）。","choices":["地域ケア会議の開催は地域包括支援センターの業務。","施設サービス計画は、その施設の介護支援専門員が作成する。","成年後見の申立てができるのは本人・配偶者・4親等内の親族・市町村長など。センターは権利擁護業務として制度の利用を支援するが、申立人にはならない。","介護認定審査会は市町村が設置する。","地域密着型サービス事業者の指定・指導・監督は市町村の権限。"],"point":"地域包括支援センターの業務は「総合相談支援」「権利擁護」「包括的・継続的ケアマネジメント支援」「介護予防ケアマネジメント」と地域ケア会議。市町村の権限（認定審査会の設置、地域密着型の指定）との入れ替えに注意する。","note":null}},{"id":"37-12","exam":37,"no":12,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ｂ<\/b>さん（85歳，男性，要支援1）は，自宅で一人暮らしをしている。最近，物忘れが多くなり，1か月前から地域支援事業の訪問型サービスを利用するようになった。ある日，<b>Ｂ<\/b>さんが，「これからも自宅で生活したいが，日中，話し相手がいなくて寂しい」と介護福祉職に話した。<br>次のうち，<b>Ｂ<\/b>さんに介護福祉職が勧めるサービスとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["認知症対応型共同生活介護（認知症高齢者グループホーム）","介護老人福祉施設","第一号通所事業（通所型サービス）","夜間対応型訪問介護","居宅療養管理指導"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"要支援1のＢさんは自宅で暮らし続けたいと望み、日中の話し相手がいないことを寂しく感じている。介護予防・日常生活支援総合事業の第一号通所事業（通所型サービス）なら、在宅のまま日中に人と交流する場をもてる。","choices":["グループホームは入居型で「自宅で生活したい」という希望に合わない。また要支援1は利用できない（介護予防のグループホームは要支援2から）。","介護老人福祉施設は入所施設で、原則として要介護3以上が対象。","在宅のまま通いで交流でき、要支援者が利用できる。","夜間対応型訪問介護は要介護者の夜間の訪問サービスで、日中の寂しさに対応しない。","居宅療養管理指導は医師・薬剤師などが訪問して療養上の指導を行うサービスで、話し相手の場にはならない。"],"point":"サービスを勧める事例は「本人の希望（自宅で暮らしたい）」「困りごと（日中寂しい）」「要介護度で使えるか」の3点で絞る。要支援者が使えないサービス（介護老人福祉施設、夜間対応型訪問介護など）を覚えておく。","note":null}},{"id":"37-13","exam":37,"no":13,"subject":"社会の理解","group":2,"case":null,"stem":"介護保険制度に関する記述として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["第1号被保険者の保険料は，都道府県が徴収する。","第1号被保険者の保険料は，全国一律である。","第2号被保険者の保険料は，年金保険の保険料と合わせて徴収される。","財源には，第1号被保険者の保険料と第2号被保険者の保険料が含まれる。","介護保険サービスの利用者負担割合は，一律，1割である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"介護保険の財源は、公費（国・都道府県・市町村）が50％、保険料が50％で、保険料には第1号被保険者の保険料と第2号被保険者の保険料の両方が含まれる。","choices":["第1号被保険者の保険料は、保険者である市町村（特別区を含む）が徴収する。","第1号被保険者の保険料は市町村ごとに決まり、所得段階別に設定されるため全国一律ではない。","第2号被保険者の保険料は、加入している医療保険の保険料と合わせて徴収される。年金保険の保険料とではない。","保険料財源には第1号・第2号の両方の保険料が含まれる。","利用者負担は原則1割だが、一定以上の所得がある人は2割または3割。"],"point":"「第1号＝65歳以上・市町村が徴収（年金からの天引きが多い）」「第2号＝40〜64歳・医療保険料と一緒に徴収」。年金から天引きする「特別徴収」と、医療保険料と合わせて集める第2号の徴収を混同させるひっかけに注意する。","note":"利用者負担を2割とする所得の範囲などは、国で見直しが検討されている。負担割合の基準が変わる可能性があるため、最新の基準は厚生労働省の資料で確認すること。"}},{"id":"37-14","exam":37,"no":14,"subject":"社会の理解","group":2,"case":null,"stem":"障害者の雇用の促進等に関する法律に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["2024年度（令和6年度）の民間企業の法定雇用率は，2.5％である。","精神障害者は，法定雇用率の対象から除外されている。","2024年度（令和6年度）に，障害者の雇用義務が生じるのは，従業員101人以上の事業主である。","週所定労働時間が10時間以上20時間未満の労働は認められていない。","2024年度（令和6年度）の事業主支援（助成金）は，2023年度（令和5年度）以前と同じである。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"民間企業の法定雇用率は、2024年4月から2.5％、2026年7月から2.7％と段階的に引き上げられることになっていた。試験時点の2024年度は2.5％である。","choices":["2024年度（令和6年度）の民間企業の法定雇用率は2.5％。","精神障害者は2018年4月から法定雇用率の算定基礎の対象に加わっている。","2024年度に雇用義務が生じるのは従業員40人以上の事業主（2.5％の場合）。101人以上は障害者雇用納付金の対象範囲（常用労働者100人超）と取り違えている。","週10時間以上20時間未満の労働は禁止されていない。2024年4月からは、この時間で働く重度身体障害者・重度知的障害者・精神障害者を1人0.5人として雇用率に算定できるようになった。","2024年4月から、雇用相談などに関する助成金の新設や既存の助成金の拡充が行われており、前年度以前と同じではない。"],"point":"法定雇用率は年度ごとの数値が問われる。数値と対象事業主の規模（2.5％なら40人以上、2.7％なら37.5人以上）をセットで覚える。2024年4月施行の「週10〜20時間未満の0.5カウント」も新しい論点。","note":"2026年7月から民間企業の法定雇用率は2.7％に引き上げられ、雇用義務の対象は従業員37.5人以上の事業主に広がった（国・地方公共団体は3.0％、都道府県などの教育委員会は2.9％）。今後受験する場合は、試験時点で適用される率を厚生労働省の資料で確認すること。"}},{"id":"37-15","exam":37,"no":15,"subject":"社会の理解","group":2,"case":null,"stem":"「障害者総合支援法」のサービスに関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護給付費の支給を受けるときに，障害支援区分の認定は不要である。","短期入所は介護給付の1つである。","地域生活支援事業は，国が実施主体である。","自立支援給付は応益負担である。","行動援護は訓練等給付の1つである。"],"notes":"（注）　「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"障害者総合支援法の介護給付には、居宅介護、重度訪問介護、同行援護、行動援護、療養介護、生活介護、短期入所、重度障害者等包括支援、施設入所支援がある。短期入所（ショートステイ）は介護給付の1つ。","choices":["介護給付費の支給には障害支援区分の認定が必要。","短期入所は介護給付に含まれる。","地域生活支援事業の実施主体は市町村と都道府県。国ではない。","自立支援給付の利用者負担は、所得に応じて上限が決まる応能負担が原則。","行動援護は介護給付。訓練等給付は自立訓練、就労移行支援、就労継続支援、共同生活援助など。"],"point":"「介護給付か訓練等給付か」は頻出。介護系（〜介護、〜援護、短期入所、施設入所支援）は介護給付、自立訓練・就労系・グループホームは訓練等給付と大まかに分ける。介護給付は障害支援区分の認定が必要、という点もセットで覚える。","note":null}},{"id":"37-16","exam":37,"no":16,"subject":"社会の理解","group":2,"case":null,"stem":"障害児支援に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["サービスを受けるには，療育手帳の取得が必要である。","放課後等デイサービスは，子ども・子育て支援法に基づく支援である。","障害児通所支援の利用には，障害児支援利用計画の作成は不要である。","障害児入所支援は，すべての市町村が実施主体である。","保育所等訪問支援は，保育所等を訪問し，障害のある児童が集団生活に適応できるように専門的な支援を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"保育所等訪問支援は児童福祉法に基づく障害児通所支援の1つで、支援員が保育所や学校などを訪問し、障害のある子どもが集団生活に適応できるよう、本人への支援や職員への助言を行う。","choices":["療育手帳がなくても、医師の意見書などで支援の必要性が認められればサービスを利用できる。","放課後等デイサービスは児童福祉法に基づく障害児通所支援。","障害児通所支援の利用には、障害児相談支援事業者が作成する障害児支援利用計画（保護者が作成するセルフプランも可）が必要。","障害児入所支援の実施主体は都道府県（指定都市・児童相談所設置市を含む）。市町村ではない。","保育所等を訪問して集団生活への適応を支援するサービスの説明として正しい。"],"point":"障害児支援の根拠法は児童福祉法（通所支援は市町村、入所支援は都道府県）。障害者総合支援法や子ども・子育て支援法との入れ替えが典型的なひっかけ。「手帳がないと使えない」も誤りの型。","note":null}},{"id":"37-17","exam":37,"no":17,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，サービス付き高齢者向け住宅に関するものとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「高齢者住まい法」に基づく，高齢者のための住まいである。","65歳以上の者が，市町村の措置によって入居する。","認知症高齢者を対象とした，共同生活の住居である。","食事サービスの提供が義務づけられている。","介護サービスの提供が義務づけられている。"],"notes":"（注）　「高齢者住まい法」とは，「高齢者の居住の安定確保に関する法律」のことである。","figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"サービス付き高齢者向け住宅は、高齢者住まい法に基づいて都道府県などに登録されるバリアフリー構造の賃貸住宅などで、安否確認（状況把握）と生活相談のサービスが必須とされている。","choices":["根拠法は高齢者住まい法。","入居は本人と事業者の契約による。市町村の措置で入所するのは養護老人ホーム。入居対象は60歳以上の人または要介護・要支援認定を受けた人など。","認知症高齢者の共同生活の住居は認知症対応型共同生活介護（グループホーム）。","食事サービスの提供は任意で、義務ではない。","介護サービスの提供は義務ではない。必要に応じて外部の介護保険サービスなどを契約して利用する。"],"point":"サ高住で義務なのは「安否確認（状況把握）」と「生活相談」の2つだけ。食事・介護は任意。「措置」は養護老人ホーム、「契約」はサ高住・有料老人ホーム、と入居の仕組みで区別する。","note":null}},{"id":"37-18","exam":37,"no":18,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ｃ<\/b>さん（60歳，男性）は，休日に自宅で趣味の家庭菜園の作業中に脳出血（cerebral hemorrhage）を起こして救急搬送された。特に麻痺はなく，その後，リハビリテーション病院に転院した。現在は，高次脳機能障害（higher brain dysfunction）の治療とリハビリテーションに専念している。<br>医療費を支払うときに<b>Ｃ<\/b>さんが利用する制度として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護保険制度","労働者災害補償保険制度","雇用保険制度","医療保険制度","年金制度"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"Ｃさんの脳出血は休日の自宅での趣味の作業中に起きており、業務上の病気ではない。病院での治療とリハビリテーションの医療費は、医療保険制度（健康保険など）を使って支払う。","choices":["60歳のＣさんは第2号被保険者で、脳血管疾患は特定疾病にあたるが、介護保険が給付するのは介護サービスであり、病院での治療の医療費ではない。","労災保険は業務上や通勤中の病気・けがが対象。休日の趣味の作業中の発症は対象外。","雇用保険は失業したときの給付などを行う制度で、医療費は支払わない。","業務外の病気の医療費は医療保険で支払う。","年金制度は障害や老齢などによる所得を保障する制度で、医療費の支払いには使わない。"],"point":"医療費の制度は「業務上・通勤中なら労災保険、それ以外は医療保険」で判断する。事例の「休日」「自宅」「趣味」という言葉が労災を外す手がかり。介護保険は「医療費」ではなく「介護サービス」の費用、と区別する。","note":null}},{"id":"37-19","exam":37,"no":19,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，恐怖や不安，喜びなどの情動に関わる脳の機能局在の部位として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["扁桃体","小脳","下垂体","海馬","視床下部"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"扁桃体は大脳辺縁系の一部で、恐怖・不安・喜びなどの情動の発生や、好き嫌いの判断に関わる。","choices":["情動の中心となる部位は扁桃体。","小脳は体の平衡や、運動の調整（スムーズな動き）に関わる。","下垂体は成長ホルモンなど多くのホルモンを分泌する内分泌器官。","海馬は記憶（新しい記憶の形成）に関わる。扁桃体のすぐ近くにあるため取り違えやすい。","視床下部は体温・食欲・睡眠などを調整する自律神経やホルモン分泌の中枢。"],"point":"大脳辺縁系の「扁桃体＝情動」「海馬＝記憶」は対で覚える。アルツハイマー型認知症で早くから萎縮するのは海馬、という知識ともつながる。","note":null}},{"id":"37-20","exam":37,"no":20,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，顔の感覚に関与する脳神経として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["嗅神経","三叉神経","顔面神経","迷走神経","舌下神経"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"三叉神経（第Ⅴ脳神経）は顔面の皮膚感覚（触覚・痛覚・温度覚など）を伝え、咀嚼筋の運動にも関わる。","choices":["嗅神経はにおいの感覚を伝える。","顔の感覚は三叉神経が担う。","顔面神経は表情筋の運動や舌の前方3分の2の味覚などに関わる。名前は「顔面」だが、顔の皮膚感覚の神経ではない。","迷走神経は心臓・肺・消化管など内臓の働きの調整や、のどの運動・感覚に関わる。","舌下神経は舌の運動に関わる。"],"point":"「顔の感覚＝三叉神経」「顔の動き（表情）＝顔面神経」が典型的なひっかけ。顔面神経麻痺では表情がゆがむ、三叉神経痛では顔に激しい痛みが出る、と症状で覚えると区別しやすい。","note":null}},{"id":"37-21","exam":37,"no":21,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次の記述のうち，鼻の構造と機能として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["鼻腔は前鼻道・中鼻道・後鼻道に分かれる。","鼻毛は塵や埃を除去する。","鼻腔の奥は喉頭に直接つながっている。","鼻腔には毛細血管は少ない。","嗅細胞は外鼻孔にある。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"鼻毛は、吸い込んだ空気に含まれる塵や埃を取り除くフィルターの働きをする。","choices":["鼻腔は上鼻道・中鼻道・下鼻道に分かれる。前・後ではなく上・中・下。","鼻毛は塵や埃を除去する。","鼻腔の奥は咽頭（上咽頭）につながる。喉頭は咽頭のさらに下で、気管の入口にあたる。","鼻腔の粘膜には毛細血管が豊富で、空気を温め加湿する。鼻中隔の前方（キーゼルバッハ部位）は鼻出血が起こりやすい。","嗅細胞は鼻腔の天井部分の嗅上皮にある。外鼻孔（鼻の穴の入口）ではない。"],"point":"鼻の構造は「上・中・下の3つの鼻道」「鼻腔→咽頭→喉頭」の順番を押さえる。鼻出血の多くは鼻の入口近くのキーゼルバッハ部位から起こるので、小鼻を圧迫して止血する、という生活支援の知識もセットで覚える。","note":null}},{"id":"37-22","exam":37,"no":22,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，歯周病（periodontal disease）の症状として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["歯のくぼみの形成","歯の硬組織の軟化","歯髄の炎症・疼痛","歯のエナメル質の侵蝕","歯周ポケットの形成"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"歯周病は歯と歯ぐきの境目にたまった歯垢（プラーク）の細菌によって歯肉に炎症が起き、歯と歯肉の間の溝が深くなって歯周ポケットが形成される。進むと歯を支える骨が溶け、歯がぐらつく。","choices":["歯にくぼみ（穴）ができるのはう蝕（むし歯）。","歯の硬組織が溶けて軟らかくなるのはう蝕の変化。","歯髄の炎症・痛みは、う蝕が進んで神経まで達したときの症状。","エナメル質が溶けて侵されるのは、う蝕や、酸性の飲食物などによる酸蝕症の変化。","歯周ポケットの形成は歯周病の特徴的な症状。"],"point":"「歯そのものが壊れる＝う蝕」「歯を支える歯ぐきや骨が壊れる＝歯周病」と分ける。歯周病は糖尿病の悪化や誤嚥性肺炎とも関係するため、口腔ケアの重要性の問題でも出題される。","note":null}},{"id":"37-23","exam":37,"no":23,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ａ<\/b>さん（78歳，女性）は，友人から口臭を指摘されて悩んでいる。また，食事をするときに，「水分と一緒に食べないと飲み込みにくい」とも話している。<b>Ａ<\/b>さんに歯の欠損，麻痺はなく，ストレスの訴えもない。<br>次のうち，<b>Ａ<\/b>さんのからだの中で，機能低下が考えられるものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["咀嚼","蠕動運動","嗅覚","唾液分泌","胃液分泌"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"唾液には口の中を洗い流す自浄作用があり、分泌が減ると細菌が増えて口臭が強くなる。また、唾液が少ないと食べ物をまとめて飲み込みやすい塊（食塊）にできず、水分がないと飲み込みにくくなる。","choices":["歯の欠損や麻痺はないとされており、噛む機能（咀嚼）の低下を示す情報はない。","蠕動運動は食道や腸で食べ物を送る動き。口臭や口の中での飲み込みにくさの説明には合わない。","嗅覚の低下は自分がにおいを感じにくくなることで、他人に口臭を指摘される原因ではない。","口臭と「水分と一緒でないと飲み込みにくい」の両方を説明できるのは唾液分泌の低下。","胃液は胃での消化に関わり、口の中での飲み込みにくさとは関係が薄い。"],"point":"事例の症状を2つ以上結びつけて考える。「口臭」＋「パサパサして飲み込みにくい」は唾液分泌低下（口腔乾燥）の典型。ストレスや薬の副作用、加齢でも唾液は減る。唾液腺マッサージや水分補給が対応になる。","note":null}},{"id":"37-24","exam":37,"no":24,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"皮膚の構造に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["表皮の厚さは平均2.0 mm である。","真皮には角質層がある。","外界と接する組織は表皮である。","皮脂腺は皮下組織にある。","表皮の最表面は基底層である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"皮膚は外側から表皮・真皮・皮下組織の3層からなり、外界と直接接するのは表皮である。","choices":["表皮の厚さは平均0.2mm程度で、2.0mmは厚すぎる。","角質層は表皮の最も外側の層で、真皮にはない。","外界と接するのは表皮。","皮脂腺は真皮にある。","表皮の最表面は角質層。基底層は表皮の最も深い層で、新しい細胞がつくられる。"],"point":"表皮は外から「角質層→顆粒層→有棘層→基底層」。最表面と最深部の入れ替えが典型的なひっかけ。皮脂腺は表皮ではなく真皮にある、とあわせて覚える。","note":null}},{"id":"37-25","exam":37,"no":25,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，高齢者が嗜好や温度覚の低下によって高温浴を希望した場合に，説明すべき高温浴の特徴として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["血圧の上昇","腸蠕動の促進","腎機能の促進","副交感神経の亢進","心機能の抑制"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"42℃以上の高温浴は交感神経を刺激し、血圧の上昇や脈拍の増加を招く。高齢者では脳卒中や心臓発作などの危険が高まるため、その点を説明する必要がある。","choices":["高温浴は交感神経の働きで血圧を上昇させる。","交感神経が優位になると腸の蠕動は抑えられる。腸の動きを促すのはぬるめの湯（副交感神経優位）。","交感神経が優位になると腎臓への血流は減り、腎機能は抑えられる。","高温浴で亢進するのは交感神経。副交感神経が優位になるのは38〜40℃程度のぬるめの湯。","心機能は抑えられるのではなく、心拍数が増え心臓への負担が大きくなる。"],"point":"入浴の温度は「熱い湯＝交感神経＝血圧上昇・興奮・腸と腎は抑制」「ぬるい湯＝副交感神経＝リラックス・腸の動き促進」と対で覚える。","note":null}},{"id":"37-26","exam":37,"no":26,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，食物の栄養素の大部分を吸収する部位として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["胃","小腸","直腸","横行結腸","Ｓ状結腸"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"小腸（十二指腸・空腸・回腸）は、内側の粘膜にある多数の絨毛で表面積が大きくなっており、栄養素の大部分を吸収する。","choices":["胃は食物を胃液と混ぜて消化する場所で、吸収はアルコールなど一部に限られる。","栄養素の大部分は小腸で吸収される。","直腸は便をためて排出する部位。","横行結腸を含む大腸では主に水分と電解質が吸収される。","Ｓ状結腸も大腸の一部で、主に水分を吸収し便を形づくる。"],"point":"「栄養素＝小腸、水分＝大腸」と覚える。消化管の順番（口腔→咽頭→食道→胃→十二指腸→空腸→回腸→盲腸→上行結腸→横行結腸→下行結腸→Ｓ状結腸→直腸）も頻出。","note":null}},{"id":"37-27","exam":37,"no":27,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次の記述のうち，レム睡眠に関するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["記憶を整理し，定着させる。","脳を休息させる。","入眠初期に出現する。","成長ホルモンの分泌を促す。","深い眠りの状態である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"レム睡眠は、体は休んでいるが脳は活発に活動している浅い眠りで、夢を見やすく、記憶を整理して定着させる働きがあるとされる。","choices":["記憶の整理・定着はレム睡眠の役割とされる。","脳を休ませるのはノンレム睡眠。","入眠初期に出現するのはノンレム睡眠。レム睡眠はその後に現れ、明け方に向けて長くなる。","成長ホルモンは入眠初期の深いノンレム睡眠のときに多く分泌される。","深い眠りはノンレム睡眠。レム睡眠は浅い眠り。"],"point":"「レム＝脳は活動・体は休息・夢・記憶の整理」「ノンレム＝脳の休息・入眠直後・深い眠り・成長ホルモン」と対で覚える。睡眠は約90分周期でこの2つを繰り返す。","note":null}},{"id":"37-28","exam":37,"no":28,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ｂ<\/b>さん（76歳，男性）は，この数週間，日中に，「眠い」と訴えている。<b>Ｂ<\/b>さんは毎日15時にコーヒー1杯を飲み，たばこを1本吸い，21時に就寝する。夜間の睡眠状態を数日間観察すると，睡眠中にぴくぴくと下肢が動いていることがたびたびあった。起床後，手足に異常を感じるかを<b>Ｂ<\/b>さんに確認したが，「特にない」とのことだった。<br>次のうち，<b>Ｂ<\/b>さんの睡眠障害の原因として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ニコチン摂取","レム睡眠行動障害","レストレスレッグス症候群","カフェイン摂取","周期性四肢運動障害"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"睡眠中に下肢がぴくぴくと繰り返し動き、そのたびに眠りが浅くなるため、本人は自覚がないまま日中の眠気が生じる。これは周期性四肢運動障害の特徴である。","choices":["たばこは15時の1本だけで、21時の就寝までに時間がある。また、下肢の動きを説明できない。","レム睡眠行動障害は、夢の内容に合わせて大声を出したり手足を激しく動かしたりする。ぴくぴくとした下肢の動きとは異なる。","レストレスレッグス症候群は、主に夕方から夜、じっとしていると脚にむずむずした不快感があり動かしたくなる病気。Ｂさんは異常を感じていない。","コーヒーは15時の1杯で就寝まで6時間あり、下肢の動きの説明にもならない。","睡眠中の周期的な下肢のぴくつきと、本人の自覚がないこと、日中の眠気が当てはまる。"],"point":"「脚の不快感があり、起きているときに自覚する＝レストレスレッグス症候群（むずむず脚症候群）」「眠っている間の脚のぴくつきで、本人は気づかない＝周期性四肢運動障害」。事例の「異常を感じない」が決め手になる。","note":null}},{"id":"37-29","exam":37,"no":29,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，呼吸中枢がある部位として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["大脳","中脳","小脳","延髄","脊髄"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"延髄は脳幹の一部で、呼吸中枢や循環（心臓・血管）の中枢があり、生命の維持に欠かせない。","choices":["大脳は思考・判断・言語・随意運動などの高度な機能を担う。","中脳は眼球運動や瞳孔の反射（対光反射）などに関わる。","小脳は体の平衡や運動の調整に関わる。","呼吸中枢は延髄にある。","脊髄は脳と体の間で神経の信号を伝える通り道で、反射の中枢でもあるが、呼吸中枢ではない。"],"point":"脳幹（中脳・橋・延髄）は生命維持の中枢。「延髄＝呼吸・循環・嚥下」「中脳＝対光反射」「視床下部＝体温・食欲」「小脳＝平衡」の組合せで覚える。","note":null}},{"id":"37-30","exam":37,"no":30,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，脳の機能停止を示す徴候に該当するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["呼吸不全","溢流性尿失禁","心停止","蠕動運動の減弱","瞳孔散大・対光反射消失"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"瞳孔の大きさや対光反射は脳幹（中脳）が調整している。瞳孔が開いたままで光を当てても縮まない状態（瞳孔散大・対光反射消失）は、脳の機能が停止したことを示す徴候である。","choices":["呼吸不全は呼吸の働きが不十分な状態で、呼吸停止とは違う。脳の機能停止を示す徴候とはいえない。","溢流性尿失禁は、前立腺肥大症などで膀胱に尿がたまりすぎ、あふれ出る失禁。","心停止は心臓の機能停止を示す徴候。死の三徴候の1つだが、脳の機能停止を示すものではない。","蠕動運動の減弱は消化管の働きの低下で、脳の機能停止の徴候ではない。","瞳孔散大・対光反射消失は脳の機能停止を示す。"],"point":"死の三徴候は「呼吸停止」「心停止」「瞳孔散大・対光反射消失」。それぞれ肺・心臓・脳の機能停止に対応する。「呼吸不全」のように「停止」でない言葉に置き換えたひっかけに注意する。","note":null}},{"id":"37-31","exam":37,"no":31,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，子どもの標準的な成長として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["1歳半から2歳ごろに，ハイハイをして移動できるようになる。","生後9か月から1歳ごろに，指をさして自分の関心や欲求を他者に伝えられるようになる。","子どもが使う言葉が急に増える語彙爆発は，5歳を過ぎたころに生じる。","人見知りの反応は，2歳を過ぎたころに生じる。","イヤイヤをしてすぐに泣く行動は，第二反抗期に生じる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"生後9か月から1歳ごろには、相手と同じものに注意を向ける共同注意が成立し、指さしで自分の関心や欲求を伝えるようになる。言葉の発達の土台となる行動である。","choices":["ハイハイは生後8〜10か月ごろに始まるのが標準。1歳半〜2歳ごろには多くの子どもが歩いている。","指さしによる伝達は生後9か月〜1歳ごろに現れる。","語彙爆発（話せる言葉が急に増える）は1歳半〜2歳ごろに起こる。","人見知りは生後6〜8か月ごろに始まる。親しい人と知らない人を区別できるようになった表れ。","イヤイヤ（自己主張・反抗）が目立つのは2〜3歳ごろの第一反抗期。第二反抗期は思春期。"],"point":"乳幼児の発達は「月齢・年齢」の入れ替えが定番。人見知り（6〜8か月）→ハイハイ（8〜10か月）→指さし（9か月〜1歳）→歩行（1歳ごろ）→語彙爆発（1歳半〜2歳）→第一反抗期（2〜3歳）の順で覚える。","note":null}},{"id":"37-32","exam":37,"no":32,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，神経性無食欲症（anorexia nervosa）に関するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["活動性が高まる。","学童期に最も生じやすい。","太ることへの恐怖はみられない。","低体重の深刻さを理解している。","多くが男性である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"神経性無食欲症（拒食症）では、強いやせがあるにもかかわらず、過剰に運動するなど活動性が高まることが多い。","choices":["やせていても活動性が高まる（過活動）のが特徴の1つ。","好発年齢は思春期から青年期。学童期に最も多いわけではない。","太ることへの強い恐怖があり、体重が増えないよう食事を制限する。","低体重の深刻さを認めない（病気の自覚が乏しい）ことが特徴。","患者の多くは女性。"],"point":"神経性無食欲症は「思春期〜青年期の女性に多い」「太ることへの恐怖」「やせの深刻さを認めない」「活動性は高い」の4点。「やせて元気がない」というイメージで選ぶと間違える。","note":null}},{"id":"37-33","exam":37,"no":33,"subject":"発達と老化の理解","group":6,"case":null,"stem":"<b>Ａ<\/b>さん（73歳，男性）は，会社の役員として勤めていたが，3年前に退職した。地域の老人クラブへの入会を勧められたが拒否している。毎年，敬老の日に記念品が配布されても，不快感を示して受け取らない。退職後も会社の状況を気にしていて，後輩とときどき連絡をとっている。<b>Ａ<\/b>さんは，身体が衰えることに強い不安を感じて，筋力トレーニングを毎日行っている。会社の後輩から，「いつも若々しいですね」と言われることに喜びを感じている。<br>ライチャード（Reichard, S.）による，引退後の男性の5つの適応タイプのうち，<b>Ａ<\/b>さんに相当するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["外罰（憤慨）型","内罰（自責）型","円熟（成熟）型","自己防衛（装甲）型","ロッキングチェアー（安楽椅子）型"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"Ａさんは、老人クラブへの入会や敬老の記念品を拒み、老いを受け入れていない。身体の衰えへの強い不安を、毎日の筋力トレーニングなど活動を続けることで打ち消そうとしている。これはライチャードの自己防衛（装甲）型にあたる。","choices":["外罰（憤慨）型は、自分の老いや人生の失敗を他人や社会のせいにして攻撃的になるタイプ。Ａさんに他者を責める様子はない。","内罰（自責）型は、人生を失敗とみなして自分を責め、ふさぎこむタイプ。","円熟（成熟）型は、老いを受け入れ、現在の生活に満足して積極的に社会と関わるタイプ。Ａさんは老いを拒んでいる。","老いへの不安に対し、活動を続けることで自分を守ろうとする自己防衛（装甲）型。","ロッキングチェアー（安楽椅子）型は、引退を受け入れ、責任から解放された受け身の生活に満足するタイプ。"],"point":"ライチャードの5類型のうち、適応的なのは円熟型・ロッキングチェアー型・自己防衛型、不適応なのは外罰型・内罰型。事例では「老いを拒む＋活動で不安を打ち消す」なら自己防衛型、「他人を責める」なら外罰型、「自分を責める」なら内罰型と、キーワードで判断する。","note":null}},{"id":"37-34","exam":37,"no":34,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，結晶性知能に関する説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["感覚や運動に基づく知能である。","過去に得た知識を活用して問題を解決する能力である。","40～50歳で急激に低下する。","知識や文化の影響よりも，生理的な老化の影響を受けやすい。","その場で新しい問題を解決する能力である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"結晶性知能は、教育や経験を通じて積み重ねた知識や判断力を活用して問題を解決する能力で、高齢になっても維持されやすい。","choices":["感覚と運動を通して外界を理解するのは、ピアジェの発達段階の感覚運動期（0〜2歳ごろ）の考え方で、結晶性知能の説明ではない。","過去に得た知識や経験を生かして問題を解決するのが結晶性知能。","結晶性知能は60歳ごろまで維持・上昇し、その後ゆるやかに低下するとされる。40〜50歳で急激に低下するわけではない。","生理的な老化の影響を受
