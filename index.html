"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｄ<\/b>さん（男性，障害支援区分4）は，ベッカー型筋ジストロフィー（Becker muscular dystrophy）である。自宅で家族と生活をしている。<b>Ｄ<\/b>さんは，食事は自立しているが，排泄，入浴に介護が必要である。歩行はできず，移動は電動車いすを使用している。絵を描くことが趣味であり，日中は創作活動に取り組んでいる。<br>これまで<b>Ｄ<\/b>さんは自宅で家族の介護を受けながら生活してきたが，<b>Ｄ<\/b>さんの身体機能の低下に伴い，家族の介護負担が増えたため，居宅介護を利用することになった。","stem":"<b>Ｄ<\/b>さんが居宅介護を利用してから数年が経過し，<b>Ｄ<\/b>さんの身体機能は徐々に低下して，着替えに時間がかかるようになった。<b>Ｄ<\/b>さんは自分のことはできるだけ自分で行いたいという思いがあり，時間がかかっても自分で着替えをしていた。<br>ある日，<b>Ｄ<\/b>さんは<b>Ｆ<\/b>介護福祉職に，「着替えをすると疲れてしまい，絵を描くことができない」とつぶやいた。<b>Ｆ<\/b>介護福祉職は，「着替えは私たちや家族の介護を利用して，<b>Ｄ<\/b>さんは好きな絵を描いたらいいのではないですか」と伝えた。その後，<b>Ｄ<\/b>さんは介護福祉職と家族の介護を利用して，短時間で着替えを済ませ，絵を描くことに専念できるようになった。<br><b>Ｆ<\/b>介護福祉職が発言した自立観を示した人物として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ヴィクトール・フランクル（Frankl, V.）","バンク－ミケルセン（Bank-Mikkelsen, N.）","エド・ロバーツ（Roberts, E.）","フェリックス・バイステック（Biestek, F.）","ミルトン・メイヤロフ（Mayeroff, M.）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"エド・ロバーツは、アメリカの自立生活運動（ＩＬ運動）の中心となった人物である。自立生活運動では、他人の介助を受けても、自分で決めて自分らしく生きることを自立と考える。介助を使って着替えを短時間で済ませ、絵を描くことに時間と体力を使うという考え方は、この自立観に当たる。","choices":["フランクルは、強制収容所での体験をもとに、どんな状況でも人は生きる意味を見いだせることを説いた精神科医。","バンク-ミケルセンは「ノーマライゼーションの父」と呼ばれ、障害のある人も普通の生活を送れるようにする理念を広めた。","介助を受けながら自己決定で生活する自立観は、エド・ロバーツらの自立生活運動の考え方。","バイステックは、援助関係における「ケースワークの7原則」を示した。","メイヤロフは『ケアの本質』で、ケアとは相手の成長を助けることだと論じた。"],"point":"身の回りの動作を自分で行うことだけが自立ではなく、介助を使っても自分で選び決めることも自立、というのが自立生活運動の考え方。事例で「介助を利用して、本人がやりたいことに力を使う」場面が出たら、エド・ロバーツ（自立生活運動）を思い出す。","note":null}},{"id":"37-123","exam":37,"no":123,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｇ<\/b>さん（38歳，女性）は，母親（65歳）と暮らしていた。両側性感音難聴（sensorineural hearing loss）があり，雑音がある場所では話を聞き取りにくい。相手の口の動きや表情から会話の内容を理解することはできる。<b>Ｇ<\/b>さんは，脳梗塞（cerebral infarction）を発症し，左片麻痺で車いすの生活となり，障害支援区分4と認定された。母親による介護が難しくなったため，障害者支援施設に入所することになった。<br><b>Ｇ<\/b>さんは，写真を撮ることが好きで，施設で近くの公園に出かけたときに，介護福祉職に手伝ってもらいながら好きな風景を撮影している。<b>Ｇ<\/b>さんは，その写真をアルバムにして，母親にプレゼントしたいと考えている。<br>ある日，<b>Ｇ<\/b>さんから，「アルバムを作りたい。飾りの付け方やメッセージの書き方を教えてほしい」と相談があった。介護福祉職は，<b>Ｇ<\/b>さんとアルバムを作ることにした。","stem":"次のうち，<b>Ｇ<\/b>さんが施設入所支援と同時に利用している障害福祉サービスとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["自立生活援助","療養介護","短期入所","生活介護","居宅介護"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"施設入所支援は、障害者支援施設で主に夜間に入浴・排泄・食事などの介護を行うサービスで、日中は生活介護などの日中活動系サービスと組み合わせて利用する。施設入所支援と生活介護を併せて利用できるのは、原則として障害支援区分4以上（50歳以上は区分3以上）の人で、区分4のＧさんはこれに当たる。","choices":["自立生活援助は、施設やグループホームなどから一人暮らしに移った人を、定期的な訪問などで支えるサービス。","療養介護は、医療と常時の介護が必要な人（人工呼吸器を使うALSの人など）が、主に昼間に病院で受けるサービス。","短期入所は、自宅で暮らす人が、介護者の休息などのために短期間施設に入所するサービス。","施設入所支援と組み合わせて、日中に生活介護を利用する。","居宅介護は、自宅に訪問して介護などを行うサービスで、施設に入所しているＧさんは対象外。"],"point":"障害者支援施設は「昼＝生活介護など（日中活動）」「夜＝施設入所支援」の組み合わせと覚える。自宅で暮らす人のためのサービス（居宅介護・短期入所）は、入所中の人の答えにならない。","note":null}},{"id":"37-124","exam":37,"no":124,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｇ<\/b>さん（38歳，女性）は，母親（65歳）と暮らしていた。両側性感音難聴（sensorineural hearing loss）があり，雑音がある場所では話を聞き取りにくい。相手の口の動きや表情から会話の内容を理解することはできる。<b>Ｇ<\/b>さんは，脳梗塞（cerebral infarction）を発症し，左片麻痺で車いすの生活となり，障害支援区分4と認定された。母親による介護が難しくなったため，障害者支援施設に入所することになった。<br><b>Ｇ<\/b>さんは，写真を撮ることが好きで，施設で近くの公園に出かけたときに，介護福祉職に手伝ってもらいながら好きな風景を撮影している。<b>Ｇ<\/b>さんは，その写真をアルバムにして，母親にプレゼントしたいと考えている。<br>ある日，<b>Ｇ<\/b>さんから，「アルバムを作りたい。飾りの付け方やメッセージの書き方を教えてほしい」と相談があった。介護福祉職は，<b>Ｇ<\/b>さんとアルバムを作ることにした。","stem":"次のうち，<b>Ｇ<\/b>さんの難聴の原因となっている損傷部位に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["内耳から聴神経","外耳道から中耳","耳介から中耳","耳介から外耳道","耳介"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"感音難聴は、内耳から聴神経、脳の聴覚の中枢までの部分が障害されて起こる難聴である。音がゆがんで聞こえるため、雑音がある場所では話を聞き取りにくい。","choices":["内耳から聴神経の障害で起こるのが感音難聴。","外耳道から中耳の障害で起こるのは伝音難聴。","耳介から中耳は音を伝える部分（伝音系）で、その障害は伝音難聴の原因になる。","耳介から外耳道も伝音系で、感音難聴の原因ではない。","耳介は音を集める部分で、感音難聴の原因ではない。"],"point":"「伝音難聴＝外耳・中耳（音を伝える部分）・音が小さく聞こえる・補聴器の効果が出やすい」「感音難聴＝内耳・聴神経（音を感じる部分）・音がゆがむ・老人性難聴も感音難聴」とセットで覚える。","note":null}},{"id":"37-125","exam":37,"no":125,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ｇ<\/b>さん（38歳，女性）は，母親（65歳）と暮らしていた。両側性感音難聴（sensorineural hearing loss）があり，雑音がある場所では話を聞き取りにくい。相手の口の動きや表情から会話の内容を理解することはできる。<b>Ｇ<\/b>さんは，脳梗塞（cerebral infarction）を発症し，左片麻痺で車いすの生活となり，障害支援区分4と認定された。母親による介護が難しくなったため，障害者支援施設に入所することになった。<br><b>Ｇ<\/b>さんは，写真を撮ることが好きで，施設で近くの公園に出かけたときに，介護福祉職に手伝ってもらいながら好きな風景を撮影している。<b>Ｇ<\/b>さんは，その写真をアルバムにして，母親にプレゼントしたいと考えている。<br>ある日，<b>Ｇ<\/b>さんから，「アルバムを作りたい。飾りの付け方やメッセージの書き方を教えてほしい」と相談があった。介護福祉職は，<b>Ｇ<\/b>さんとアルバムを作ることにした。","stem":"次の記述のうち，<b>Ｇ<\/b>さんに介護福祉職がアルバムの作り方を説明するときに配慮することとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ｇ<\/b>さんの左側に座る。","閉じられた質問を用いる。","小さな声で話す。","<b>Ｇ<\/b>さんの好きな音楽を流す。","1対1で向かい合って話す。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Ｇさんは雑音のある場所では聞き取りにくいが、相手の口の動きや表情から会話を理解できる。1対1で向かい合って話すと、口の動きや表情が見え、ほかの人の声などの雑音も少なくなるため、説明が伝わりやすい。","choices":["横に座ると、Ｇさんから話し手の口の動きや表情が見えにくくなる。さらにＧさんは左片麻痺で、左側に座ると麻痺側からの関わりにもなる。","閉じられた質問は「はい・いいえ」などで答える質問。作り方を説明する場面で優先すべきは、質問の種類ではなく、Ｇさんが話し手の口元を見られるようにすることである。","小さな声では、聞こえにくいＧさんはさらに聞き取りにくくなる。","音楽は雑音となり、話の聞き取りを妨げる。","1対1で向かい合い、口の動きや表情が見えるように話す。"],"point":"難聴のある人とのコミュニケーションは「静かな環境」「正面から口元を見せる」「はっきり・ゆっくり話す」が基本。事例文にある「できること（口の動きや表情から理解できる）」を生かす選択肢を選ぶ。","note":null}},{"id":"38-1","exam":38,"no":1,"subject":"人間の尊厳と自立","group":1,"case":null,"stem":"社会福祉の理念を発展させた人物に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["バンク-ミケルセン（Bank-Mikkelsen, N.）は，「ソーシャルロール・バロリゼーション（Social Role Valorization）」を提唱した。","ニィリエ（Nirje, B.）は，「ノーマライゼーション（normalization）の8つの原理」を提唱した。","ヴォルフェンスベルガー（Wolfensberger, W.）は，「エーデル改革」を提唱した。","リッチモンド（Richmond, M.）は，「ケースワークの7原則」を提唱した。","エリクソン（Erikson, E.）は，「自立生活運動の理念」を提唱した。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"ニィリエはノーマライゼーションの理念を具体化し、「1日のノーマルなリズム」など8つの原理として整理した。","choices":["ソーシャルロール・バロリゼーションはヴォルフェンスベルガーの提唱。バンク-ミケルセンは「ノーマライゼーションの父」。","ニィリエが「ノーマライゼーションの8つの原理」を示した。","エーデル改革はスウェーデンの高齢者ケア改革（1992年）で、ヴォルフェンスベルガーとは無関係。","「ケースワークの7原則」はバイステック。リッチモンドは「ケースワークの母」。","自立生活運動はアメリカの障害者運動（ロバーツら）。エリクソンは心理社会的発達理論。"],"point":"人物と業績の組み合わせ問題は毎年出る。「バンク-ミケルセン＝ノーマライゼーションの父」「ニィリエ＝8つの原理」「ヴォルフェンスベルガー＝社会的役割の価値付与」「バイステック＝7原則」の4組をセットで覚える。誤りの選択肢は、他の人物の業績と入れ替えて作られることが多い。","note":null}},{"id":"38-2","exam":38,"no":2,"subject":"人間の尊厳と自立","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（62歳，男性，要介護2）は，2年前に筋萎縮性側索硬化症（amyotrophic lateral sclerosis：ＡＬＳ）と診断された。妻と自宅で過ごしたいと希望し，訪問介護（ホームヘルプサービス）と訪問看護を利用している。最近，症状が進行し，サービス担当者会議で，<b>Ａ<\/b>さんは，「人工呼吸器はつけないで，最期まで自宅で生活したい」と言った。<br>会議のあと，妻は訪問介護員（ホームヘルパー）に，「夫にはなかなか言えないのですが，一日でも長く一緒にいたいので，私は人工呼吸器をつけてほしいと思っています」と気持ちを伝えた。<br>次のうち，<b>Ａ<\/b>さんの妻に対する訪問介護員（ホームヘルパー）の提案として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「会議で話されていた<b>Ａ<\/b>さんの意思が大切なので，尊重しませんか」","「私にはわからないので，医師に決めてもらってはどうですか」","「<b>Ａ<\/b>さんに人工呼吸器をつけてもらったほうがいいですよね」","「<b>Ａ<\/b>さんとお互いの気持ちを話し合う時間をつくりませんか」","「病院や施設の情報がほしいと介護支援専門員に伝えてはどうですか」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"本人と妻の意向が食い違っている。介護職がどちらかに決めるのではなく、二人が気持ちを伝え合い、納得できる形を一緒に考える場をつくることが意思決定支援の基本である。","choices":["本人の意思は大切だが、妻の気持ちを受け止めずに一方的に結論を示している。","「わからない」と突き放し、医師に決定を委ねている。決めるのは本人であり、医師ではない。","介護職が妻の側に立って結論を誘導しており、本人の意思を軽視している。","本人と家族が互いの思いを話し合う機会をつくる提案で、意思決定を支える関わりとして適切。","病院や施設の情報は「最期まで自宅で」という本人の希望と方向が違い、話し合いの前に進める話でもない。"],"point":"本人と家族の意見が対立する事例では、「どちらかに決める」選択肢は誤り。「話し合いの場をつくる」「気持ちを受け止める」が正解の型。人生の最終段階の話し合いを繰り返す「ACP（人生会議）」とあわせて覚える。","note":null}},{"id":"38-3","exam":38,"no":3,"subject":"介護の基本","group":1,"case":null,"stem":"介護施設における介護ロボットに関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["導入した施設は，人員配置基準が撤廃される。","使用方法は，職員個人の判断で行う。","導入することによって，利用者の自立支援や生活の質の向上が期待される。","導入の目的は，職員と利用者とのかかわりを最小限に抑えることである。","導入によって，職員の巡回は不要になる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"介護ロボットは、移乗・見守り・排泄などを支え、利用者の自立支援や生活の質（QOL）の向上と、職員の負担軽減を目的に導入される。","choices":["人員配置基準は撤廃されない。機器導入などを条件に一部で基準を柔軟にする仕組みはあるが、基準そのものはなくならない。","安全のため、施設として使用方法を定め、研修を行って使う。個人判断で使うものではない。","自立支援とQOLの向上が期待されるのが導入の目的。","負担を減らして生まれた時間を、利用者とのかかわりに使うことが目的。かかわりを減らすためではない。","見守り機器があっても、職員による確認や巡回は必要。機器だけに頼らない。"],"point":"福祉機器・ICTの問題は「撤廃」「不要」「個人の判断」「最小限」といった極端な表現が誤りのサイン。目的は「利用者の自立支援・QOL向上」と「職員の負担軽減」の2本柱と覚える。","note":null}},{"id":"38-4","exam":38,"no":4,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，指定避難所での要配慮者に対する生活支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["避難所内の情報提供には，音声やピクトグラム（pictogram）も取り入れる。","避難所内では，二次避難に備えて土足で過ごしてもらう。","食事は，被災者の平等性，公平性の観点から同じものを提供する。","トイレは，感染予防のために和式便器が望ましい。","生活範囲は，区画されたスペースに限定する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"要配慮者には、聴覚障害・視覚障害・外国人・認知症の人などが含まれる。音声とピクトグラム（絵文字）など複数の手段で情報を伝えると、誰もが情報を受け取りやすくなる。","choices":["音声と視覚の両方で伝える工夫で、情報を受け取りにくい人に配慮している。","土足は床が汚れ、感染症やほこりの原因になる。居住スペースは土足禁止が基本。","嚥下障害・アレルギー・持病のある人には、個別に配慮した食事が必要。一律の提供は不適切。","和式便器はしゃがむ動作が必要で、高齢者や障害者には使いにくい。洋式便器が望ましい。","区画内に閉じ込めると活動量が減り、生活不活発病（廃用症候群）につながる。体を動かす機会をつくる。"],"point":"避難所の問題は「平等＝全員同じ」ではなく「一人ひとりに合わせた配慮」が正解の方向。災害時の「生活不活発病」「エコノミークラス症候群」「福祉避難所」もあわせて覚える。","note":null}},{"id":"38-5","exam":38,"no":5,"subject":"介護の基本","group":1,"case":null,"stem":"ユニバーサルデザイン（universal design）の7原則に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["安全で使いやすいデザインにする。","要介護高齢者を対象とする。","個別対応より標準化を優先する。","介護福祉職にとって操作しやすいことを優先する。","デザインの美しさを優先する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"ユニバーサルデザインは、年齢や障害の有無にかかわらず、できるだけ多くの人が使いやすいようにはじめから設計する考え方。7原則には「失敗に対する寛大さ」（安全性）や「使い方が簡単ですぐわかる」が含まれ、選択肢1の内容に合う。","choices":["安全性と使いやすさは7原則の中心的な考え方。","特定の人ではなく、すべての人を対象とする。要介護高齢者に限るのはバリアフリーに近い発想。","7原則には「使ううえでの柔軟性」があり、使う人の好みや能力に合わせて選べることを重視する。","介護者だけでなく、使うすべての人にとって使いやすいことを目指す。","美しさを優先するという原則はない。"],"point":"提唱者はロナルド・メイス。7原則（公平な利用、利用の柔軟性、単純で直感的、わかりやすい情報、失敗に対する寛大さ、少ない身体的負担、利用しやすい大きさと空間）を覚える。「特定の人を対象」はバリアフリー、「すべての人」はユニバーサルデザインと区別する。","note":null}},{"id":"38-6","exam":38,"no":6,"subject":"介護の基本","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（51歳，男性，障害支援区分5）は，知的障害がある。共同生活援助（グループホーム）で生活をしている。日中は，生活介護を利用して軽作業を行っている。<b>Ａ<\/b>さんは，タオルに強いこだわりを持っていて，なじみの店で自分が選んだタオルしか使用しない。これまでタオルは，両親と買いに行っていたが，両親が高齢になり行けなくなった。<b>Ａ<\/b>さんの両親から，サービス管理責任者に，「強いこだわりがあるので，いつも行く店で本人にタオルを選ばせてほしい。何か良いサービスはありませんか」と相談があった。<br>次の記述のうち，サービス管理責任者の助言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["店までの移動に不安があるため，同行援護を勧める。","身体機能の維持・向上のために，自立訓練（機能訓練）を勧める。","一人で外出できるように，自発的活動支援を勧める。","自立した日常生活が送れるように，自立生活援助を勧める。","本人が買物に行けるように，行動援護を勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"行動援護は、知的障害や精神障害により行動上著しい困難がある人に、外出時の危険回避や移動の支援を行う障害福祉サービス。強いこだわりがあるAさんがなじみの店でタオルを選ぶ外出を支えるのに合う。","choices":["同行援護は視覚障害のある人の外出支援。Aさんは知的障害なので対象が違う。","自立訓練（機能訓練）は身体機能の維持・向上の訓練。買物の付き添いではない。","自発的活動支援は、障害者や家族などが自発的に行う活動（ピアサポートなど）を支える市町村の事業で、個人の外出支援ではない。","自立生活援助は、施設やグループホームから一人暮らしに移った人を定期的に訪問して支えるサービス。","行動援護で、本人が店に行き自分でタオルを選べるよう支援できる。"],"point":"外出支援の3つを障害の種類で区別する。「同行援護＝視覚障害」「行動援護＝知的・精神障害で行動上の困難」「重度訪問介護＝重度の肢体不自由など（外出も含む）」。事例文で障害名を確かめてから選ぶ。","note":null}},{"id":"38-7","exam":38,"no":7,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護保険制度における一人暮らしの要支援者を支えるサービスの内容として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["夜間を安心して過ごすために，夜間対応型訪問介護を利用する。","自宅で安全に移動するために，介護予防住宅改修を利用する。","趣味のカラオケに行くために，小規模多機能型居宅介護を利用する。","身元保証や死後の財産処分のために，高齢者等終身サポート事業を利用する。","金銭管理のために，日常生活自立支援事業を利用する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"介護予防住宅改修は、要支援者も利用できる介護保険の予防給付。手すりの取り付けや段差の解消などで、自宅内の安全な移動を支える。","choices":["夜間対応型訪問介護は要介護者だけが対象で、要支援者は利用できない。","介護予防住宅改修は要支援者も対象で、自宅での安全な移動を支える。","小規模多機能型居宅介護は介護サービス（要支援者向けは「介護予防」小規模多機能型居宅介護）。趣味の外出に付き添うためのサービスでもない。","高齢者等終身サポート事業は民間事業者による契約サービスで、介護保険のサービスではない。","日常生活自立支援事業は社会福祉協議会が行う事業で、介護保険のサービスではない。"],"point":"「要支援者が使えるか」は、サービス名に「介護予防」がつくかをまず手がかりにする。ただし要支援者は、介護予防・日常生活支援総合事業の訪問型サービス・通所型サービスも利用できる（「介護予防」はつかない）。夜間対応型訪問介護・定期巡回・随時対応型訪問介護看護・看護小規模多機能型居宅介護・施設サービスは要支援者が使えない、と覚える。","note":null}},{"id":"38-8","exam":38,"no":8,"subject":"介護の基本","group":1,"case":null,"stem":"<b>Ａ<\/b>さん（91歳，女性，要支援2）は，長年診療所の医師として地域医療に貢献してきた。婚姻歴はなく，診療所敷地内の自宅で3匹の猫と暮らしている。85歳で医師を引退した後も，近隣には<b>Ａ<\/b>さんを慕う地域住民が多く，定期的に，「先生，元気にしてますか」と<b>Ａ<\/b>さんの自宅を訪ねている。<br><b>Ａ<\/b>さんは昨年から歩行の不安を訴え，現在は地域住民の見守りのほか，訪問型サービスを週2回利用している。人の世話になることに慣れていない様子もあるが，最期まで自宅で暮らすことを望んでいる。<br>次の記述のうち，<b>Ａ<\/b>さんの生活史を尊重した訪問介護員（ホームヘルパー）の声かけとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「3匹の猫は，今後は地域の皆さんに預けましょう」","「近所の方の力も借りて，この地域で暮らしていけるように考えていきましょう」","「介護を受けることにも，今後は慣れてください」","「医師であったことは忘れて，私たちを頼ってください」","「一人暮らしで自宅で最期を迎えるのは，不安がありますよね」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Aさんは長年地域医療を支え、今も住民に慕われている。その関係を生かし、近所の人の力も借りて地域で暮らし続けることを一緒に考える声かけは、生活史と本人の望みを尊重している。","choices":["猫との暮らしはAさんの大切な生活の一部。手放すよう求めるのは生活史を尊重していない。","地域住民との長年の関係を生かし、最期まで自宅で暮らしたいという希望にも沿っている。","人の世話になることに慣れていないAさんの気持ちを否定し、慣れることを押しつけている。","医師として歩んできた人生を否定しており、尊厳を傷つける。","本人が望む在宅での最期に対して不安をあおっており、希望を支える声かけになっていない。"],"point":"生活史を尊重する声かけは、その人の「これまでの役割・人間関係・大切なもの」を生かすものが正解。「忘れて」「預けましょう」「慣れてください」など、過去や大切なものを手放させる表現は誤りの型。","note":null}},{"id":"38-9","exam":38,"no":9,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護老人保健施設における在宅復帰に向けたカンファレンスで，介護福祉士が連携する職種の役割として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["歯科衛生士が，義歯を作成する。","看護師が，車いすを貸与する。","介護支援専門員（ケアマネジャー）が，訪問介護計画を作成する。","福祉用具専門相談員が，下肢の機能訓練をする。","作業療法士が，自宅の玄関の段差を確認する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"作業療法士は、住環境の評価や生活動作の訓練を担う。在宅復帰の前に自宅を訪問し、玄関の段差など動作の妨げになる場所を確認することは、作業療法士の役割に合う。","choices":["義歯を作るのは歯科医師（と歯科技工士）。歯科衛生士は口腔ケアや歯科保健指導などを行う。","車いすの貸与は福祉用具貸与事業者が行う。看護師の役割ではない。","訪問介護計画を作るのは訪問介護事業所のサービス提供責任者。介護支援専門員はケアプラン（居宅サービス計画）を作る。","下肢の機能訓練は理学療法士などの役割。福祉用具専門相談員は福祉用具の選定や使い方の助言を行う。","作業療法士が自宅の段差を確認するのは、在宅復帰に向けた役割として適切。"],"point":"職種の役割の入れ替えが定番のひっかけ。「ケアプラン＝介護支援専門員」「訪問介護計画＝サービス提供責任者」「義歯の作成＝歯科医師」「福祉用具の選定・助言＝福祉用具専門相談員」をセットで覚える。","note":null}},{"id":"38-10","exam":38,"no":10,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護老人福祉施設におけるリスクマネジメントとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["安全対策担当者を置き，事故発生予防のための委員会を定期的に開催する。","家族からの苦情は，介護福祉職が，その場で解決する。","利用者の私物を壊したときは，介護福祉職の自己判断で弁償する。","入浴介助時のインシデントの報告は，職員間の口頭による伝達に統一する。","事故防止のため，地域のお祭りへの参加は控える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"介護老人福祉施設の運営基準では、事故発生防止のための指針の整備、委員会の定期開催、職員研修、それらを担当する担当者の配置が求められている。","choices":["担当者を置き、事故防止の委員会を定期的に開くのは基準に沿った対応。","苦情は個人がその場で処理するのではなく、施設の苦情受付窓口や体制に沿って記録し、組織で対応する。","私物の破損も事故として上司に報告し、施設として対応する。自己判断で弁償しない。","インシデントは記録（報告書）に残し、分析して再発防止に生かす。口頭だけでは共有と分析ができない。","事故を恐れて社会参加の機会を奪うのは不適切。リスクに備えたうえで参加を支える。"],"point":"リスクマネジメントは「個人で抱えず組織で対応」「記録して分析・共有」が原則。「その場で」「自己判断で」「口頭で」は誤りの型。ヒヤリハット（インシデント）を集めて事故を防ぐ考え方（ハインリッヒの法則）もあわせて覚える。","note":null}},{"id":"38-11","exam":38,"no":11,"subject":"介護の基本","group":1,"case":null,"stem":"次の記述のうち，介護現場におけるレジオネラ菌の感染対策として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["感染者の衣類は，熱湯で煮沸消毒する。","提供する食品は，加熱調理を徹底する。","循環式浴槽は，塩素系薬剤を使用して消毒する。","ドアノブは，次亜塩素酸ナトリウム液で消毒する。","家庭用加湿器のタンクの水は，常に貯めておく。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"レジオネラ菌は、循環式浴槽や加湿器など、温かい水がたまる場所で増える。感染はその水しぶき（エアロゾル）を吸い込むことで起こるため、浴槽を塩素系薬剤で消毒し、水を清潔に保つことが対策になる。","choices":["衣類の煮沸や汚染物の処理は、ノロウイルスなどの対策の考え方。レジオネラ症は人から人へはうつりにくい。","加熱調理は食中毒（腸管出血性大腸菌など）の対策。レジオネラ菌は主に水から感染する。","循環式浴槽の塩素系薬剤による消毒は、レジオネラ菌対策の基本。","ドアノブの次亜塩素酸ナトリウム消毒は、ノロウイルスなど接触感染の対策。","水を貯めたままにすると菌が増える。加湿器のタンクは毎日水を入れ替え、定期的に洗う。"],"point":"感染症ごとに「どこから・どうやってうつるか」で対策を結びつける。「レジオネラ＝循環式浴槽・加湿器の水→塩素消毒・水の入れ替え」「ノロ＝嘔吐物・便→次亜塩素酸ナトリウム」「インフルエンザ＝飛沫→マスク・換気」。","note":null}},{"id":"38-12","exam":38,"no":12,"subject":"介護の基本","group":1,"case":null,"stem":"介護福祉職が受けるストレスチェック制度に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["3年に1回の実施が義務づけられている。","労働者数が常時100名の事業場は受検が免除される。","結果は労務管理を行う介護主任へ提供され，面接指導に活用する。","心理的な負担の程度を把握するためのものである。","高ストレスと判定された場合は，産業医による治療が必須である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"ストレスチェックは、労働安全衛生法にもとづき、労働者の心理的な負担の程度を把握するための検査。本人の気づきを促し、職場環境の改善につなげて、メンタルヘルス不調を防ぐことが目的である。","choices":["実施は1年以内ごとに1回。3年に1回ではない。","常時50人以上の労働者がいる事業場は実施が義務。100名の事業場は免除されない。","結果は本人に直接通知される。事業者や上司に提供するには本人の同意が必要。","心理的な負担の程度を把握するための検査である。","高ストレスと判定された人が申し出た場合に、医師による面接指導を行う。治療は必須ではない。"],"point":"「年1回」「常時50人以上で義務」「結果は本人へ（事業者へは同意が必要）」「高ストレス者は申し出により医師の面接指導」の4点をセットで覚える。「免除」「必須」「上司へ提供」が誤りの型。","note":"2025年の労働安全衛生法改正で、労働者50人未満の事業場にもストレスチェックの実施を義務づけることになった（2028年4月1日施行予定）。施行後は「50人以上で義務」の部分が変わるため、最新の扱いは厚生労働省の資料で確認すること。"}},{"id":"38-13","exam":38,"no":13,"subject":"社会の理解","group":2,"case":null,"stem":"民法の親族に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["三親等内の血族を家族と規定している。","六親等内の姻族を親族と規定している。","いとこは互いに扶養する義務があると規定している。","同居する親族は互いに扶け合わなければならないと規定している。","養子と養親の間には，親族関係は生じない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"民法第730条は「直系血族及び同居の親族は、互いに扶け合わなければならない」と定めている。","choices":["民法に「家族」の定義はない。","親族は「6親等内の血族、配偶者、3親等内の姻族」（民法第725条）。6親等内の姻族ではない。","扶養義務があるのは直系血族と兄弟姉妹（民法第877条）。いとこ（4親等）は含まれない。","同居の親族の助け合いは民法第730条の規定どおり。","養子縁組により、養子と養親の間には血族と同じ親族関係（法定血族）が生じる。"],"point":"親族の範囲は「血族6・配偶者・姻族3」と数字で覚える。扶養義務は「直系血族と兄弟姉妹」が原則で、特別な事情があれば家庭裁判所が3親等内の親族にも負わせることがある。数字の入れ替え（6と3）がひっかけの型。","note":null}},{"id":"38-14","exam":38,"no":14,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，「令和4（2022）年　国民生活基礎調査」（厚生労働省）における，高齢者に関する調査結果として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["65歳以上の者のいる世帯の世帯構造で最も多いのは，親と未婚の子のみの世帯である。","高齢者世帯は5割以上を占めている。","要介護者等と同居の主な介護者の年齢の組合せでは，65歳以上同士が約6割を占めている。","介護が必要となった理由の第1位は，骨折・転倒である。","1世帯当たりの平均所得金額では，高齢者世帯では600万円を超えている。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"令和4年国民生活基礎調査では、同居の主な介護者と要介護者等の組合せのうち、ともに65歳以上の「老老介護」が63.5％と約6割を占めた。","choices":["65歳以上の者のいる世帯で多いのは「夫婦のみの世帯」と「単独世帯」で、それぞれ約3割。親と未婚の子のみの世帯は約2割。","高齢者世帯は全世帯の31.2％で、5割には届かない。5割を超えるのは「65歳以上の者のいる世帯」（50.6％）なので、2つを取り違えない。","65歳以上同士の組合せは約6割を占める。","介護が必要となった主な原因の第1位は認知症。骨折・転倒は脳血管疾患に次ぐ第3位。","高齢者世帯の1世帯当たり平均所得金額は318.3万円で、600万円を大きく下回る。"],"point":"国民生活基礎調査は毎回出題される。「介護の原因1位＝認知症」「老老介護＝約6割」「65歳以上の者のいる世帯＝夫婦のみ・単独が多い」を押さえる。調査年によって順位や割合が変わるので、問題文の年次を必ず確認する。","note":"調査結果は調査年ごとに更新される。新しい調査では順位や割合が変わることがあるので、最新の数値は厚生労働省の公表資料で確認すること。"}},{"id":"38-15","exam":38,"no":15,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ａ<\/b>さん（78歳，女性）は，一人暮らしである。家事や買物は，時間はかかるが，できるだけ自分で取り組んでいる。近くに頼れる親族がいないため，緊急時にすぐに通報できる公共サービスを利用している。<b>Ａ<\/b>さんは，定期的に市の窓口や地域包括支援センターに今後の生活支援について相談している。近所には，毎日散歩を一緒にしている友人グループがいて，散歩に来ない仲間がいると訪問して声をかけあっている。<br>次のうち，<b>Ａ<\/b>さんの生活を支える自助に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ａ<\/b>さんが身辺のことを，時間をかけてもやること","緊急時にすぐに通報できる公共サービスを利用していること","市の窓口の職員が相談に応じること","地域包括支援センターの職員が相談に応じること","散歩仲間が声をかけあっていること"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"自助とは、自分のことを自分で行うこと（自分の力や費用で生活を支えること）。Aさんが時間をかけても身の回りのことを自分でしているのは自助にあたる。","choices":["自分のことを自分で行っており、自助にあたる。","公的な緊急通報サービスの利用は、行政が提供する支援（公助）にあたる。","市の窓口職員による相談は、行政による公的な支援で、自助ではない。","地域包括支援センター職員による相談は、制度にもとづく専門職の支援で、自助ではない。","散歩仲間どうしの声かけは、住民どうしの自発的な支え合いで、互助にあたる。"],"point":"地域包括ケアの「自助・互助・共助・公助」を区別する。「自助＝自分で」「互助＝近所・友人・ボランティアの支え合い」「共助＝介護保険など社会保険」「公助＝税による行政サービス・生活保護」。","note":null}},{"id":"38-16","exam":38,"no":16,"subject":"社会の理解","group":2,"case":null,"stem":"介護保険制度における介護サービス利用に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["65歳未満の者は，保険給付の対象外である。","保険給付には，支給限度額がある。","要介護認定の有効期限は，原則として3か月である。","保険給付による福祉用具の貸与は，要介護3以上の者が対象である。","地域包括支援センターに相談する前に，要介護認定を受ける必要がある。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"在宅サービスでは、要介護度ごとに1か月に使える保険給付の上限（区分支給限度基準額）が決まっている。上限を超えた分は全額自己負担になる。","choices":["40〜64歳の第2号被保険者も、特定疾病が原因で要介護・要支援になれば給付を受けられる。","保険給付には支給限度額がある。","要介護認定の有効期間は、新規が原則6か月、更新が原則12か月。3か月ではない。","福祉用具貸与は要支援者・要介護1の人も利用できる。車いすや特殊寝台など一部の品目に、軽度者は原則対象外とする制限があるだけである。","地域包括支援センターには、認定を受けていない人も相談できる。"],"point":"介護保険の数字をまとめて覚える。「第2号被保険者＝40〜64歳・特定疾病」「認定の有効期間＝新規6か月・更新12か月（原則）」「区分支給限度基準額＝在宅サービスの上限」。「対象外」「必要がある」などの断定はまず疑う。","note":null}},{"id":"38-17","exam":38,"no":17,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，障害者福祉の歴史的展開として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["国際連合の障害者の権利に関する条約の影響を受け，障害者基本法に「社会的障壁の除去」が規定された。","第二次世界大戦後5年以内に，優生保護法が廃止された。","「精神薄弱者福祉法」の制定によって，知的障害者の入所施設からの地域移行が推進された。","社会福祉基礎構造改革によって，高齢者より先に障害者の福祉制度が利用契約制度となった。","身体障害，知的障害，精神障害のうち，福祉に関する法律の制定が最も早かったのは知的障害である。"],"notes":"（注）　「精神薄弱者福祉法」とは，現在の知的障害者福祉法のことである。","figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"障害者権利条約の批准に向けた国内法の整備として、2011年の障害者基本法改正で、障害者の定義に「社会的障壁」が加わり、その除去と合理的配慮の考え方が規定された。","choices":["障害者権利条約の影響を受け、障害者基本法に社会的障壁の除去が盛り込まれた。","優生保護法は1948年に制定され、1996年に母体保護法へ改められるまで続いた。戦後5年以内には廃止されていない。","精神薄弱者福祉法（1960年）は施設入所による保護が中心だった。地域移行が進められたのはずっと後のこと。","措置から契約への移行は、高齢者が先（2000年の介護保険制度）で、障害者は後（2003年の支援費制度）。","最も早く制定されたのは身体障害者福祉法（1949年）。知的障害者の法律は1960年。"],"point":"障害者福祉の年表を順番で覚える。「身体障害者福祉法1949→精神衛生法1950→精神薄弱者福祉法1960」「介護保険2000→支援費制度2003→障害者自立支援法2005→障害者総合支援法2012」「障害者基本法改正2011→障害者差別解消法2013→権利条約批准2014」。","note":null}},{"id":"38-18","exam":38,"no":18,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，障害者福祉に関係する機関やシステムとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["地域活動支援センターは，補装具の判定を行う。","基幹相談支援センターには，介護福祉士の配置が義務となっている。","都道府県は，身体障害者更生相談所を設置しなければならない。","都道府県は，障害支援区分の認定を行う。","利用者負担の額は，市町村障害福祉計画によって決められる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"身体障害者福祉法により、都道府県は身体障害者更生相談所を設置しなければならない。更生相談所は補装具の判定などの専門的な業務を行う。","choices":["補装具の判定は身体障害者更生相談所が行う。地域活動支援センターは創作活動や交流の場を提供する施設。","基幹相談支援センターに介護福祉士の配置を義務づける規定はない。相談支援専門員や社会福祉士などの相談職が中心となる。","都道府県は身体障害者更生相談所の設置が義務。","障害支援区分の認定を行うのは市町村。","利用者負担は、所得に応じた負担上限月額として国（政令）で定められている。市町村障害福祉計画はサービスの見込み量などを定める計画。"],"point":"障害福祉の実施主体は「サービスの支給決定・障害支援区分の認定＝市町村」「更生相談所の設置＝都道府県（義務）」と区別する。介護保険の要介護認定も市町村なので、あわせて「認定は市町村」と覚える。","note":null}},{"id":"38-19","exam":38,"no":19,"subject":"社会の理解","group":2,"case":null,"stem":"障害者虐待防止に関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["養護者による虐待が疑われる障害者を発見した場合，都道府県へ通報する義務がある。","著しく拒絶的な対応は身体的虐待に当てはまる。","使用者による障害者虐待は含まれない。","行政職員が障害者福祉施設等に，立ち入り調査を行うことは許されていない。","虐待を発見した障害者福祉施設従事者が通報した場合，業務上の守秘義務違反にはならない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"障害者虐待防止法では、虐待を受けたと思われる障害者を発見した人の通報は、刑法の秘密漏示罪その他の守秘義務に関する規定によって妨げられないとされている。通報しても守秘義務違反にはならない。","choices":["養護者による虐待の通報先は市町村。都道府県ではない。","著しく拒絶的な対応や暴言は心理的虐待にあたる。","障害者虐待防止法は「養護者」「障害者福祉施設従事者等」「使用者」による虐待の3類型を対象とする。","市町村や都道府県は、法律にもとづいて施設への立入調査などの権限を行使できる。","通報は守秘義務違反にならない。"],"point":"虐待の5類型（身体的・性的・心理的・放棄放任・経済的）の中身を区別する。「無視・拒絶的な対応・暴言＝心理的虐待」。障害者虐待は高齢者虐待と違い「使用者による虐待」があることがひっかけになりやすい。通報先は原則「市町村」と覚える。","note":null}},{"id":"38-20","exam":38,"no":20,"subject":"社会の理解","group":2,"case":null,"stem":"<b>Ａ<\/b>さん（82歳，女性，要介護1）は，自宅で一人暮らしをしている。外出機会が少ない<b>Ａ<\/b>さんを心配して，民生委員が定期的に見守りを行っている。ある日，民生委員から地域包括支援センターに，「<b>Ａ<\/b>さんのように，家に閉じこもりがちな要介護者が増えている。民生委員だけでは十分な見守りができない」と相談があった。<br>次の記述のうち，地域包括支援センターの職員の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["高齢者本人による相談が原則のため，<b>Ａ<\/b>さん自身が相談に来るように促す。","介護サービスを利用するため，<b>Ａ<\/b>さんのケアプランを作成する。","フォーマルな社会資源の活用を優先し，民生委員のかかわりを制限する。","地域ケア会議において，関係者と地域課題について話し合う。","要介護者の実態を把握するために，介護保険審査会を設置する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"地域ケア会議は、個別の事例の検討を通じて地域に共通する課題を見つけ、関係者で解決策を話し合う場。地域包括支援センターなどが開催し、民生委員だけでは見守りが足りないという課題を検討するのに適している。","choices":["地域包括支援センターは、本人以外の家族や民生委員などからの相談にも応じる。","Aさんは要介護1なので、ケアプランは原則として居宅介護支援事業所の介護支援専門員が作る。また相談の内容は地域全体の課題である。","フォーマル・インフォーマルな社会資源を組み合わせて支えるのが基本。民生委員のかかわりを制限する理由はない。","地域ケア会議で関係者と地域課題を話し合うのが適切。","介護保険審査会は、要介護認定などへの不服申立てを審査する都道府県の機関。実態把握のためのものではない。"],"point":"地域ケア会議の5つの機能（個別課題の解決、ネットワーク構築、地域課題の発見、地域づくり・資源開発、政策形成）を覚える。「地域全体の課題」が出てきたら地域ケア会議を選ぶ。「介護保険審査会＝不服申立て（都道府県）」との取り違えに注意。","note":null}},{"id":"38-21","exam":38,"no":21,"subject":"社会の理解","group":2,"case":null,"stem":"法定後見制度に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["65歳未満の者は利用することができない。","判断能力が十分ある者には，後見人をつけることができない。","市町村長は，後見開始の審判を請求することができない。","法人を後見人に選任することはできない。","後見人は財産管理を行うことはできない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"法定後見は、判断能力が不十分な人を保護・支援するための制度。判断能力が十分ある人には後見人をつけられない。判断能力があるうちに将来に備えるのは任意後見制度である。","choices":["年齢制限はない。判断能力が不十分であれば、65歳未満の人も利用できる。","法定後見は判断能力が不十分な人が対象で、十分ある人には後見人をつけられない。","身寄りがない場合などに、市町村長は後見開始の審判を請求できる。","社会福祉法人などの法人も後見人に選任できる（法人後見）。","後見人の主な職務は、財産管理と身上保護（生活・療養看護に関する契約など）である。"],"point":"「法定後見＝判断能力が不十分になってから（後見・保佐・補助の3類型）」「任意後見＝判断能力があるうちに契約」と区別する。申立てができる人（本人・配偶者・4親等内の親族・市町村長など）と、法人・複数の後見人も選べることをあわせて覚える。","note":null}},{"id":"38-22","exam":38,"no":22,"subject":"社会の理解","group":2,"case":null,"stem":"有料老人ホームに関する次の記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["入居する高齢者に，介護，食事の提供，家事，健康管理のうち1つ以上のサービスを提供する。","状況把握サービスと生活相談サービスの提供が義務づけられている。","自立した高齢者は，入居の対象外である。","共生型サービスとして，指定を受けることができる。","介護保険制度の指定対象外である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"老人福祉法では、有料老人ホームは高齢者を入居させ、入浴・排せつ・食事の介護、食事の提供、洗濯・掃除などの家事、健康管理のうち、少なくとも1つのサービスを提供する施設と定められている。","choices":["4つのサービスのうち1つ以上を提供するのが有料老人ホームの要件。","状況把握（安否確認）サービスと生活相談サービスの提供が義務なのは、サービス付き高齢者向け住宅。","自立した高齢者も入居できる。住宅型・健康型の有料老人ホームもある。","共生型サービスは、介護保険と障害福祉の両方の指定を受けやすくする仕組みで、訪問介護・通所介護・短期入所生活介護などが対象。有料老人ホームは対象ではない。","介護保険の特定施設入居者生活介護の指定を受けることができる（介護付有料老人ホーム）。"],"point":"「有料老人ホーム＝老人福祉法・4サービスのうち1つ以上」「サービス付き高齢者向け住宅＝高齢者住まい法・安否確認と生活相談が必須」と根拠法とセットで区別する。特定施設の指定を受けたものが「介護付」と呼ばれる。","note":null}},{"id":"38-23","exam":38,"no":23,"subject":"社会の理解","group":2,"case":null,"stem":"生活困窮者自立支援法に関する記述のうち，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害者は対象から除外されている。","生活困窮者自立相談支援事業は，社会福祉法人へ委託できない。","生活困窮者自立相談支援事業は，市にとって任意事業である。","生活困窮者住居確保給付金の支給は，市にとって必須事業である。","都道府県の責務は規定されていない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"生活困窮者自立支援法では、福祉事務所を設置する自治体（市など）にとって、自立相談支援事業と住居確保給付金の支給が必須事業とされている。","choices":["障害者は対象から除外されていない。経済的に困窮し、最低限度の生活を維持できなくなるおそれのある人が対象。","自立相談支援事業は、社会福祉法人やNPO法人などに委託できる。","自立相談支援事業は必須事業である。","住居確保給付金の支給は必須事業である。","都道府県の責務も法律に規定されている。"],"point":"必須事業は「自立相談支援事業」と「住居確保給付金」の2つと覚える。就労準備支援事業・家計改善支援事業・居住支援事業（旧・一時生活支援事業）・子どもの学習・生活支援事業などは努力義務や任意事業。必須と任意の入れ替えがひっかけの型。","note":null}},{"id":"38-24","exam":38,"no":24,"subject":"社会の理解","group":2,"case":null,"stem":"次の記述のうち，生活保護制度における補足性の原理として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["申請に基づいて保護を行う。","国の定める基準によって測定された需要をもとに保護を行う。","個人の必要に応じてできるだけ早く保護を行う。","資産・能力を活用した上で保護を行う。","世帯を単位として保護を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"補足性の原理とは、資産や能力、ほかの法律による給付、扶養などをまず活用し、それでも足りない部分を保護で補うという考え方である。","choices":["申請保護の原則（4原則の1つ）。","基準及び程度の原則（4原則の1つ）。","必要即応の原則（4原則の1つ）。個人や世帯の実情に応じて保護を行うという考え方。","資産・能力を活用したうえで保護を行うのが補足性の原理。","世帯単位の原則（4原則の1つ）。"],"point":"生活保護の「4原理（国家責任・無差別平等・最低生活・補足性）」と「4原則（申請保護・基準及び程度・必要即応・世帯単位）」を分けて覚える。「原理」を聞いているのに「原則」を並べる出題が多い。","note":null}},{"id":"38-25","exam":38,"no":25,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"新人職員の<b>Ａ<\/b>さん（20歳）は，子どもの頃からの夢だった介護福祉職になり，がんばって働いていた。ただ，介護の技術をもっと学ぶ必要があるといつも感じていた。ある日，利用者<b>Ｂ<\/b>さんに，「<b>Ａ<\/b>さんじゃダメだ，別の人を呼んで」と言われて，ショックを受けた。悩むうちに利用者とかかわりたくないと感じるようになり，眠れなくなってしまった。<br>次の記述のうち，このような状況にある<b>Ａ<\/b>さんが，ストレスを取り除くためにまず行うべき対処方法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["つらさから逃げず，学びが足りないことを自覚する。","介護の技術がうまくなるために，全力で取り組む。","眠れるように，毎晩飲酒する。","上司や同僚などに悩みを話して，助言を受ける。","介護福祉職には向かないと判断して，転職する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"悩みを一人で抱えて眠れなくなっている状態では、まず信頼できる上司や同僚に相談し、助言や支えを受けることが大切。周囲の支援（ソーシャルサポート）はストレスを和らげる有効な対処方法である。","choices":["自分を責める方向に向かい、ストレスをさらに強める。","心身が疲れている状態で無理を重ねると、燃え尽き（バーンアウト）につながる。","飲酒は睡眠の質を下げ、依存の危険もある。適切な対処方法ではない。","上司や同僚に話して助言を受けるのは、まず行うべき対処として適切。","一つの出来事だけで判断して転職を決めるのは早すぎる。まず相談して状況を整理する。"],"point":"ストレス対処の問題は「一人で抱え込まず相談する」が正解の型。「全力で」「毎晩飲酒」「逃げずに」など、自分を追い込む選択肢は誤り。バーンアウト（燃え尽き症候群）の予防として、相談・休養・セルフケアをあわせて覚える。","note":null}},{"id":"38-26","exam":38,"no":26,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"<b>Ａ<\/b>さんは有料老人ホームに入所したばかりである。ある日，廊下を行ったり来たりしている<b>Ａ<\/b>さんに，<b>Ｂ<\/b>介護福祉職が声をかけた。<b>Ａ<\/b>さんは，「私の部屋はどこですか」と困った様子で答えた。<b>Ｂ<\/b>介護福祉職が，「ここから2つ隣の部屋です」と伝えると，<b>Ａ<\/b>さんは，「どこですか」と不安そうな表情で聞いた。<b>Ｂ<\/b>介護福祉職は非言語的コミュニケーションを用いて伝えることにした。<br>次の記述のうち，<b>Ｂ<\/b>介護福祉職が用いた非言語的コミュニケーションとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ゆっくり話した。","大きな声で伝えた。","<b>Ａ<\/b>さんの部屋の番号を紙に書いて渡した。","<b>Ａ<\/b>さんに近づいた。","<b>Ａ<\/b>さんの部屋のドアを指差した。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"非言語的コミュニケーションは、言葉以外の手段（表情・視線・身振り・姿勢など）で伝えること。部屋のドアを指差すのは身振りによる伝達で、言葉で伝わらなかった場所を目で見てわかるように示している。","choices":["話す速さは準言語で、非言語的コミュニケーションに含まれる。ただし、ゆっくり話しても部屋の場所そのものは伝わらない。","声の大きさも準言語で、非言語的コミュニケーションに含まれる。ただし、大きな声で言っても部屋の場所は伝わらない。","紙に書いた番号は文字による伝達で、言語的コミュニケーションにあたる。","近づくことは非言語的な行動だが、それだけでは部屋の場所は伝わらない。","指差しは身振りによる非言語的コミュニケーションで、場所を直接示せる。"],"point":"「文字・手話・点字＝言語的コミュニケーション」は定番のひっかけ。非言語は表情・視線・身振り・姿勢・距離・接触、そして準言語（声の大きさ・速さ・トーン）と覚える。設問の目的（ここでは「部屋の場所を伝える」）が達成できるかも判断の手がかりになる。","note":null}},{"id":"38-27","exam":38,"no":27,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"次のうち，介護福祉施設におけるコンプライアンスの意味として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["法令を遵守すること","給与を引き上げること","連携を促進すること","介護技術の向上に努めること","管理体制を強化すること"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"コンプライアンスとは「法令遵守」のこと。介護施設では、法令に加えて、運営基準や職業倫理、施設の規程を守ることも含めて使われる。","choices":["コンプライアンスの意味は法令を遵守すること。","給与の引き上げは処遇改善の話で、コンプライアンスの意味ではない。","連携の促進はチームケアや多職種連携の話。","介護技術の向上は自己研鑽の話。","管理体制の強化は、コンプライアンスを守るための手段の一つにはなりうるが、言葉の意味ではない。"],"point":"カタカナ用語の意味を問う問題は確実に得点したい。「コンプライアンス＝法令遵守」「アカウンタビリティ＝説明責任」「ガバナンス＝組織の統治」「リスクマネジメント＝事故を予防し、起きたときの対応も含めて管理すること」をセットで覚える。","note":null}},{"id":"38-28","exam":38,"no":28,"subject":"人間関係とコミュニケーション","group":3,"case":null,"stem":"入社して3か月の<b>Ａ<\/b>介護福祉職は，初めて夜勤を経験したとき，排泄チェック表の記入でミスをしてしまった。起床介助で忙しい時間に記入したために，記載箇所を間違えてしまった。<b>Ａ<\/b>介護福祉職は自身のミスを受け入れられず，落ち込んでいる。<br>次の記述のうち，<b>Ａ<\/b>介護福祉職に対する支持的スーパービジョンとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["同僚と一緒に排泄チェック表を確認する。","施設長から再発防止に向けた対応を指示する。","上司が<b>Ａ<\/b>介護福祉職の気持ちの理解に努めつつ，状況を確認する。","看護師が利用者のその後の状況を確認する。","業務マニュアルを見直して，上司が必要な修正を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"支持的スーパービジョンは、スーパーバイジー（指導を受ける人）の気持ちを受け止め、精神的に支える機能。落ち込んでいるAさんの気持ちを理解しようとしながら状況を確認する関わりがこれにあたる。","choices":["記入内容を確認する業務面の対応で、落ち込んでいるAさんの気持ちを受け止める関わりになっていない。","再発防止の指示は、業務を管理する管理的機能にあたる。","気持ちの理解に努めつつ状況を確認するのは支持的機能。","利用者の状態確認は看護師の業務で、Aさんへのスーパービジョンではない。","マニュアルの見直しは、業務や組織を整える管理的な対応。"],"point":"スーパービジョンの3機能を区別する。「管理的＝業務の管理・指示」「教育的＝知識・技術を教える」「支持的＝気持ちを受け止め支える」。選択肢に「気持ち」「受け止める」があれば支持的を疑う。","note":null}},{"id":"38-29","exam":38,"no":29,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"次のうち，利用者とのコミュニケーション場面で，介護福祉職が行う自己開示の目的として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["自己の潜在意識を活用するため","利用者との信頼関係を評価するため","利用者に自分自身の情報を知らせるため","利用者との信頼関係を形成するため","自己を深く分析し，客観的に理解するため"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"自己開示は、自分の考えや経験、気持ちを相手に伝えること。介護福祉職が適切に自己開示すると利用者との距離が縮まり、信頼関係（ラポール）の形成につながる。","choices":["潜在意識の活用は自己開示の目的ではない。","自己開示は信頼関係をつくるためのもので、評価するためのものではない。","情報を知らせることは手段であり、それ自体は目的ではない。","信頼関係を形成することが自己開示の目的。","自己を深く分析して客観的に理解するのは「自己覚知」。"],"point":"「自己開示＝自分のことを相手に伝える（信頼関係の形成）」「自己覚知＝自分の価値観や感情の傾向を知る」を区別する。自己開示は利用者の話を引き出すためのもので、職員の話が中心にならないよう、内容と量を考えて行う。ジョハリの窓もあわせて覚える。","note":null}},{"id":"38-30","exam":38,"no":30,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ａ<\/b>介護福祉職は，認知症（dementia）のある<b>Ｂ<\/b>さん（80歳，女性）と会話をしている。<b>Ｂ<\/b>さんは，「私は小さい頃毎年お祭りに行くことが楽しみでね」「なんだか最近ひざが痛いような気がしてね」「今から何をしようかしらね」と，次々に話している。<b>Ａ<\/b>介護福祉職は，<b>Ｂ<\/b>さんが混乱しないように，「<b>Ｂ<\/b>さん，子どもの頃の思い出や体調のことをお話しくださっているのですね」と返答した。<br>次のうち，<b>Ａ<\/b>介護福祉職が行ったコミュニケーション技術として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["要約","承認","賞賛","共感","同意"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"要約は、相手の話のポイントをまとめて言葉で返す技術。次々と話題が変わるBさんの話を「子どもの頃の思い出や体調のこと」とまとめて返しており、話の整理を助けている。","choices":["複数の話をまとめて返しており、要約にあたる。","承認は、相手の存在や努力、行動を認めて言葉にすること。","賞賛は、相手の行動や成果をほめること。","共感は、相手の気持ちを自分のことのように理解し、伝え返すこと。発言は話の内容をまとめたもので、気持ちへの応答ではない。","同意は、相手の意見に賛成すること。"],"point":"応答技法を区別する。「要約＝話をまとめる」「言い換え＝別の言葉で返す」「繰り返し＝同じ言葉で返す」「感情の反映＝気持ちを言葉にする」。応答が「〜のことを話してくださっているのですね」と内容をまとめていれば要約と判断する。","note":null}},{"id":"38-31","exam":38,"no":31,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"次の記述のうち，利用者の家族との関係づくりにおける介護福祉職の基本姿勢として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["お互いの緊張が解けるまでじっと待つ。","介護福祉職のペースで話を進める。","利用者の意向よりも家族の意向を優先する。","家族への連絡は最小限にする。","利用者支援で協働するパートナーとして接する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"家族は、利用者を一緒に支える協働のパートナーである。家族の思いや状況を理解し、情報を共有しながら支援をともに進める姿勢が関係づくりの基本となる。","choices":["待つだけでは関係は深まらない。介護福祉職から働きかけて関係をつくる。","家族のペースや思いに合わせて話を聞く。職員のペースで進めない。","支援の中心は利用者本人。家族の意向を優先するのは誤り。","利用者の状態などを必要に応じて伝え、情報を共有することで信頼関係が生まれる。","協働するパートナーとして接するのが基本姿勢。"],"point":"家族支援の問題では「パートナー」「協働」「家族の思いを受け止める」が正解の型。「利用者より家族を優先」「最小限」「職員のペース」は誤りのサインと覚える。","note":null}},{"id":"38-32","exam":38,"no":32,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，女性，要介護3）は中途障害の全盲である。介護老人福祉施設に入所している。最近，食堂の席の入れ替えがあった。<b>Ａ<\/b>さんは同じテーブルの利用者同士の会話を，自分に向けて話しかけられていると思って，応答した。しかし，誰からも反応はなく，<b>Ａ<\/b>さんは下を向いてしまった。その様子を見た<b>Ｂ<\/b>介護福祉職は，<b>Ａ<\/b>さんの状況に対応するために，同じテーブルの利用者に<b>Ａ<\/b>さんの事情を話し，協力を求めた。<br>次の記述のうち，<b>Ｂ<\/b>介護福祉職が同じテーブルの利用者に協力を依頼した内容として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ａ<\/b>さんは疲れているので，部屋で休むように伝えてほしい。","<b>Ａ<\/b>さんは不安なので，そっと手を握ってほしい。","<b>Ａ<\/b>さんにもわかるように，話す相手の名前を呼んでから話しかけてほしい。","<b>Ａ<\/b>さんが混乱するので，食堂での会話は控えてほしい。","<b>Ａ<\/b>さんは施設の予定がわからないので，これから食事だと教えてほしい。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"全盲のAさんは、誰が誰に話しかけているのかを視覚で判断できない。話しかける前に相手の名前を呼んでもらえば、自分に向けた会話かどうかがわかり、安心して会話に参加できる。","choices":["疲れていると決めつけて席を外させるのは、Aさんを会話の場から遠ざけてしまう。","突然手を握られると、見えないAさんは驚く。問題の解決にもならない。","名前を呼んでから話しかけると、誰に向けた話かがわかる。","会話を控えるのは周りの利用者の生活を制限し、Aさんの孤立も深める。","Aさんが困っているのは予定ではなく、誰に話しかけられているかがわからないこと。"],"point":"視覚障害のある人とのコミュニケーションは「声をかけるときは名前を呼ぶ」「話しかける人が名乗る」「いきなり触れない」「指示語（あれ・それ・ここ）を避けて具体的に言う」を覚える。","note":null}},{"id":"38-33","exam":38,"no":33,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"<b>Ａ<\/b>さん（72歳，男性）は記憶障害があり，介護施設に入居している。ある日，介護福祉職に<b>Ａ<\/b>さんが，「あの，ちょっとお願いがあるんです。ええとね，実は，お昼ご飯をほとんど残しちゃいました…。それでね…，あ，あれかな，調理師さんはがっかりしたかな，私はずっと食堂をやっていたんですよ。店はけっこう繁盛していたけど閉めることになってね。あ，ええと何の話だったかな…」と話しかけてきた。<br>次のうち，このときの<b>Ａ<\/b>さんの発言を促すための介護福祉職の応答として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「<b>Ａ<\/b>さんは，お店を閉めたくなかったのですね」","「<b>Ａ<\/b>さんは，どんな料理が得意だったのですか」","「調理師さんのことは気にしなくていいですよ」","「どこかからだの具合が悪いのではないですか」","「何かお願いがあるのではありませんか」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Aさんは「お願いがある」と話し始めたが、話がそれて本題を見失っている。最初の話題に戻す問いかけをすると、Aさんが本来伝えたかったことを話しやすくなる。","choices":["「閉めたくなかった」とは言っておらず、職員の推測を押しつけている。話もさらにそれる。","料理の話題に移ると、本来のお願いから離れてしまう。","調理師のことは本題ではないうえ、Aさんの気持ちを打ち切ってしまう。","体調不良を決めつけた問いかけで、話の内容に沿っていない。","最初の「お願い」に戻すことで、Aさんが伝えたいことを話せるよう促している。"],"point":"記憶障害がある人の話がそれたときは、本人が最初に言ったキーワードに戻して話の糸口をつくる。職員が推測で話をまとめたり、新しい話題を出したりする選択肢は誤り。","note":null}},{"id":"38-34","exam":38,"no":34,"subject":"コミュニケーション技術","group":3,"case":null,"stem":"次の記述のうち，客観的事実に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者<b>Ａ<\/b>は，楽しかったはずだ。","利用者<b>Ａ<\/b>は，朝食のパンを残した。","利用者<b>Ａ<\/b>は，何か言いたそうだった。","利用者<b>Ａ<\/b>は，不安だったと思う。","利用者<b>Ａ<\/b>は，退屈そうにしていた。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"客観的事実とは、誰が見ても同じように確認できる事実のこと。「朝食のパンを残した」は観察した行動をそのまま書いており、客観的事実にあたる。","choices":["「楽しかったはずだ」は記録者の推測。","実際に確認できる行動で、客観的事実。","「言いたそうだった」は記録者の解釈。","「不安だったと思う」は記録者の推測。","「退屈そうに」は記録者の印象（主観）。"],"point":"記録の問題では、文末に「〜はずだ」「〜と思う」「〜そうだった」がつくものは主観（推測・解釈）と判断する。主観を書くときは、根拠となる事実と区別して記録する。利用者の言葉はそのまま「 」で書くのも客観的な記録の基本。","note":null}},{"id":"38-35","exam":38,"no":35,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護福祉職が行う利用者の生活支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者ができないことを代わりに行うことに重点を置く。","利用者の全体像をとらえて支援する。","利用者がすべてを自分一人でできるようにする。","利用者の生活の効率化を図ることを目標にする。","利用者に同情する気持ちで寄り添う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"生活支援では、心身の状態だけでなく、生活歴・価値観・家族や地域との関係などを含めた利用者の全体像をとらえ、その人らしい生活を支える。","choices":["できないことを代わりに行うことが中心になると、残存能力を使う機会を奪い、自立を妨げる。","全体像をとらえることで、その人に合った支援を考えられる。","自立は「すべて一人でできること」ではない。必要な支援を受けながら自分で選び決めることも自立に含まれる。","目標は本人の望む生活の実現。効率は介護者側の都合になりやすい。","同情は相手を「かわいそうな人」と見る一方的な感情。求められるのは相手の立場で理解する共感的な姿勢。"],"point":"生活支援の基本問題では「全体像」「その人らしさ」「残存能力の活用」「自己決定」が正答のキーワード。「代わりに行う」「すべて自分で」「効率化」「同情」は誤りの定番。","note":null}},{"id":"38-36","exam":38,"no":36,"subject":"生活支援技術","group":4,"case":null,"stem":"介護老人福祉施設における，快適な室内環境に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["風の通り道をつくって，換気を行う。","手すりは，壁紙と同じ色を使う。","ベッドライトの光源は，利用者の目に直接あたるように調整する。","カビの発生を予防するために，湿度は高く保つ。","靴音を小さくするために，硬い床材にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"空気の入口と出口をつくって風の通り道を確保すると、室内の空気が効率よく入れ替わる。臭気や二酸化炭素、病原体を含む空気を外に出すことは、快適さと感染予防の両方に役立つ。","choices":["対角線上の窓や扉を開けるなど、風の通り道をつくると換気の効率がよい。","手すりは壁と違う色にして目立たせる。高齢者は色の差やコントラストが見分けにくくなる。","光源が目に直接あたるとまぶしい。光源は目に入らない向きに調整する。","湿度が高いとカビやダニが発生しやすい。室内の湿度は高すぎず低すぎない範囲に保つ。","硬い床材は靴音が響きやすく、転倒したときのけがも大きくなる。音を抑えるには、クッション性のある床材などを選ぶ。"],"point":"室内環境の問題は「換気は通り道をつくる」「手すり・段差は色の対比で目立たせる」「照明はまぶしさを避ける」「湿度は高すぎるとカビ」をセットで覚える。","note":null}},{"id":"38-37","exam":38,"no":37,"subject":"生活支援技術","group":4,"case":null,"stem":"パーキンソン病（Parkinson disease）の人の住まいに関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["玄関の段差には，スロープを設置する。","廊下の床には，歩幅に合わせて目印をつける。","リビングの床には，大きさの違うカーペットを重ねて敷く。","移動空間が狭くなるように，家具を配置する。","リビングは1階，浴室は2階にして，階段で行き来する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"パーキンソン病では、歩き始めや方向転換で足が出なくなる「すくみ足」が起こる。床に歩幅に合わせた目印（テープなど）があると、それを目安にまたぐように足を出しやすくなる。","choices":["前傾姿勢と小刻み歩行があり、下り坂では歩行が加速して止まれなくなることがある（突進現象）。スロープが安全とは限らない。","視覚的な目印は、すくみ足の改善に役立つ。","カーペットを重ねると段差ができ、すり足で歩く人はつまずきやすい。","移動空間が狭いと方向転換が増え、すくみ足や転倒が起こりやすい。動線は広く確保する。","階段の昇降は転倒の危険が高い。生活に必要な部屋は同じ階にまとめる。"],"point":"パーキンソン病の四大症状（安静時振戦・筋固縮・無動・姿勢反射障害）と、そこから起こる「すくみ足」「小刻み歩行」「突進現象」を押さえる。すくみ足には「床の目印」「リズムをとる声かけ」が有効、と覚える。","note":null}},{"id":"38-38","exam":38,"no":38,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，歩行が不安定になり，移動の意欲が低下している利用者に対する介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["福祉用具の使用は避けて，自力での歩行を目指すように促す。","移動の目的を伝えるよりも，歩行機能の改善を優先する。","成功体験を積み重ねることができるように，達成可能な歩行の目標距離を設定する。","歩行の不安定さに合わせて，移動範囲を縮小する。","本人が希望しなくても，介護福祉職の判断で毎日歩くことを目標にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"移動の意欲が低下しているときは、無理なく達成できる目標を設定し、「できた」という成功体験を重ねることで自信と意欲を引き出す。","choices":["不安定な歩行で福祉用具を避けると転倒の危険が高まる。適切な福祉用具は安全と自立の両方を支える。","「何のために移動するか」がわかると意欲につながる。目的を伝えることを後回しにするのは逆効果。","達成可能な目標で成功体験を積むと、意欲が高まる。","移動範囲を縮小すると活動量が減り、生活不活発病（廃用症候群）が進んでしまう。","本人の希望を無視した目標は自己決定に反し、意欲もさらに下がる。"],"point":"意欲低下への支援は「小さな目標→成功体験→自信」の流れで考える。「本人が希望しなくても」「介護福祉職の判断で」と書かれた選択肢はまず疑う。","note":null}},{"id":"38-39","exam":38,"no":39,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，右片麻痺のある利用者に対する，仰臥位（背臥位）から車いすへの移乗の介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者に右側臥位になって起き上がるように促す。","端座位になった利用者の左側に立つ。","端座位になった利用者の右側に，車いすを置く。","車いすのフットサポートは下げておく。","移乗するときは，利用者に前傾姿勢をとるように促す。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"立ち上がりや移乗のときに前傾姿勢をとると、重心が足の上に移り、少ない力で腰を浮かせることができる。","choices":["起き上がりは健側（左）を下にした左側臥位から行う。麻痺側を下にすると、健側の手で支えられず、麻痺側を傷めるおそれもある。","介護福祉職は、転倒しやすい麻痺側（右側）に立って支える。","車いすは健側（左側）に置く。健側の手でアームサポートをつかみ、健側の足を軸に回れる。","フットサポートは上げておく。下げたままだと足が引っかかり、転倒の原因になる。","前傾姿勢で重心を前に移すと、立ち上がりやすい。"],"point":"片麻痺の移乗は「車いすは健側に置く」「介護者は患側に立つ」「起き上がりは健側を下に」「フットサポートは上げる」「前傾姿勢」を一組で覚える。右片麻痺か左片麻痺かで、左右を必ず確認してから選ぶ。","note":null}},{"id":"38-40","exam":38,"no":40,"subject":"生活支援技術","group":4,"case":null,"stem":"視覚障害者の歩行時の誘導に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護福祉職は，利用者の半歩後ろで背中を支えながら歩く。","介護福祉職は，白杖に触れながら歩く。","狭い通路では，介護福祉職は利用者の後ろを歩く。","階段利用時は，介護福祉職は階段の前で声かけして止まる。","介護福祉職は，利用者が握っている上肢を振って歩く。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"階段や段差の手前でいったん止まり、上りか下りかを声で伝えると、利用者は心構えができ、安全に足を運べる。","choices":["介護福祉職は利用者の半歩前に立ち、利用者に肘の少し上などを握ってもらう。後ろから背中を支えると進む方向がわからない。","白杖は利用者が路面を確かめる大切な道具。介護福祉職が触れると使えなくなる。","狭い通路では、介護福祉職が前、利用者が後ろになり、一列で進む。","階段の前で止まって声をかけるのが基本。","腕を振ると利用者の体が揺れ、方向や動きがわかりにくくなる。腕は体側につけて安定させる。"],"point":"視覚障害者の誘導は「介護者は半歩前」「利用者は介護者の肘の上を握る」「狭い所は介護者が前」「段差・階段の手前で止まって伝える」「白杖には触れない」を覚える。","note":null}},{"id":"38-41","exam":38,"no":41,"subject":"生活支援技術","group":4,"case":null,"stem":"身じたくの目的に関する次の記述のうち，国際生活機能分類（ＩＣＦ）における「心身機能・身体構造」の観点が考えられるものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["体温を調整する。","身体を清潔に保つ。","セルフケアを行う。","自分を表現する。","周囲との人間関係を調整する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"ICFの「心身機能」は、体温調節などの身体の生理的な働きを指す。衣服で暑さ寒さを調節し体温を保つことは、心身機能の観点からみた身じたくの目的である。","choices":["体温調節は心身機能にあたる。","身体を洗う・手入れをすることは、ICFでは「活動」（セルフケア）の項目にあたる。","セルフケアは「活動」の分類に含まれる。","おしゃれで自分らしさを表すことは、ICFでは社会との関わりとしての「参加」や、その人の好み・価値観である「個人因子」に関わる。心身機能ではない。","対人関係は「活動と参加」の分類に含まれる。"],"point":"ICFの問題は「心身機能＝体の働き（体温調節・関節の動きなど）」「活動＝個人が行う動作（洗う・着る・食べる）」「参加＝社会や人との関わり」に振り分けて考える。","note":null}},{"id":"38-42","exam":38,"no":42,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護が必要な利用者への口腔ケアとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["仰臥位（背臥位）で行う。","歯垢を除去するためにうがいをしてもらう。","歯ブラシで歯を1，2本ずつ磨く。","スポンジブラシは乾いた状態で使用する。","部分床義歯（局部床義歯）はつけたまま行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"歯ブラシを小刻みに動かし、1〜2本ずつ磨くと、歯と歯ぐきの境目や歯の間の歯垢を確実に落とせる。","choices":["仰臥位では水分や汚れがのどに流れ込み、誤嚥しやすい。座位やファーラー位で顎を引くか、側臥位で行う。","歯垢は歯にこびりついた細菌のかたまりで、うがいだけでは落ちない。歯ブラシで機械的に除去する。","1〜2本ずつ丁寧に磨くのが基本。","乾いたスポンジブラシは粘膜を傷つける。水で湿らせて、よく絞ってから使う。","部分床義歯は外して、義歯も残っている歯も別々に清掃する。つけたままでは義歯の下やバネのかかる歯が磨けない。"],"point":"口腔ケアは「誤嚥予防の姿勢（座位・顎を引く／側臥位）」「歯垢はブラッシングで落とす」「スポンジブラシは湿らせて絞る」「義歯は外して清掃」をセットで覚える。","note":null}},{"id":"38-43","exam":38,"no":43,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，右片麻痺の利用者が前開きの上着を着脱するときに介護福祉職が行う説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「脱ぐときは，左肩の衣服を下げてから，右側の袖から腕を抜きましょう」","「脱ぐときは，右肩の衣服を下げてから，右側の袖から腕を抜きましょう」","「襟元を手前にして，腿の上に置きましょう」","「着るときは，右袖を肘まで通してから，左袖を通しましょう」","「着るときは，右袖を肩まで通してから，左袖を通しましょう」"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"片麻痺のある人の着脱は「脱健着患」（脱ぐときは健側から、着るときは患側から）が原則。右片麻痺では、着るときに麻痺側の右袖を肩まで通しておくと、背中に回した衣服がずれず、健側の左腕を通しやすい。","choices":["正しい手順は「麻痺側（右）の肩の衣服を先に下げてゆとりを作る→健側（左）の袖を抜く→麻痺側（右）の袖を抜く」。この選択肢は下げる肩も、先に抜く袖も逆になっている。","右肩を先に下げるところまでは正しいが、その後に麻痺側（右）の袖から抜いており、「脱健」に反する。","一般に、自分で着るときに腿の上に置く場合は、裏側を上にし、襟元を膝側（向こう側）にすると、患側の袖に手を通しやすい。","肘までしか通さないと、衣服が肩からずり落ち、健側の袖を通すときに引っぱられて麻痺側の腕を傷めやすい。","患側の袖を肩までしっかり通してから健側を通す。"],"point":"「脱健着患」で右・左のどちらが健側かを先に確定させる。着るときは「患側を肩まで」が決め手で、「肘まで」はひっかけの型。","note":null}},{"id":"38-44","exam":38,"no":44,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護老人福祉施設における食事に関する支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["食堂の換気は，不要である。","食事中は，会話を控えるようにする。","食事が楽しくなるような雰囲気をつくる。","食べ終わった利用者の食器は，すぐに下膳する。","照明は，明るさを25ルクス（lx）以下にする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"食事は栄養をとるだけでなく、楽しみや人との交流の場でもある。楽しい雰囲気は食欲を高め、生活の質の向上につながる。","choices":["食べ物のにおいや湿気がこもる。換気は必要。","会話は食事の楽しみの一つ。ただし口に食べ物が入っているときは誤嚥に注意して話しかけるタイミングを選ぶ。","楽しい雰囲気づくりは食事支援の基本。","すぐに下膳すると、まだ食べている人がせかされた気持ちになる。全体の様子を見て下膳する。","25ルクス以下は暗すぎて、料理の色や形が見えにくく、食欲も落ちる。食堂は十分な明るさが必要。"],"point":"食事環境の問題は「楽しく・落ち着いて・見やすく」が基準。「会話を控える」「すぐ下膳」「暗い照明」は、効率や管理を優先した誤りの型。","note":null}},{"id":"38-45","exam":38,"no":45,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，椅子に座って食事をするときに，利用者が食事をしやすい姿勢を確保するための介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["足底を床につけてもらう。","テーブルと身体の間は30 cm 離してもらう。","椅子に浅く座ってもらう。","体幹を後方に傾けてもらう。","顎を上げてもらう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"足底を床につけると姿勢が安定し、体幹がやや前傾しやすくなる。この姿勢は食べ物を取り込み飲み込むのに適しており、誤嚥予防にもなる。","choices":["足底を床につけると姿勢が安定する。","30cmは遠すぎて前かがみになりにくい。テーブルと身体の間はこぶし1つ分程度が目安。","浅く座ると骨盤が後ろに傾き、ずり落ちやすく姿勢が崩れる。深く座る。","後ろに傾くと食べ物がのどに流れ込みやすく、誤嚥の危険が高まる。体幹はやや前傾。","顎が上がると気道が開いて誤嚥しやすい。顎は軽く引く。"],"point":"食事の姿勢は「深く座る・足底を床に・やや前傾・顎を引く・テーブルとはこぶし1つ分」をまとめて覚える。「顎を上げる」「後ろに傾く」は誤嚥につながる誤りの定番。","note":null}},{"id":"38-46","exam":38,"no":46,"subject":"生活支援技術","group":4,"case":null,"stem":"咀嚼機能が低下した利用者の食事介護に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["大きめのスプーンで吸い込むように食べてもらう。","一口量は，ティースプーンに軽く一杯を目安にする。","食べる順番は，介護福祉職の判断で行う。","スプーンは，舌の奥にのせるように入れる。","咀嚼が始まったら，すぐに次の食べ物を口に入れる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"咀嚼機能が低下した人には、一口量を少なめ（ティースプーンに軽く一杯程度）にすると、口の中でまとめやすく、のどに詰まらせにくい。","choices":["大きいスプーンは一口量が多くなり、吸い込むと食べ物が気道に入りやすい。小さめのスプーンを使う。","一口量は少なめが基本。","何から食べるかは本人の希望を尊重する。","舌の奥にのせると、咀嚼する前にのどに送られ、むせや誤嚥の原因になる。舌の中央あたりにのせる。","飲み込みを確認してから次の一口を入れる。続けて入れると口の中にたまり、窒息の危険がある。"],"point":"食事介助は「少なめの一口量」「舌の中央にのせる」「飲み込みを確認してから次」「食べる順番は本人の希望」の4点を押さえる。","note":null}},{"id":"38-47","exam":38,"no":47,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，女性，要介護3）は，介護老人福祉施設で生活している。食事は見守りのもとでほぼ自力で摂取しているが，嚥下機能は低下してきている。医師からは，食事摂取に配慮するように指導されている。ある日の昼食中，<b>Ａ<\/b>さんは食事を1/3ほど食べたところで箸を止め，表情がこわばり，呼吸もやや浅くなった。<br>次の記述のうち，介護福祉職が医療職に報告すると同時に，最初に行う対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["血圧を測定する。","口腔の状況を観察する。","口すぼめ呼吸を促す。","その場で仰臥位（背臥位）になってもらう。","すぐに薬を服用してもらう。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"嚥下機能が低下しているAさんが食事中に急に箸を止め、表情がこわばり呼吸が浅くなった。食べ物がのどに詰まりかけている（窒息・誤嚥）可能性があるため、まず口の中に食べ物が残っていないかを確認する。","choices":["血圧測定は緊急時の最初の対応ではない。原因の確認と気道の確保を優先する。","口腔内を観察し、食べ物の詰まりを確認する。","口すぼめ呼吸は慢性閉塞性肺疾患（COPD）などの呼吸法。のどの詰まりは解消しない。","仰臥位にすると、口の中やのどの食べ物がさらに奥に入り込む。","薬を飲ませると、さらに誤嚥・窒息の危険が高まる。医師の指示もない。"],"point":"食事中の急変問題は、まず「窒息・誤嚥ではないか」を疑い、口の中を確認する。窒息のサイン（のどをつかむ・声が出ない・顔色の変化）と、異物除去の方法（背部叩打法・腹部突き上げ法）もあわせて覚える。","note":null}},{"id":"38-48","exam":38,"no":48,"subject":"生活支援技術","group":4,"case":null,"stem":"ベッド上で行う陰部洗浄に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["滅菌手袋を使用して行う。","上半身はベッドの手前端に移動する。","バスタオルで両下肢を包む。","洗浄する時は，43℃のお湯を用いる。","終了後は，蒸しタオルで水分を拭き取る。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"陰部洗浄では、洗う部分以外はできるだけ露出しないようにする。両下肢をバスタオルで包むと、保温とプライバシーの保護ができる。","choices":["陰部洗浄は無菌操作ではないので、滅菌手袋は不要。使い捨て手袋を使う。","上半身だけを端に寄せる必要はない。体がねじれて不安定になり、転落の危険もある。","保温と羞恥心への配慮になる。","43℃は皮膚や粘膜には熱すぎる。38℃前後のお湯を使い、介護福祉職の前腕内側などで温度を確かめる。","洗浄後の要点は、乾いたタオルをこすらずに押し当てて、水分を残さないこと。蒸しタオルでは湿り気が残り、皮膚がふやけてかぶれやすい。"],"point":"陰部洗浄は「使い捨て手袋」「露出を最小限に（バスタオルで覆う）」「38℃前後のお湯」「前から後ろへ洗う（女性は尿道口から肛門へ）」「乾いたタオルで押さえ拭き」を覚える。","note":null}},{"id":"38-49","exam":38,"no":49,"subject":"生活支援技術","group":4,"case":null,"stem":"腹部の清拭の方法を図に示す。矢印は拭く方向を表している。<br>次のうち，基本的な清拭の方法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":[],"notes":null,"figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUg
