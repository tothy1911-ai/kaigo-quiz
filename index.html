  // ---- ユーティリティ ----
  function h(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function setLabel(key) {
    if (key === "review") return "間違えた問題の復習";
    const parts = key.split("-");
    return parts[0] === "exam" ? `本番形式 第${parts[1]}回` : `科目別 ${GROUPS[+parts[1] - 1]}`;
  }
  function orderFor(key) {
    if (key === "review") return L.reviewOrder(state, QUESTIONS);
    const parts = key.split("-");
    return parts[0] === "exam" ? L.examOrder(QUESTIONS, +parts[1]) : L.groupOrder(QUESTIONS, +parts[1]);
  }
  function show(html, keepScroll) {
    app.innerHTML = html;
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function warnBanner() {
    return storageOk ? "" :
      `<div class="warn">この開き方では学習記録が保存されません。記録を残すには「記録のバックアップ」から書き出してください。</div>`;
  }

  // ---- レーダーチャート ----
  function radarSvg() {
    const rows = L.radar(state, QUESTIONS, GROUPS.length);
    const N = rows.length, cx = 240, cy = 195, R = 115;
    const pt = (i, r) => {
      const a = -Math.PI / 2 + 2 * Math.PI * i / N;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    };
    const poly = f => rows.map((row, i) => pt(i, f(row)).map(v => v.toFixed(1)).join(",")).join(" ");
    const aria = rows.map((row, i) => `${GROUPS[i]} ${row.rate === null ? "未学習" : Math.round(row.rate * 100) + "%"}`).join("、");
    let s = `<svg viewBox="0 0 480 400" class="radar" role="img" aria-label="科目群別の正答率：${aria}">`;
    [0.25, 0.5, 0.75, 1].forEach(f => { s += `<polygon class="grid" points="${poly(() => R * f)}"/>`; });
    rows.forEach((_, i) => {
      const [x, y] = pt(i, R);
      s += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    });
    s += `<polygon class="data" points="${poly(row => R * (row.rate || 0))}"/>`;
    rows.forEach((row, i) => {
      const [x, y] = pt(i, R + 18);
      const anchor = Math.abs(x - cx) < 8 ? "middle" : (x > cx ? "start" : "end");
      const val = row.rate === null ? "未学習" : Math.round(row.rate * 100) + "%";
      s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="lbl">` +
        `<tspan>${SHORT[i]}</tspan><tspan x="${x.toFixed(1)}" dy="17" class="val">${val}</tspan></text>`;
    });
    return s + "</svg>";
  }

  // ---- ホーム ----
  function modeRow(key, title, count, disabled) {
    const set = state.sets[key];
    if (set) {
      const done = Object.keys(set.answers).length;
      return `<div class="row"><div class="row-label">${h(title)}<small>途中（回答 ${done} / ${set.order.length}問）</small></div>` +
        `<div class="row-actions"><button class="primary" data-act="resume" data-key="${key}">続きから</button>` +
        `<button data-act="restart" data-key="${key}">最初から</button></div></div>`;
    }
    return `<button class="row-btn" data-act="start" data-key="${key}" ${disabled ? "disabled" : ""}>` +
      `${h(title)}<small>${count}問</small></button>`;
  }

  function renderHome() {
    const reviewCount = L.reviewOrder(state, QUESTIONS).length;
    show(`
      <h1>介護福祉士 過去問</h1>
      ${warnBanner()}
      <section><h2>本番形式</h2>
        ${EXAMS.slice().reverse().map(e => modeRow(`exam-${e}`, `第${e}回`, 125, false)).join("")}
      </section>
      <section><h2>科目別</h2>
        ${GROUPS.map((g, i) => modeRow(`group-${i + 1}`, g, QUESTIONS.filter(q => q.group === i + 1).length, false)).join("")}
      </section>
      <section><h2>間違えた問題の復習</h2>
        ${modeRow("review", "間違えた問題", reviewCount, reviewCount === 0)}
      </section>
      <section><h2>得意・苦手</h2>${radarSvg()}</section>
      <section><button class="row-btn" data-act="backup">記録のバックアップ<small>書き出し・読み込み</small></button></section>
      <footer>
        <p>問題の出典: 公益財団法人 社会福祉振興・試験センター 公表の第36回〜第38回介護福祉士国家試験問題</p>
        <p>解説は本アプリ作成者が独自に作成したもので、社会福祉振興・試験センターとは関係ありません。</p>
        <p>過去問題には、その後の法改正等により、現時点では正答が成立しないものが含まれる場合があります。</p>
      </footer>`);
  }

  // ---- 解答 ----
  function progressLabel(p) {
    return p.phase === "main" ? `${p.index} / ${p.total}` : `スキップした問題 ${p.index} / ${p.total}`;
  }

  function choicesHtml(q, key) {
    let out = "";
    for (let n = 1; n <= 5; n++) {
      const text = q.choices.length ? q.choices[n - 1] : "";
      let cls = "";
      if (feedback) {
        if (q.answer.indexOf(n) !== -1) cls = "ok";
        else if (feedback.choice === n) cls = "ng";
      }
      out += `<li><button class="choice ${cls}" data-act="choose" data-key="${key}" data-choice="${n}" ${feedback ? "disabled" : ""}>` +
        `<span class="num">${n}</span><span class="txt">${text}</span></button></li>`;
    }
    return out;
  }

  function expHtml(q) {
    const e = q.exp;
    if (!e) return `<section class="exp"><p>解説準備中</p></section>`;
    return `<section class="exp">
      <h3>正答の根拠</h3><p>${e.basis}</p>
      <h3>選択肢</h3><ol class="exp-choices">${e.choices.map((c, i) => `<li><span class="num">${i + 1}</span><span>${c}</span></li>`).join("")}</ol>
      <h3>合格へのポイント</h3><p>${e.point}</p>
      ${e.note ? `<div class="note"><h3>注意</h3><p>${e.note}</p></div>` : ""}
    </section>`;
  }

  function renderQuiz(key) {
    const set = state.sets[key];
    const q = byId[feedback ? feedback.id : L.currentId(set)];
    const p = feedback ? feedback.prog : L.progress(set);
    const after = feedback
      ? `<div class="fb ${feedback.correct ? "ok" : "ng"}">${feedback.correct ? "○ 正解" : "× 不正解"}<span>正答 ${q.answer.join("・")}</span></div>
         ${expHtml(q)}
         <button class="primary wide" data-act="next" data-key="${key}">次へ</button>`
      : `<button class="wide" data-act="skip" data-key="${key}">スキップ</button>`;
    show(`
      <header class="bar"><span>${h(setLabel(key))}</span><button data-act="interrupt" data-key="${key}">中断</button></header>
      <div class="progress">${progressLabel(p)}</div>
      <article class="q">
        <div class="q-meta">第${q.exam}回 問${q.no}｜${h(q.subject)}</div>
        ${q.case ? `<details class="case" open><summary>事例</summary><div>${q.case}</div></details>` : ""}
        <div class="stem">${q.stem}</div>
        ${q.figure ? `<img class="fig" src="${q.figure}" alt="問題の図">` : ""}
        <ol class="choices">${choicesHtml(q, key)}</ol>
        ${q.notes ? `<div class="notes">${q.notes}</div>` : ""}
      </article>
      ${after}`, !!feedback);
    if (feedback) {
      const fb = app.querySelector(".fb");
      if (fb) fb.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function advance(key) {
    const set = state.sets[key];
    const st = L.status(set);
    if (st === "question") return renderQuiz(key);
    if (st === "askSkipped") return renderAskSkipped(key);
    const sum = L.finishSet(state, key);
    save();
    renderResult(key, sum, false);
  }

  function renderAskSkipped(key) {
    const n = state.sets[key].skipped.length;
    show(`
      <header class="bar"><span>${h(setLabel(key))}</span></header>
      <div class="card">
        <p>スキップした問題が${n}問あります。解きますか？</p>
        <button class="primary wide" data-act="solveSkipped" data-key="${key}">解く</button>
        <button class="wide" data-act="endSet" data-key="${key}">終了する</button>
      </div>`);
  }

  // ---- 結果 ----
  function renderResult(key, sum, interrupted) {
    const rate = sum.answered ? `（${Math.round(sum.correct / sum.answered * 100)}%）` : "";
    const wrong = sum.answered - sum.correct;
    const buttons = interrupted
      ? `<button class="primary wide" data-act="resume" data-key="${key}">続きから</button>`
      : (wrong > 0 && L.reviewOrder(state, QUESTIONS).length > 0
          ? `<button class="primary wide" data-act="${state.sets.review ? "resume" : "start"}" data-key="review">間違えた問題を復習する</button>` : "");
    show(`
      <h1>${interrupted ? "中断" : "終了"}</h1>
      <p class="sub">${h(setLabel(key))}</p>
      <p class="score">${sum.answered}問中 ${sum.correct}問正解${rate}</p>
      ${interrupted ? `<p class="sub">未回答 ${sum.total - sum.answered}問（続きから再開できます）</p>` : ""}
      <section><h2>得意・苦手</h2>${radarSvg()}</section>
      ${buttons}
      <button class="wide" data-act="home">ホームへ</button>`);
  }

  // ---- バックアップ ----
  function renderBackup() {
    show(`
      <header class="bar"><span>記録のバックアップ</span><button data-act="home">ホームへ</button></header>
      ${warnBanner()}
      <section><h2>書き出し</h2>
        <p>学習記録をファイルに保存します。ファイルを保存できない場合は、下の文字列をコピーしてメモなどに保存してください。</p>
        <button class="primary wide" data-act="download">ファイルに書き出す</button>
        <textarea id="exportText" readonly rows="4">${h(JSON.stringify(state))}</textarea>
        <button class="wide" data-act="copy">文字列をコピー</button>
      </section>
      <section><h2>読み込み</h2>
        <p>書き出したファイルを選ぶか、文字列を貼り付けてください。現在の記録は上書きされます。</p>
        <input type="file" id="importFile" accept=".json,application/json">
        <textarea id="importText" rows="4" placeholder="ここに貼り付け"></textarea>
        <button class="wide" data-act="importText">貼り付けた内容を読み込む</button>
        <p id="msg" class="msg" role="status"></p>
      </section>`);
  }

  function setMsg(text) { const m = document.getElementById("msg"); if (m) m.textContent = text; }

  function doImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return setMsg("読み込めません：形式が正しくありません。"); }
    if (!L.validateState(obj)) return setMsg("読み込めません：形式が正しくありません。");
    L.pruneState(obj, knownIds);
    pendingImport = obj;
    showConfirm("現在の記録は上書きされます。読み込みますか？", "読み込む", "confirmImport", "キャンセル", "cancelImport", "");
  }

  let pendingImport = null;
  function showConfirm(msg, okLabel, okAct, cancelLabel, cancelAct, key) {
    show(`
      <section class="card">
        <p>${h(msg)}</p>
        <button class="primary wide" data-act="${okAct}" data-key="${key}">${h(okLabel)}</button>
        <button class="wide" data-act="${cancelAct}" data-key="${key}">${h(cancelLabel)}</button>
      </section>`);
  }

  function download() {
    const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `kaigo-quiz-backup-${ymd}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  function copyExport() {
    const ta = document.getElementById("exportText");
    const fallback = () => { ta.select(); try { document.execCommand("copy"); setMsg("コピーしました。"); } catch (e) { setMsg("コピーできませんでした。手動で選択してコピーしてください。"); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(() => setMsg("コピーしました。"), fallback);
    } else fallback();
  }

  // ---- 操作 ----
  const actions = {
    start(d) {
      if (state.sets[d.key]) return actions.restart(d);
      L.startSet(state, d.key, orderFor(d.key));
      save();
      feedback = null;
      advance(d.key);
    },
    restart(d) {
      showConfirm("最初からやり直しますか？（このセットの途中経過は消えます。これまでの正誤の記録は残ります）", "やり直す", "confirmRestart", "キャンセル", "home", d.key);
    },
    confirmRestart(d) {
      const order = orderFor(d.key);
      if (order.length === 0) { delete state.sets[d.key]; save(); return renderHome(); }
      L.startSet(state, d.key, order);
      save();
      feedback = null;
      advance(d.key);
    },
    resume(d) { feedback = null; advance(d.key); },
    choose(d) {
      const set = state.sets[d.key];
      const q = byId[L.currentId(set)];
      const prog = L.progress(set);
      const choice = +d.choice;
      const correct = L.answer(state, d.key, q, choice, Date.now());
      save();
      feedback = { id: q.id, choice: choice, correct: correct, prog: prog };
      renderQuiz(d.key);
    },
    next(d) { feedback = null; advance(d.key); },
    skip(d) { L.skip(state, d.key); save(); advance(d.key); },
    solveSkipped(d) { L.beginSkippedRound(state, d.key); save(); advance(d.key); },
    endSet(d) { const sum = L.finishSet(state, d.key); save(); renderResult(d.key, sum, false); },
    interrupt(d) { feedback = null; renderResult(d.key, L.summary(state.sets[d.key]), true); },
    home() { feedback = null; renderHome(); },
    backup() { renderBackup(); },
    download() { download(); },
    copy() { copyExport(); },
    confirmImport() {
      if (!pendingImport) return renderBackup();
      state = pendingImport;
      pendingImport = null;
      save();
      renderBackup();
      setMsg("読み込みました。");
    },
    cancelImport() { pendingImport = null; renderBackup(); },
    importText() { doImport(document.getElementById("importText").value); },
  };

  let lastClick = 0;
  app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const now = Date.now();
    if (now - lastClick < 300) return;
    lastClick = now;
    actions[b.dataset.act](b.dataset);
  });
  app.addEventListener("change", e => {
    if (e.target.id !== "importFile" || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => doImport(String(r.result));
    r.readAsText(e.target.files[0]);
  });

  renderHome();
})();
</script>
</body>
</html>
