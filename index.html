護員（ホームヘルパー）が福祉用具を用いて入浴介護をしている。<br>次のうち，<b>Ａ<\/b>さんが入浴時に使用している福祉用具として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["移乗台","バスボード","入浴用リフト","浴槽用手すり","滑り止めマット"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"第5頚髄（C5）損傷では、肩や肘を曲げる動きは残るが、手指は動かせず、体幹も支えられないため、座位を自分で保つことが難しい。浴槽への出入りは、身体をつり上げて移動する入浴用リフトを使うのが安全である。","choices":["移乗台は、ある程度の座位保持や上肢での移動ができる人向け。C5損傷では自分で移動できない。","バスボードは、座ったまま浴槽をまたぐための用具。座位を保ち、足を持ち上げる動作が必要。","体幹を支えられない人でも、リフトで安全に浴槽へ出入りできる。","手すりは、つかんで体を支える握力や上肢の力が必要。C5損傷では使えない。","滑り止めマットは転倒予防の補助用具で、移動そのものは助けない。"],"point":"頚髄損傷はレベルごとの「できること」を覚える。C5は肘を曲げられるが手指は動かない、C6は手首を反らせる（自助具を使った食事などができる）、C7は肘を伸ばせる（プッシュアップによる移乗が可能になりうる）。","note":null}},{"id":"38-51","exam":38,"no":51,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ａ<\/b>さん（85歳，男性，要介護3）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）と診断され，認知症対応型共同生活介護（認知症高齢者グループホーム）で生活をしている。入所時，<b>Ａ<\/b>さんは，尿意や便意はあり，自分でトイレに行って排泄できていた。最近，認知機能の低下によって，トイレ以外の場所で排泄するようになった。<br>次の記述のうち，<b>Ａ<\/b>さんの状態に合わせた介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["骨盤底筋訓練を行う。","紙おむつを使用する。","一日の水分摂取量を減らす。","ほかの利用者と同じ時間にトイレへ誘導する。","トイレの出入口に「トイレ」と書いた紙を貼る。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"尿意・便意はあるが、認知機能の低下でトイレの場所がわからなくなっている。出入口に「トイレ」と表示すると、場所を見つけやすくなり、自分で排泄を続けられる。","choices":["骨盤底筋訓練は腹圧性尿失禁への対応。Aさんの原因は場所がわからないこと（機能性尿失禁）。","尿意・便意があり自分で排泄できる力が残っているのに、紙おむつは自尊心を傷つけ、排泄の自立を奪う。","水分を減らすと脱水や便秘を招き、問題も解決しない。","排泄のタイミングは人それぞれ。一律の時間ではなく、本人の排泄パターンに合わせて誘導する。","わかりやすい表示で、トイレの場所を認識しやすくする。"],"point":"認知症の人の排泄の失敗は「なぜトイレでできないか（場所がわからない・服の脱ぎ方がわからない等）」を考える。トイレの表示、排泄パターンに合わせた誘導、そわそわするなどのサインへの気づきが正答になりやすい。","note":null}},{"id":"38-52","exam":38,"no":52,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，下痢をしている利用者の水分補給として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["白湯","牛乳","炭酸水","コーヒー","冷水"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"下痢では水分と電解質が失われる。腸を刺激しない常温〜人肌程度の白湯は、下痢のときの水分補給に適している。","choices":["腸への刺激が少ない。","牛乳は脂肪分や乳糖を含み、下痢を悪化させることがある。","炭酸は腸を刺激し、ガスで腹部の張りも起こしやすい。","カフェインは腸の動きを活発にし、利尿作用もある。","冷たい飲み物は腸を刺激し、下痢を悪化させる。"],"point":"下痢のときは「常温〜温かい・刺激が少ない」飲み物を選ぶ。白湯のほか、電解質を補える経口補水液もあわせて覚える。冷たいもの・牛乳・炭酸・カフェインは避ける。","note":null}},{"id":"38-53","exam":38,"no":53,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ａ<\/b>さん（83歳，男性，要介護1）は，一人暮らしで，少額の年金で生活している。<b>Ａ<\/b>さんは軽度の認知症（dementia）と診断を受けている。近所には親しくしている人が複数人いる。ある日，訪問介護員（ホームヘルパー）が訪問すると，近所のスーパーで購入した未開封の健康食品が山積みになっていた。<b>Ａ<\/b>さんが財布を持ってきて，「買いたいものがたくさんあるが，お金が足りない。どうしたらよいか」と訪問介護員（ホームヘルパー）に相談した。<br>このときの訪問介護員（ホームヘルパー）の対応に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["「お金は足りているから安心して大丈夫ですよ」と伝える。","近所の親しい人に，財布を預かってもらえるか，聞いてみる。","鍵付きの引き出しに財布を入れ，訪問介護員（ホームヘルパー）が鍵を管理する。","「お金の使い方について，一緒に考えてみませんか」と提案する。","健康食品のクーリング・オフを勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"軽度の認知症があっても、Aさんには自分のお金の使い方を決める権利がある。「一緒に考えましょう」と提案すると、本人の意思を尊重しながら金銭管理の課題に向き合える。","choices":["Aさんの「お金が足りない」という訴えを否定しており、根拠もない。相談に応えていない。","近所の人に財布を預けるのは、本人の同意も法的な裏づけもなく、トラブルの原因になる。","訪問介護員が財布を管理するのは、本人の財産を勝手に管理することで不適切。","本人の自己決定を尊重しながら一緒に考える姿勢。","店で直接購入した商品は、原則としてクーリング・オフの対象外。本人の気持ちを聞かずに勧めるのも早すぎる。"],"point":"金銭管理の事例は「本人の意思を尊重し、一緒に考える」が正答の型。介護職が財布を預かる、近所の人に頼むなどは誤り。必要に応じて日常生活自立支援事業や成年後見制度につなぐこともあわせて覚える。","note":null}},{"id":"38-54","exam":38,"no":54,"subject":"生活支援技術","group":4,"case":null,"stem":"繊維や衣類の性質と洗濯方法に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["綿の柄物シャツには酸素系漂白剤を使う。","ナイロンのレインウエアは脱水時間を長くする。","ウールのニットセーターは乾燥機を使う。","レーヨンのパジャマはすすぎ時間を長くする。","絹のブラウスには弱アルカリ性洗剤を使う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"酸素系漂白剤は色柄物にも使える。綿の柄物シャツの漂白には酸素系を使う。塩素系漂白剤は色や柄まで脱色してしまうため、白物にしか使えない。","choices":["色柄物には酸素系漂白剤。","ナイロンのレインウエアのような防水・撥水素材は水を通しにくく、長い脱水は生地を傷める。脱水は短時間にする。","ウールは熱と摩擦で縮み、フェルト化する。乾燥機は使わず、平干しにする。","レーヨンは水に弱く、ぬれると縮んだり強度が落ちたりする。すすぎを長くすると傷みやすい。","絹（動物繊維）はアルカリに弱い。絹やウールには中性洗剤を使う。"],"point":"洗濯の問題は「色柄物は酸素系、白物は塩素系」「絹・ウールは中性洗剤」「ウールは乾燥機で縮む」「レーヨンは水に弱い」を覚える。洗濯表示（家庭洗濯・漂白・乾燥の記号）もあわせて確認しておく。","note":null}},{"id":"38-55","exam":38,"no":55,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ａ<\/b>さん（82歳，女性，要介護1）は，訪問介護（ホームヘルプサービス）を週1回利用し，生活援助を受けながら，自宅で一人暮らしをしている。調理は<b>Ａ<\/b>さん本人が行うなど，できることは自分で行いたいと思っている。ある日，訪問介護員（ホームヘルパー）は<b>Ａ<\/b>さんから買物リストを渡されて，近くのスーパーで食材を購入してきた。<br>次の記述のうち，<b>Ａ<\/b>さんへの生活援助における訪問介護員（ホームヘルパー）の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["依頼された食材が安かったので，リストに書かれた数より多く購入した。","おつりとレシート，購入した食材の確認を，<b>Ａ<\/b>さんにすべて任せた。","冷蔵庫を開けたとき，賞味期限切れの食材があったため廃棄した。","買物リストは，次から訪問介護員（ホームヘルパー）が書くことを提案した。","購入した食材で調理しにくいものがないか，<b>Ａ<\/b>さんに確認した。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Aさんは調理を自分で行いたいと思っている。購入した食材で調理しにくいもの（硬い・大きいなど）がないかを確認すると、Aさんが自分で調理を続ける支援になる。","choices":["依頼と違う数を買うのは、本人の意思と金銭を無視した行為。安くても依頼どおりに買う。","訪問介護員は、おつり・レシート・品物を本人と一緒に確認する。すべて任せると、金銭トラブルの原因になる。","本人の物を無断で捨ててはいけない。賞味期限切れに気づいたら本人に伝え、どうするか本人が決める。","買物リストを自分で書くことは、Aさんができていること。代わりに行うのは自立を妨げる。","本人の調理を支える確認で、自立支援になる。"],"point":"買物代行の問題は「依頼どおりに買う」「おつり・レシートは本人と一緒に確認」「本人の物を無断で処分しない」「本人ができることは本人が行う」が基準。","note":null}},{"id":"38-56","exam":38,"no":56,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，良質な睡眠のための環境づくりとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["日中は，強度の高い運動を多く取り入れる。","夜食は，就寝直前にとる。","入浴は，就寝の1〜2時間前に行う。","眠気がなくても，決まった時間に目を閉じる。","寝ている間も，照明は明るくしておく。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"入浴で体が温まり、その後に深部体温が下がっていくときに眠気が生じやすい。厚生労働省「健康づくりのための睡眠ガイド2023」でも、就寝の1〜2時間前の入浴が寝つきをよくするとしている。","choices":["強度の高い運動は疲労や興奮を残す。日中は適度な運動がよい。","就寝直前の食事は消化のために胃腸が働き、眠りを妨げる。","就寝の1〜2時間前の入浴は入眠を促す。","眠くないのに床に入ると、寝つけない時間が長くなり、かえって不眠を強める。眠くなってから床につく。","明るい照明は眠りを妨げる。夜間は暗くし、必要なら足元灯を使う。"],"point":"睡眠の環境づくりは「入浴は就寝1〜2時間前」「朝に日光を浴びる」「就寝前のカフェイン・飲酒・食事を避ける」「眠くなってから床につく」「夜は暗く静かに」をまとめて覚える。","note":null}},{"id":"38-57","exam":38,"no":57,"subject":"生活支援技術","group":4,"case":null,"stem":"<b>Ａ<\/b>さん（83歳，女性，要介護3）は，脳梗塞（cerebral infarction）の後遺症で左片麻痺があり，介護老人福祉施設に入所している。ある日の夜間，仰臥位（背臥位）で寝ていた<b>Ａ<\/b>さんが，「背中が重く感じて，眠れない」と介護福祉職に訴えた。<br>次の記述のうち，介護福祉職が<b>Ａ<\/b>さんに行う介護として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ファーラー位にして，左下肢にクッションを入れる。","両上肢の下に，クッションを入れる。","両膝窩部に，クッションを入れる。","右側臥位にして，クッションを抱いてもらう。","右下肢の足部に，クッションを入れる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"同じ仰臥位が続き、背中に圧がかかり続けて重さを感じている。健側（右）を下にした右側臥位にすると、背中の圧迫がなくなる。クッションを抱くと上側の腕や体幹が安定し、楽な姿勢を保てる。","choices":["ファーラー位では背中や仙骨部に体重がかかり、背中の重さは軽くならない。","上肢の下にクッションを入れても、背中の圧迫は変わらない。","膝窩部のクッションは膝を楽にするが、背中への圧は変わらない。","体位を変えて背中の圧迫を除き、クッションで姿勢を安定させる。","足部のクッションでは、背中の重さは解消しない。"],"point":"「背中が重い」「同じ部分が痛い」という訴えには、圧のかかる部位を変える体位変換が基本。片麻痺では健側を下にした側臥位とし、麻痺側を下にして長時間圧迫しないことも覚える。","note":null}},{"id":"38-58","exam":38,"no":58,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，介護老人福祉施設で，終末期にある利用者とその家族に行う介護福祉職の支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者の苦しそうな姿を見せないように，家族には面会を控えてもらう。","利用者と家族の関係が良好でない場合は，家族と連絡を取らないようにする。","好きなものや食べたいものがある場合は，家族に持ってきてもらう。","苦痛を訴える場合は，家族から激励してもらう。","家族が不安になるため，体調の変化は伝えないようにする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"終末期は、利用者が望むことを実現し、家族と過ごす時間を大切にする時期である。好きなもの・食べたいものを家族に持ってきてもらうと、利用者の希望がかない、家族も役割を果たせる。","choices":["面会を控えると、残された大切な時間を共に過ごせなくなる。家族の思いを聞きながら面会を支える。","関係が良好でなくても、家族と連絡を絶つのは適切ではない。関係修復の機会を奪うおそれもある。","利用者の希望を尊重し、家族も参加できる支援。","苦痛の訴えには、医療職と連携して苦痛を和らげる。激励はかえって本人を追い詰める。","体調の変化は家族に伝え、心の準備ができるように支える。"],"point":"終末期の支援は「本人の希望の実現」「家族と過ごす時間の確保」「家族への情報提供と心の準備の支援」「苦痛は医療職と連携して緩和」が正答の軸。「面会を控える」「伝えない」は誤りの定番。","note":null}},{"id":"38-59","exam":38,"no":59,"subject":"生活支援技術","group":4,"case":null,"stem":"次の記述のうち，施設で亡くなった利用者家族への介護福祉職の対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["悲しみの表出があった時点からかかわりを開始する。","傾聴よりも励ますことを重視する。","悲嘆は特異な反応のため注意する。","故人との思い出には触れないようにする。","悲嘆が長期化した場合は，専門医等へ相談するように助言する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"悲嘆は自然な反応だが、長期化して日常生活に支障が出る場合は、専門的な支援が必要になることがある。そのときは専門医などへの相談を勧める。","choices":["家族への支援（グリーフケア）は、亡くなる前の終末期から始まっている。悲しみが表に出てからではない。","励ましよりも、まず気持ちを受け止める傾聴が大切。","悲嘆は大切な人を失ったときの自然で正常な反応。特異な反応ではない。","故人の思い出を語ることは、悲しみを受け入れる助けになる。避ける必要はない。","長期化した悲嘆には専門的な支援につなぐ。"],"point":"グリーフケアは「死別前から始まる」「傾聴が中心」「悲嘆は正常な反応」「思い出を語ることを支える」「長期化・生活への支障があれば専門職へ」を押さえる。","note":null}},{"id":"38-60","exam":38,"no":60,"subject":"生活支援技術","group":4,"case":null,"stem":"次のうち，固定式歩行器が適した利用者として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["対麻痺で，下肢を交互に出すことができない人","片麻痺があって，麻痺側の指関節の拘縮がある人","両上肢の筋力が弱く，手関節に痛みがある人","両手の握力が保たれていて，数秒程度の立位保持ができる人","右の足根骨を骨折して，右下肢に体重をかけることができない人"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"固定式歩行器は、両手で持ち上げて前に置き、そこまで歩くことを繰り返して使う。両手でしっかり握れること、そして持ち上げる間の数秒、歩行器に頼らず立っていられることが条件になる。","choices":["下肢を前に出せないと、歩行器を前に置いても歩けない。車いすなど別の移動手段を検討する。","片麻痺で片手の指が拘縮していると両手で握れない。片麻痺の歩行には杖が使われることが多い。","上肢の筋力が弱く手関節が痛む人には、歩行器を持ち上げる動作の負担が大きい。前腕で支えるタイプなどを検討する。","両手の握力と短時間の立位保持という条件を満たしている。","片脚だけで立ったまま歩行器を持ち上げる瞬間は支えがなく、転倒の危険が高い。固定式歩行器に必要な条件（両手で握れる・短時間の立位保持）をそろって示しているのは4だけ、という点が判断の決め手。"],"point":"歩行器は種類ごとの条件を覚える。固定式は「持ち上げる→両手の握力と立位保持が必要」、交互型は「左右交互に動かす→持ち上げる力が弱い人向け」、キャスター付きは「押して進む→持ち上げなくてよい」。","note":null}},{"id":"38-61","exam":38,"no":61,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，比較的短い時間に限られる大きな感情の動きに該当するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["条件づけ","短期記憶","気分","思考","情動"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"「情動」は、怒り・恐れ・喜びなど、急に起こって比較的短い時間でおさまる強い感情の動き。動悸や発汗など身体の変化を伴うことが多い。","choices":["条件づけは、刺激と反応の結びつきによる「学習」のしくみ。感情の種類ではない。","短期記憶は、情報を数十秒ほど保持する「記憶」の種類。","気分は、弱いが長く続く感情の状態。「短い時間に限られる大きな動き」は情動。","思考は、考える・判断するといった認知の働き。","短時間で強い感情の動きが情動。"],"point":"「情動＝強い・短い・身体反応を伴う」「気分＝弱い・長く続く」の対比で覚える。選択肢に学習・記憶・認知の用語が混ぜてあれば、感情の用語は情動と気分の2つに絞れる。","note":null}},{"id":"38-62","exam":38,"no":62,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次の記述のうち，脳のしくみとその働きとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["神経細胞は，神経膠細胞（グリア細胞）を支える。","神経膠細胞（グリア細胞）は，情報伝達をつかさどる。","セロトニン（serotonin）は，神経伝達物質の1つである。","頭頂葉には，運動野が存在する。","海馬は，視覚をつかさどる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"セロトニンは、神経細胞どうしの情報伝達に使われる神経伝達物質の1つ。睡眠や気分の調整に関わる。","choices":["逆。神経膠細胞（グリア細胞）が神経細胞を支え、栄養を補給する。","情報伝達をつかさどるのは神経細胞（ニューロン）。グリア細胞は支持・保護の役割。","セロトニンは神経伝達物質。ドーパミン、アセチルコリンなども同じ仲間。","運動野は前頭葉（中心前回）にある。頭頂葉には体性感覚野がある。","海馬は記憶に関わる。視覚をつかさどるのは後頭葉。"],"point":"脳の部位は「前頭葉＝運動・思考」「頭頂葉＝感覚」「側頭葉＝聴覚・言語理解」「後頭葉＝視覚」「海馬＝記憶」をセットで覚える。神経細胞とグリア細胞の役割を入れ替える選択肢は定番のひっかけ。","note":null}},{"id":"38-63","exam":38,"no":63,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次の記述のうち，循環器系のしくみとして，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["心臓は体性神経が支配している。","肺動脈には静脈血が流れている。","左心室から出た血液は大静脈へ流れる。","リンパ管には血液が流れている。","静脈血とは酸素を多く含む血液である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"肺動脈は、心臓（右心室）から肺へ血液を送る血管。全身から戻った酸素の少ない静脈血が流れている。","choices":["心臓は自律神経（交感神経・副交感神経）が支配する。体性神経は骨格筋や感覚を担う。","肺動脈には静脈血が流れる。","左心室から出た血液は大動脈へ流れ、全身へ送られる。大静脈は全身から右心房へ戻る血管。","リンパ管を流れるのはリンパ液。","静脈血は酸素が少ない血液。酸素を多く含むのは動脈血。"],"point":"「動脈＝心臓から出る血管」「静脈＝心臓へ戻る血管」で、中を流れる血液の種類とは別。肺だけは逆になり「肺動脈＝静脈血」「肺静脈＝動脈血」。この例外が毎年のように問われる。","note":null}},{"id":"38-64","exam":38,"no":64,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次の記述のうち，人の動作時に収縮する筋肉に関する説明として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["立位を保持するときは大殿筋が収縮する。","膝の屈曲には大腿四頭筋が収縮する。","肘の屈曲には上腕三頭筋が収縮する。","肩関節を内転するときは三角筋が収縮する。","足関節の底屈では前脛骨筋が収縮する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"大殿筋は股関節を伸ばす筋肉で、重力に逆らって姿勢を保つ抗重力筋の1つ。立位を保つときに収縮する。","choices":["大殿筋は立位保持に働く抗重力筋。","大腿四頭筋は膝を伸ばす（伸展）。膝を曲げるのは大腿の後ろ側のハムストリングス。","上腕三頭筋は肘を伸ばす。肘を曲げるのは上腕二頭筋。","三角筋は肩関節を外転させる（腕を横に上げる）。内転ではない。","前脛骨筋は足関節を背屈させる（つま先を上げる）。底屈は下腿三頭筋（ふくらはぎ）。"],"point":"筋肉は「曲げる側・伸ばす側」の対で覚える。上腕二頭筋⇔三頭筋、ハムストリングス⇔大腿四頭筋、前脛骨筋⇔下腿三頭筋。誤りの選択肢は、対になる筋肉と入れ替えて作られている。","note":null}},{"id":"38-65","exam":38,"no":65,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，白内障（cataract）で混濁する部位として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["網膜","角膜","脈絡膜","硝子体","水晶体"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"白内障は、レンズの役割をする水晶体が白く濁る病気。加齢によるものが最も多く、まぶしさやかすみ目が起こる。","choices":["網膜は像を映す部分。網膜の病気には網膜剝離、糖尿病性網膜症などがある。","角膜は眼の表面の透明な膜。白内障で濁る部位ではない。","脈絡膜は網膜の外側にある血管の多い膜。","硝子体は眼球内を満たすゼリー状の組織。白内障で濁るのは水晶体。","白内障は水晶体の混濁。"],"point":"眼の病気は部位とセットで覚える。「白内障＝水晶体の混濁」「緑内障＝眼圧上昇などによる視神経の障害」「加齢黄斑変性＝網膜の中心部（黄斑）の障害」。","note":null}},{"id":"38-66","exam":38,"no":66,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次の記述のうち，低栄養の高齢者にみられる症状や行動の特徴として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["唾液の分泌が増加する。","腸蠕動が亢進する。","食べこぼしが減る。","偏りのある食べ方をする。","体重が増える。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"低栄養の高齢者には、好きなものだけを食べるなど偏った食べ方がみられやすい。偏った食べ方は低栄養の原因にもなるため、食事の観察で気づくことが大切。","choices":["低栄養や加齢では唾液の分泌は減る傾向にある。","低栄養では活動量や食事量が減り、腸蠕動はむしろ低下して便秘になりやすい。","低栄養で筋力や体力が落ちると、食べこぼしはむしろ増えやすい。","偏りのある食べ方は低栄養の高齢者にみられる特徴。","低栄養では体重が減る。体重減少は低栄養を見つける重要なサイン。"],"point":"低栄養のサインは「体重減少」「食事量の減少・偏り」「筋力低下」「活動量の低下」「浮腫（血清アルブミン低下による）」。低栄養の問題では、唾液・腸蠕動・体重などが「増える・亢進する」とする選択肢は誤りを疑う（低栄養では多くの機能が低下する方向に変化するため。ただし浮腫は低栄養で現れるサインなので例外として覚える）。","note":null}},{"id":"38-67","exam":38,"no":67,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，バリア機能をもつ表皮の構造として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["汗腺","角質層","基底層","有棘層","顆粒層"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"角質層は表皮の最も外側にあり、外からの異物や細菌の侵入を防ぎ、体内の水分が失われるのを防ぐ主なバリアとなっている。","choices":["汗腺は真皮などにある汗を出す器官で、表皮の層ではない。主な働きは体温調節。","角質層が皮膚のバリア機能の中心。","基底層は表皮の最も深い層で、新しい細胞をつくる。","有棘層は基底層の上の層で、バリアの中心ではない。","顆粒層は角質層のすぐ下の層。バリア機能の中心は最外層の角質層。"],"point":"表皮は深い方から「基底層→有棘層→顆粒層→角質層」。基底層でできた細胞が上へ移り、角質層になってはがれ落ちる。高齢者は角質層の水分が減って乾燥しやすく、かゆみ（掻痒）の原因になる。","note":null}},{"id":"38-68","exam":38,"no":68,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ａ<\/b>さん（98歳，女性）は，認知症（dementia）があるが，食事動作は自立していた。最近，配膳されても食事動作が始まらないことが増えてきた。介護福祉職が献立や食材などの説明をしたところ，<b>Ａ<\/b>さんは食べ始めるようになった。<br>次の摂食嚥下の5期のうち，介護福祉職が支援した期として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["先行期","準備期","口腔期","咽頭期","食道期"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"先行期（認知期）は、食べ物を目で見て認識し、何をどのように食べるかを判断する段階。献立や食材を説明して食べ物だと認識できるように支えたのは、先行期への支援。","choices":["食べ物の認識を助ける支援は先行期への支援。","準備期は、口に入れた食べ物をかみ砕き、飲み込みやすい塊（食塊）にする段階。","口腔期は、食塊を舌で口から喉へ送る段階。","咽頭期は、嚥下反射で食塊を喉から食道へ送る段階。","食道期は、食塊を食道から胃へ送る段階。"],"point":"5期は「先行期（認識）→準備期（咀嚼）→口腔期（舌で送る）→咽頭期（嚥下反射）→食道期（胃へ）」。認知症で「食べ始めない」「食べ物と認識できない」場面は先行期の問題と判断する。","note":null}},{"id":"38-69","exam":38,"no":69,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，健康な成人において，横行結腸の次に便が通過する部位として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["盲腸","上行結腸","下行結腸","Ｓ状結腸","直腸"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"大腸は、盲腸→上行結腸→横行結腸→下行結腸→S状結腸→直腸の順に続く。横行結腸の次は下行結腸。","choices":["盲腸は大腸の始まりの部分で、横行結腸より前にある。","上行結腸は横行結腸の手前。","横行結腸の次は下行結腸。","S状結腸は下行結腸の次。","直腸はS状結腸の次で、大腸の最後の部分。"],"point":"大腸の順番は、腹部を時計回りに「上がって（上行）→横切って（横行）→下がって（下行）→S字に曲がって→直腸」とイメージすると覚えやすい。腹部マッサージを「の」の字（時計回り）に行う理由もこの流れ。","note":null}},{"id":"38-70","exam":38,"no":70,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"<b>Ａ<\/b>さん（80歳，男性）は，半年前から急に便秘になり，最近では排便回数が5日に1回程度となった。腹部は膨満していて，便は細く，血液が付着することがあるという。<br>次の記述のうち，<b>Ａ<\/b>さんの便秘に対する対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["水分摂取を促す。","食物繊維の摂取を促す。","散歩などの運動を促す。","腹部のマッサージを行う。","医療機関の受診を促す。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"高齢になってから急に始まった便秘、細い便、便への血液の付着は、大腸がんなど腸の病気による便秘（器質性便秘）を疑う症状。生活上の工夫より先に、医療機関の受診につなげる。","choices":["水分摂取は一般的な便秘対策だが、病気が疑われる場合はまず受診が優先。","腸が狭くなっている場合、食物繊維を増やすと便の通過をさらに妨げるおそれがある。","運動は機能性便秘には有効だが、原因の病気を見逃すおそれがある。","腸の病気が疑われるときの腹部マッサージは控え、まず医師の診断を受ける。","急な発症・細い便・出血は受診のサイン。"],"point":"事例に「急に」「細い便」「血液の付着」「体重減少」があれば、生活習慣の工夫ではなく受診を選ぶ。水分・食物繊維・運動・マッサージは、病気が除外された機能性便秘への対応。","note":null}},{"id":"38-71","exam":38,"no":71,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"次のうち，65歳の人の妥当な睡眠時間として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["約12時間","約10時間","約8時間","約6時間","約4時間"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"夜間に眠れる時間は加齢とともに短くなり、厚生労働省「健康づくりのための睡眠ガイド2023」では、65歳では約6時間とされている。","choices":["約12時間は長すぎる。高齢者は床上時間が8時間以上になると健康リスクが高まると報告されている。","約10時間も65歳の睡眠時間としては長すぎる。","約8時間は15歳前後の目安。","65歳で約6時間。","約4時間は短すぎる。"],"point":"睡眠時間は「15歳前後で約8時間、25歳で約7時間、45歳で約6.5時間、65歳で約6時間」と、成人後20年ごとに約30分ずつ短くなる。高齢者は「長く寝床にいすぎない（床上時間8時間以上を避ける）」こともあわせて覚える。","note":null}},{"id":"38-72","exam":38,"no":72,"subject":"こころとからだのしくみ","group":5,"case":null,"stem":"キューブラー・ロス（Kubler-Ross, E.）が示した終末期にある人の死の受容プロセスのうち「抑うつ」の段階として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["第1段階","第2段階","第3段階","第4段階","第5段階"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"キューブラー・ロスの死の受容プロセスは「否認→怒り→取り引き→抑うつ→受容」の5段階。抑うつは第4段階。","choices":["第1段階は「否認」。死を受け入れられず否定する。","第2段階は「怒り」。なぜ自分がと怒りを周囲に向ける。","第3段階は「取り引き」。神などと取り引きして延命を願う。","第4段階が「抑うつ」。喪失感から気持ちが沈む。","第5段階は「受容」。死を受け入れ、穏やかになる。"],"point":"順番は頭文字の「否→怒→取→抑→受」で覚える。すべての人がこの順番どおりに進むわけではない、という点もあわせて押さえる。","note":null}},{"id":"38-73","exam":38,"no":73,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，ハヴィガースト（Havighurst, R.）の示す中年期の発達課題に該当するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["良心，道徳心，価値尺度を発達させる。","成人としての市民的・社会的責任を達成する。","満足できる住宅を確保する。","男性あるいは女性の社会的役割を身につける。","気心の合う社交集団を見つける。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"ハヴィガーストは中年期の発達課題として「成人としての市民的・社会的責任を達成する」を挙げている。ほかに、一定の経済的な生活水準を築き維持する、10代の子どもの成長を助ける、生理的な変化を受け入れる、老いた親に適応する、などがある。","choices":["良心・道徳心・価値尺度の発達は児童期の課題。","中年期の発達課題。","満足できる住宅（住まい）の確保は老年期の課題。","男性・女性としての社会的役割を身につけるのは青年期の課題。","気心の合う社交集団を見つけるのは早期成人期の課題。"],"point":"ハヴィガーストの問題は「どの時期の課題か」の入れ替えで作られる。キーワードで時期を判断する。「道徳・良心＝児童期」「性役割・自立の準備＝青年期」「配偶者選び・社交集団＝早期成人期」「市民的責任・10代の子・老親＝中年期」「引退・配偶者の死・住まい＝老年期」。","note":null}},{"id":"38-74","exam":38,"no":74,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，自閉症スペクトラム障害（autism spectrum disorder）の特徴として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["文字のつづりがうまく書けず，類似の文字を間違えたりする。","同じ動作や行動を繰り返す。","注意の持続が難しい。","順番を待てずに割り込む。","数の大小の比較が難しい。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"自閉症スペクトラム障害（自閉スペクトラム症）は、対人関係・コミュニケーションの困難と、限られた興味・同じ動作や行動の繰り返し（常同行動・こだわり）を特徴とする。","choices":["文字のつづりがうまく書けないのは、学習障害（限局性学習症）の書字の困難。","同じ動作や行動の繰り返しは自閉症スペクトラム障害の特徴。","注意の持続が難しいのは、注意欠陥多動性障害（ADHD）の不注意。","順番を待てずに割り込むのは、ADHDの衝動性。","数の大小の比較が難しいのは、学習障害の算数の困難。"],"point":"発達障害は3つに分けて覚える。「自閉症スペクトラム障害＝対人・コミュニケーションの困難＋こだわり・繰り返し」「ADHD＝不注意・多動・衝動性」「学習障害＝読む・書く・計算など特定の学習の困難」。","note":null}},{"id":"38-75","exam":38,"no":75,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次のうち，健康な状態と心身の機能が低下して介護等が必要な状態の中間を示す用語として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["エイジング（aging）","サルコペニア（sarcopenia）","ロコモティブシンドローム","ホメオスタシス（homeostasis）","フレイル（frailty）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"フレイルは、加齢により心身の活力が低下し、健康な状態と要介護状態の中間にある状態。適切な支援で健康な状態に戻れる可能性がある。","choices":["エイジングは、加齢・老化そのものを指す言葉。","サルコペニアは、加齢による筋肉量と筋力の低下。フレイルの原因の1つになる。","ロコモティブシンドロームは、骨・関節・筋肉など運動器の障害で、立つ・歩くなどの移動機能が低下した状態。","ホメオスタシスは、体の内部環境を一定に保つしくみ（恒常性）。","健康と要介護の中間がフレイル。"],"point":"「フレイル＝心身全体の虚弱（身体・精神心理・社会的な面を含む）」「サルコペニア＝筋肉」「ロコモ＝運動器・移動機能」と範囲の違いで区別する。フレイルは「戻れる（可逆性がある）」ことも出題のポイント。","note":null}},{"id":"38-76","exam":38,"no":76,"subject":"発達と老化の理解","group":6,"case":null,"stem":"高齢者のセクシュアリティ（sexuality）に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["高齢になると性への関心がなくなる。","男性は，高齢になっても性ホルモンの分泌が維持される。","女性は，高齢になると性交痛を感じやすくなる。","高齢者は生殖機能の喪失と同時にセクシュアリティ（sexuality）を喪失する。","高齢者の性的欲求に，性差はみられない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"女性は閉経後に女性ホルモン（エストロゲン）が減り、膣の粘膜が薄く乾燥しやすくなるため、性交痛を感じやすくなる。","choices":["性への関心は高齢になっても続く。年齢でなくなると決めつけない。","男性ホルモン（テストステロン）は加齢とともに徐々に減少する。","ホルモンの減少による性交痛は女性の高齢期の変化。","セクシュアリティは生殖機能だけでなく、親密さ・ふれあい・自分らしさなどを含む広い概念。生殖機能を失っても続く。","高齢期の性的欲求や性への関心の現れ方には性差がみられる。男性は閉経のような急な変化がなくホルモンが徐々に減るのに対し、女性は閉経でホルモンが急に減るといった違いが、その背景にある。"],"point":"高齢者のセクシュアリティは「生涯続く」「生殖に限らない」が基本。「なくなる」「喪失する」といった断定は誤りと判断する。","note":null}},{"id":"38-77","exam":38,"no":77,"subject":"発達と老化の理解","group":6,"case":null,"stem":"<b>Ａ<\/b>さん（22歳，女性）は，施設で介護福祉職として勤務し，食事や睡眠を工夫しながら，一人暮らしをしている。日々の生活や勤務状況に問題はない。職場に<b>Ａ<\/b>さんと年齢の近い介護福祉職はおらず，休憩時間や休みの日も一人で過ごしている。<b>Ａ<\/b>さんは，「自分の仕事ぶりを上司に認めてほしいという気持ちはない。それよりも，仕事やそれ以外のことを深く話せる同年代の同僚がほしい」と思っている。<br>次のマズロー（Maslow, A.H.）の欲求階層説の各段階のうち，<b>Ａ<\/b>さんの現在の気持ちが当てはまるものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["生理的欲求","所属・愛情欲求","安全欲求","承認欲求","自己実現欲求"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Aさんは生活や勤務に問題がなく、上司に認めてほしい気持ちもないと言っている。そのうえで、深く話せる同年代の仲間がほしいと思っているので、仲間や集団に属したいという所属・愛情欲求に当てはまる。","choices":["食事や睡眠は工夫して満たしており、生理的欲求の問題ではない。","仲間がほしいという気持ちは所属・愛情欲求。","生活や勤務に問題はなく、安全を脅かされている状況ではない。","「上司に認めてほしい気持ちはない」と本人が否定している。","自分の能力を最大限に生かしたいという気持ちは語られていない。"],"point":"マズローは下から「生理的→安全→所属・愛情→承認→自己実現」。事例問題では、満たされている欲求（食事・睡眠・生活の安定）と、本人が否定している欲求を消していくと、残った1つが答えになる。","note":null}},{"id":"38-78","exam":38,"no":78,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次のうち，加齢に伴い階段を上ると息切れしやすくなる現象に関係する恒常性の機能として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["予備力","適応力","免疫力","抵抗力","回復力"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"予備力は、安静時に使っている以上に、必要なときに発揮できる余力のこと。加齢で予備力が低下すると、安静時は問題がなくても、階段を上るなどの負荷がかかったときに息切れしやすくなる。","choices":["負荷時の息切れは予備力の低下による。","適応力は、環境の変化に体を合わせる力。","免疫力は、病原体などから体を守る力。","抵抗力は、病気やストレスに負けない力。息切れとの直接の関係は薄い。","回復力は、病気や疲労から元の状態に戻る力。"],"point":"加齢による恒常性の低下は「予備力・防衛力（免疫力など）・適応力・回復力」の4つで整理する。「ふだんは平気だが、負荷がかかると症状が出る」と書かれていれば予備力の低下と判断する。","note":null}},{"id":"38-79","exam":38,"no":79,"subject":"発達と老化の理解","group":6,"case":null,"stem":"次の記述のうち，高齢者の疾患や症状の特徴として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["典型的な症状を呈する。","生活が活発になる。","痛みに敏感になる。","複数の疾患を持ちやすい。","慢性的な疾患は少ない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"高齢者は、高血圧・糖尿病・骨粗鬆症など、複数の疾患を同時に持ちやすい（多病）。そのため服用する薬も増えやすい。","choices":["高齢者は典型的な症状が出にくい。肺炎でも高熱が出ない、心筋梗塞でも胸痛が少ないことがある。","病気によって活動量が減り、生活が不活発になりやすい。","痛みを感じにくくなることがあり、病気の発見が遅れる原因になる。","複数の疾患を持ちやすい。","慢性的な疾患が多い。"],"point":"高齢者の病気の特徴は「多病」「症状が非典型的」「慢性化しやすい」「薬の副作用が出やすい」「個人差が大きい」。「典型的」「敏感」「少ない」と書かれた選択肢は、この逆を突いたひっかけ。","note":null}},{"id":"38-80","exam":38,"no":80,"subject":"発達と老化の理解","group":6,"case":null,"stem":"<b>Ａ<\/b>さん（82歳，女性）は，介護老人保健施設に入所している。朝，眠そうな様子であったため，介護福祉職がどうしたのかと尋ねると，<b>Ａ<\/b>さんは，「夜，足や背中がかゆくてあまり眠れなかった」と話した。看護師と共に足や背中を観察すると，皮膚が乾燥していて，引っ掻いたような傷があった。そのほかに皮膚の異常はみられなかった。<b>Ａ<\/b>さんは寒さに弱く，今は冬なので常に電気毛布を使用している。昨日は入浴日であった。<br>次のうち，<b>Ａ<\/b>さんに生じている可能性がある疾患として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["角化型疥癬（hyperkeratotic scabies）","帯状疱疹（herpes zoster）","褥瘡","老人性皮膚掻痒症（senile pruritus）","閉塞性動脈硬化症（arteriosclerosis obliterans）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"皮膚の乾燥と引っ掻き傷のほかに異常がなく、電気毛布の使用や入浴後という乾燥しやすい条件がそろっている。皮膚の乾燥による老人性皮膚掻痒症が考えられる。","choices":["角化型疥癬は、ヒゼンダニによる感染症で、厚い垢のような角質（かさぶた状）がみられる。Aさんには乾燥以外の皮膚の異常がない。","帯状疱疹は、体の片側に帯のように赤い発疹や水疱が出て、強い痛みを伴う。","褥瘡は、圧迫を受ける部位の発赤や潰瘍。かゆみと乾燥の説明に合わない。","乾燥・かゆみ・掻き傷・暖房や入浴による乾燥条件がそろっている。","閉塞性動脈硬化症は下肢の血流が悪くなる病気で、冷感や、歩くと足が痛む（間欠性跛行）などがみられる。"],"point":"老人性皮膚掻痒症は「乾燥」「冬」「電気毛布・こたつ」「熱い湯・洗いすぎ」がキーワード。対応は保湿剤、ぬるめの湯、こすりすぎない、爪を短く切る。疥癬は「感染」「強いかゆみ＋皮膚の異常（発疹・角質）」で区別する。","note":null}},{"id":"38-81","exam":38,"no":81,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，認知症（dementia）のある人にみられる妄想の説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["自分でしまい忘れた物が見つからず，誰かが盗んだと思い込むのは，嫉妬妄想である。","孫と会って話をしたにもかかわらず，孫にずっと会わせてもらえていないと主張するのは，カプグラ症候群である。","介護支援専門員（ケアマネジャー）と妻が話しているのを見て，妻の浮気相手だと思い込むのは，幻の同居人である。","家族など身近な人がよく似た偽物と入れ替わっていると主張するのは，被害妄想である。","身体的疾患がないにもかかわらず，自分が病気だと思い込むのは，心気妄想である。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"心気妄想は、体に病気がないのに、自分は重い病気だと強く思い込む妄想。うつ状態の高齢者などにみられる。","choices":["しまい忘れた物を盗まれたと思い込むのは「物盗られ妄想」で、被害妄想の一種。嫉妬妄想ではない。","会ったことを忘れて会わせてもらえないと訴えるのは、記憶障害による訴え。カプグラ症候群は、身近な人が偽物と入れ替わっていると思い込むもの。","妻と話している人を浮気相手と思い込むのは「嫉妬妄想」。幻の同居人は、家に誰かが住みついていると思い込むもの。","身近な人が偽物と入れ替わっていると主張するのは「カプグラ症候群」。","病気がないのに病気だと思い込むのは心気妄想。"],"point":"妄想の名前と内容を入れ替えたひっかけ。「物盗られ＝被害妄想」「浮気＝嫉妬妄想」「偽物と入れ替わり＝カプグラ症候群」「家に知らない人が住んでいる＝幻の同居人」「病気だと思い込む＝心気妄想」の5組で覚える。","note":null}},{"id":"38-82","exam":38,"no":82,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，認知症（dementia）の人への取り組みとその説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["本人ミーティングでは，当事者たちが語り合い社会に発信も行う。","認知症初期集中支援チームは，要介護認定を行う。","若年性認知症支援コーディネーターは，認知症（dementia）の診断を行う。","認知症疾患医療センターは，地域ケア会議を開催する。","認知症カフェは，認知症介護指導者を養成する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"本人ミーティングは、認知症の本人どうしが集まり、体験や希望を語り合う場。その声を地域や行政に発信し、施策づくりに生かすことも目的にしている。","choices":["本人どうしが語り合い、社会に発信する取り組み。","認知症初期集中支援チームは、医療・介護の専門職が自宅を訪問し、初期の支援を集中的に行う。要介護認定は市町村が行う。","若年性認知症支援コーディネーターは、本人や家族の相談に応じ、就労継続や関係機関との調整を行う。診断は医師が行う。","認知症疾患医療センターは、鑑別診断や専門医療相談を行う医療機関。地域ケア会議は市町村や地域包括支援センターが開催する。","認知症カフェは、本人・家族・地域住民・専門職が気軽に集える場。認知症介護指導者の養成は行わない。"],"point":"認知症施策は「誰が・何をするか」の組み合わせで問われる。診断＝医師（認知症疾患医療センターなど）、要介護認定＝市町村、地域ケア会議＝市町村・地域包括支援センター、と役割の持ち主を確認すると誤りが見抜ける。","note":null}},{"id":"38-83","exam":38,"no":83,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，認知症（dementia）の行動・心理症状（ＢＰＳＤ）に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["10分前に施設職員が挨拶しに来たことを，覚えていない。","病院にいるのに，自宅にいると思っている。","通所介護（デイサービス）を利用中に，出口を探して歩き回る。","薬を処方されても，服薬管理ができない。","入浴を促すと，湯につかるだけで出てくる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"行動・心理症状（BPSD）は、中核症状に、本人の不安・環境・体調などが影響して起こる症状。出口を探して歩き回る行動は、BPSDの「歩き回り（徘徊）」に当たる。","choices":["少し前の出来事を覚えていないのは記憶障害で、中核症状。","今いる場所がわからないのは見当識障害で、中核症状。","出口を探して歩き回るのはBPSD。","服薬管理ができないのは、記憶障害や遂行機能障害による中核症状の表れ。","入浴の一連の手順をこなせないのは、遂行機能障害などの中核症状の表れ。"],"point":"中核症状は脳の障害で直接起こる「記憶・見当識・理解判断・遂行機能・失語・失行・失認」。BPSDは「歩き回り・興奮・暴言・妄想・幻覚・抑うつ・不安・帰宅願望」など。「〜できない」は中核症状、「〜する（行動・感情が表に出る）」はBPSDのことが多い。","note":null}},{"id":"38-84","exam":38,"no":84,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，アルツハイマー型認知症（dementia of the Alzheimer’s type）の説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["古い記憶から障害され，徐々に新しい記憶も障害される。","認知機能が変動することが特徴的である。","ＡＤＬ（Activities of Daily Living：日常生活動作）の障害は，重度期以降に認められる。","見当識障害は，中期以降に認められる。","記憶障害は，初期から認められる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"アルツハイマー型認知症は、初期から記憶障害、特に新しいことを覚えられない障害（記銘力障害）が目立つ。","choices":["逆。新しい記憶から障害され、進行すると古い記憶も失われていく。","認知機能が日や時間によって変動するのは、レビー小体型認知症の特徴。","買い物・金銭管理などのIADLは初期から、食事・排泄などのADLは中期ごろから障害される。重度期になって初めて出るものではない。","見当識障害は、時間の見当識から初期に現れる。","記憶障害は初期から認められる。"],"point":"アルツハイマー型は「新しい記憶から失われる」「時間→場所→人の順に見当識が障害される」「ゆるやかに進行する」。変動・幻視はレビー小体型、段階的な悪化・まだら認知症は血管性、人格変化・常同行動は前頭側頭型。","note":null}},{"id":"38-85","exam":38,"no":85,"subject":"認知症の理解","group":7,"case":null,"stem":"次のうち，レビー小体型認知症（dementia with Lewy bodies）の症状として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ノンレム睡眠行動障害による大声","自律神経症状による起立性低血圧（orthostatic hypotension）","聴覚認知機能の障害による幻聴","側頭葉の萎縮による意味性失語","嚥下機能の促進による食欲増加"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"レビー小体型認知症では、自律神経の症状がよくみられる。立ち上がったときに血圧が下がる起立性低血圧は代表的な症状で、転倒の原因になる。","choices":["夢の内容に合わせて大声を出したり体を動かしたりするのは「レム睡眠行動障害」。ノンレム睡眠ではない。","自律神経症状による起立性低血圧はレビー小体型の特徴。","レビー小体型で特徴的なのは、視覚認知の障害によるありありとした「幻視」。","側頭葉の萎縮による意味性失語は、前頭側頭葉変性症の1つ（意味性認知症）の特徴。","進行するとパーキンソン症状などで嚥下機能は低下し、誤嚥しやすくなる。"],"point":"レビー小体型の症状は「幻視」「パーキンソン症状」「認知機能の変動」「レム睡眠行動障害」「自律神経症状（起立性低血圧・便秘など）」の5つで覚える。「ノンレム」「幻聴」など、1語だけ入れ替えたひっかけに注意。","note":null}},{"id":"38-86","exam":38,"no":86,"subject":"認知症の理解","group":7,"case":null,"stem":"次のうち，認知症（dementia）の人の生活をアセスメントするうえで，身体的要因に含まれる項目として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["性格","居住環境","人的環境","ＩＡＤＬ（Instrumental Activities of Daily Living：手段的日常生活動作）","社会とのつながり"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"認知症の人の生活のアセスメントでは、身体的要因として、病気や体調、視力・聴力、ADLやIADLなど、体の状態や生活動作の能力を確認する。IADLはこれに含まれる。","choices":["性格は心理的要因。","居住環境は環境要因（物的環境）。","家族や職員などの人的環境は環境要因。","IADLは身体的要因に含まれる。","社会とのつながりは社会的要因。"],"point":"アセスメントの要因は「身体的（病気・体調・ADL/IADL）」「心理的（性格・感情）」「環境（住まい・人）」「社会的（役割・地域とのつながり）」に分けて整理する。","note":null}},{"id":"38-87","exam":38,"no":87,"subject":"認知症の理解","group":7,"case":null,"stem":"認知症（dementia）の人への環境の配慮に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["視覚的認識を容易にするために，廊下の手すりに色をつけて目立つようにする。","聴覚に影響を与えるために，ピクトグラム（pictogram）を表示する。","音の選択的聴取の力を高めるために，ＢＧＭ（background music）の音量を大きくする。","穏やかに生活するために，居室の光の刺激を強くする。","落ち着く空間をつくるために，居室を細かい模様の壁紙で統一する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"認知症の人は、視覚的な認識が難しくなることがある。手すりに色をつけて背景と区別しやすくすると、場所や物を見つけやすくなる。","choices":["色のコントラストで見分けやすくする工夫。","ピクトグラム（絵文字の案内表示）は視覚に働きかけるもの。聴覚ではない。","BGMの音量を大きくすると、必要な音（話しかけなど）を聞き分けにくくなる。BGMは控えめにする。","強い光の刺激はまぶしさや混乱を招く。まぶしくなく、十分な明るさの照明が望ましい。","細かい模様は、虫やごみなどに見間違える原因になる。落ち着いた無地に近いものがよい。"],"point":"認知症の人への環境づくりは「わかりやすく」「刺激は強すぎず」が基本。コントラストをつける・表示を見やすくするは〇、大きな音・強い光・細かい模様は×と判断する。","note":null}},{"id":"38-88","exam":38,"no":88,"subject":"認知症の理解","group":7,"case":null,"stem":"次の記述のうち，認知症（dementia）の人の遂行機能障害の症状として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ご飯を食べたことを忘れて，ご飯をほしいと言う。","包丁の使い方を忘れて，うまく使うことができない。","食事が配膳されているが，左側のものを残す。","調理の手順を順序だてて行うことができない。","皿の模様をおかずと間違えて，スプーンですくおうとする。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"遂行機能障害は、計画を立て、手順どおりに物事を進めることが難しくなる障害。調理の手順を順序だてて行えないのは典型例。","choices":["食べたこと自体を忘れるのは記憶障害。","道具の使い方がわからなくなるのは失行。","左側にあるものに気づかないのは半側空間無視（脳血管障害などでみられる）。","手順を順序だてて行えないのは遂行機能障害。","皿の模様を食べ物と間違えるのは、見たものを正しく認識できない視覚認知の障害（失認など）。"],"point":"「順序・段取り・計画ができない」と書かれていれば遂行機能障害。「忘れる＝記憶障害」「使い方がわからない＝失行」「見ても何かわからない＝失認」「片側を見落とす＝半側空間無視」と区別する。","note":null}},{"id":"38-89","exam":38,"no":89,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ａ<\/b>さん（75歳，男性）は，認知症（dementia）で，通所介護（デイサービス）を利用している。介護福祉職が，「今日は何月何日でしょうか」と聞くと，<b>Ａ<\/b>さんは，「9月」と答えた。介護福祉職が，「今朝，<b>Ａ<\/b>さんの家の庭にあじさいが咲いていましたね」と言うと，<b>Ｂ<\/b>さんが，「あじさいが咲くのは6月？」と答えた。介護福祉職は，「そうです。今日は6月22日です」と言い，ホワイトボードに日付とあじさいの絵を描いた。介護福祉職が，「6月生まれの方はいますか」と聞くが，返事がない。介護福祉職は，「今日は6月22日ですが，あと3日で<b>Ａ<\/b>さんの誕生日ですね」と伝えた。<br>次のうち，介護福祉職が実施した技法として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["タッチケア（touch care）","アートセラピー（art therapy）","リアリティ・オリエンテーション（reality orientation）","ライフレビュー（life review）","グリーフケア（grief care）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"介護福祉職は、季節の手がかり（あじさい）や日付をホワイトボードに書くなどして、今日の日付を繰り返し伝えている。これは、時間・場所・人などの現実の情報を伝えて見当識を補うリアリティ・オリエンテーション。","choices":["タッチケアは、体に触れることで安心感を与える方法。事例では触れていない。","アートセラピーは、絵を描くなどの創作活動を通じて心の表現を促す方法。絵は日付を伝えるための手がかりとして使っている。","日付を伝えて見当識を補っているので、リアリティ・オリエンテーション。","ライフレビューは、人生を振り返り、意味づけをする回想の方法。","グリーフケアは、死別などの喪失による悲嘆を抱える人への支援。"],"point":"リアリティ・オリエンテーションは「日付・季節・場所・人の名前を伝え、見当識を補う」。会話の中で自然に伝える方法（24時間RO）と、少人数で行う方法（クラスルームRO）がある。昔の話を引き出すのは回想法、と区別する。","note":null}},{"id":"38-90","exam":38,"no":90,"subject":"認知症の理解","group":7,"case":null,"stem":"<b>Ａ<\/b>さん（88歳，女性）は，4年前に，認知症（dementia）と診断された。在宅で長男が介護している。<b>Ａ<\/b>さんは，3か月前から，何度もトイレ以外で排泄しようとする様子がみられた。長男が繰り返しトイレの場所を教えているが，状態は変わらない。長男は<b>Ａ<\/b>さんに対して，「何回，同じことを言ったら，わかるんだ」と大声でどなってしまい，その後で落ち込むようになった。また，長男は，「認知症（dementia）がいつまで続くのか」「自分に何か問題があったのではないか」と言って，自分を強く責めている。<br>次のうち，<b>Ａ<\/b>さんの認知症（dementia）を長男が受け入れる過程と考えた場合，このときの長男の心理的特徴に該当する段階として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["ショック期","否認期","混乱期","解決への努力期","受容期"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"長男は、同じことを繰り返すAさんにどなってしまい、その後落ち込み、自分を強く責めている。怒りや落ち込み、自責の念が入り混じった状態は、受け入れる過程の「混乱期」に当たる。","choices":["ショック期は、診断を受けた直後などで、衝撃を受け、何が起きているか受け止められない時期。診断から4年たっている。","否認期は、認知症であることを認めようとしない時期。長男は認知症の存在自体は認めている。","怒り・落ち込み・自責が入り混じるのは混乱期。","解決への努力期は、現実に向き合い、工夫やサービスの利用など解決に向けて行動し始める時期。","受容期は、認知症をありのままに受け入れ、穏やかに付き合えるようになる時期。"],"point":"家族の心理は「否定・認めない」「怒り・抑うつ・自分を責める」「工夫や相談を始める」「受け入れる」のどの言動が出ているかで段階を判断する。混乱期の家族には、気持ちを受け止め、家族会やサービスの情報を伝えて負担を軽くする支援を考える。","note":null}},{"id":"38-91","exam":38,"no":91,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，障害福祉におけるソーシャルインクルージョン（social inclusion）の考え方の説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害のある人とない人を統合する社会","障害のある人を権利侵害から守る社会","障害のある人の意思決定を支援する社会","障害のある人の最善の利益を考える社会","障害のある人もない人も包摂する社会"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"ソーシャルインクルージョン（社会的包摂）は、障害の有無などにかかわらず、すべての人を社会の一員として包み込み、支え合う社会をめざす考え方。","choices":["障害のある人とない人を「統合する」のはインテグレーションの考え方。分けたものを後から一緒にするという発想で、インクルージョンとは区別される。","権利侵害から守るのは、権利擁護（アドボカシー）の考え方。","意思決定を支援するのは、意思決定支援の考え方。","本人の最善の利益を考えるのは、意思決定支援などで用いられる「最善の利益」の考え方。","障害のある人もない人も包摂する社会がソーシャルインクルージョン。"],"point":"インクルージョン＝「包摂（はじめから包み込む）」、インテグレーション＝「統合（分けたものを一緒にする）」と区別する。ソーシャルエクスクルージョン（社会的排除）の反対語として覚えるとよい。","note":null}},{"id":"38-92","exam":38,"no":92,"subject":"障害の理解","group":8,"case":null,"stem":"知的障害に関する次の記述のうち，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害が発達期にあらわれる。","障害の原因は明らかである。","一般就労は不可能である。","療育手帳の等級は障害支援区分で決める。","運動発達の遅れは伴わない。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"知的障害は、知的機能の障害が発達期（おおむね18歳まで）に現れ、日常生活に支障が生じている状態。","choices":["発達期に現れることが知的障害の要件。","原因は染色体異常、出生前後の脳の障害などさまざまで、原因が特定できない場合も多い。","障害の程度や支援によっては一般就労している人も多い。「不可能」と決めつけない。","療育手帳の障害程度は、児童相談所や知的障害者更生相談所の判定で決める。障害支援区分は障害福祉サービスの必要度を示すもので別の仕組み。","知的障害には運動発達の遅れを伴うことがある。"],"point":"知的障害は「発達期に現れる」がポイント。成人後の病気やけがで知的機能が低下した場合は、認知症や高次脳機能障害として区別する。「不可能」「明らか」など断定した選択肢は誤りを疑う。","note":null}},{"id":"38-93","exam":38,"no":93,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，後遺症によって片麻痺や言語障害を伴うことがある疾患や病態として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["脳血管障害（cerebrovascular disorder）","糖尿病（diabetes mellitus）","脊髄損傷（spinal cord injury）","慢性閉塞性肺疾患（chronic obstructive pulmonary disease）","クローン病（Crohn disease）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"脳梗塞や脳出血などの脳血管障害では、損傷した脳の部位によって、体の片側の麻痺（片麻痺）や、失語症・構音障害などの言語障害が後遺症として残ることがある。","choices":["片麻痺と言語障害は脳血管障害の代表的な後遺症。","糖尿病の合併症は網膜症・腎症・神経障害など。片麻痺や言語障害が直接の後遺症ではない。","脊髄損傷では、損傷部位より下の両側の麻痺（対麻痺・四肢麻痺）が起こる。脳は損傷していないため言語障害は起こらない。","慢性閉塞性肺疾患は呼吸機能の障害で、息切れなどが中心。","クローン病は口から肛門までの消化管に炎症が起こる病気。"],"point":"麻痺の型で原因を区別する。「片麻痺＝脳（脳血管障害など）」「対麻痺・四肢麻痺＝脊髄損傷」。言語障害を伴えば、言語中枢がある脳の障害を考える。","note":null}},{"id":"38-94","exam":38,"no":94,"subject":"障害の理解","group":8,"case":null,"stem":"次の記述のうち，国際障害者年を契機に，日本の障害福祉に起きた変化として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["障害者を弱者として保護する捉え方が広まった。","ノーマライゼーションの理念が徐々に浸透した。","身体障害者福祉法の制定につながった。","障害種別ごとの福祉サービス給付が始まった。","措置制度から自立支援医療制度へ移行した。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"1981年の国際障害者年は「完全参加と平等」をテーマとし、これを契機に、日本でもノーマライゼーションの理念が徐々に広まった。","choices":["国際障害者年は、障害者を保護される弱者ではなく、権利をもつ主体として捉え直す流れを広めた。","ノーマライゼーションの理念が浸透するきっかけになった。","身体障害者福祉法は1949年の制定で、国際障害者年（1981年）より前。","障害種別ごとの福祉サービスは、それ以前から各法律のもとで行われていた。その後の流れは、障害種別を越えた一元化の方向。","措置制度からの移行は、2003年の支援費制度（利用契約制度）への移行。自立支援医療は医療費の公費負担制度で、措置制度に代わるものではない。"],"point":"障害福祉の年表は「1949年 身体障害者福祉法 成立」「1981年 国際障害者年（完全参加と平等）」「2003年 支援費制度 開始」「障害者自立支援法 2005年成立・2006年施行」「障害者総合支援法 2012年成立・2013年施行」の順で押さえる。年代の前後関係で誤りを見抜ける。","note":null}},{"id":"38-95","exam":38,"no":95,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，筋萎縮性側索硬化症（amyotrophic lateral sclerosis：ＡＬＳ）によくみられる症状として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["感覚障害","失禁","嚥下障害","視力障害","便秘"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"ALSは、運動神経が障害されて全身の筋力が低下していく病気。喉や舌の筋肉も弱くなるため、嚥下障害や構音障害がよくみられる。","choices":["感覚神経は保たれるため、感覚障害は起こりにくい。","膀胱や直腸の機能は保たれやすく、失禁は起こりにくい。","嚥下障害はALSによくみられる症状。","眼の機能や眼球運動は比較的保たれ、視力障害は起こりにくい。","活動量の低下などで便秘になることはあるが、病気そのものの特徴的な症状ではない。"],"point":"ALSで「起こりにくい症状」は、感覚障害・膀胱直腸障害・眼球運動障害・褥瘡の4つ（陰性徴候）。眼球運動が保たれるので、進行しても透明文字盤や視線入力でのコミュニケーションが使える。","note":null}},{"id":"38-96","exam":38,"no":96,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ａ<\/b>さん（50歳，男性）は，以前は一人暮らしをしていたが，現在は統合失調症（schizophrenia）のため長期入院をしている。症状が軽快して安定したため，医師から間もなく退院できるという説明があった。<b>Ａ<\/b>さんは以前と同じように独居を希望しているが，一人で住居を探すのに不安がある。<br>次のうち，<b>Ａ<\/b>さんの希望を実現するために利用する公的な支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["地域定着支援","自立生活援助","地域移行支援","生活介護","同行援護"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"地域移行支援は、精神科病院に入院している人や施設に入所している人に、住居の確保、地域生活の準備のための相談や同行などを行い、地域での生活に移行できるよう支援するサービス。","choices":["地域定着支援は、地域で単身生活をしている人に、常時の連絡体制と緊急時の対応を行う。退院後に使うサービス。","自立生活援助は、施設や病院などから一人暮らしに移った人を、定期的な訪問などで支える。これも一人暮らしを始めた後のサービス。","入院中の住居探しや退院の準備を支えるのは地域移行支援。","生活介護は、常に介護が必要な人に、日中に入浴・排泄・食事の介護や創作的活動などを行う。","同行援護は、視覚障害のある人の外出に同行して支援する。"],"point":"退院の「前」は地域移行支援、退院の「後」は地域定着支援（緊急時の対応）と自立生活援助（定期訪問）。事例が「入院中」か「すでに一人暮らし」かで選ぶ。","note":null}},{"id":"38-97","exam":38,"no":97,"subject":"障害の理解","group":8,"case":null,"stem":"<b>Ａ<\/b>さん（45歳，男性）は，1年前，交通事故で頭部外傷を負った。四肢に障害は残らなかったが，高次脳機能障害（higher brain dysfunction）と診断された。<br>次の記述のうち，<b>Ａ<\/b>さんの障害特性を理解した支援として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["記憶障害によって同じことを何度も質問するが，一度だけ質問に答える。","注意障害によって作業のミスが多いため，その度ごとに強く注意する。","遂行機能障害によって指示されないと作業ができないため，自分の判断でやるように促す。","社会的行動障害によってすぐに怒りだすことがあるため，感情が落ち着くように場面や話題を変える。","病識低下によってできないことを認めないため，できないことを指摘する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"社会的行動障害では、感情のコントロールが難しく、急に怒りだすことがある。そのようなときは、場面や話題を変えて気持ちを切り替えやすくすると、落ち着きやすい。","choices":["記憶障害のある人には、繰り返しの質問にもそのつど丁寧に答え、メモなどで記憶を補う。","注意障害によるミスを強く注意すると、自信を失い混乱が増す。作業を区切る、集中しやすい環境を整えるなどの工夫をする。","遂行機能障害のある人は、自分で判断して段取りを組むことが難しい。手順を示したメモや表を用意して支援する。","場面や話題を変えて、感情が落ち着くように支援する。","病識が低い人にできないことを指摘しても、受け入れにくく、関係が悪化しやすい。体験を通して少しずつ気づけるよう支える。"],"point":"高次脳機能障害への支援は「障害を責めず、環境や方法で補う」が基本。記憶障害にはメモ・スケジュール表、注意障害には静かな環境、遂行機能障害には手順書、社会的行動障害には場面転換、と組み合わせで覚える。","note":null}},{"id":"38-98","exam":38,"no":98,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，「障害者総合支援法」に規定する補装具として，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["特殊寝台","電動車椅子","点字器","電気式たん吸引器","ストーマ装具"],"notes":"（注）　「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"電動車椅子は、「障害者総合支援法」で補装具として定められている。補装具は、失われた身体機能を補い、長く使用するものとして種目が決められている。","choices":["特殊寝台は日常生活用具（地域生活支援事業）。","電動車椅子は補装具。","点字器は日常生活用具。","電気式たん吸引器は日常生活用具。","ストーマ装具は日常生活用具（排泄管理支援用具）。"],"point":"補装具の主な種目は「義肢・装具・座位保持装置・視覚障害者安全つえ・義眼・眼鏡・補聴器・車椅子・電動車椅子・歩行器・歩行補助つえ・重度障害者用意思伝達装置」。これ以外の生活用品（特殊寝台・点字器・吸引器・ストーマ装具など）は日常生活用具と判断する。介護保険の福祉用具と区分が異なる点にも注意。","note":null}},{"id":"38-99","exam":38,"no":99,"subject":"障害の理解","group":8,"case":null,"stem":"次の記述のうち，地域における障害者のサポート体制として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護支援専門員は，サービス等利用計画を作成する。","相談支援専門員は，個別支援計画を作成する。","基幹相談支援センターは，障害支援区分を決定する。","地域包括支援センターは，要介護度を決定する。","市町村は，地域生活支援事業を行う。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"地域生活支援事業は、「障害者総合支援法」にもとづき、市町村（一部は都道府県）が地域の実情に合わせて行う事業。相談支援、移動支援、日常生活用具の給付などがある。","choices":["サービス等利用計画を作成するのは相談支援専門員。介護支援専門員は介護保険のケアプランを作成する。","個別支援計画を作成するのは、各事業所のサービス管理責任者など。相談支援専門員はサービス等利用計画を作成する。","障害支援区分を決定するのは市町村。基幹相談支援センターは地域の相談支援の中核機関。","要介護度を決定（認定）するのは市町村。地域包括支援センターは高齢者の総合相談などを行う。","地域生活支援事業は市町村が行う。"],"point":"「サービス等利用計画＝相談支援専門員」「個別支援計画＝サービス管理責任者」「ケアプラン＝介護支援専門員」「区分・要介護度の決定＝市町村」の組み合わせを整理しておく。","note":null}},{"id":"38-100","exam":38,"no":100,"subject":"障害の理解","group":8,"case":null,"stem":"次のうち，障害があるためスプーンがうまく握れない人に自助具を作成する職種として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["看護師","義肢装具士","理学療法士","作業療法士","言語聴覚士"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"作業療法士は、食事・整容などの生活動作の訓練を行い、動作を助ける自助具の選定や作成も担う。スプーンを握りやすくする柄の工夫などがその例。","choices":["看護師は、診療の補助や療養上の世話を行う。自助具の作成は主な役割ではない。","義肢装具士は、医師の指示のもとで義肢や装具を製作・適合する。","理学療法士は、起き上がり・立つ・歩くなどの基本動作の訓練を行う。","生活動作を助ける自助具は作業療法士の領域。","言語聴覚士は、言語・聴覚・嚥下の訓練を行う。"],"point":"リハビリ職は「理学療法士＝基本動作（立つ・歩く）」「作業療法士＝応用動作・生活動作（食事・家事・手作業）と自助具」「言語聴覚士＝話す・聞く・飲み込む」「義肢装具士＝義肢・装具」と役割で区別する。","note":null}},{"id":"38-101","exam":38,"no":101,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，バイタルサインを測定するときの留意点として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["非接触型体温計による測定では，環境温度に注意する。","脈拍の測定では，橈骨動脈に拇指で触れる。","呼吸の測定では，ゆっくりと息をするように伝えてから行う。","血圧測定では，上腕にマンシェットを隙間のないように巻く。","意識レベルは，まず身体を揺さぶって反応をみる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"非接触型体温計は、皮膚の表面温度をもとに体温を推定するため、室温や外気温、直射日光などの環境温度の影響を受けやすい。測定する場所の環境に注意する。","choices":["非接触型体温計は環境温度の影響を受けやすい。","拇指（親指）には測る人自身の脈があり、取り違えるおそれがある。示指・中指・薬指の3本を当てて測る。","呼吸は意識すると回数や深さが変わるため、測ることを伝えずに自然な呼吸を観察する。","マンシェットは、指が1〜2本入る程度の余裕をもたせて巻く。きつすぎても緩すぎても正しく測れない。","意識レベルは、まず呼びかけて反応をみる。いきなり体を揺さぶると、頭や首にけががある場合に悪化させるおそれがある。"],"point":"バイタルサイン測定の基本は「脈拍は3本指」「呼吸は気づかれないように」「マンシェットは指1〜2本の余裕」「意識はまず呼びかけ」。「拇指で」「隙間なく」「揺さぶる」は誤りの定番。","note":null}},{"id":"38-102","exam":38,"no":102,"subject":"医療的ケア","group":9,"case":null,"stem":"気管カニューレの構造等に関する次の記述のうち，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["気管カニューレは，咽頭に挿入されている。","気管カニューレは，交換の必要がない。","カフは，カニューレの上端についている。","カフには，滅菌蒸留水が入れてある。","サイドチューブから，カフの上部の貯留物を吸引することができる。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"カフ上部吸引ライン（サイドチューブ）付きの気管カニューレでは、サイドチューブから、カフの上にたまった分泌物を吸引することができる。","choices":["気管カニューレは、気管切開の穴から気管に挿入されている。咽頭ではない。","気管カニューレは、汚れや感染を防ぐため、医師の指示により定期的に交換する。","カフはカニューレの先端（下端）近くにあり、気管の内側でふくらませて固定し、分泌物が肺に流れ込むのを防ぐ。","カフには空気を入れてふくらませる。","サイドチューブからカフ上部の貯留物を吸引できる。"],"point":"気管カニューレ内部の吸引は、カニューレの長さを超えない範囲で行う（介護福祉士等が行うのはカニューレ内部まで）。カフの位置・中身（空気）・サイドチューブの役割を、図をイメージしながら覚える。","note":null}},{"id":"38-103","exam":38,"no":103,"subject":"医療的ケア","group":9,"case":null,"stem":"<b>Ａ<\/b>さん（85歳，男性）は，慢性閉塞性肺疾患（chronic obstructive pulmonary disease）で，介護老人福祉施設に入所している。ある日，<b>Ａ<\/b>さんから，「痰がからんでいて，咳をしても出せない」という訴えがあった。介護福祉士が呼吸回数を確認すると，1分間に22回で，ゴロゴロという音がしていた。看護職からは，右肺に痰が貯留しやすいという情報提供があった。口腔内吸引をすると，粘性の強い透明な痰が吸引できた。<br>このとき，介護福祉士が喀痰排出を促すために<b>Ａ<\/b>さんに行う対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["居室の湿度を30％に保つ。","水分摂取を控えるように伝える。","左側を下にした体位を勧める。","太い吸引チューブに変える。","ベッド上での安静を勧める。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"看護職から右肺に痰がたまりやすいと情報があるので、右肺を上にする姿勢（左側を下にした側臥位）にすると、重力で痰が気管の方へ移動し、出しやすくなる（体位ドレナージの考え方）。","choices":["湿度30％は乾燥しすぎで、痰が固くなり出しにくくなる。湿度はおおむね40〜60％を目安に保つ。","水分が不足すると痰の粘りが強くなる。医師の制限がなければ、水分摂取を促す。","痰がたまっている右肺を上にするため、左側を下にした体位を勧める。","吸引チューブの太さは、医師・看護職の指示どおりに使う。太くすると粘膜を傷つけるおそれがある。","同じ姿勢で安静にしていると痰がたまりやすい。体位を変えたり、できる範囲で体を動かしたりするほうが排出を助ける。"],"point":"痰を出しやすくする3つの方法は「重力（痰のある側を上にする体位）」「湿度・水分（痰をやわらかくする）」「体を動かす（体位変換）」。「痰のある側を下にする」と取り違えないよう注意する。","note":null}},{"id":"38-104","exam":38,"no":104,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，胃の構造として，<b>正しいもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["幽門から始まり噴門で終わる。","左上方を胃底部といい，食べ物を一時的にためる。","左下方の縁を小弯という。","胃には3つの生理的狭窄部がある。","胃に続く小腸は，空腸という。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"胃の入口（噴門）の左上方の、ふくらんだ部分を胃底部という。胃は全体として、食べ物を一時的にためて消化液と混ぜる働きがある。","choices":["逆。胃は食道とつながる噴門から始まり、十二指腸とつながる幽門で終わる。","左上方が胃底部。","左下方の外側の大きなカーブは大弯。小弯は右上方の内側の小さなカーブ。","3つの生理的狭窄部があるのは食道。","胃に続く小腸は十二指腸。十二指腸の次が空腸、その次が回腸。"],"point":"経管栄養に関わる消化器の構造は「食道（3か所の狭窄）→噴門→胃底部・胃体部→幽門→十二指腸→空腸→回腸」の順で押さえる。入口・出口や大弯・小弯の入れ替えがひっかけの型。","note":null}},{"id":"38-105","exam":38,"no":105,"subject":"医療的ケア","group":9,"case":null,"stem":"次の記述のうち，ボタン型胃ろうチューブを挿入している利用者に対して，介護福祉士が行うケアとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["胃ろう周囲の皮膚に発赤がある場合は，軟膏を塗布する。","1日に2，3回，胃ろうチューブを回転させて，癒着を防ぐ。","胃ろうチューブの抜去予防のため，歩行は避けるように勧める。","胃ろう周囲の皮膚は石けんとぬるま湯で洗浄して，清潔を保つ。","栄養剤を注入する前には，胃ろう部を消毒する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"胃ろう周囲の皮膚は、石けんを泡立ててぬるま湯で洗い、よくすすいで清潔と乾燥を保つ。これは日常のケアとして介護福祉士が行える。","choices":["発赤などの皮膚の異常は看護職に報告し、指示を受ける。異常を自分で判断して軟膏を塗らない。","チューブの回転などの胃ろう部の管理は、医療職が判断・確認する事項。回転させるかどうかや「1日に何回」といった頻度を、介護福祉士が独自に決めて行ってはならない。","胃ろうがあっても歩行は制限しない。チューブを衣服に引っかけないなど抜去に注意しながら、活動を続けてよい。","石けんとぬるま湯での洗浄で清潔を保つ。","胃ろう部が落ち着いていれば、注入前の消毒は通常不要。洗浄と乾燥で清潔を保つ。"],"point":"経管栄養で介護福祉士が行うのは「日常の清潔ケア・観察・注入の実施」。皮膚の異常、チューブの抜けや位置の変化に気づいたら、自分で処置せず、すぐに看護職へ報告する、と判断する。","note":null}},{"id":"38-106","exam":38,"no":106,"subject":"介護過程","group":10,"case":null,"stem":"次のうち，介護過程における生活課題への対応として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護福祉職が望む支援を実現すること","利用者が望む暮らしを実現すること","他職種が望む連携を実現すること","家族が望む経済状況を実現すること","施設が望む運営を実現すること"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"介護過程の目的は、利用者の生活課題を解決し、利用者が望む暮らし（自分らしい生活）を実現することにある。支援の主体と目標の中心は、常に利用者本人である。","choices":["介護福祉職の望みを実現することが目的ではない。支援者の都合や価値観を優先すると、利用者主体から外れる。","利用者が望む暮らしの実現が、生活課題への対応の目的。","多職種連携は利用者の目標を達成するための手段であり、それ自体が目的ではない。","家族の意向は情報として大切だが、家族の経済状況の実現が介護過程の目的ではない。","施設の運営上の都合を実現するものではない。"],"point":"介護過程の問題で「誰が望む〜」と問われたら、答えは「利用者」。介護福祉職・家族・他職種・施設を主語にした選択肢は、利用者主体から外れたひっかけと判断する。","note":null}},{"id":"38-107","exam":38,"no":107,"subject":"介護過程","group":10,"case":null,"stem":"次の記述のうち，短期目標に関する説明として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護福祉職の介護目標を設定する。","利用者の1年後の状態を記載する。","利用者の家族を主体にして表現する。","アセスメントに基づく利用者の具体的な生活課題から検討する。","目標達成時の介護福祉職の満足度を記載する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"短期目標は、アセスメントで明らかになった具体的な生活課題をもとに、長期目標を達成するための段階的な目標として設定する。利用者を主語に、達成できたかどうかを評価できる具体的な表現で書く。","choices":["目標は利用者の目標であり、介護福祉職の目標（「〜させる」）として書かない。","短期目標は長期目標よりも短い期間で達成をめざす目標。1年後といった長い期間の状態を書くものではない。","主体は利用者本人。家族を主語にして表現しない。","アセスメントで把握した具体的な生活課題から検討する。","目標は利用者の生活の変化で評価する。介護福祉職の満足度は評価の基準にならない。"],"point":"目標の書き方は「利用者が主語」「具体的で評価できる」「期間を区切る」の3点。「介護福祉職の」「家族を主体に」「満足度」が出てきたら誤りを疑う。短期目標は長期目標を達成するための段階的な目標、とセットで覚える。","note":null}},{"id":"38-108","exam":38,"no":108,"subject":"介護過程","group":10,"case":null,"stem":"次の記述のうち，介護計画の実施に関するものとして，<b>適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["利用者の実践状況は評価日にまとめて記録する。","介護福祉職が結果に満足できるまで実践を続ける。","介護福祉職の実践経験を積むことを目的にする。","他職種が立案した介護計画をチームで実践する。","利用者に支援内容を説明して同意を得る。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"介護計画を実施するときは、利用者に支援の内容や方法を説明し、同意を得てから行う。利用者の自己決定を尊重し、納得したうえで支援を受けてもらうためである。","choices":["実践状況や利用者の反応は、実施のたびにその都度記録する。評価日にまとめると、記憶があいまいになり正確な評価ができない。","実施期間は計画で定めた評価日までであり、介護福祉職の満足が基準ではない。評価は利用者の目標の達成度で行う。","実施の目的は利用者の生活課題の解決。介護福祉職の経験を積むことが目的ではない。","介護計画は介護福祉職が中心となって立案し、チームで共有して実践する。他職種が立案したものを実践するわけではない。","説明と同意を得てから実践する。"],"point":"実施の段階で押さえるのは「説明と同意」「計画どおりに統一して行う」「利用者の反応をその都度記録する」の3つ。主語や基準が介護福祉職になっている選択肢（満足できるまで・経験を積む）は誤りと判断する。","note":null}},{"id":"38-109","exam":38,"no":109,"subject":"介護過程","group":10,"case":null,"stem":"次のうち，サービス担当者会議にサービス管理責任者が出席する目的として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["個別支援計画の取り組みの報告","障害支援区分の判定","支給が必要かどうかの決定","サービス等利用計画の説明","相談支援専門員への個別支援計画作成の指示"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"障害福祉サービスでは、相談支援専門員が「サービス等利用計画」を作成し、サービス担当者会議を開く。各事業所のサービス管理責任者は「個別支援計画」を作成する立場で、会議では個別支援計画の取り組み状況を報告し、全体の計画との整合を図る。","choices":["サービス管理責任者は、事業所での個別支援計画の取り組みを報告する。","障害支援区分は、市町村が認定調査と医師意見書をもとに、市町村審査会の審査判定を経て認定する。","支給の要否を決める（支給決定）のは市町村。","サービス等利用計画を作成・説明するのは相談支援専門員。","個別支援計画はサービス管理責任者が自ら作成する。相談支援専門員に作成を指示する関係ではない。"],"point":"「相談支援専門員＝サービス等利用計画（全体の計画）」「サービス管理責任者＝個別支援計画（事業所ごとの計画）」「市町村＝障害支援区分の認定・支給決定」の3者の役割をセットで覚える。役割の入れ替えがひっかけの型。","note":null}},{"id":"38-110","exam":38,"no":110,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題110<\/b>，<b>問題111<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（78歳，女性，要介護1）は，軽度の認知症（dementia）があり，通所介護（デイサービス）を利用しながら一人暮らしをしている。一人娘が近くに住んでいる。最近，近所の人から娘に，「決められた日以外にごみを出しているので，そっと片付けているの」と連絡があった。<br>翌日，娘が<b>Ａ<\/b>さんの自宅に行くと，部屋の中に弁当の空の容器がそのまま残されていた。心配した娘が同居を勧めたが，<b>Ａ<\/b>さんは，「これからもこの家からデイサービスに通いたい」と強い口調で言った。話し合いの結果，娘が夕方に様子を見に行くことになった。<br><b>Ａ<\/b>さんは，通所介護（デイサービス）を休むことなく利用していたが，ある日の迎えのとき，担当の介護福祉職に，「今日は行きたくない」と言って利用を拒否した。娘が理由を聞くと，「クイズの時間になると利用者の<b>Ｂ<\/b>さんに，あなたの答えはいつも間違えていると何度も注意される。情けない・・・」と話した。娘は<b>Ａ<\/b>さんの様子を介護福祉職に伝えた。","stem":"次のうち，<b>Ａ<\/b>さんのニーズとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["娘の家で同居すること","自宅での生活を続けること","通所介護（デイサービス）を休めること","弁当のメニューを変更すること","ごみ出しを近所の人に任せること"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"Aさんは同居を勧められても「これからもこの家からデイサービスに通いたい」と強く言っている。本人の意思を尊重すると、ニーズは「自宅での生活を続けること」である。ごみ出しや片付けの問題は、その実現のための課題として扱う。","choices":["同居は娘の提案であり、Aさん本人は望んでいない。","本人がはっきり示している望みで、生活全体の方向性になる。","「行きたくない」はBさんとの関係で一時的に生じた気持ち。Aさんはデイサービスに通い続けることを望んでいる。","弁当の容器が残っていたことは片付けの課題であり、メニューの問題は事例から読み取れない。","近所の人に任せることはAさんの望みではなく、近所の人の負担にもなる。"],"point":"ニーズを問う事例問題は、本人の発言（特に強い口調の言葉や繰り返し語る言葉）を探す。家族の提案や一時的な感情を、そのまま本人のニーズと取り違えないようにする。","note":null}},{"id":"38-111","exam":38,"no":111,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題110<\/b>，<b>問題111<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（78歳，女性，要介護1）は，軽度の認知症（dementia）があり，通所介護（デイサービス）を利用しながら一人暮らしをしている。一人娘が近くに住んでいる。最近，近所の人から娘に，「決められた日以外にごみを出しているので，そっと片付けているの」と連絡があった。<br>翌日，娘が<b>Ａ<\/b>さんの自宅に行くと，部屋の中に弁当の空の容器がそのまま残されていた。心配した娘が同居を勧めたが，<b>Ａ<\/b>さんは，「これからもこの家からデイサービスに通いたい」と強い口調で言った。話し合いの結果，娘が夕方に様子を見に行くことになった。<br><b>Ａ<\/b>さんは，通所介護（デイサービス）を休むことなく利用していたが，ある日の迎えのとき，担当の介護福祉職に，「今日は行きたくない」と言って利用を拒否した。娘が理由を聞くと，「クイズの時間になると利用者の<b>Ｂ<\/b>さんに，あなたの答えはいつも間違えていると何度も注意される。情けない・・・」と話した。娘は<b>Ａ<\/b>さんの様子を介護福祉職に伝えた。","stem":"<b>Ａ<\/b>さんの娘から連絡を受けた通所介護（デイサービス）では，介護過程の再アセスメントをすることになった。<br>次のうち，<b>Ａ<\/b>さんの再アセスメントで重視すべき情報として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["通所介護（デイサービス）を利用しない日の過ごし方","通所介護（デイサービス）での様子","通所介護（デイサービス）の利用継続に関する娘の意見","通所介護（デイサービス）の迎えを担当した介護福祉職の印象","通所介護（デイサービス）以外のサービスを利用することへの意向"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"新たに起きた問題は、デイサービスのクイズの時間にBさんから何度も注意され、Aさんが「情けない」と感じて利用を拒否したこと。再アセスメントでは、この問題が生じている場であるデイサービスでのAさんの様子（活動への参加の仕方、他の利用者との関係など）を重視して情報を集める。","choices":["利用しない日の過ごし方も情報の一つだが、今回の利用拒否の原因に直接関わる情報ではない。","問題が生じている場での様子が、再アセスメントの中心になる。","娘の意見は参考になるが、本人の状況を把握することが先。","迎えを担当した介護福祉職の主観的な印象では、原因の分析にならない。","Aさんはデイサービスに通い続けたいと考えており、他のサービスへの移行を前提にした情報は優先度が低い。"],"point":"再アセスメントは「何が新たに起きたか」「それはどこで起きたか」を事例から特定し、その場面の本人の様子を集める。印象や他者の意見より、本人の客観的な様子を優先する。","note":null}},{"id":"38-112","exam":38,"no":112,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題112<\/b>，<b>問題113<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（50歳，男性，障害支援区分3）は，中度の知的障害がある。身体機能に問題はないが，遂行機能に障害がある。短い言葉での意思表示はできる。両親は亡くなっている。姉が近くに住んでいるが，同居は難しく，共同生活援助（グループホーム）へ入居した。入居時に短期目標を「生活のリズムを整える」と設定し，順調に進んでいた。日中は就労継続支援Ｂ型事業所に通っている。<br>共同生活援助（グループホーム）の生活に慣れてきた頃，<b>Ａ<\/b>さんは日中活動を休むようになった。心配した生活支援員が居室を訪ねると，<b>Ａ<\/b>さんが，「昨日も，遊びに来た隣室の友人が，散らかっている部屋を見て笑った。前はきれいにできていたのに」と自信をなくしている様子であった。<br>生活支援員が<b>Ａ<\/b>さんの居室を確認すると，趣味で集めているアニメグッズや衣服が増えていて，きれいにしていた自室内に散乱していた。","stem":"次のうち，日中活動を休むようになった<b>Ａ<\/b>さんの状態を理解するために必要な情報として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["<b>Ａ<\/b>さんの姉の家族構成","隣室の友人が<b>Ａ<\/b>さんの部屋に行った時間","<b>Ａ<\/b>さんが自信をなくした理由","生活支援員が<b>Ａ<\/b>さんの部屋を訪ねた心情","<b>Ａ<\/b>さんが隣室の友人と遊ぶことになった理由"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"Aさんは「前はきれいにできていたのに」と自信をなくしている。日中活動を休むようになった背景を理解するには、自信をなくした理由（片付けられなくなった原因や、友人に笑われたことの受け止め方）を知ることが必要。","choices":["姉の家族構成は、今回の状態の変化と直接関係しない。","友人が訪れた時間は、Aさんの気持ちや行動の変化の理由を説明しない。","自信をなくした理由が、日中活動を休むようになった状態を理解する鍵になる。","生活支援員の心情は支援者側の情報であり、Aさんの状態の理解にはつながらない。","友人と遊ぶことになった経緯は、問題の中心ではない。"],"point":"事例中の本人の言葉（「前はきれいにできていたのに」）が、情報収集の焦点を示している。支援者側の心情や、周辺の細かな事実を問う選択肢は外す。","note":null}},{"id":"38-113","exam":38,"no":113,"subject":"介護過程","group":10,"case":"次の事例を読んで，<b>問題112<\/b>，<b>問題113<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（50歳，男性，障害支援区分3）は，中度の知的障害がある。身体機能に問題はないが，遂行機能に障害がある。短い言葉での意思表示はできる。両親は亡くなっている。姉が近くに住んでいるが，同居は難しく，共同生活援助（グループホーム）へ入居した。入居時に短期目標を「生活のリズムを整える」と設定し，順調に進んでいた。日中は就労継続支援Ｂ型事業所に通っている。<br>共同生活援助（グループホーム）の生活に慣れてきた頃，<b>Ａ<\/b>さんは日中活動を休むようになった。心配した生活支援員が居室を訪ねると，<b>Ａ<\/b>さんが，「昨日も，遊びに来た隣室の友人が，散らかっている部屋を見て笑った。前はきれいにできていたのに」と自信をなくしている様子であった。<br>生活支援員が<b>Ａ<\/b>さんの居室を確認すると，趣味で集めているアニメグッズや衣服が増えていて，きれいにしていた自室内に散乱していた。","stem":"後日，カンファレンスが開かれ，短期目標についての見直しが検討された。次の記述のうち，見直された短期目標として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["趣味を変更する。","現在の自室の状態を維持する。","衣服を部屋の隅に寄せる。","日中活動の事業所を変更する。","自室を整理整頓する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Aさんは「前はきれいにできていたのに」と、整った部屋を取り戻したい気持ちをもっている。物が増えて散乱したことで自信を失っているので、短期目標を「自室を整理整頓する」と見直すことが、自信の回復と日中活動への復帰につながる。遂行機能障害があるため、収納場所を決めるなど手順を具体的にした支援をあわせて行う。","choices":["趣味のアニメグッズ集めはAさんの楽しみ。趣味の変更を求めるのは本人の生活を否定することになる。","散らかった状態の維持では、自信をなくした原因が解決しない。","衣服を隅に寄せるだけでは整理整頓にならず、Aさんの「きれいにしたい」という思いにも応えていない。","日中活動を休むようになった原因は部屋の状態と自信の低下であり、事業所の問題ではない。","本人の思いに沿い、原因に直接働きかける目標。"],"point":"目標の見直しは「本人の思い」と「問題の原因」に合っているかで選ぶ。趣味や事業所を変えるなど、本人の生活や選択を変えさせる選択肢は外す。","note":null}},{"id":"38-114","exam":38,"no":114,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（66歳，女性）は，一人息子と二人で暮らしている。会社の趣味サークルや地域活動に熱心に参加してきた。半年前に，長年勤めた仕事を定年退職して，継続雇用で週2日の勤務になった。その頃から不眠を訴え，疲れやすく気持ちが落ち込む日が増えてきた。しばらくすると，睡眠中に大声をあげたり，息子の部屋までふらふらと歩いてきたり，自室のカーテンの花柄が動いて怖いと話したりするようになった。近隣の大学病院を受診した結果，手足の震え，小刻みな歩行，顔のこわばりなどがみられ，レビー小体型認知症（dementia with Lewy bodies）の診断を受けた。<br><b>Ａ<\/b>さんは，趣味活動や自宅で息子と過ごすことを優先し，これからの生活を楽しみたいと考えて，仕事を辞めた。そして，安全に歩く力を維持するために介護サービスを活用しようと考えた。<b>Ａ<\/b>さんは要支援2の認定を受けて，介護予防通所リハビリテーションの利用を始めた。","stem":"<b>Ａ<\/b>さんの手足の震えは，ある体内物質の影響によって生じている。<br>次のうち，その体内物質に該当するものとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["メラトニン（melatonin）","ドーパミン（dopamine）","アドレナリン（adrenaline）","コルチゾール（cortisol）","グルカゴン（glucagon）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"レビー小体型認知症では、脳内の神経伝達物質であるドーパミンが不足し、手足の震え（振戦）・小刻み歩行・筋固縮（顔のこわばり）などのパーキンソン症状が現れる。","choices":["メラトニンは睡眠と覚醒のリズムに関わるホルモン。","ドーパミンの不足でパーキンソン症状が生じる。","アドレナリンは副腎髄質から分泌され、心拍数や血圧を上げるなど興奮・緊張時に働く。","コルチゾールは副腎皮質から分泌されるストレスホルモンで、血糖を上げるなどの働きがある。","グルカゴンは膵臓から分泌され、血糖値を上げるホルモン。"],"point":"レビー小体型認知症の特徴は「幻視」「パーキンソン症状（ドーパミン不足）」「認知機能の変動」「レム睡眠行動障害（睡眠中の大声など）」の4つ。事例の「カーテンの花柄が動いて怖い」は幻視、「睡眠中に大声」はレム睡眠行動障害にあたる。","note":null}},{"id":"38-115","exam":38,"no":115,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（66歳，女性）は，一人息子と二人で暮らしている。会社の趣味サークルや地域活動に熱心に参加してきた。半年前に，長年勤めた仕事を定年退職して，継続雇用で週2日の勤務になった。その頃から不眠を訴え，疲れやすく気持ちが落ち込む日が増えてきた。しばらくすると，睡眠中に大声をあげたり，息子の部屋までふらふらと歩いてきたり，自室のカーテンの花柄が動いて怖いと話したりするようになった。近隣の大学病院を受診した結果，手足の震え，小刻みな歩行，顔のこわばりなどがみられ，レビー小体型認知症（dementia with Lewy bodies）の診断を受けた。<br><b>Ａ<\/b>さんは，趣味活動や自宅で息子と過ごすことを優先し，これからの生活を楽しみたいと考えて，仕事を辞めた。そして，安全に歩く力を維持するために介護サービスを活用しようと考えた。<b>Ａ<\/b>さんは要支援2の認定を受けて，介護予防通所リハビリテーションの利用を始めた。","stem":"ある日，送迎のときに，介護予防通所リハビリテーション事業所の<b>Ｂ<\/b>介護福祉職は，息子から，日々の症状に変動がある母を自宅で介護をするときにどのようなことに注意すべきか，と聞かれた。<b>Ｂ<\/b>介護福祉職は事業所で多職種ミーティングを行ってから返答することにした。<br>次の記述のうち，<b>Ｂ<\/b>介護福祉職の息子への助言として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["視覚的環境からの影響を防ぐために，自室のカーテンを無地のものに変更する。","下肢筋力を維持するために，毎日決まった時間に同じ運動をする。","転倒を防止するために，<b>Ａ<\/b>さんの外出の機会を減らす。","夜間は部屋をできるだけ明るく照らすために，直接照明を用いる。","着脱をしやすくするために，ボタン止めの衣服を使用する。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"Aさんには「カーテンの花柄が動いて怖い」という幻視がある。模様は幻視や錯視のきっかけになりやすいため、無地のカーテンに替えて視覚的な刺激を減らすことが適切な助言になる。","choices":["模様をなくすことで幻視のきっかけを減らせる。","認知機能やパーキンソン症状は日によって変動する。毎日決まった時間に同じ運動をするのではなく、その日の体調に合わせて内容を調整する。","外出を減らすと活動量が落ち、歩く力の低下や閉じこもりにつながる。Aさんの「歩く力を維持したい」という希望にも反する。","直接照明は強い影を作り、影が人や物に見える錯視・幻視の原因になりやすい。夜間は影のできにくい間接照明などで適度な明るさを保つ。","手の震えがあるとボタン止めは難しい。面ファスナーや大きめのボタンなど、着脱しやすい工夫をする。"],"point":"レビー小体型認知症の環境づくりは「模様・影・暗がりを減らす（幻視・錯視対策）」「症状の変動に合わせる」「パーキンソン症状に配慮した転倒予防と着衣の工夫」で考える。","note":null}},{"id":"38-116","exam":38,"no":116,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題114から問題116まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（66歳，女性）は，一人息子と二人で暮らしている。会社の趣味サークルや地域活動に熱心に参加してきた。半年前に，長年勤めた仕事を定年退職して，継続雇用で週2日の勤務になった。その頃から不眠を訴え，疲れやすく気持ちが落ち込む日が増えてきた。しばらくすると，睡眠中に大声をあげたり，息子の部屋までふらふらと歩いてきたり，自室のカーテンの花柄が動いて怖いと話したりするようになった。近隣の大学病院を受診した結果，手足の震え，小刻みな歩行，顔のこわばりなどがみられ，レビー小体型認知症（dementia with Lewy bodies）の診断を受けた。<br><b>Ａ<\/b>さんは，趣味活動や自宅で息子と過ごすことを優先し，これからの生活を楽しみたいと考えて，仕事を辞めた。そして，安全に歩く力を維持するために介護サービスを活用しようと考えた。<b>Ａ<\/b>さんは要支援2の認定を受けて，介護予防通所リハビリテーションの利用を始めた。","stem":"サービス利用開始から2か月後，担当介護支援専門員（介護福祉士）はモニタリングを行うために，<b>Ａ<\/b>さんの自宅を訪れた。<b>Ａ<\/b>さんは，「もっとほかの人と交流したいが，自宅で生活しながら利用できると安心だ。とにかく息子に心配をかけずに一緒に暮らしていきたい」と語った。<br>息子は，「最近仕事が忙しくなり，今後泊まりの出張もあるので，リハビリ以外のサービスもうまく使ってほしい」と語った。<br>次のうち，<b>Ａ<\/b>さんに利用を勧めるサービスとして，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["介護予防認知症対応型共同生活介護（認知症高齢者グループホーム）","日常生活自立支援事業","訪問介護（ホームヘルプサービス）","介護予防小規模多機能型居宅介護","介護予防・生活支援サービス事業の通所型サービス"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[4],"exp":{"basis":"Aさんは「ほかの人と交流したい」「自宅で生活しながら利用したい」と望み、息子は泊まりの出張に備えたいと考えている。介護予防小規模多機能型居宅介護は「通い」を中心に「訪問」「泊まり」を組み合わせて利用でき、両者の希望をまとめて満たせる。","choices":["グループホームは住まいを移して共同生活をするサービス。自宅で暮らし続けたいというAさんの希望に合わない。","日常生活自立支援事業は、判断能力が不十分な人の福祉サービスの利用援助や日常的な金銭管理を支援する事業。交流や泊まりのニーズには応えない。","訪問介護では交流の機会や、息子の出張時の泊まりに対応できない。また、要支援者の訪問型サービスは現在、介護予防・日常生活支援総合事業で行われている。","通い・訪問・泊まりを一体的に利用でき、自宅での生活を続けられる。","通所型サービスで交流はできるが、泊まりには対応できない。"],"point":"複数の希望（交流・在宅継続・泊まり）が並ぶ事例は、すべてを満たすサービスを選ぶ。「通い・訪問・泊まり」の3つを一つの事業所で組み合わせられるのが小規模多機能型居宅介護、と覚える。","note":null}},{"id":"38-117","exam":38,"no":117,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（85歳，女性，要介護1）は，Ｂ住居型有料老人ホームで暮らしている。子どもはなく，親族もいない。<b>Ａ<\/b>さんは現在，外部の事業所から訪問介護サービスを週2回利用している。<b>Ａ<\/b>さんは駐車場を経営していて，毎月その収入がある。<br>最近，<b>Ｃ<\/b>訪問介護員（ホームヘルパー）は，<b>Ａ<\/b>さんの居室内の冷蔵庫の中に同じ食材がたくさん入っていることが多く，気になっていた。ある日，<b>Ｃ<\/b>訪問介護員（ホームヘルパー）が<b>Ａ<\/b>さんに尋ねると，「近所のスーパーに買い物に行くのが楽しみだが，冷蔵庫の中に何があるのか忘れてしまい，同じものばかり買ってしまう」と答えた。また，「今は，毎月振り込まれる駐車場収入の管理ができているが，今後管理できなくなることが不安だ」と話した。その後，<b>Ａ<\/b>さんは，初期のアルツハイマー型認知症（dementia of the Alzheimer’s type）の診断を受けた。","stem":"次のうち，<b>Ａ<\/b>さんが不安に思っている駐車場収入の管理について，訪問介護事業所のサービス提供責任者が<b>Ａ<\/b>さんに提案する制度として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["成年後見制度","生活保護制度","老齢年金制度","継続雇用制度","後期高齢者医療制度"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"Aさんは初期のアルツハイマー型認知症と診断され、「今後、駐車場収入を管理できなくなることが不安」と話している。親族もいないため、財産管理を法的に支える成年後見制度を提案するのが適切。判断能力があるうちに自分で後見人と支援内容を決めておける任意後見制度も利用できる。","choices":["判断能力が不十分になった人の財産管理や契約を支える制度。","生活保護は生活に困窮する人の最低限度の生活を保障する制度。Aさんには駐車場収入があり、財産管理の不安とは別の問題。","老齢年金は老後の所得保障で、財産の管理を支える制度ではない。","継続雇用制度は、定年後も希望者を引き続き雇用する制度。","後期高齢者医療制度は75歳以上の人の医療保険制度。"],"point":"「財産管理の不安」と「認知症」がそろったら成年後見制度を考える。判断能力があるうちに備えるのは任意後見、すでに不十分になってから家庭裁判所に申し立てるのは法定後見（後見・保佐・補助）と区別する。日常的な金銭管理の支援なら日常生活自立支援事業も候補になる。","note":null}},{"id":"38-118","exam":38,"no":118,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（85歳，女性，要介護1）は，Ｂ住居型有料老人ホームで暮らしている。子どもはなく，親族もいない。<b>Ａ<\/b>さんは現在，外部の事業所から訪問介護サービスを週2回利用している。<b>Ａ<\/b>さんは駐車場を経営していて，毎月その収入がある。<br>最近，<b>Ｃ<\/b>訪問介護員（ホームヘルパー）は，<b>Ａ<\/b>さんの居室内の冷蔵庫の中に同じ食材がたくさん入っていることが多く，気になっていた。ある日，<b>Ｃ<\/b>訪問介護員（ホームヘルパー）が<b>Ａ<\/b>さんに尋ねると，「近所のスーパーに買い物に行くのが楽しみだが，冷蔵庫の中に何があるのか忘れてしまい，同じものばかり買ってしまう」と答えた。また，「今は，毎月振り込まれる駐車場収入の管理ができているが，今後管理できなくなることが不安だ」と話した。その後，<b>Ａ<\/b>さんは，初期のアルツハイマー型認知症（dementia of the Alzheimer’s type）の診断を受けた。","stem":"その後，<b>Ａ<\/b>さんは認知症（dementia）が進行することを心配し，介護支援専門員（ケアマネジャー）に相談して，同じ市内のＤ介護付き有料老人ホームに転居することになった。<br>転居してから2年後，<b>Ａ<\/b>さんの認知症（dementia）の症状は進行してきた。<b>Ａ<\/b>さんの担当となった<b>Ｅ<\/b>介護福祉職はサービス担当者会議で，「現在，<b>Ａ<\/b>さんの，認知症高齢者の日常生活自立度判定基準は，ランクⅢａと考えられる。そこで，このランクに合った介護計画を立案したい」と提案し，他職種の承諾を得た。<br>次のうち，<b>Ａ<\/b>さんの介護計画立案時に<b>Ｅ<\/b>介護福祉職が意識する，認知症高齢者の日常生活自立度判定基準Ⅲａに該当する状態として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["日常生活が自立している状態","見守りがあれば自立できる状態","日中を中心に意思疎通の困難さがみられ，介護を必要とする状態","意思疎通の困難さが頻繁にみられ，常に介護を必要とする状態","専門医療の導入が必要な状態"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"認知症高齢者の日常生活自立度判定基準のランクⅢは「日常生活に支障を来たすような症状・行動や意思疎通の困難さが見られ、介護を必要とする」状態で、ランクⅣ（頻繁に見られる）に比べると、ときどき見られる程度である。そのうちⅢaは、それが日中を中心にみられる状態をいう。","choices":["何らかの認知症はあるが日常生活がほぼ自立しているのはランクⅠ。","誰かが注意していれば（見守りがあれば）自立できるのはランクⅡ。","日中を中心に症状や意思疎通の困難さがみられ、介護を要するのがⅢa。","症状や意思疎通の困難さが頻繁にみられ、常に介護を必要とするのはランクⅣ。","著しい精神症状や重篤な身体疾患がみられ、専門医療を必要とするのはランクM。"],"point":"自立度判定基準は「Ⅰ ほぼ自立」「Ⅱ 見守りで自立」「Ⅲ ときどき・介護が必要（a 日中中心／b 夜間中心）」「Ⅳ 頻繁・常に介護」「M 専門医療」の順に覚える。ⅢaとⅢbは「日中」と「夜間」の違い。","note":null}},{"id":"38-119","exam":38,"no":119,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題117から問題119まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（85歳，女性，要介護1）は，Ｂ住居型有料老人ホームで暮らしている。子どもはなく，親族もいない。<b>Ａ<\/b>さんは現在，外部の事業所から訪問介護サービスを週2回利用している。<b>Ａ<\/b>さんは駐車場を経営していて，毎月その収入がある。<br>最近，<b>Ｃ<\/b>訪問介護員（ホームヘルパー）は，<b>Ａ<\/b>さんの居室内の冷蔵庫の中に同じ食材がたくさん入っていることが多く，気になっていた。ある日，<b>Ｃ<\/b>訪問介護員（ホームヘルパー）が<b>Ａ<\/b>さんに尋ねると，「近所のスーパーに買い物に行くのが楽しみだが，冷蔵庫の中に何があるのか忘れてしまい，同じものばかり買ってしまう」と答えた。また，「今は，毎月振り込まれる駐車場収入の管理ができているが，今後管理できなくなることが不安だ」と話した。その後，<b>Ａ<\/b>さんは，初期のアルツハイマー型認知症（dementia of the Alzheimer’s type）の診断を受けた。","stem":"Ｄ介護付き有料老人ホームに転居してから3年が経過した。<b>Ａ<\/b>さんの認知症（dementia）の症状は，さらに進行してきた。Ｄ介護付き有料老人ホームでは，施設の方針として，新たにパーソン・センタード・ケアを取り入れることになった。<br>次の記述のうち，<b>Ｅ<\/b>介護福祉職が介護計画を見直すときの方向性として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["認知症（dementia）の人の共通点に着目したケアマニュアルをつくる。","認知症（dementia）を治療する。","認知症（dementia）の人のその人らしさを支える。","認知症（dementia）の人を特別な存在として保護する。","行動・心理症状（ＢＰＳＤ）をなくす。"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"パーソン・センタード・ケアは、キットウッドが提唱した、認知症の人を一人の「人」として尊重し、その人の視点に立ってその人らしさ（パーソンフッド）を支えるケアの考え方である。","choices":["共通点に着目して一律のマニュアルをつくるのは、一人ひとりの個別性を重視する考え方と逆。","パーソン・センタード・ケアは治療をめざすものではなく、その人の生活と心理的なニーズを支える考え方。","その人らしさを支えることが基本。","特別な存在として保護するのではなく、社会の一員として尊重し、できることや関係性を大切にする。","BPSDは満たされていないニーズの表れと捉え、原因を理解して関わる。症状をなくすこと自体を目的にしない。"],"point":"パーソン・センタード・ケアは「キットウッド」「その人らしさ（パーソンフッド）」「本人の視点」がキーワード。「マニュアル化」「保護」「症状をなくす」など、病気や症状を中心に据えた選択肢は外す。","note":null}},{"id":"38-120","exam":38,"no":120,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（42歳，男性）は，知的障害がある。父親（72歳）と二人暮らしをしている。半年前，<b>Ａ<\/b>さんに血便がみられたため病院を受診したところ，大腸がん（colorectal cancer）と診断され，Ｓ状結腸ストーマを造設した。パウチの交換に支援が必要となり，退院後は父親が自宅で介護をしていた。父親の介護負担が大きくなったため，居宅介護（ホームヘルプサービス）を利用することになった。","stem":"次のうち，<b>Ａ<\/b>さんの正常時の便の性状として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["水様から粥状","流動状から液状","半流動から粥状","泥状から軟便","軟便から固形状"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"便は大腸を進むにつれて水分が吸収され、固くなっていく。S状結腸は直腸の手前にあり、ここに造設したストーマからは、肛門から出る便に近い軟便から固形状の便が出る。","choices":["水様から粥状の便は、小腸（回腸）に近い位置のストーマでみられる性状。","流動状から液状の便は、水分の吸収がほとんど進んでいない段階の便で、S状結腸ストーマの正常な性状ではない。","半流動から粥状の便は、大腸の前半（上行結腸など）に近い位置のストーマでみられる性状。","泥状から軟便は、大腸の中ほど（横行結腸など）のストーマでみられる性状。","S状結腸ストーマでは、軟便から固形状の便が出る。"],"point":"ストーマの便の性状は「肛門に近いほど固い、小腸に近いほど水っぽい」で判断する。回腸ストーマは水分が多く脱水や皮膚トラブルに注意、S状結腸ストーマは固形に近い便、と対比して覚える。","note":null}},{"id":"38-121","exam":38,"no":121,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（42歳，男性）は，知的障害がある。父親（72歳）と二人暮らしをしている。半年前，<b>Ａ<\/b>さんに血便がみられたため病院を受診したところ，大腸がん（colorectal cancer）と診断され，Ｓ状結腸ストーマを造設した。パウチの交換に支援が必要となり，退院後は父親が自宅で介護をしていた。父親の介護負担が大きくなったため，居宅介護（ホームヘルプサービス）を利用することになった。","stem":"ある日，訪問介護員（ホームヘルパー）に<b>Ａ<\/b>さんから，「今度，父親と温泉に行くことになったが，便のにおいが気になる」と相談があった。<br>次のうち，訪問介護員（ホームヘルパー）が<b>Ａ<\/b>さんに勧める食品として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["チーズ","たまねぎ","ヨーグルト","にら","アスパラガス"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"ヨーグルトに含まれる乳酸菌は腸内環境を整え、便のにおいを抑える効果が期待できる食品とされる。においが気になるときに勧める食品として適切。","choices":["チーズなどの乳製品の一部は、においが強くなりやすい。","たまねぎは、においを強くしやすい食品。","乳酸菌が腸内環境を整え、においを抑える。","にらは、においを強くしやすい食品。","アスパラガスは、においを強くしやすい食品。"],"point":"ストーマの食事は「においを強くする食品（たまねぎ・にら・にんにく・ねぎ類・アスパラガス・卵・チーズ など）」と「においを抑える食品（ヨーグルト・パセリ・レモン など）」を対にして覚える。ガスが出やすい食品（豆類・いも類・炭酸飲料など）も合わせて押さえる。","note":null}},{"id":"38-122","exam":38,"no":122,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題120から問題122まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（42歳，男性）は，知的障害がある。父親（72歳）と二人暮らしをしている。半年前，<b>Ａ<\/b>さんに血便がみられたため病院を受診したところ，大腸がん（colorectal cancer）と診断され，Ｓ状結腸ストーマを造設した。パウチの交換に支援が必要となり，退院後は父親が自宅で介護をしていた。父親の介護負担が大きくなったため，居宅介護（ホームヘルプサービス）を利用することになった。","stem":"ある日，訪問介護員（ホームヘルパー）が<b>Ａ<\/b>さんの自宅を訪問したところ，<b>Ａ<\/b>さんの父親から，「地震のニュースを見たら，知的障害があり，ストーマの管理が必要な息子に対する災害時の対応が心配になった」と相談があった。訪問介護員（ホームヘルパー）は，相談支援専門員に状況を報告し，相談支援専門員とともにほかの利用者家族に確認したところ，同様に災害時の不安を感じている親が多く，この地域では個別避難計画の作成が遅れていることがわかった。そこで，訪問介護員（ホームヘルパー）はこの課題を地域の課題としてとらえ，サービス提供責任者や相談支援専門員とともに対応することを確認した。<br>次のうち，この地域課題の検討を働きかける場として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["協議会","運営適正化委員会","介護保険審査会","障害者政策委員会","地方更生保護委員会"],"notes":"（注）　「協議会」とは，障害者の日常生活及び社会生活を総合的に支援するための法律第89条の3第1項に規定するものである。","figure":null,"choicesInFigure":false,"answer":[1],"exp":{"basis":"協議会（障害者総合支援法第89条の3）は、地方公共団体が設置し、関係機関・団体、障害者とその家族、支援関係者などが参加して、地域の支援体制の課題について情報を共有し、検討する場である。個別の支援から見えてきた地域課題（個別避難計画の作成の遅れ）を働きかける場として適切。","choices":["地域の障害者支援の課題を共有し、関係者で改善を検討する場。","運営適正化委員会は都道府県社会福祉協議会に置かれ、福祉サービスに関する苦情の解決や、日常生活自立支援事業の運営の監視を行う。","介護保険審査会は都道府県に置かれ、要介護認定などの処分に対する審査請求を審理する。障害福祉の地域課題を検討する場ではない。","障害者政策委員会は障害者基本法に基づき国（内閣府）に置かれ、障害者基本計画について意見を述べ、その実施状況を監視する機関。地域の個別課題を検討する場ではない。","地方更生保護委員会は法務省の機関で、仮釈放の許可などを行う。"],"point":"「個別の支援で見えた課題を地域の課題として検討する場」は、障害福祉では協議会、介護保険では地域ケア会議と対にして覚える。苦情解決＝運営適正化委員会、審査請求＝介護保険審査会（障害福祉では障害者介護給付費等不服審査会）と区別する。","note":null}},{"id":"38-123","exam":38,"no":123,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（50歳，男性，障害支援区分4）は，1年前の交通事故の後遺症で，右片麻痺，高次脳機能障害（higher brain dysfunction），失語症（aphasia）となった。現在は障害者支援施設で生活している。日中は，車いすに座って過ごしているが，すぐに右肩が下がり上半身は右へ傾いた姿勢になる。ある日，<b>Ｂ<\/b>介護福祉職が<b>Ａ<\/b>さんに姿勢の傾きを直す方法を伝えようとすると，<b>Ａ<\/b>さんは大声でどなり，物を投げた。<b>Ｂ<\/b>介護福祉職は，以前から<b>Ａ<\/b>さんとのコミュニケーションに悩んでいたため，<b>Ｃ<\/b>介護主任に相談することにした。<b>Ｃ<\/b>介護主任の問いかけに答えるなかで，<b>Ｂ<\/b>介護福祉職は自分自身の言動を振り返ることができ，<b>Ａ<\/b>さんに伝わらない焦りと，子どもに言い聞かせるような口調が，<b>Ａ<\/b>さんの感情を害していたことに気づいた。その後，コミュニケーション方法を工夫し，<b>Ａ<\/b>さんに姿勢の傾きを直す方法を説明し，同意を得ることができた。<br>毎週，<b>Ａ<\/b>さんは妻との面会を楽しみにしている。しかし，妻は<b>Ａ<\/b>さんの将来に不安を感じて，<b>Ｂ<\/b>介護福祉職に，「夫の障害について，情報交換や勉強がしたい。そのようなところがあれば紹介してほしい」と相談した。","stem":"次のうち，<b>Ｃ<\/b>介護主任が<b>Ｂ<\/b>介護福祉職への対応に用いた手法として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["コンサルテーション（consultation）","コーチング（coaching）","フォロワーシップ（followership）","ティーチング（teaching）","メンバーシップ（membership）"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[2],"exp":{"basis":"C介護主任は答えを教えるのではなく、問いかけによってB介護福祉職が自分の言動を振り返り、自ら気づけるように関わっている。相手の中にある答えや力を、質問や傾聴で引き出す手法はコーチングである。","choices":["コンサルテーションは、異なる分野の専門職などから専門的な助言を受けること。","問いかけで本人の気づきを引き出している。","フォロワーシップは、メンバーがリーダーを補佐し、組織の目標達成に主体的に貢献する力や姿勢。","ティーチングは、知識や方法を直接教えること。C介護主任は答えを教えていない。","メンバーシップは、集団の一員としての役割や関わり方。指導の手法ではない。"],"point":"「問いかけ」「本人が気づく」とあればコーチング、「教える・指示する」ならティーチング、「他分野の専門家に助言を求める」ならコンサルテーション。スーパービジョン（熟練者による指導・支援）とも区別しておく。","note":null}},{"id":"38-124","exam":38,"no":124,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（50歳，男性，障害支援区分4）は，1年前の交通事故の後遺症で，右片麻痺，高次脳機能障害（higher brain dysfunction），失語症（aphasia）となった。現在は障害者支援施設で生活している。日中は，車いすに座って過ごしているが，すぐに右肩が下がり上半身は右へ傾いた姿勢になる。ある日，<b>Ｂ<\/b>介護福祉職が<b>Ａ<\/b>さんに姿勢の傾きを直す方法を伝えようとすると，<b>Ａ<\/b>さんは大声でどなり，物を投げた。<b>Ｂ<\/b>介護福祉職は，以前から<b>Ａ<\/b>さんとのコミュニケーションに悩んでいたため，<b>Ｃ<\/b>介護主任に相談することにした。<b>Ｃ<\/b>介護主任の問いかけに答えるなかで，<b>Ｂ<\/b>介護福祉職は自分自身の言動を振り返ることができ，<b>Ａ<\/b>さんに伝わらない焦りと，子どもに言い聞かせるような口調が，<b>Ａ<\/b>さんの感情を害していたことに気づいた。その後，コミュニケーション方法を工夫し，<b>Ａ<\/b>さんに姿勢の傾きを直す方法を説明し，同意を得ることができた。<br>毎週，<b>Ａ<\/b>さんは妻との面会を楽しみにしている。しかし，妻は<b>Ａ<\/b>さんの将来に不安を感じて，<b>Ｂ<\/b>介護福祉職に，「夫の障害について，情報交換や勉強がしたい。そのようなところがあれば紹介してほしい」と相談した。","stem":"<b>Ｂ<\/b>介護福祉職は，<b>Ａ<\/b>さんが車いすで良肢位を保つことができるように，クッションを使用することにした。まず，<b>Ｂ<\/b>介護福祉職は<b>Ａ<\/b>さんの上半身を起こし深く座り直してもらった。<br>次のうち，<b>Ｂ<\/b>介護福祉職がクッションを挿入する位置として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["背中とバックサポートの間","左大腿部と座面の間","両下腿とレッグサポートの間","右大腿部と左大腿部の間","右上肢と右アームサポートの間"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[5],"exp":{"basis":"Aさんは右片麻痺で、座っていると右肩が下がり上半身が右へ傾く。麻痺側の右上肢と右アームサポートの間にクッションを入れると、右腕の重みを支えて肩が下がるのを防ぎ、体幹をまっすぐに保ちやすくなる。","choices":["すでに深く座り直しているので、背中にクッションを入れると殿部が前にずれ、浅く座った姿勢になりやすい。右への傾きも直せない。","健側の左大腿部の下にクッションを入れると、左側が持ち上がり、上半身はさらに右へ傾く。","下腿とレッグサポートの間は、上半身の右への傾きと関係がない。","両大腿部の間のクッションは、股関節が内側に閉じるのを防ぐためのもので、体幹の横への傾きは直せない。","麻痺側の上肢を支えて、右肩の下がりと体幹の傾きを防ぐ。"],"point":"車いすの姿勢保持は「どちらに・なぜ傾くのか」から考える。片麻痺では麻痺側に傾きやすいので、麻痺側を支える位置にクッションを入れる。健側を持ち上げると傾きが強まる、という逆の効果に注意する。","note":null}},{"id":"38-125","exam":38,"no":125,"subject":"総合問題","group":11,"case":"次の事例を読んで，<b>問題123から問題125まで<\/b>について答えなさい。<br>〔事　例〕<br><b>Ａ<\/b>さん（50歳，男性，障害支援区分4）は，1年前の交通事故の後遺症で，右片麻痺，高次脳機能障害（higher brain dysfunction），失語症（aphasia）となった。現在は障害者支援施設で生活している。日中は，車いすに座って過ごしているが，すぐに右肩が下がり上半身は右へ傾いた姿勢になる。ある日，<b>Ｂ<\/b>介護福祉職が<b>Ａ<\/b>さんに姿勢の傾きを直す方法を伝えようとすると，<b>Ａ<\/b>さんは大声でどなり，物を投げた。<b>Ｂ<\/b>介護福祉職は，以前から<b>Ａ<\/b>さんとのコミュニケーションに悩んでいたため，<b>Ｃ<\/b>介護主任に相談することにした。<b>Ｃ<\/b>介護主任の問いかけに答えるなかで，<b>Ｂ<\/b>介護福祉職は自分自身の言動を振り返ることができ，<b>Ａ<\/b>さんに伝わらない焦りと，子どもに言い聞かせるような口調が，<b>Ａ<\/b>さんの感情を害していたことに気づいた。その後，コミュニケーション方法を工夫し，<b>Ａ<\/b>さんに姿勢の傾きを直す方法を説明し，同意を得ることができた。<br>毎週，<b>Ａ<\/b>さんは妻との面会を楽しみにしている。しかし，妻は<b>Ａ<\/b>さんの将来に不安を感じて，<b>Ｂ<\/b>介護福祉職に，「夫の障害について，情報交換や勉強がしたい。そのようなところがあれば紹介してほしい」と相談した。","stem":"妻の相談を受けた<b>Ｂ<\/b>介護福祉職がサービス管理責任者に報告をしたところ，ある社会資源を紹介することになった。<br>次のうち，<b>Ｂ<\/b>介護福祉職が妻に紹介した社会資源として，<b>最も適切なもの<\/b>を<b>1つ<\/b>選びなさい。","choices":["福祉事務所","公共職業安定所（ハローワーク）","家族会","地域包括支援センター","地域障害者職業センター"],"notes":null,"figure":null,"choicesInFigure":false,"answer":[3],"exp":{"basis":"妻は「夫の障害について、情報交換や勉強がしたい」と望んでいる。同じ障害（高次脳機能障害・失語症など）のある人の家族どうしが集まり、体験や情報を交換し、学び合う場である家族会を紹介するのが適切。","choices":["福祉事務所は、生活保護など福祉に関する行政の相談・手続きを担う機関。家族どうしの情報交換や学び合いの場ではない。","公共職業安定所（ハローワーク）は職業紹介などを行う機関。妻の相談内容と合わない。","同じ立場の家族が情報交換し、学び合える。","地域包括支援センターは、主に高齢者とその家族の総合相談などを担う機関。障害のある50歳のAさんの家族の学び合いの場ではない。","地域障害者職業センターは、職業評価や職業準備支援など職業リハビリテーションを行う機関。"],"point":"「同じ立場の人と情報交換したい」「気持ちを分かち合いたい」という相談には、家族会・当事者会（セルフヘルプグループ）を選ぶ。行政機関や就労支援機関は、相談内容と機関の役割が合うかで判断する。","note":null}}];</script>
<script>(function (root) {
  "use strict";
  const VERSION = 1;

  function emptyState() { return { version: VERSION, latest: {}, sets: {} }; }

  function isCorrect(q, choice) { return q.answer.indexOf(choice) !== -1; }

  function sortedIds(questions, keep) {
    return questions.filter(keep).slice()
      .sort((a, b) => a.exam - b.exam || a.no - b.no)
      .map(q => q.id);
  }
  function examOrder(questions, exam) { return sortedIds(questions, q => q.exam === exam); }
  function groupOrder(questions, group) { return sortedIds(questions, q => q.group === group); }
  function reviewOrder(state, questions) {
    return sortedIds(questions, q => !!state.latest[q.id] && state.latest[q.id].correct === false);
  }

  function startSet(state, key, order) {
    state.sets[key] = { order: order.slice(), pos: 0, answers: {}, skipped: [], phase: "main", queue: [] };
    return state.sets[key];
  }

  function list(set) { return set.phase === "main" ? set.order : set.queue; }
  function currentId(set) { const l = list(set); return set.pos < l.length ? l[set.pos] : null; }

  function status(set) {
    if (currentId(set) !== null) return "question";
    return set.skipped.length > 0 ? "askSkipped" : "done";
  }

  function answer(state, key, q, choice, now) {
    const set = state.sets[key];
    if (currentId(set) !== q.id) throw new Error("not the current question: " + q.id);
    const correct = isCorrect(q, choice);
    set.answers[q.id] = { choice: choice, correct: correct };
    state.latest[q.id] = { correct: correct, choice: choice, at: now };
    set.pos += 1;
    return correct;
  }

  function skip(state, key) {
    const set = state.sets[key];
    const id = currentId(set);
    if (id === null) throw new Error("no current question");
    set.skipped.push(id);
    set.pos += 1;
  }

  function beginSkippedRound(state, key) {
    const set = state.sets[key];
    set.queue = set.skipped;
    set.skipped = [];
    set.pos = 0;
    set.phase = "skipped";
  }

  function summary(set) {
    const ids = Object.keys(set.answers);
    return { answered: ids.length, correct: ids.filter(id => set.answers[id].correct).length, total: set.order.length };
  }

  function finishSet(state, key) {
    const s = summary(state.sets[key]);
    delete state.sets[key];
    return s;
  }

  function progress(set) {
    const l = list(set);
    return { phase: set.phase, index: Math.min(set.pos + 1, l.length), total: l.length };
  }

  function radar(state, questions, groupCount) {
    const rows = [];
    for (let g = 1; g <= groupCount; g++) rows.push({ group: g, answered: 0, correct: 0, rate: null });
    questions.forEach(q => {
      const r = state.latest[q.id];
      if (!r) return;
      const row = rows[q.group - 1];
      row.answered += 1;
      if (r.correct) row.correct += 1;
    });
    rows.forEach(r => { if (r.answered > 0) r.rate = r.correct / r.answered; });
    return rows;
  }

  function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function isStrArray(v) { return Array.isArray(v) && v.every(x => typeof x === "string"); }

  function pruneState(state, knownIds) {
    const known = knownIds instanceof Set ? knownIds : new Set(knownIds);
    const ok = id => known.has(id);
    for (const id of Object.keys(state.latest)) if (!ok(id)) delete state.latest[id];
    for (const k of Object.keys(state.sets)) {
      const t = state.sets[k];
      if (!t.order.every(ok) || !t.queue.every(ok) || !t.skipped.every(ok) || !Object.keys(t.answers).every(ok)) delete state.sets[k];
    }
    return state;
  }

  function validateState(s) {
    if (!isObj(s) || s.version !== VERSION || !isObj(s.latest) || !isObj(s.sets)) return false;
    for (const id in s.latest) {
      const r = s.latest[id];
      if (!isObj(r) || typeof r.correct !== "boolean" || !Number.isInteger(r.choice) || typeof r.at !== "number") return false;
    }
    for (const k in s.sets) {
      const t = s.sets[k];
      if (!isObj(t) || !isStrArray(t.order) || !Number.isInteger(t.pos) || t.pos < 0 || !isObj(t.answers) ||
          !isStrArray(t.skipped) || !isStrArray(t.queue) || (t.phase !== "main" && t.phase !== "skipped")) return false;
      for (const id in t.answers) {
        const a = t.answers[id];
        if (!isObj(a) || !Number.isInteger(a.choice) || typeof a.correct !== "boolean") return false;
      }
    }
    return true;
  }

  const API = {
    VERSION, emptyState, isCorrect, examOrder, groupOrder, reviewOrder, startSet, currentId, status,
    answer, skip, beginSkippedRound, summary, finishSet, progress, radar, validateState, pruneState,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.Logic = API;
})(this);
</script>
<script>(function () {

  const byId = {};
  QUESTIONS.forEach(q => { byId[q.id] = q; });
  const app = document.getElementById("app");

  const knownIds = new Set(QUESTIONS.map(q => q.id));

  }
  function save() {
    if (!storageOk) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { storageOk = false; }
